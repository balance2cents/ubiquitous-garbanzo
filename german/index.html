{id:"4.1",ch:4,title:"Im Büro: Zeitangaben",pages:[98,100],ga:[[30,157],[78,390]],topics:["zeitprep"],
 goals:["Say when something happens with um, am, im, seit, vor, ab, bis","Describe your working week"],
 theory:`
<h3>1 · Which preposition for which time?</h3>
<div class="tablewrap"><table>
<tr><th>Preposition</th><th>Used for</th><th>Examples</th></tr>
<tr><td><b>um</b></td><td>clock times</td><td>um 9 Uhr, um halb acht</td></tr>
<tr><td><b>am</b></td><td>days, dates, parts of the day, the weekend</td><td>am Montag, am 5. März, am Abend, am Wochenende</td></tr>
<tr><td><b>im</b></td><td>months, seasons, years with "Jahr"</td><td>im Juli, im Winter, im Jahr 2020</td></tr>
<tr><td><b>in der</b></td><td>the night, weeks</td><td>in der Nacht, in der nächsten Woche</td></tr>
<tr><td>(nothing)</td><td>plain years</td><td>2020 bin ich umgezogen.</td></tr>
</table></div>
<p>Swiss usage: <i>am Wochenende</i> is standard everywhere; you'll also hear <i>über das Wochenende</i>.</p>
<h3>2 · Periods: seit, vor, ab, von … bis</h3>
<div class="tablewrap"><table>
<tr><th>seit + Dat</th><td>started in the past and still going</td><td>Ich arbeite <b>seit</b> drei Jahr<b>en</b> hier. (present tense!)</td></tr>
<tr><th>vor + Dat</th><td>… ago</td><td>Er hat <b>vor</b> zwei Woch<b>en</b> gekündigt.</td></tr>
<tr><th>ab</th><td>from … on (future)</td><td><b>Ab</b> nächster Woche habe ich Urlaub.</td></tr>
<tr><th>von … bis</th><td>from … to</td><td><b>von</b> 8 <b>bis</b> 17 Uhr, <b>vom</b> 1. <b>bis zum</b> 5. Mai</td></tr>
<tr><th>bis</th><td>deadline</td><td><b>bis</b> Freitag, <b>bis</b> morgen</td></tr>
</table></div>
<div class="trap"><b>Common mistake:</b> English "I have worked here for three years" is present tense in German: <i>Ich arbeite <b>seit</b> drei Jahren hier.</i> Not "Ich habe … gearbeitet", and not "für drei Jahre".</div>
<h3>3 · Dates out loud</h3>
<p>Ordinal numbers: <i>am erst<b>en</b>, zweit<b>en</b>, dritt<b>en</b>, viert<b>en</b> … neunzehnt<b>en</b>, zwanzig<b>sten</b></i>. Written: <i>am 5. März</i>, read: <i>am fünften März</i>. On the phone: <i>Geht es am Dienstag, dem fünften März?</i></p>
<div class="ex"><div class="ex-h">My working week</div><p><b>Am</b> Montag und Freitag arbeite ich <b>von</b> 8 <b>bis</b> 17 Uhr im Büro. <b>Am</b> Mittwoch arbeite ich im Homeoffice. Die Teamsitzung ist jeden Dienstag <b>um</b> 10 Uhr. <b>Im</b> August habe ich zwei Wochen Ferien. <b>Seit</b> einem Monat habe ich eine neue Chefin.</p></div>
<div class="book">In the book: Im Büro p. 98 (PDF 100), Teil C Zeitangaben p. 119 (PDF 121). The ordinal numbers are in the appendix of Grammatik aktiv (PDF 470).</div>`,
 extra:[
 {q:"Die Sitzung beginnt ___ halb zehn.",a:["um"]},
 {q:"Ich habe ___ Juni Ferien.",a:["im"]},
 {q:"Er arbeitet ___ zwei Jahren bei uns.",a:["seit"]},

 read:{title:"Eine E-Mail an das Team",text:`Liebe Kolleginnen und Kollegen,

Viele Grüße
Daniel`,

{id:"4.2",ch:4,title:"Telefonieren: höfliche Bitten und indirekte Fragen",pages:[101,110],ga:[[55,275],[67,335]],topics:["k2polite","indirekt"],
 goals:["Make a business phone call and set an appointment","Ask politely with könnten, würden, hätten","Turn direct questions into indirect ones"],
 theory:`
<h3>1 · Politeness = Konjunktiv II</h3>
<p>On the phone and in the office, the imperative sounds rude. Swap it for Konjunktiv II:</p>
<div class="tablewrap"><table>
<tr><th>Too direct</th><th>Polite</th></tr>
<tr><td>Helfen Sie mir!</td><td><b>Könnten</b> Sie mir bitte helfen?</td></tr>
<tr><td>Schicken Sie mir die Unterlagen.</td><td><b>Würden</b> Sie mir die Unterlagen schicken?</td></tr>
<tr><td>Ich will einen Termin.</td><td>Ich <b>hätte</b> gern einen Termin. / Ich <b>würde</b> gern einen Termin vereinbaren.</td></tr>
<tr><td>Haben Sie Zeit?</td><td><b>Hätten</b> Sie am Dienstag Zeit?</td></tr>
<tr><td>Passt Dienstag?</td><td><b>Würde</b> es Ihnen am Dienstag passen?</td></tr>
</table></div>
<h3>2 · Indirect questions</h3>
<p>An even softer way to ask: wrap the question in a lead-in. The verb goes to the <b>end</b>.</p>
<div class="ex"><div class="ex-h">W-question → keep the question word</div><p>Wann kommt Herr Meier zurück? → Können Sie mir sagen, <b>wann</b> Herr Meier zurück<b>kommt</b>?</p></div>
<div class="ex"><div class="ex-h">Yes/no question → ob</div><p>Ist Frau Keller im Büro? → Wissen Sie, <b>ob</b> Frau Keller im Büro <b>ist</b>?</p></div>
<p>Lead-ins: <i>Können Sie mir sagen, … / Wissen Sie, … / Ich möchte wissen, … / Ich frage mich, …</i> Statement lead-ins take <em>dass</em>: <i>Ich glaube, <b>dass</b> die Sitzung um zehn beginnt.</i></p>
<div class="trap"><b>Common mistake:</b> "Wissen Sie, wann kommt der Zug?" In an indirect question the verb goes last: <i>… wann der Zug <b>kommt</b>?</i></div>
<h3>3 · A business call, step by step</h3>
<div class="ex"><div class="ex-h">Redemittel</div>
<p>☎ Firma Alpina, Brunner am Apparat. / Guten Tag, hier spricht …</p>
<p>Könnte ich bitte Frau Keller sprechen? – Einen Moment, ich verbinde Sie.</p>
<p>Worum geht es? – Es geht um einen Termin.</p>
<p>Könnten Sie Ihren Namen bitte buchstabieren?</p>
<p>Würde es Ihnen am Dienstag um 14 Uhr passen? – Ja, das passt mir gut. / Nein, da habe ich leider keine Zeit.</p>
<p>Könnte ich eine Nachricht hinterlassen?</p></div>
<p>Spelling on the phone uses the German spelling alphabet: <i>A wie Anton, B wie Berta, C wie Cäsar, D wie Dora, E wie Emil …</i></p>
<div class="book">In the book: Telefonieren from p. 101 (PDF 103), Teil C Konjunktiv II p. 121 and Nebensätze p. 126.</div>`,
 extra:[
 {q:"___ Sie mir bitte Ihre Telefonnummer geben? (können)",a:["Könnten"]},
 {q:"___ es Ihnen am Freitag passen? (werden)",a:["Würde"]},
 {q:"Wissen Sie, ___ das Büro heute geöffnet ist?",a:["ob"]},
 {t:"o",w:["Können","Sie","mir","sagen",",","wann","Frau Keller","zurückkommt","?"],en:"Can you tell me when Ms. Keller is coming back?"},
 {t:"c",q:"Welcher Satz ist am höflichsten?",o:["Geben Sie mir Herrn Meier!","Ich will Herrn Meier sprechen.","Könnte ich bitte Herrn Meier sprechen?"],a:2}

 read:{title:"Am Telefon",text:`– Firma Novatec, Sie sprechen mit Lara Frei. Guten Tag.
– Guten Tag, mein Name ist Novak. Könnte ich bitte Herrn Wyss sprechen?

– N wie Nordpol, O wie Otto, V wie Viktor, A wie Anton, K wie Kaufmann.
– Danke, Frau Novak. Ich sage Herrn Wyss Bescheid.`,

{id:"4.3",ch:4,title:"Kommunikation im Büro: Verben mit Präpositionen",pages:[111,125],ga:[[53,265],[54,270]],topics:["verbprep"],
 goals:["Use verbs with fixed prepositions (warten auf, sich freuen über …)","Ask worauf? and answer darauf","Write a short formal email"],
 theory:`
<h3>1 · Verb + preposition = one unit</h3>
<p>Many verbs come glued to a preposition, and the preposition decides the case. The English equivalent often uses a different preposition or none at all, so learn them as blocks:</p>
<div class="tablewrap"><table>
<tr><th>+ Akkusativ</th><th>+ Dativ</th></tr>
<tr><td>warten <b>auf</b> · sich freuen <b>auf</b> (future)<br>sich freuen <b>über</b> (present/past) · sprechen <b>über</b><br>sich ärgern <b>über</b> · sich beschweren <b>über</b><br>sich interessieren <b>für</b> · sich bedanken <b>für</b><br>denken <b>an</b> · sich erinnern <b>an</b><br>sich bewerben <b>um</b> · sich kümmern <b>um</b></td>
<td>teilnehmen <b>an</b><br>Angst haben <b>vor</b><br>träumen <b>von</b> · erzählen <b>von</b><br>sprechen <b>mit</b> · telefonieren <b>mit</b><br>fragen <b>nach</b><br>sich verabschieden <b>von</b></td></tr></table></div>
<h3>2 · Questions and pronouns for things: wo(r)- and da(r)-</h3>
<p>For <b>things</b>, glue the preposition to <i>wo-</i> (question) or <i>da-</i> (answer). Add an <b>r</b> if the preposition starts with a vowel.</p>
<div class="ex"><div class="ex-h">Things</div><p><b>Worauf</b> wartest du? – Auf den Bus. / Ich warte <b>darauf</b>.</p><p><b>Wofür</b> interessierst du dich? – Für Kunst. / Ich interessiere mich sehr <b>dafür</b>.</p><p><b>Worüber</b> habt ihr gesprochen? – <b>Darüber</b> möchte ich nicht reden.</p></div>
<div class="ex"><div class="ex-h">People: preposition + pronoun</div><p><b>Auf wen</b> wartest du? – Auf Anna. / Ich warte <b>auf sie</b>.</p><p><b>Mit wem</b> hast du telefoniert? – <b>Mit meinem Chef</b>.</p></div>
<div class="trap"><b>Common mistake:</b> "Ich freue mich für das Wochenende." It's <i>auf</i> for something coming, <i>über</i> for something you already have: <i>Ich freue mich <b>auf</b> das Wochenende / <b>über</b> dein Geschenk.</i> <i>für</i> only means "happy for someone": <i>Ich freue mich <b>für</b> dich.</i></div>
<h3>3 · Formal email frame</h3>
<div class="ex"><div class="ex-h">Template</div><p>Sehr geehrte Frau Keller, / Sehr geehrter Herr Wyss,</p><p>vielen Dank für Ihre E-Mail vom 3. November.</p><p>Leider kann ich am Donnerstag nicht an der Sitzung teilnehmen, weil …</p><p>Wäre es möglich, den Termin auf Freitag zu verschieben?</p><p>Ich freue mich auf Ihre Antwort.</p><p>Mit freundlichen Grüßen<br>Anna Muster</p></div>
<p>Note the lowercase after the comma in the greeting (<i>vielen Dank…</i>), and no comma after <i>Mit freundlichen Grüßen</i>. In Switzerland you'll often see <i>Freundliche Grüsse</i> (ss).</p>
<div class="book">In the book: Kommunikation im Büro p. 111 (PDF 113), Teil C Kasus p. 122 (PDF 124).</div>`,
 extra:[

 {q:"Sie hat sich ___ den Lärm beschwert.",a:["über"]},
 {q:"Wir nehmen morgen ___ einem Workshop teil.",a:["an"]},
 {q:"___ interessierst du dich? – Für Fotografie.",a:["Wofür"]},

 read:{title:"Eine Beschwerde",text:`Sehr geehrte Damen und Herren,
am 12. Oktober habe ich bei Ihnen einen Drucker bestellt. Leider warte ich immer noch auf die Lieferung. Ich habe schon zweimal mit Ihrem Kundenservice telefoniert, aber niemand hat sich um mein Problem gekümmert. Darüber ärgere ich mich sehr. Ich brauche den Drucker dringend für meine Arbeit. Bitte teilen Sie mir bis Freitag mit, wann der Drucker kommt. Wenn er bis Ende des Monats nicht da ist, möchte ich mein Geld zurück.
Mit freundlichen Grüßen
Jana Horvat`,

{id:"5.1",ch:5,title:"Wohin fährst du? nach, in, zu, an",pages:[132,136],ga:[[35,178]],topics:["lokal"],
 goals:["Say where you go, where you are and where you come from","Pick the right preposition for countries, places, people"],
 theory:`
<h3>1 · Three questions, three case patterns</h3>
<div class="tablewrap"><table>
<tr><th></th><th>Wohin? (to)</th><th>Wo? (at)</th><th>Woher? (from)</th></tr>
<tr><td>Cities, countries without article</td><td><b>nach</b> Italien, nach Bern</td><td><b>in</b> Italien, in Bern</td><td><b>aus</b> Italien</td></tr>
<tr><td>Countries with article</td><td><b>in die</b> Schweiz, <b>in die</b> USA, <b>in den</b> Iran</td><td><b>in der</b> Schweiz, <b>in den</b> USA</td><td><b>aus der</b> Schweiz</td></tr>
<tr><td>Buildings, rooms, closed spaces</td><td><b>ins</b> Kino, <b>in die</b> Stadt</td><td><b>im</b> Kino, <b>in der</b> Stadt</td><td><b>aus dem</b> Kino</td></tr>
<tr><td>People, shops, institutions</td><td><b>zum</b> Arzt, <b>zur</b> Bank, <b>zu</b> Anna</td><td><b>beim</b> Arzt, <b>bei</b> Anna</td><td><b>vom</b> Arzt</td></tr>
<tr><td>Water, edges</td><td><b>ans</b> Meer, <b>an den</b> See</td><td><b>am</b> Meer, <b>am</b> See</td><td><b>vom</b> Meer</td></tr>
<tr><td>Mountains, islands</td><td><b>in die</b> Berge, <b>auf</b> eine Insel</td><td><b>in den</b> Bergen, <b>auf</b> der Insel</td><td><b>aus den</b> Bergen</td></tr>
<tr><td>Home</td><td><b>nach Hause</b></td><td><b>zu Hause</b></td><td><b>von zu Hause</b></td></tr>
</table></div>
<p>Countries with an article are the minority, but many are common: <i>die Schweiz, die Türkei, die USA (pl), die Niederlande (pl), der Iran, der Irak</i>.</p>
<div class="trap"><b>Common mistake:</b> "Ich fahre nach die Schweiz" or "Ich bin in Schweiz." Articles stick: <i>in <b>die</b> Schweiz / in <b>der</b> Schweiz / aus <b>der</b> Schweiz</i>. And "nach Hause" (to) vs. "zu Hause" (at) is tested constantly.</div>
<h3>2 · Countries and people</h3>
<div class="tablewrap"><table><tr><th>Land</th><th>er</th><th>sie</th><th>Adjektiv</th></tr>
<tr><td>die Schweiz</td><td>der Schweizer</td><td>die Schweizerin</td><td>schweizerisch</td></tr><tr><td>Deutschland</td><td>der Deutsche</td><td>die Deutsche</td><td>deutsch</td></tr><tr><td>Österreich</td><td>der Österreicher</td><td>die Österreicherin</td><td>österreichisch</td></tr><tr><td>Italien</td><td>der Italiener</td><td>die Italienerin</td><td>italienisch</td></tr><tr><td>Frankreich</td><td>der Franzose</td><td>die Französin</td><td>französisch</td></tr><tr><td>Russland</td><td>der Russe</td><td>die Russin</td><td>russisch</td></tr></table></div>
<div class="book">In the book: Endlich Urlaub! p. 132 (PDF 134), Länder und Nationalitäten p. 134, Teil C Lokalangaben p. 152 (PDF 154).</div>`,

{id:"5.2",ch:5,title:"Ein schönes Hotel: Adjektivendungen",pages:[137,157],ga:[[36,186],[37,191],[79,395]],topics:["adjgen"],
 goals:["Describe hotels, cities and trips with adjectives","Get adjective endings right after der, ein and no article"],
 theory:`
<h3>1 · When does an adjective need an ending?</h3>
<p>After <i>sein, werden, bleiben</i> and as an adverb: no ending. <i>Das Hotel ist <b>schön</b>.</i> Before a noun: always an ending. <i>ein <b>schönes</b> Hotel</i>.</p>
<h3>2 · The one idea behind all the tables</h3>
<p>Someone has to show the case and gender. If the article already shows it clearly (<i>der, den, dem, einem</i>…), the adjective relaxes and takes <b>-e</b> or <b>-en</b>. If there is no article, or the article is <i>ein</i> in a form that hides the gender, the adjective has to show it with the "strong" ending.</p>
<div class="tablewrap"><table><tr><th>after der/die/das</th><th>m</th><th>f</th><th>n</th><th>pl</th></tr>
<tr><td>Nom</td><td>der neu<b>e</b> Zug</td><td>die neu<b>e</b> Bahn</td><td>das neu<b>e</b> Hotel</td><td>die neu<b>en</b> Zimmer</td></tr>
<tr><td>Akk</td><td>den neu<b>en</b> Zug</td><td>die neu<b>e</b> Bahn</td><td>das neu<b>e</b> Hotel</td><td>die neu<b>en</b> Zimmer</td></tr>
<tr><td>Dat</td><td>dem neu<b>en</b> Zug</td><td>der neu<b>en</b> Bahn</td><td>dem neu<b>en</b> Hotel</td><td>den neu<b>en</b> Zimmern</td></tr></table></div>
<p>Pattern: only five spots take <b>-e</b> (the three Nominative singulars plus feminine and neuter Accusative). Everything else: <b>-en</b>.</p>
<div class="tablewrap"><table><tr><th>after ein/kein/mein</th><th>m</th><th>f</th><th>n</th><th>pl (kein/mein)</th></tr>
<tr><td>Nom</td><td>ein neu<b>er</b> Zug</td><td>eine neu<b>e</b> Bahn</td><td>ein neu<b>es</b> Hotel</td><td>keine neu<b>en</b> Zimmer</td></tr>
<tr><td>Akk</td><td>einen neu<b>en</b> Zug</td><td>eine neu<b>e</b> Bahn</td><td>ein neu<b>es</b> Hotel</td><td>keine neu<b>en</b> Zimmer</td></tr>
<tr><td>Dat</td><td>einem neu<b>en</b> Zug</td><td>einer neu<b>en</b> Bahn</td><td>einem neu<b>en</b> Hotel</td><td>keinen neu<b>en</b> Zimmern</td></tr></table></div>
<p>Same as the der-table except the three places where <i>ein</i> has no ending: there the adjective shows <b>-er</b> (masculine) or <b>-es</b> (neuter).</p>
<div class="tablewrap"><table><tr><th>no article</th><th>m</th><th>f</th><th>n</th><th>pl</th></tr>
<tr><td>Nom</td><td>gut<b>er</b> Wein</td><td>frisch<b>e</b> Milch</td><td>kalt<b>es</b> Wasser</td><td>nett<b>e</b> Leute</td></tr>
<tr><td>Akk</td><td>gut<b>en</b> Wein</td><td>frisch<b>e</b> Milch</td><td>kalt<b>es</b> Wasser</td><td>nett<b>e</b> Leute</td></tr>
<tr><td>Dat</td><td>mit gut<b>em</b> Wein</td><td>mit frisch<b>er</b> Milch</td><td>mit kalt<b>em</b> Wasser</td><td>mit nett<b>en</b> Leuten</td></tr></table></div>
<p>No article: the adjective takes the ending the article <i>would</i> have had (<i>der → -er, dem → -em</i>). Typical in menus, ads and hotel brochures: <i>Zimmer mit schön<b>em</b> Blick, frisch<b>er</b> Fisch, italienisch<b>er</b> Wein</i>.</p>
<div class="trap"><b>Spelling:</b> <i>teuer → ein teu<b>r</b>es Hotel</i>, <i>dunkel → ein dunk<b>l</b>er Raum</i>, <i>hoch → ein ho<b>h</b>er Berg</i>.</div>
<div class="book">In the book: Eine Reise planen p. 137 (PDF 139), Städtereisen p. 145, Teil C Nomengruppe p. 153 (PDF 155). This is the lesson to drill daily: the ∞ generator in Grammar never runs out.</div>`,

{id:"5.3",ch:5,title:"Wetter und Pannen: obwohl, weil, Vorschläge",pages:[140,151],ga:[[42,218]],topics:["obwohl"],
 goals:["Talk about the weather","Contrast with obwohl and trotzdem","Apologize and make suggestions"],
 theory:`
<h3>1 · obwohl: the surprising contrast</h3>
<p><em>obwohl</em> (although) works like <i>weil</i>: it starts a subordinate clause and the verb goes to the end. But the meaning is the opposite: the result is <b>unexpected</b>.</p>
<div class="ex"><div class="ex-h">weil vs. obwohl</div><p>Wir bleiben im Hotel, <b>weil</b> es regnet. (logical)</p><p>Wir gehen wandern, <b>obwohl</b> es regnet. (surprising)</p></div>
<p>The main-clause twin of <i>obwohl</i> is <em>trotzdem</em> (still, anyway). It sits in position 1 and the verb follows directly: <i>Es regnet. <b>Trotzdem gehen</b> wir wandern.</i> (More on this in 7.3.)</p>
<h3>2 · Weather</h3>
<div class="tablewrap"><table><tr><th>Verb</th><th>Adjective</th><th>Noun</th></tr>
<tr><td>Es regnet. Es schneit. Die Sonne scheint. Es blitzt und donnert.</td><td>sonnig, bewölkt, neblig, windig, stürmisch, heiß, kalt, mild</td><td>der Regen, der Schnee, das Gewitter, der Nebel, der Wind</td></tr></table></div>
<p>Temperatures: <i>Es sind 25 Grad. / Die Temperaturen liegen zwischen 10 und 15 Grad. / Es ist minus fünf Grad.</i></p>
<h3>3 · When things go wrong</h3>
<div class="ex"><div class="ex-h">Apologizing</div><p>Entschuldigung, ich bin zu spät, <b>weil</b> ich den Zug verpasst habe.</p><p>Tut mir leid, der Zug hatte 20 Minuten Verspätung.</p><p>Ich stand eine Stunde im Stau.</p></div>
<h3>4 · Making suggestions</h3>
<div class="ex"><div class="ex-h">Redemittel</div><p><b>Wie wäre es mit</b> einem Museumsbesuch? (+ Dativ)</p><p>Wir <b>könnten</b> doch ins Museum gehen.</p><p>Ich <b>schlage vor</b>, dass wir eine Stadtrundfahrt machen.</p><p><b>Lass uns</b> an den See gehen!</p><p>Reacting: Gute Idee! / Das klingt gut. / Ich weiß nicht, ich habe eigentlich keine Lust auf …</p></div>
<div class="book">In the book: weather and traffic announcements in Eine Reise planen (from p. 137), Städtereisen p. 145 (PDF 147).</div>`,

{id:"6.1",ch:6,title:"Tiere vergleichen: Komparativ und Superlativ",pages:[162,168],ga:[[38,196],[39,200]],topics:["kompgen","komparativ"],
 goals:["Compare animals, people and things","Form comparatives and superlatives, including the irregular ones"],
 theory:`
<h3>1 · Three steps</h3>
<div class="tablewrap"><table><tr><th>Positiv</th><th>Komparativ (+ als)</th><th>Superlativ</th></tr>
<tr><td>schnell</td><td>schnell<b>er</b></td><td>am schnell<b>sten</b> / der schnell<b>ste</b></td></tr>
<tr><td>klein</td><td>klein<b>er</b></td><td>am klein<b>sten</b></td></tr>
<tr><td>interessant</td><td>interessant<b>er</b></td><td>am interessant<b>esten</b></td></tr></table></div>
<p>Adjectives ending in <i>-t, -d, -s, -ß, -z, -sch</i> add an e in the superlative: <i>am ält<b>e</b>sten, am heiß<b>e</b>sten, am kürz<b>e</b>sten</i>.</p>
<h3>2 · Umlaut and irregular forms</h3>
<p>Many short adjectives with a, o, u get an umlaut: <i>alt – älter, jung – jünger, groß – größer, warm – wärmer, kalt – kälter, lang – länger, kurz – kürzer, stark – stärker, arm – ärmer, klug – klüger, gesund – gesünder</i>.</p>
<div class="tablewrap"><table><tr><th>gut</th><td>besser</td><td>am besten</td></tr><tr><th>viel</th><td>mehr</td><td>am meisten</td></tr><tr><th>gern</th><td>lieber</td><td>am liebsten</td></tr><tr><th>hoch</th><td>höher</td><td>am höchsten</td></tr><tr><th>nah</th><td>näher</td><td>am nächsten</td></tr><tr><th>teuer</th><td>teurer</td><td>am teuersten</td></tr></table></div>
<h3>3 · Comparing</h3>
<div class="ex"><div class="ex-h">als vs. wie</div><p>Different: Ein Gepard ist schnell<b>er als</b> ein Pferd.</p><p>Equal: Mein Hund ist <b>so</b> groß <b>wie</b> deine Katze. / <b>genauso</b> alt <b>wie</b></p><p>Not equal: Bern ist <b>nicht so</b> groß <b>wie</b> Zürich.</p></div>
<div class="trap"><b>Common mistake:</b> "größer wie" or "so groß als". Comparative → <b>als</b>, same level → <b>wie</b>.</div>
<h3>4 · Superlative before a noun</h3>
<p>Before a noun the superlative takes normal adjective endings: <i>der schnell<b>ste</b> Vogel, das gefährlich<b>ste</b> Tier, mit dem teuer<b>sten</b> Auto</i>. After <i>sein</i> or as an adverb: <i>am … sten</i>: <i>Der Gepard läuft <b>am schnellsten</b>.</i></p>
<div class="book">In the book: Gefährliche Tiere p. 162 (PDF 164), Teil C Adjektive p. 180 (PDF 182). Teil B has a fun insect text ("Wer sticht am gemeinsten?").</div>`,

 {q:"Mein Bruder ist genauso alt ___ ich.",a:["wie"]},
 {q:"Welches Tier ist am ___? (gefährlich)",a:["gefährlichsten"]},
 {q:"Heute ist es ___ als gestern. (kalt)",a:["kälter"]},

 read:{title:"Rekorde im Tierreich",text:`Welches Tier ist am schnellsten? An Land ist es der Gepard: Er kann bis zu 110 Kilometer pro Stunde laufen, aber nur kurze Zeit. In der Luft ist der Wanderfalke noch viel schneller. Wenn er nach unten fliegt, erreicht er über 300 Kilometer pro Stunde. Das größte Tier der Welt ist der Blauwal. Er ist größer als jeder Dinosaurier und kann über 30 Meter lang werden. Und welches Tier ist am gefährlichsten für Menschen? Nicht der Hai, nicht die Schlange, sondern die Mücke! Sie überträgt Krankheiten wie Malaria und tötet jedes Jahr mehr Menschen als alle anderen Tiere zusammen.`,

{id:"6.2",ch:6,title:"Menschen beschreiben: Relativsätze",pages:[169,186],ga:[[70,350],[71,354]],topics:["relativ"],
 goals:["Describe appearance and character","Add detail with relative clauses (der, die, das, den, dem, denen)"],
 theory:`
<h3>1 · Describing people</h3>
<div class="ex"><div class="ex-h">Aussehen (appearance)</div><p>Sie <b>hat</b> lange, blonde Haare / blaue Augen / ein rundes Gesicht.</p><p>Er <b>ist</b> groß, schlank und sportlich. Er <b>trägt</b> eine Brille und einen Bart.</p></div>
<div class="ex"><div class="ex-h">Charakter</div><p>Sie ist geduldig, zuverlässig und sehr hilfsbereit. Manchmal ist sie ein bisschen chaotisch.</p><p>Opposites to learn in pairs: <i>fleißig – faul, ordentlich – chaotisch, optimistisch – pessimistisch, geduldig – ungeduldig, ernst – lustig</i>.</p></div>
<p>Notice: <i>haben</i> + adjective + noun needs adjective endings (lesson 5.2): <i>Sie hat blau<b>e</b> Augen</i> (no article, plural Akk → -e).</p>
<h3>2 · Relative clauses</h3>
<p>A relative clause adds information about a noun, like "who" or "which/that" in English. German never drops the pronoun (English can: "the man I met").</p>
<div class="formula">Das ist die Frau, <span>die</span> neben mir <span>wohnt</span>.</div>
<p>Three rules: (1) comma before the relative clause; (2) conjugated verb at the end; (3) the relative pronoun takes <b>gender and number</b> from the noun, but its <b>case</b> from its job inside the relative clause.</p>
<div class="tablewrap"><table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr>
<tr><td>Nom</td><td>der</td><td>die</td><td>das</td><td>die</td></tr>
<tr><td>Akk</td><td><b>den</b></td><td>die</td><td>das</td><td>die</td></tr>
<tr><td>Dat</td><td><b>dem</b></td><td><b>der</b></td><td><b>dem</b></td><td><b>denen</b></td></tr></table></div>
<p>It's the definite article, except dative plural <b>denen</b>.</p>
<h3>3 · Finding the case: a trick</h3>
<p>Turn the relative clause into a normal sentence with the noun in it:</p>
<div class="ex"><div class="ex-h">Examples</div>
<p>Der Mann, ___ ich gestern gesehen habe … → Ich habe <b>den Mann</b> gesehen. → Akk → <b>den</b></p>
<p>Die Freundin, ___ ich helfe … → Ich helfe <b>der Freundin</b>. → Dat → <b>der</b></p>
<p>Die Kollegen, ___ ich oft spreche mit … → mit <b>den Kollegen</b> → Dat pl → <b>mit denen</b></p></div>
<p>A preposition goes in front of the relative pronoun: <i>der Kollege, <b>mit dem</b> ich arbeite; die Stadt, <b>in der</b> ich wohne</i>.</p>
<div class="trap"><b>Common mistake:</b> "Der Mann, den wohnt neben mir." Here the man is the subject of <i>wohnt</i>, so Nominativ: <b>der</b>. Always ask who does what inside the relative clause.</div>
<div class="book">In the book: Menschen p. 169 (PDF 171), Teil C Sätze p. 185 (PDF 187).</div>`,

 read:{title:"Meine beste Freundin",text:`Meine beste Freundin heißt Ilona. Wir kennen uns seit der Schule, also schon seit 15 Jahren. Ilona ist ein bisschen größer als ich und hat kurze, rote Haare. Sie trägt fast immer eine große, schwarze Brille, die sie in Paris gekauft hat. Ilona ist die lustigste Person, die ich kenne. Aber sie ist auch sehr ehrlich: Wenn ihr etwas nicht gefällt, sagt sie es sofort. Manchmal ist das nicht so angenehm. Sie ist hilfsbereit und immer für mich da, wenn ich Probleme habe. Nur pünktlich ist sie nie! Der Mann, mit dem sie seit zwei Jahren zusammen ist, sagt: „Ilona kommt immer, aber nie zur richtigen Zeit.“`,

{id:"6.3",ch:6,title:"Ratschläge, Lob und Kritik: sollte und Präpositionen mit Akkusativ",pages:[184,191],ga:[[6,41],[56,280],[32,165]],topics:["sollten","akkprep"],
 goals:["Give advice with sollte","Praise and criticize politely","Use für, durch, gegen, ohne, um"],
 theory:`
<h3>1 · Advice: sollte</h3>
<p><i>sollte</i> is the Konjunktiv II of <i>sollen</i>. It's softer than <i>müssen</i> and is the standard way to give advice.</p>
<div class="tablewrap"><table><tr><td>ich sollte</td><td>du solltest</td><td>er/sie sollte</td><td>wir sollten</td><td>ihr solltet</td><td>sie/Sie sollten</td></tr></table></div>
<div class="ex"><div class="ex-h">Examples</div><p>Du <b>solltest</b> mehr Wasser <b>trinken</b>.</p><p>Bei Schlafproblemen <b>sollten</b> Sie abends kein Handy <b>benutzen</b>.</p><p>An deiner Stelle <b>würde</b> ich einen Hund <b>adoptieren</b>. (another advice pattern)</p></div>
<h3>2 · Praise and criticism</h3>
<div class="tablewrap"><table><tr><th>Lob</th><th>Kritik (polite → strong)</th></tr>
<tr><td>Das hast du prima gemacht!<br>Das gefällt mir sehr gut.<br>Mach weiter so!<br>Ich bin begeistert!</td>
<td>Vielleicht <b>solltest</b> du nächstes Mal …<br><b>Könntest</b> du bitte nächstes Mal …?<br>Was hast du denn da gemacht?<br>Hör sofort damit auf!</td></tr></table></div>
<p>The polite forms use Konjunktiv II again (<i>solltest, könntest</i>). Softeners like <i>vielleicht, bitte, eigentlich, doch</i> make a huge difference in tone. The book calls these <i>Redepartikeln</i>.</p>
<h3>3 · Prepositions that always take the accusative</h3>
<p><em>durch, für, gegen, ohne, um</em>. Mnemonic: <b>DOGFU</b> (durch, ohne, gegen, für, um). Only the masculine shows a visible change: <i>der → den, ein → einen, er → ihn</i>.</p>
<div class="ex"><div class="ex-h">Examples</div><p>Haustiere sind gut <b>gegen den</b> Stress.</p><p>Ich habe ein Geschenk <b>für meinen</b> Bruder / <b>für dich</b>.</p><p>Wir spazieren <b>durch den</b> Park.</p><p>Er geht nie <b>ohne seinen</b> Hund aus dem Haus.</p><p>Wir sitzen <b>um den</b> Tisch.</p></div>
<div class="trap"><b>Common mistake:</b> "für mir", "ohne ihm". Always accusative: <i>für <b>mich</b>, ohne <b>ihn</b></i>.</div>
<div class="book">In the book: Von Tieren und Menschen p. 167 (PDF 169), Teil C Verben p. 184 and Präpositionen p. 187 (PDF 189).</div>`,
 extra:[
 {q:"Du ___ weniger Kaffee trinken. (sollen, K II)",a:["solltest"]},
 {q:"Sie ___ mal zum Arzt gehen. (formal)",a:["sollten"]},
 {q:"Das Geschenk ist für ___. (du)",a:["dich"]},
 {q:"Wir gehen ohne ___ Chef essen. (unser)",a:["unseren|unsern"]},
 {t:"o",w:["Vielleicht","solltest","du","nächstes Mal","früher","anfangen"],en:"Maybe next time you should start earlier."}

 read:{title:"Frag Dr. Tier",text:`Liebe Frau Dr. Tier,
ich bin 34 und wohne allein in einer kleinen Wohnung in der Stadt. Ich arbeite viel und fühle mich oft einsam. Eine Freundin sagt, ich sollte einen Hund haben. Aber ich bin von 8 bis 18 Uhr im Büro. Was meinen Sie?
Tobias, Basel

Lieber Tobias,
ein Hund ist wirklich gut gegen Einsamkeit, aber er braucht viel Zeit. Ein Hund sollte nicht zehn Stunden allein sein. Vielleicht sollten Sie eine Katze adoptieren. Katzen sind selbstständiger und brauchen nicht so viel Platz. Oder Sie fragen im Tierheim, ob Sie am Wochenende mit einem Hund spazieren gehen können. So haben Sie Kontakt zu Tieren und lernen vielleicht auch neue Leute kennen.
Ihre Dr. Tier`,

{id:"7.1",ch:7,title:"Die Wohnung einrichten: stellen/stehen und Wechselpräpositionen",pages:[192,198],ga:[[33,169],[34,174],[62,306]],topics:["wechselgen","stellen"],
 goals:["Describe where things are in a room","Choose Akkusativ (wohin?) or Dativ (wo?) after the nine two-way prepositions","Use stellen/stehen, legen/liegen, hängen"],
 theory:`
<h3>1 · The nine two-way prepositions</h3>
<p><i>in, an, auf, über, unter, vor, hinter, neben, zwischen</i> can take either case. The question decides:</p>
<div class="tablewrap"><table><tr><th>Wohin? movement to a new place</th><th>Wo? position, no change of place</th></tr>
<tr><td><b>Akkusativ</b>: Ich hänge das Bild an <b>die</b> Wand.</td><td><b>Dativ</b>: Das Bild hängt an <b>der</b> Wand.</td></tr>
<tr><td>Ich lege das Buch auf <b>den</b> Tisch.</td><td>Das Buch liegt auf <b>dem</b> Tisch.</td></tr>
<tr><td>Wir gehen <b>ins</b> Wohnzimmer.</td><td>Wir sitzen <b>im</b> Wohnzimmer.</td></tr></table></div>
<p>Moving around <i>inside</i> one place is still <b>wo</b>: <i>Die Kinder laufen <b>im</b> Garten.</i> (they don't enter it, they're already there)</p>
<h3>2 · The verb pairs</h3>
<div class="tablewrap"><table><tr><th>Action (wohin? + Akk), regular</th><th>Result (wo? + Dat), irregular</th></tr>
<tr><td><b>stellen</b> – stellte – hat gestellt (upright)</td><td><b>stehen</b> – stand – hat gestanden</td></tr>
<tr><td><b>legen</b> – legte – hat gelegt (flat)</td><td><b>liegen</b> – lag – hat gelegen</td></tr>
<tr><td><b>setzen</b> – setzte – hat gesetzt</td><td><b>sitzen</b> – saß – hat gesessen</td></tr>
<tr><td><b>hängen</b> – hängte – hat gehängt</td><td><b>hängen</b> – hing – hat gehangen</td></tr></table></div>
<p>Logic: you <i>stellen</i> a bottle (it then <i>steht</i>), you <i>legen</i> a book flat (it then <i>liegt</i>). Things with a base stand, things without lie: <i>Die Flasche steht, das Handy liegt, der Teller steht (on the table) or liegt (in the sink)</i>.</p>
<h3>3 · Contractions</h3>
<p><i>in dem = <b>im</b>, in das = <b>ins</b>, an dem = <b>am</b>, an das = <b>ans</b></i>. In speech you'll also hear <i>aufs</i> (auf das).</p>
<div class="ex"><div class="ex-h">My room</div><p>Mein Bett <b>steht</b> <b>neben dem</b> Fenster. <b>Über dem</b> Bett <b>hängt</b> ein Poster. Meine Bücher <b>stehen</b> <b>im</b> Regal. Mein Laptop <b>liegt</b> meistens <b>auf dem</b> Schreibtisch, aber gestern habe ich ihn <b>aufs</b> Bett <b>gelegt</b>.</p></div>
<div class="trap"><b>Common mistake:</b> using stellen for position: "Die Vase stellt auf dem Tisch." Position = <i>steht</i>. Also: after these verbs the case follows automatically. stellen/legen/hängen(-te) → Akk, stehen/liegen/hängen(hing) → Dat.</div>
<div class="book">In the book: Wohnen p. 192 (PDF 194), Teil C Verben p. 207 and Präpositionen p. 213 (PDF 215).</div>`,

 {q:"Ich stelle die Lampe neben ___ Sofa.",a:["das"]},
 {q:"Die Lampe steht neben ___ Sofa.",a:["dem"]},
 {q:"Wohin hast du meine Brille ___? (legen)",a:["gelegt"]},
 {q:"Der Mantel ___ im Schrank. (hängen)",a:["hängt"]},

 read:{title:"Endlich eine eigene Wohnung",text:`Seit einem Monat wohnt Lina in ihrer ersten eigenen Wohnung in Winterthur. Die Wohnung ist klein, aber hell. Im Wohnzimmer steht ein altes Sofa, das sie von ihrer Tante bekommen hat. Neben dem Sofa steht eine große Pflanze. An der Wand über dem Sofa hängt ein Bild von ihrem Lieblingsmaler. Ihren Schreibtisch hat sie direkt ans Fenster gestellt, weil sie beim Lernen gern nach draußen schaut. Nur mit der Küche ist sie nicht zufrieden: Sie ist sehr klein, und der Kühlschrank steht im Flur, weil er nicht in die Küche passt. „Aber die Miete ist günstig“, sagt Lina, „und der Bahnhof ist nur fünf Minuten entfernt.“`,

{id:"7.2",ch:7,title:"Früher: als oder wenn? Infinitiv mit zu",pages:[199,212],ga:[[72,358],[68,340],[69,345]],topics:["alswenn","zu"],
 goals:["Talk about the past with als and wenn","Use zu + infinitive after Lust haben, versuchen, vergessen …"],
 theory:`
<h3>1 · als vs. wenn: the one-time test</h3>
<div class="tablewrap"><table><tr><th></th><th>Past</th><th>Present / future</th></tr>
<tr><td>Once, or one period</td><td><b>als</b>: Als ich ein Kind <b>war</b>, …<br>Als ich gestern nach Hause <b>kam</b>, …</td><td rowspan="2"><b>wenn</b>: Wenn ich Zeit habe, … / Wenn du kommst, …</td></tr>
<tr><td>Repeated</td><td><b>(immer) wenn</b>: Immer wenn ich Oma besuchte, …</td></tr></table></div>
<p>Both are subordinating: verb at the end, and if they come first, the main clause starts with the verb: <i>Als ich zwölf war, <b>sind</b> wir nach Zürich umgezogen.</i></p>
<div class="trap"><b>Common mistake:</b> "Wenn ich ein Kind war …" Childhood is one period in the past → <b>als</b>. Test: can you add "jedes Mal" (every time)? If yes → wenn. If no → als.</div>
<h3>2 · Infinitiv mit zu</h3>
<p>After certain verbs and expressions, a second action comes as <em>zu + infinitive</em> at the end of the clause:</p>
<div class="ex"><div class="ex-h">Triggers</div><p>Ich habe keine <b>Lust</b>, heute <b>zu kochen</b>.</p><p>Ich <b>versuche</b>, gesünder <b>zu essen</b>.</p><p><b>Vergiss nicht</b>, den Müll raus<b>zu</b>bringen.</p><p>Ich habe <b>vor</b>, am Wochenende auf<b>zu</b>räumen.</p><p><b>Es ist schwer</b>, in Zürich eine Wohnung <b>zu finden</b>.</p><p>Common triggers: <i>Lust/Zeit/Angst haben, anfangen, aufhören, versuchen, vergessen, vorhaben, beginnen, es ist wichtig/schön/schwer/verboten</i>.</p></div>
<p>Separable verbs put zu in the middle: <i>auf<b>zu</b>stehen, ein<b>zu</b>kaufen, an<b>zu</b>rufen</i>.</p>
<p><b>No zu</b> after modal verbs, <i>werden</i>, <i>lassen</i>, and verbs of movement like <i>gehen</i>: <i>Ich <b>muss</b> arbeiten. Ich <b>gehe</b> einkaufen.</i></p>
<div class="book">In the book: Ein Garten in der Stadt p. 199 (PDF 201), Teil C Sätze p. 210 (PDF 212).</div>`,
 extra:[
 {q:"___ ich 18 war, habe ich meinen Führerschein gemacht.",a:["Als"]},
 {q:"Jedes Mal, ___ ich nach Bern fahre, regnet es.",a:["wenn"]},
 {q:"Ich habe keine Zeit, dich ___. (anrufen)",a:["anzurufen"]},
 {q:"Es ist wichtig, genug ___ schlafen.",a:["zu"]},
 {t:"c",q:"Ich gehe heute ___ schwimmen.",o:["zu","— (no zu)"],a:1}
 ],
 read:{title:"Omas Garten",text:`Als ich ein Kind war, habe ich jeden Sommer zwei Wochen bei meiner Oma auf dem Land verbracht. Sie hatte einen riesigen Garten mit Gemüse, Kräutern und Obstbäumen. Immer wenn ich ankam, wartete sie schon mit einem Apfelkuchen auf mich. Morgens hatte ich keine Lust aufzustehen, aber Oma sagte: „Der Garten wartet nicht!“ Also haben wir Tomaten und Bohnen geerntet und Unkraut gezogen. Als ich 14 war, hat Oma mir gezeigt, wie man Konfitüre macht. Heute wohne ich in der Stadt und habe nur einen kleinen Balkon. Trotzdem versuche ich jedes Jahr, ein paar Tomaten und Kräuter anzupflanzen. Jedes Mal, wenn ich sie gieße, denke ich an Oma.`,

{id:"7.3",ch:7,title:"Essen und Restaurant: deshalb und trotzdem",pages:[200,206],ga:[[41,214]],topics:["deshalb"],
 goals:["Talk about eating habits and recipes","Connect ideas with deshalb (so) and trotzdem (anyway)","Order and complain in a restaurant"],
 theory:`
<h3>1 · Connectors in position 1</h3>
<p><i>deshalb</i> and <i>trotzdem</i> are adverbs, not subordinating words. They take position 1 in their clause, so the <b>verb comes immediately after</b>:</p>
<div class="formula">Ich esse gern Gemüse<span>,</span> <span>deshalb</span> <b>kaufe</b> ich jede Woche auf dem Markt ein.</div>
<div class="tablewrap"><table><tr><th>Meaning</th><th>Main clause (verb 2nd)</th><th>Subordinate clause (verb last)</th></tr>
<tr><td>reason → consequence</td><td>…, <b>deshalb</b> / <b>deswegen</b> / <b>darum</b> + verb</td><td>…, <b>weil</b> … verb</td></tr>
<tr><td>contrast</td><td>…, <b>trotzdem</b> + verb</td><td>…, <b>obwohl</b> … verb</td></tr></table></div>
<div class="ex"><div class="ex-h">Same meaning, two structures</div><p>Ich habe keine Zeit, <b>deshalb esse</b> ich in der Kantine.</p><p>Ich esse in der Kantine, <b>weil</b> ich keine Zeit <b>habe</b>.</p><p>Das Restaurant ist teuer, <b>trotzdem gehen</b> wir oft hin.</p><p>Wir gehen oft hin, <b>obwohl</b> das Restaurant teuer <b>ist</b>.</p></div>
<p>Compare: <i>und, aber, oder, denn, sondern</i> are "position 0" connectors: they don't count, so the order stays normal: <i>…, <b>aber</b> ich <b>habe</b> keine Zeit.</i></p>
<div class="trap"><b>Common mistake:</b> "…, deshalb ich kaufe …" After deshalb/trotzdem the verb comes first, then the subject.</div>
<h3>2 · In the restaurant</h3>
<div class="ex"><div class="ex-h">Redemittel</div><p>Ich hätte gern die Kürbissuppe. / Ich nehme das Tagesmenü.</p><p>Könnte ich bitte noch ein Glas Wasser haben?</p><p>Entschuldigung, das Essen ist kalt. / Ich glaube, Sie haben meine Bestellung vergessen.</p><p>Die Rechnung, bitte. / Zusammen oder getrennt? – Getrennt, bitte.</p><p>Guten Appetit! – Danke, gleichfalls. / Prost! / Zum Wohl!</p></div>
<p>Switzerland: service is included, but people round up (<i>Das stimmt so.</i> = keep the change). Some Swiss words: <i>das Znüni</i> (morning snack), <i>der Zmittag</i>, <i>das Poulet</i> (chicken), <i>die Rüebli</i> (carrots).</p>
<div class="book">In the book: Gesunde Ernährung p. 200 (PDF 202). Teil B is about the effect of colors, including on appetite.</div>`,
 extra:[
 {t:"o",w:["Ich","trinke","keinen Kaffee",",","deshalb","schlafe","ich","gut"],en:"I don't drink coffee, so I sleep well."},
 {q:"Das Essen war kalt, ___ haben wir alles gegessen.",a:["trotzdem"]},
 {q:"Er ist Vegetarier, ___ bestellt er das Gemüsecurry.",a:["deshalb|deswegen|darum"]},
 {t:"c",q:"Welcher Satz ist richtig?",o:["Ich habe Hunger, deshalb ich esse.","Ich habe Hunger, deshalb esse ich.","Ich habe Hunger, deshalb esse."],a:1},

 read:{title:"Gesund essen im Alltag?",text:`Viele Menschen wissen, dass Gemüse gesund ist. Trotzdem essen die meisten Schweizerinnen und Schweizer zu wenig davon. Experten empfehlen fünf Portionen Obst und Gemüse pro Tag. Das klingt viel, ist aber nicht so schwer: Ein Apfel am Morgen, ein Salat zum Mittagessen und etwas Gemüse am Abend – und schon hat man drei Portionen. Das Problem ist oft die Zeit. Viele arbeiten lange, deshalb kaufen sie Fertigprodukte. Diese enthalten aber oft viel Salz, Zucker und Fett. Ein Tipp: Am Sonntag eine große Portion Gemüsesuppe kochen und sie für die Woche einfrieren. So hat man immer etwas Gesundes zu Hause.`,

{id:"8.1",ch:8,title:"Nachrichten: das Passiv",pages:[218,223],ga:[[57,284],[58,288]],topics:["passiv"],
 goals:["Understand short news items","Form the passive in present and past"],
 theory:`
<h3>1 · Why the passive exists</h3>
<p>News, instructions and official texts care about <b>what happens</b>, not who does it. That's the passive: <i>Die Brücke <b>wird</b> renoviert.</i> (Who renovates it? Doesn't matter.)</p>
<div class="formula"><span>werden</span> in position 2 &nbsp;+&nbsp; … &nbsp;+&nbsp; <span>Partizip II</span> at the end</div>
<div class="tablewrap"><table><tr><th></th><th>Active</th><th>Passive</th></tr>
<tr><td>Präsens</td><td>Die Stadt baut ein Stadion.</td><td>Ein Stadion <b>wird</b> gebaut.</td></tr>
<tr><td>Präteritum</td><td>Die Stadt baute ein Stadion.</td><td>Ein Stadion <b>wurde</b> gebaut.</td></tr>
<tr><td>Perfekt (B1 preview)</td><td>Die Stadt hat ein Stadion gebaut.</td><td>Ein Stadion <b>ist</b> gebaut <b>worden</b>.</td></tr></table></div>
<p>The accusative object of the active sentence becomes the <b>subject</b> (Nominativ) of the passive: <i>Man baut <b>den</b> Turm → <b>Der</b> Turm wird gebaut.</i> If you want to name the doer: <i>von + Dativ</i>: <i>Das Telefon wurde <b>von</b> Bell erfunden.</i></p>
<h3>2 · werden forms</h3>
<div class="tablewrap"><table><tr><th></th><th>ich</th><th>du</th><th>er/sie/es</th><th>wir</th><th>ihr</th><th>sie/Sie</th></tr>
<tr><td>Präsens</td><td>werde</td><td>wirst</td><td>wird</td><td>werden</td><td>werdet</td><td>werden</td></tr>
<tr><td>Präteritum</td><td>wurde</td><td>wurdest</td><td>wurde</td><td>wurden</td><td>wurdet</td><td>wurden</td></tr></table></div>
<div class="trap"><b>Watch out:</b> <i>werden</i> has three jobs. Future: <i>Ich <b>werde</b> kommen.</i> Becoming: <i>Sie <b>wird</b> Ärztin.</i> Passive: <i>Das Haus <b>wird</b> gebaut.</i> Look at the end of the clause: an infinitive means future, a participle means passive, a noun or adjective means "become".</div>
<h3>3 · News vocabulary</h3>
<div class="ex"><div class="ex-h">Typical headlines</div><p>Neue Brücke <b>wird</b> eröffnet. · Zwei Personen <b>wurden</b> verletzt. · Der Streik <b>wurde</b> beendet. · In Bern <b>wird</b> gewählt. · Hier <b>wird</b> nicht geraucht.</p></div>
<div class="book">In the book: Neues aus dem In- und Ausland p. 218 (PDF 220), Teil C Verben p. 234 (PDF 236).</div>`,

{id:"8.2",ch:8,title:"Umwelt und Meinung: um … zu, damit",pages:[224,226],ga:[[74,366]],topics:["umzu"],
 goals:["Give your opinion, agree and disagree","Express purpose with um … zu and damit"],
 theory:`
<h3>1 · Purpose: um … zu vs. damit</h3>
<div class="tablewrap"><table><tr><th></th><th>When</th><th>Example</th></tr>
<tr><td><b>um … zu</b> + infinitive</td><td>same subject in both parts</td><td>Ich fahre Velo, <b>um</b> Energie <b>zu sparen</b>. (I ride, I save)</td></tr>
<tr><td><b>damit</b> + verb last</td><td>different subjects (and always possible)</td><td>Ich spreche langsam, <b>damit</b> du mich <b>verstehst</b>. (I speak, you understand)</td></tr></table></div>
<p>Separable verbs: <i>um früh auf<b>zu</b>stehen</i>. Don't put a modal verb into an um-zu clause: <i>um zu können</i> is almost never needed.</p>
<div class="trap"><b>Common mistake:</b> "für zu sparen" (from English "for to"). German purpose = <i>um … zu</i>. Also: <i>damit</i> here means "so that", not "with it".</div>
<h3>2 · Opinions</h3>
<div class="ex"><div class="ex-h">Giving your opinion</div><p><b>Meiner Meinung nach</b> sollte man mehr Zug fahren. (note: verb comes next)</p><p><b>Ich bin der Meinung</b>, dass … / <b>Ich finde</b>, dass … / <b>Ich glaube</b>, dass …</p></div>
<div class="ex"><div class="ex-h">Agreeing / disagreeing</div><p>Das finde ich auch. / Da hast du recht. / Ich bin ganz deiner Meinung. / Ich bin dafür.</p><p>Das sehe ich anders. / Ich bin ganz anderer Meinung. / Ich bin dagegen. / Da muss ich widersprechen.</p><p>Softer: Einerseits …, andererseits … / Das stimmt, aber …</p></div>
<h3>3 · Environment vocabulary</h3>
<p><i>die Umwelt schützen, Energie sparen, den Müll trennen, recyceln, die Luftverschmutzung, der Klimawandel, erneuerbare Energien, öffentliche Verkehrsmittel benutzen, weniger fliegen, Plastik vermeiden</i>.</p>
<p>Switzerland detail: you pay per garbage bag (<i>Gebührensack</i>), which is a big reason people sort their trash (<i>Müll trennen</i>) so carefully.</p>
<div class="book">In the book: Neues zum Thema Umwelt p. 224 (PDF 226), Teil C Sätze p. 237 (PDF 239).</div>`,

{id:"8.3",ch:8,title:"Technik: Präpositionen mit Dativ und Gebrauchsanweisungen",pages:[227,239],ga:[[31,161]],topics:["datprep"],
 goals:["Understand simple instructions for devices","Describe a tech problem","Use aus, bei, mit, nach, seit, von, zu"],
 theory:`
<h3>1 · The seven dative prepositions</h3>
<p><em>aus, bei, mit, nach, seit, von, zu</em> (plus <i>gegenüber</i>) always take the dative. Chant it to the tune of the Blue Danube waltz ("aus-bei-mit, nach-seit-von-zu") if that helps.</p>
<div class="tablewrap"><table><tr><th>aus</th><td>from (inside), made of</td><td>aus der Schweiz, aus Plastik</td></tr>
<tr><th>bei</th><td>at someone's place / company, during</td><td>bei meinen Eltern, bei Google, beim Kochen</td></tr>
<tr><th>mit</th><td>with, by (transport)</td><td>mit dem Zug, mit einem Kabel</td></tr>
<tr><th>nach</th><td>after, to (cities/countries)</td><td>nach der Arbeit, nach Wien</td></tr>
<tr><th>seit</th><td>since, for (still going)</td><td>seit einem Jahr</td></tr>
<tr><th>von</th><td>from, of, by</td><td>von meiner Oma, von 9 bis 5</td></tr>
<tr><th>zu</th><td>to (people, institutions)</td><td>zum Arzt, zur Arbeit</td></tr></table></div>
<p>Contractions: <i>zu dem = zum, zu der = zur, von dem = vom, bei dem = beim</i>. Dative plural nouns add <b>-n</b>: <i>mit den Kinder<b>n</b>, mit meinen Freunde<b>n</b></i>.</p>
<h3>2 · Instructions</h3>
<p>Manuals use the infinitive or the <i>Sie</i>-imperative:</p>
<div class="ex"><div class="ex-h">Gebrauchsanweisung</div><p>Gerät <b>einschalten</b>: Taste A drücken. / <b>Drücken Sie</b> die Taste A.</p><p>Akku vor dem ersten Gebrauch vollständig <b>aufladen</b>.</p><p>Das Kabel <b>mit dem</b> Computer <b>verbinden</b>.</p><p>Nicht <b>mit</b> Wasser reinigen!</p></div>
<h3>3 · Describing a problem</h3>
<div class="ex"><div class="ex-h">Redemittel</div><p>Mein Laptop funktioniert nicht mehr. / Der Bildschirm bleibt schwarz.</p><p>Seit gestern lässt sich das Handy nicht mehr aufladen.</p><p>Ich habe ihn schon aus- und wieder eingeschaltet.</p><p>Das Gerät ist erst drei Monate alt. Ist das noch Garantie?</p><p>Können Sie ihn reparieren, oder bekomme ich ein neues Gerät?</p></div>
<div class="trap"><b>Common mistake:</b> "mit der Zug", "nach die Arbeit". These prepositions never take accusative: <i>mit <b>dem</b> Zug, nach <b>der</b> Arbeit</i>.</div>
<div class="book">In the book: Altes und Neues zum Thema Technik p. 227 (PDF 229), Teil C Präpositionen p. 238 (PDF 240), and the full review (Gesamtwiederholung) from p. 240.</div>`,

{id:"9.1",ch:9,title:"Prüfungstraining: Start Deutsch 2 / A2",pages:[250,256],ga:[],topics:["perfekt","datakk","weilwenn","adjgen","wechselgen","relativ","k2polite","passiv"],
 goals:["Know the structure of an A2 exam","Practice the writing tasks under time pressure","Test yourself across all eight chapters"],
 theory:`
<h3>1 · The exam at a glance</h3>
<p>The Begegnungen appendix contains a practice test for <i>Start Deutsch 2</i>, the A2 exam that is now called the <b>Goethe-Zertifikat A2</b>. The format is roughly this (check your own exam's official page, since formats change):</p>
<div class="tablewrap"><table><tr><th>Part</th><th>Time</th><th>What you do</th></tr>
<tr><td>Hören (listening)</td><td>~30 min</td><td>Announcements, phone messages, short conversations, radio. Multiple choice and matching.</td></tr>
<tr><td>Lesen (reading)</td><td>~30 min</td><td>Newspaper notes, signs, ads, emails. You find specific information.</td></tr>
<tr><td>Schreiben (writing)</td><td>~30 min</td><td>Two short texts: an informal message (SMS, ~20–30 words) and a short formal or semi-formal email (~30–40 words). Cover every point listed.</td></tr>
<tr><td>Sprechen (speaking)</td><td>~15 min, in pairs</td><td>(1) Ask and answer questions with word cards. (2) Talk about your life on a topic. (3) Plan something together with your partner.</td></tr></table></div>
<p>You usually need about 60% to pass.</p>
<h3>2 · Writing: how points are lost</h3>
<p>Most lost points come from <b>missing one of the three task points</b>, not from grammar. Strategy: underline the three points, write one or two sentences per point, and check them off. Use a greeting and a closing that fit the register (<i>Lieber Marco / Liebe Grüße</i> vs. <i>Sehr geehrte Damen und Herren / Mit freundlichen Grüßen</i>).</p>
<div class="ex"><div class="ex-h">Model answer (SMS, 3 points)</div><p>Hallo Marco, es tut mir leid, aber ich kann am Samstag nicht zu deinem Geburtstag kommen. Meine Schwester heiratet an diesem Tag. Hast du nächste Woche Zeit? Wir könnten zusammen essen gehen. Liebe Grüße, Anna</p></div>
<h3>3 · Speaking: survival phrases</h3>
<div class="ex"><div class="ex-h">Redemittel</div><p>Wie bitte? Können Sie das bitte wiederholen?</p><p>Was bedeutet das Wort …?</p><p>Ich weiß nicht genau, wie man das sagt, aber …</p><p>Planning: Wann hast du Zeit? – Am Montag kann ich nicht, aber wie wäre es mit Dienstag? – Gute Idee, dann treffen wir uns um drei.</p></div>
<h3>4 · Your last two weeks</h3>
<p>(1) Do the practice test in the book (p. 250, PDF 252) with a timer. (2) Write both exam-format tasks in Schreiben and let Claude grade them. (3) Run the Mistakes tab until it's empty. (4) Do each role-play once more, this time without looking anything up.</p>
<div class="book">In the book: Übungstest p. 250 (PDF 252) and Grammatik in Übersichten from p. 257 (PDF 259), the best one-stop grammar review in the book.</div>`,

/* ================= APP ================= */
const FOUR_LANES="https://claude.ai/artifact/Vnx7HMkgddgpTuiHVtZHnE";
const WEEKLY_GOAL=420;
const NEW_PER_DAY=12;
const INTERVALS=[0,1,3,7,16,35]; // days per Leitner box
const CH_ALT_SEIN=new Set(["liegen","sitzen","stehen"]);

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d);};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const today=()=>iso(new Date());
const fmt=s=>parseD(s).toLocaleDateString("en-US",{month:"short",day:"numeric"});
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const slug=s=>s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
const clone=o=>JSON.parse(JSON.stringify(o));
const mondayOf=s=>{const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);};

function norm(s){
  return String(s||"").toLowerCase().normalize("NFC")
    .replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
    .replace(/[’'`´]/g,"").replace(/[.,!?;:…"„“()]/g," ").replace(/\s+/g," ").trim();
}
function lev(a,b){
  if(a===b)return 0; const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}
  return prev[n];
}
/* returns "ok" | "typo" | "no" */
function judge(given,accepted,{typo=true}={}){
  const g=norm(given); if(!g)return "no";
  const alts=String(accepted).split("|").map(norm);
  if(alts.includes(g))return "ok";
  if(typo&&alts.some(a=>a.length>=6&&lev(a,g)===1))return "typo";
  return "no";
}

const splitList=s=>String(s||"").split(/[,;]/).map(x=>x.trim()).filter(Boolean);
function umlautLast(w){
  const i=Math.max(w.lastIndexOf("a"),w.lastIndexOf("o"),w.lastIndexOf("u"));if(i<0)return w;
  if(w[i]==="u"&&w[i-1]==="a")return w.slice(0,i-1)+"ä"+w.slice(i);
  return w.slice(0,i)+{a:"ä",o:"ö",u:"ü"}[w[i]]+w.slice(i+1);
}
/* plural answer: "die Stellen", "Stellen", or dictionary shorthand "-n", "¨-e", "-" */
function judgePlural(c,given){
  let g=String(given||"").trim().replace(/^die\s+/i,"");if(!g)return "no";
  if(/^(¨?\s*[-–]\s*¨?\s*[a-zäöüß]*|¨[a-zäöüß]*)$/i.test(g)){
    const um=g.includes("¨"),suf=g.replace(/[¨\-–\s]/g,"");
    g=(um?umlautLast(c.noun):c.noun)+suf;
  }
  return judge(g,c.pl,{typo:false}); // plurals differ by one letter or an umlaut, so no typo slack
}
/* ---------- content build ---------- */
const CARDS={};
const CARD_ORDER=[];
for(const ch of Object.keys(VOCAB)){
  for(const line of VOCAB[ch].split("\n")){
    const [de,pl,en]=line.split("|").map(x=>(x||"").trim()); if(!de)continue;
    const m=de.match(/^(der|die|das) (.+)$/);
    const isNoun=!!(m&&/^[A-ZÄÖÜ]/.test(m[2])&&!/[.?!…]/.test(de));
    const phrase=!isNoun&&(/[.?!…]/.test(de)||/^[A-ZÄÖÜ]/.test(de));
    const id="w"+ch+"-"+slug(de);
    CARDS[id]={id,t:"w",ch:+ch,de,en,pl:pl||"",art:isNoun?m[1]:"",noun:isNoun?m[2]:"",kind:isNoun?"noun":phrase?"phrase":"word"};
    CARD_ORDER.push(id);
  }
}
for(const line of VERBS.split("\n")){
  const [inf,pr,pt,pf,ch,en]=line.split("|").map(x=>x.trim()); if(!inf)continue;
  const id="v-"+slug(inf);
  CARDS[id]={id,t:"v",ch:+ch,inf,pr,pt,pf,en,kind:"verb"};
  CARD_ORDER.push(id);
}

function genAdj(){
  const cs=pick(["N","A","D","D","A"]);
  const type=pick(["def","ind","ind","none","def"]);
  let noun,g,adj,shown;
  if(type==="none"){
    if(Math.random()<.55){const m=pick(ADJ_MASS);noun=m.n;g=m.g;adj=pick(m.a);}
    else{const x=pick(ADJ_NOUNS);g="pl";noun=cs==="D"?datPl(x.pl):x.pl;adj=pick(x.p?ADJ_PERS:ADJ_THING);}
  }else{
    const x=pick(ADJ_NOUNS);const plural=Math.random()<.22;
    g=plural?"pl":x.g;noun=plural?(cs==="D"?datPl(x.pl):x.pl):x.n;adj=pick(x.p?ADJ_PERS:ADJ_THING);
  }
  const gi=GI[g], end=ENDINGS[type][cs][gi];
  const frame={N:g==="pl"?"Hier sind":"Hier ist",A:"für",D:"mit"}[cs];
  const art=type==="none"?"":ARTS[type][cs][gi];
  const blankArt=type!=="none"&&Math.random()<.35;
  const base=type==="def"?"der/die/das":"ein/kein";
  const q=`${frame} ${type==="none"?"":blankArt?"___ ":art+" "}${stemOf(adj)}___ ${noun}.`;
  const a=blankArt?[art,end]:[end];
  const gname={m:"masculine",f:"feminine",n:"neuter",pl:"plural"}[g];
  let why=`${CASE_NAME[cs]}, ${gname}`;
  if(type==="none")why+=", no article → the adjective carries the der/die/das signal (-"+end+")";
  else if(type==="ind"&&["er","es"].includes(end))why+=`: "${art}" hides the gender, so the adjective shows it (-${end})`;
  else why+=`: the article already shows it, so the adjective takes -${end}`;
  return {q,a,hint:`${CASE_NAME[cs]} · ${gname}${blankArt?" · article: "+base:""}`,why,gen:"adjgen",tile:end};
}

async function flush(){

        if(sn.exists){S[n]=Object.assign(clone(DEF[n]),clone(sn.data()));lastJSON[n]=JSON.stringify(sn.data());}
        else if(JSON.stringify(S[n])!==JSON.stringify(DEF[n]))migrate.push(n);});

function newCards(maxCh,n,filter=()=>true){

  weak.slice(0,2).forEach(tid=>gram.push({k:"gram",tid,item:gramItem(tid)}));

/* ---------- drill actions ---------- */
function curItem(){return ui.sess&&ui.sess.q[ui.sess.i];}
function readInputs(it){
  if(it.k==="card"){const c=CARDS[it.id];
    if(c.t==="v")it.vals=[...document.querySelectorAll("[data-vf]")].map(e=>e.value);
    else{const a=$("[data-ans]");if(a)it.val=a.value;const p=$("[data-pl]");if(p)it.pl=p.value;}
  }else if(!it.item.t)it.vals=[...document.querySelectorAll("[data-blank]")].map(e=>e.value);
}
function check(){
  const it=curItem();if(!it||it.res)return;readInputs(it);
  if(it.k==="card")return checkCard(it);
  const x=it.item;let kind="no";
  if(x.t==="c"){if(it.pickd==null)return;kind=it.pickd===x.a?"ok":"no";}
  else if(x.t==="o"){const got=norm((it.built||[]).map(k=>x.w[k]).join(" "));if(!(it.built||[]).length)return;kind=[x.w.join(" "),...(x.alt||[])].some(a=>norm(a)===got)?"ok":"no";}
  else{
    if((it.vals||[]).every(v=>!v.trim()))return;
    if(x.a.length>1&&it.vals.filter(v=>v.trim()).length===1){const k0=it.vals.findIndex(v=>v.includes(","));if(k0>=0){const ps=splitList(it.vals[k0]);if(ps.length===x.a.length)it.vals=ps;}}
    const parts=x.a.map((a,k)=>judge(it.vals[k],a,{typo:!/^(der|die|das|den|dem|des|ein|eine|einen|einem|einer|eines|kein|keine|keinen|keinem|keiner|keins|keines|e|en|er|es|em)$/i.test(String(a).split("|")[0])}));
    it.res={parts};kind=parts.every(p=>p==="ok")?"ok":parts.every(p=>p!=="no")?"typo":"no";
  }
  it.res=Object.assign(it.res||{},{kind});
  const ok=kind!=="no";
  recordTopic(it.tid,ok);
  if(ok){ui.sess.ok++;if(it.redo)fixMistake(it.tid,x);}
  else{ui.sess.no++;addMistake(it.tid,x,x.t==="c"?x.o[it.pickd]:x.t==="o"?(it.built||[]).map(k=>x.w[k]).join(" "):(it.vals||[]).join(" / "));}
  render();focusNext();
}
function checkCard(it){
  const c=CARDS[it.id];let ok,typo=false,cls,msg="",plCls="";
  if(c.t==="v"){
    const exp=[c.pr,c.pt,c.pf].map((f,k)=>k===2&&CH_ALT_SEIN.has(c.inf)?f+"|"+f.replace(/^hat /,"ist "):f);
    let raw=it.vals.slice();
    // "fährt, fuhr, ist gefahren" typed into one box fills all three
    const k0=raw.findIndex(v=>v.includes(","));
    if(k0>=0&&raw.filter(v=>v.trim()).length===1){let ps=splitList(raw[k0]);if(ps.length===4&&judge(ps[0],c.inf)!=="no")ps=ps.slice(1);if(ps.length>=2){raw=[0,1,2].map(k=>ps[k]||"");it.vals=raw;}}
    const vals=raw.map(v=>v.replace(/^\s*(er|sie|es)\s+/i,""));
    if(vals.every(v=>!v.trim()))return;
    const parts=exp.map((e,k)=>judge(vals[k],e));
    ok=parts.every(p=>p!=="no");typo=ok&&parts.some(p=>p==="typo");
    it.res={parts,ok,typo};
  }else{
    const g=(it.val||"").trim();if(!g)return;
    const gp=splitList(g);
    if(c.kind==="noun"){
      const m=norm(gp[0]).match(/^(der|die|das) (.+)$/);
      if(!m){ok=false;msg="You need the article. That's the whole point of learning the noun.";}
      else if(m[1]!==c.art){ok=false;msg=`Wrong article: it's <b class="g-${c.art}">${c.art}</b> ${esc(c.noun)}.`;}
      else{const j=judge(m[2],c.noun);ok=j!=="no";typo=j==="typo";}
      const askPl=c.pl&&srs(it.id)&&srs(it.id).b>=2;
      const plGiven=((it.pl||"").trim()||gp[1]||"").trim();
      if(c.pl&&(askPl||plGiven)){const pj=judgePlural(c,plGiven);plCls=pj;if(pj==="no"){if(ok)msg=plGiven?`Singular right, but the plural is die ${esc(c.pl)}.`:`Plural is die ${esc(c.pl)}.`;ok=false;}else if(pj==="typo")typo=true;}
    }else{let j=judge(g,c.de);if(j==="no"&&gp.length>1)j=judge(gp[0],c.de);ok=j!=="no";typo=j==="typo";}
    cls=ok?(typo?"typo":"ok"):"no";
    it.res={ok,typo,cls,plCls,msg};
  }
  if(!it.cram||!ok)grade(it.id,ok);
  if(ok)ui.sess.ok++;else{ui.sess.no++;requeue(it);}
  render();focusNext();
}
function requeue(it){if(it.requeued)return;const s=ui.sess;s.q.splice(Math.min(s.q.length,s.i+4),0,{k:it.k,id:it.id,requeued:true});}
function next(){const s=ui.sess;if(!s)return;const it=curItem();if(it&&!it.res&&!it.intro)return;s.i++;if(s.i>=s.q.length)finishSession(s);render();focusFirst();}
function focusFirst(){requestAnimationFrame(()=>{const el=document.querySelector(".drill input:not([disabled])");if(el)el.focus({preventScroll:true});});}
function focusNext(){requestAnimationFrame(()=>{const el=document.querySelector('.drill [data-act="next"]');if(el)el.focus({preventScroll:true});});}

async function explain(){
  const it=curItem();if(!it||!sample)return;const x=it.item;it.explaining=true;render();
  const right=x.t==="c"?x.o[x.a]:x.t==="o"?x.w.join(" "):fillAnswer(x);
  const given=x.t==="c"?x.o[it.pickd]:x.t==="o"?(it.built||[]).map(k=>x.w[k]).join(" "):(it.vals||[]).join(" / ");
  try{

    it.explain=text.trim();
  }catch(e){it.explain=e.code==="not_granted"?"Claude access was declined for this page.":"Couldn't reach Claude just now. Try again in a bit.";}

/* ---------- Claude: writing ---------- */
function promptsSorted(){const cur=currentChapter();return WRITING.map((p,i)=>({...p,i})).sort((a,b)=>(a.ch===cur?-1:0)-(b.ch===cur?-1:0)||a.ch-b.ch);}
const wordCount=s=>(s.trim().match(/\S+/g)||[]).length;
async function correctWriting(){
  const w=ui.write;const p=WRITING[w.prompt];if(!sample||!p)return;
  const text=($("#wtext")||{}).value||w.text;w.text=text;if(wordCount(text)<5){w.err="Write at least a few sentences first.";render();return;}
  w.busy=true;w.err="";w.result=null;render();
  const prompt=`You are a demanding but fair German teacher. The learner passed A1 with a top grade and is now working through Begegnungen A2+ (chapter ${p.ch<9?p.ch:"8, exam prep"}). They live in Switzerland but learn standard German (ss instead of ß is fine).
Task: ${p.task}
Target length: ${p.words} words. Grammar focus: ${p.focus}.

Learner's text:
"""
${text.slice(0,6000)}
"""

Reply with ONLY one JSON object:
{"grade": Swiss school grade from 1 to 6 in half steps (6 best, 4 is a pass), judged against what a good A2 learner should produce for this task,
 "verdict": "one or two blunt, specific sentences in English",
 "task_check": "one sentence in English: did they cover every point of the task and hit the length?",
 "corrected": "their full text, corrected with minimal changes, keeping their meaning and voice",
 "errors": [{"wrong": "exact wrong fragment from their text", "right": "corrected fragment", "type": "article|case|ending|word order|verb form|tense|preposition|spelling|vocabulary|other", "why": "one short English sentence naming the rule"}],
 "good": ["up to 3 specific things they did well, in English"],
 "upgrade": "one German sentence they could add to sound stronger, using this chapter's grammar, with an English gloss in parentheses"}
List at most 10 errors, most important first. Count missing noun capitalization as an error.`;
  try{
    const r=await sample.json(prompt,{modelTier:"default"});
    if(!r||typeof r!=="object"||!("corrected" in r))throw {code:"invalid_json"};
    w.result=r;
    S.writing.items.unshift({ts:Date.now(),d:today(),p:w.prompt,text,r});if(S.writing.items.length>25)S.writing.items.length=25;touch("writing");
    logClaudeErrors(r.errors,"writing");
  }catch(e){w.err=errCopy(e);}
  w.busy=false;render();
}
function logClaudeErrors(errs,src){
  if(!Array.isArray(errs))return;
  for(const e of errs.slice(0,6)){if(!e||!e.wrong||!e.right)continue;
    S.mistakes.items.unshift({key:"writing:"+e.wrong+"→"+e.right,tid:"writing",src,item:{wrong:String(e.wrong),right:String(e.right),type:String(e.type||"other"),why:String(e.why||"")},n:1,ts:Date.now(),fixed:false});}
  if(S.mistakes.items.length>160)S.mistakes.items.length=160;touch("mistakes");
}
function errCopy(e){const c=e&&e.code;return c==="not_granted"?"Claude access was declined for this page. Reload to be asked again.":c==="rate_limited"?"Too many requests right now. Give it a minute.":c==="invalid_json"?"Claude's answer came back garbled. Hit the button again.":c==="refused"?"Claude declined that one. Try rephrasing.":"Couldn't reach Claude. Try again in a moment.";}

/* ---------- Claude: conversation ---------- */
function sceneRules(sc){return `Role-play with a German learner at A2 level. ${sc.role}
Rules: speak only German at a simple A2 level. Keep each turn to 1–3 short sentences and end most turns with one question so the learner keeps talking. Stay in role. If the learner's latest message had any mistakes, add a final separate line starting with "✎ " that gives a corrected version of their sentence(s), nothing else on that line. If there were no mistakes, don't add that line. Use standard German; Swiss context (Franken, Grüezi) is fine. If the learner writes in English, answer in simple German and give the German for what they meant in the ✎ line.`;}
async function sendChat(){
  const c=ui.chat;const sc=SCENES[c.scene];const el=$("#chatin");if(!sample||!sc||!el)return;
  const msg=el.value.trim();if(!msg||c.busy)return;
  c.turns.push({role:"user",content:msg});c.busy=true;c.err="";c.stream="";render();scrollChat();
  const turns=[{role:"user",content:sceneRules(sc)},{role:"assistant",content:sc.open},...c.turns.slice(-16)];
  try{
    const {text}=await sample(turns,{cache:false,modelTier:"quick",onText:({text})=>{c.stream=text;const b=$("#streaming");if(b)b.textContent=text;scrollChat();}});
    c.turns.push({role:"assistant",content:text.trim()});

async function chatFeedback(){
