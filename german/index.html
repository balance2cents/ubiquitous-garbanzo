{id:"6.1",ch:6,title:"Tiere vergleichen: Komparativ und Superlativ",pages:[162,168],ga:[[38,196],[39,200]],topics:["kompgen","komparativ"],
 goals:["Compare animals, people and things","Form comparatives and superlatives, including the irregular ones"],
 theory:`
<h3>1 · Three steps</h3>
<div class="tablewrap"><table><tr><th>Positiv</th><th>Komparativ (+ als)</th><th>Superlativ</th></tr>
<tr><td>schnell</td><td>schnell<b>er</b></td><td>am schnell<b>sten</b> / der schnell<b>ste</b></td></tr>
<tr><td>klein</td><td>klein<b>er</b></td><td>am klein<b>sten</b></td></tr>
<tr><td>interessant</td><td>interessant<b>er</b></td><td>am interessant<b>esten</b></td></tr></table></div>
<p>Adjectives ending in <i>-t, -d, -s, -ß, -z, -sch</i> add an e in the superlative: <i>am ält<b>e</b>sten, am heiß<b>e</b>sten, am kürz<b>e</b>sten</i>.</p>
<h3>2 · Umlaut and irregular forms</h3>
<p>Many short adjectives with a, o, u get an umlaut: <i>alt – älter, jung – jünger, groß – größer, warm – wärmer, kalt – kälter, lang – länger, kurz – kürzer, stark – stärker, arm – ärmer, klug – klüger, gesund – gesünder</i>.</p>
<div class="tablewrap"><table><tr><th>gut</th><td>besser</td><td>am besten</td></tr><tr><th>viel</th><td>mehr</td><td>am meisten</td></tr><tr><th>gern</th><td>lieber</td><td>am liebsten</td></tr><tr><th>hoch</th><td>höher</td><td>am höchsten</td></tr><tr><th>nah</th><td>näher</td><td>am nächsten</td></tr><tr><th>teuer</th><td>teurer</td><td>am teuersten</td></tr></table></div>
<h3>3 · Comparing</h3>
<div class="ex"><div class="ex-h">als vs. wie</div><p>Different: Ein Gepard ist schnell<b>er als</b> ein Pferd.</p><p>Equal: Mein Hund ist <b>so</b> groß <b>wie</b> deine Katze. / <b>genauso</b> alt <b>wie</b></p><p>Not equal: Bern ist <b>nicht so</b> groß <b>wie</b> Zürich.</p></div>
<div class="trap"><b>Common mistake:</b> "größer wie" or "so groß als". Comparative → <b>als</b>, same level → <b>wie</b>.</div>
<h3>4 · Superlative before a noun</h3>
<p>Before a noun the superlative takes normal adjective endings: <i>der schnell<b>ste</b> Vogel, das gefährlich<b>ste</b> Tier, mit dem teuer<b>sten</b> Auto</i>. After <i>sein</i> or as an adverb: <i>am … sten</i>: <i>Der Gepard läuft <b>am schnellsten</b>.</i></p>
<div class="book">In the book: Gefährliche Tiere p. 162 (PDF 164), Teil C Adjektive p. 180 (PDF 182). Teil B has a fun insect text ("Wer sticht am gemeinsten?").</div>`,
 extra:[
 {q:"Ein Elefant ist schwerer ___ ein Pferd.",a:["als"]},
 {q:"Mein Bruder ist genauso alt ___ ich.",a:["wie"]},
 {q:"Welches Tier ist am ___? (gefährlich)",a:["gefährlichsten"]},
 {q:"Heute ist es ___ als gestern. (kalt)",a:["kälter"]},

 read:{title:"Rekorde im Tierreich",text:`Welches Tier ist am schnellsten? An Land ist es der Gepard: Er kann bis zu 110 Kilometer pro Stunde laufen, aber nur kurze Zeit. In der Luft ist der Wanderfalke noch viel schneller. Wenn er nach unten fliegt, erreicht er über 300 Kilometer pro Stunde. Das größte Tier der Welt ist der Blauwal. Er ist größer als jeder Dinosaurier und kann über 30 Meter lang werden. Und welches Tier ist am gefährlichsten für Menschen? Nicht der Hai, nicht die Schlange, sondern die Mücke! Sie überträgt Krankheiten wie Malaria und tötet jedes Jahr mehr Menschen als alle anderen Tiere zusammen.`,

{id:"6.2",ch:6,title:"Menschen beschreiben: Relativsätze",pages:[169,186],ga:[[70,350],[71,354]],topics:["relativ"],
 goals:["Describe appearance and character","Add detail with relative clauses (der, die, das, den, dem, denen)"],
 theory:`
<h3>1 · Describing people</h3>
<div class="ex"><div class="ex-h">Aussehen (appearance)</div><p>Sie <b>hat</b> lange, blonde Haare / blaue Augen / ein rundes Gesicht.</p><p>Er <b>ist</b> groß, schlank und sportlich. Er <b>trägt</b> eine Brille und einen Bart.</p></div>
<div class="ex"><div class="ex-h">Charakter</div><p>Sie ist geduldig, zuverlässig und sehr hilfsbereit. Manchmal ist sie ein bisschen chaotisch.</p><p>Opposites to learn in pairs: <i>fleißig – faul, ordentlich – chaotisch, optimistisch – pessimistisch, geduldig – ungeduldig, ernst – lustig</i>.</p></div>
<p>Notice: <i>haben</i> + adjective + noun needs adjective endings (lesson 5.2): <i>Sie hat blau<b>e</b> Augen</i> (no article, plural Akk → -e).</p>
<h3>2 · Relative clauses</h3>
<p>A relative clause adds information about a noun, like "who" or "which/that" in English. German never drops the pronoun (English can: "the man I met").</p>
<div class="formula">Das ist die Frau, <span>die</span> neben mir <span>wohnt</span>.</div>
<p>Three rules: (1) comma before the relative clause; (2) conjugated verb at the end; (3) the relative pronoun takes <b>gender and number</b> from the noun, but its <b>case</b> from its job inside the relative clause.</p>
<div class="tablewrap"><table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr>
<tr><td>Nom</td><td>der</td><td>die</td><td>das</td><td>die</td></tr>
<tr><td>Akk</td><td><b>den</b></td><td>die</td><td>das</td><td>die</td></tr>
<tr><td>Dat</td><td><b>dem</b></td><td><b>der</b></td><td><b>dem</b></td><td><b>denen</b></td></tr></table></div>
<p>It's the definite article, except dative plural <b>denen</b>.</p>
<h3>3 · Finding the case: a trick</h3>
<p>Turn the relative clause into a normal sentence with the noun in it:</p>
<div class="ex"><div class="ex-h">Examples</div>
<p>Der Mann, ___ ich gestern gesehen habe … → Ich habe <b>den Mann</b> gesehen. → Akk → <b>den</b></p>
<p>Die Freundin, ___ ich helfe … → Ich helfe <b>der Freundin</b>. → Dat → <b>der</b></p>
<p>Die Kollegen, ___ ich oft spreche mit … → mit <b>den Kollegen</b> → Dat pl → <b>mit denen</b></p></div>
<p>A preposition goes in front of the relative pronoun: <i>der Kollege, <b>mit dem</b> ich arbeite; die Stadt, <b>in der</b> ich wohne</i>.</p>
<div class="trap"><b>Common mistake:</b> "Der Mann, den wohnt neben mir." Here the man is the subject of <i>wohnt</i>, so Nominativ: <b>der</b>. Always ask who does what inside the relative clause.</div>
<div class="book">In the book: Menschen p. 169 (PDF 171), Teil C Sätze p. 185 (PDF 187).</div>`,

{id:"6.3",ch:6,title:"Ratschläge, Lob und Kritik: sollte und Präpositionen mit Akkusativ",pages:[184,191],ga:[[6,41],[56,280],[32,165]],topics:["sollten","akkprep"],
 goals:["Give advice with sollte","Praise and criticize politely","Use für, durch, gegen, ohne, um"],
 theory:`
<h3>1 · Advice: sollte</h3>
<p><i>sollte</i> is the Konjunktiv II of <i>sollen</i>. It's softer than <i>müssen</i> and is the standard way to give advice.</p>
<div class="tablewrap"><table><tr><td>ich sollte</td><td>du solltest</td><td>er/sie sollte</td><td>wir sollten</td><td>ihr solltet</td><td>sie/Sie sollten</td></tr></table></div>
<div class="ex"><div class="ex-h">Examples</div><p>Du <b>solltest</b> mehr Wasser <b>trinken</b>.</p><p>Bei Schlafproblemen <b>sollten</b> Sie abends kein Handy <b>benutzen</b>.</p><p>An deiner Stelle <b>würde</b> ich einen Hund <b>adoptieren</b>. (another advice pattern)</p></div>
<h3>2 · Praise and criticism</h3>
<div class="tablewrap"><table><tr><th>Lob</th><th>Kritik (polite → strong)</th></tr>
<tr><td>Das hast du prima gemacht!<br>Das gefällt mir sehr gut.<br>Mach weiter so!<br>Ich bin begeistert!</td>
<td>Vielleicht <b>solltest</b> du nächstes Mal …<br><b>Könntest</b> du bitte nächstes Mal …?<br>Was hast du denn da gemacht?<br>Hör sofort damit auf!</td></tr></table></div>
<p>The polite forms use Konjunktiv II again (<i>solltest, könntest</i>). Softeners like <i>vielleicht, bitte, eigentlich, doch</i> make a huge difference in tone. The book calls these <i>Redepartikeln</i>.</p>
<h3>3 · Prepositions that always take the accusative</h3>
<p><em>durch, für, gegen, ohne, um</em>. Mnemonic: <b>DOGFU</b> (durch, ohne, gegen, für, um). Only the masculine shows a visible change: <i>der → den, ein → einen, er → ihn</i>.</p>
<div class="ex"><div class="ex-h">Examples</div><p>Haustiere sind gut <b>gegen den</b> Stress.</p><p>Ich habe ein Geschenk <b>für meinen</b> Bruder / <b>für dich</b>.</p><p>Wir spazieren <b>durch den</b> Park.</p><p>Er geht nie <b>ohne seinen</b> Hund aus dem Haus.</p><p>Wir sitzen <b>um den</b> Tisch.</p></div>
<div class="trap"><b>Common mistake:</b> "für mir", "ohne ihm". Always accusative: <i>für <b>mich</b>, ohne <b>ihn</b></i>.</div>
<div class="book">In the book: Von Tieren und Menschen p. 167 (PDF 169), Teil C Verben p. 184 and Präpositionen p. 187 (PDF 189).</div>`,

 {q:"Sie ___ mal zum Arzt gehen. (formal)",a:["sollten"]},
 {q:"Das Geschenk ist für ___. (du)",a:["dich"]},

 read:{title:"Frag Dr. Tier",text:`Liebe Frau Dr. Tier,
ich bin 34 und wohne allein in einer kleinen Wohnung in der Stadt. Ich arbeite viel und fühle mich oft einsam. Eine Freundin sagt, ich sollte einen Hund haben. Aber ich bin von 8 bis 18 Uhr im Büro. Was meinen Sie?
Tobias, Basel

Lieber Tobias,
ein Hund ist wirklich gut gegen Einsamkeit, aber er braucht viel Zeit. Ein Hund sollte nicht zehn Stunden allein sein. Vielleicht sollten Sie eine Katze adoptieren. Katzen sind selbstständiger und brauchen nicht so viel Platz. Oder Sie fragen im Tierheim, ob Sie am Wochenende mit einem Hund spazieren gehen können. So haben Sie Kontakt zu Tieren und lernen vielleicht auch neue Leute kennen.
Ihre Dr. Tier`,

{id:"7.1",ch:7,title:"Die Wohnung einrichten: stellen/stehen und Wechselpräpositionen",pages:[192,198],ga:[[33,169],[34,174],[62,306]],topics:["wechselgen","stellen"],
 goals:["Describe where things are in a room","Choose Akkusativ (wohin?) or Dativ (wo?) after the nine two-way prepositions","Use stellen/stehen, legen/liegen, hängen"],
 theory:`
<h3>1 · The nine two-way prepositions</h3>
<p><i>in, an, auf, über, unter, vor, hinter, neben, zwischen</i> can take either case. The question decides:</p>
<div class="tablewrap"><table><tr><th>Wohin? movement to a new place</th><th>Wo? position, no change of place</th></tr>
<tr><td><b>Akkusativ</b>: Ich hänge das Bild an <b>die</b> Wand.</td><td><b>Dativ</b>: Das Bild hängt an <b>der</b> Wand.</td></tr>
<tr><td>Ich lege das Buch auf <b>den</b> Tisch.</td><td>Das Buch liegt auf <b>dem</b> Tisch.</td></tr>
<tr><td>Wir gehen <b>ins</b> Wohnzimmer.</td><td>Wir sitzen <b>im</b> Wohnzimmer.</td></tr></table></div>
<p>Moving around <i>inside</i> one place is still <b>wo</b>: <i>Die Kinder laufen <b>im</b> Garten.</i> (they don't enter it, they're already there)</p>
<h3>2 · The verb pairs</h3>
<div class="tablewrap"><table><tr><th>Action (wohin? + Akk), regular</th><th>Result (wo? + Dat), irregular</th></tr>
<tr><td><b>stellen</b> – stellte – hat gestellt (upright)</td><td><b>stehen</b> – stand – hat gestanden</td></tr>
<tr><td><b>legen</b> – legte – hat gelegt (flat)</td><td><b>liegen</b> – lag – hat gelegen</td></tr>
<tr><td><b>setzen</b> – setzte – hat gesetzt</td><td><b>sitzen</b> – saß – hat gesessen</td></tr>
<tr><td><b>hängen</b> – hängte – hat gehängt</td><td><b>hängen</b> – hing – hat gehangen</td></tr></table></div>
<p>Logic: you <i>stellen</i> a bottle (it then <i>steht</i>), you <i>legen</i> a book flat (it then <i>liegt</i>). Things with a base stand, things without lie: <i>Die Flasche steht, das Handy liegt, der Teller steht (on the table) or liegt (in the sink)</i>.</p>
<h3>3 · Contractions</h3>
<p><i>in dem = <b>im</b>, in das = <b>ins</b>, an dem = <b>am</b>, an das = <b>ans</b></i>. In speech you'll also hear <i>aufs</i> (auf das).</p>
<div class="ex"><div class="ex-h">My room</div><p>Mein Bett <b>steht</b> <b>neben dem</b> Fenster. <b>Über dem</b> Bett <b>hängt</b> ein Poster. Meine Bücher <b>stehen</b> <b>im</b> Regal. Mein Laptop <b>liegt</b> meistens <b>auf dem</b> Schreibtisch, aber gestern habe ich ihn <b>aufs</b> Bett <b>gelegt</b>.</p></div>
<div class="trap"><b>Common mistake:</b> using stellen for position: "Die Vase stellt auf dem Tisch." Position = <i>steht</i>. Also: after these verbs the case follows automatically. stellen/legen/hängen(-te) → Akk, stehen/liegen/hängen(hing) → Dat.</div>
<div class="book">In the book: Wohnen p. 192 (PDF 194), Teil C Verben p. 207 and Präpositionen p. 213 (PDF 215).</div>`,

 read:{title:"Endlich eine eigene Wohnung",text:`Seit einem Monat wohnt Lina in ihrer ersten eigenen Wohnung in Winterthur. Die Wohnung ist klein, aber hell. Im Wohnzimmer steht ein altes Sofa, das sie von ihrer Tante bekommen hat. Neben dem Sofa steht eine große Pflanze. An der Wand über dem Sofa hängt ein Bild von ihrem Lieblingsmaler. Ihren Schreibtisch hat sie direkt ans Fenster gestellt, weil sie beim Lernen gern nach draußen schaut. Nur mit der Küche ist sie nicht zufrieden: Sie ist sehr klein, und der Kühlschrank steht im Flur, weil er nicht in die Küche passt. „Aber die Miete ist günstig“, sagt Lina, „und der Bahnhof ist nur fünf Minuten entfernt.“`,

{id:"7.2",ch:7,title:"Früher: als oder wenn? Infinitiv mit zu",pages:[199,212],ga:[[72,358],[68,340],[69,345]],topics:["alswenn","zu"],
 goals:["Talk about the past with als and wenn","Use zu + infinitive after Lust haben, versuchen, vergessen …"],
 theory:`
<h3>1 · als vs. wenn: the one-time test</h3>
<div class="tablewrap"><table><tr><th></th><th>Past</th><th>Present / future</th></tr>
<tr><td>Once, or one period</td><td><b>als</b>: Als ich ein Kind <b>war</b>, …<br>Als ich gestern nach Hause <b>kam</b>, …</td><td rowspan="2"><b>wenn</b>: Wenn ich Zeit habe, … / Wenn du kommst, …</td></tr>
<tr><td>Repeated</td><td><b>(immer) wenn</b>: Immer wenn ich Oma besuchte, …</td></tr></table></div>
<p>Both are subordinating: verb at the end, and if they come first, the main clause starts with the verb: <i>Als ich zwölf war, <b>sind</b> wir nach Zürich umgezogen.</i></p>
<div class="trap"><b>Common mistake:</b> "Wenn ich ein Kind war …" Childhood is one period in the past → <b>als</b>. Test: can you add "jedes Mal" (every time)? If yes → wenn. If no → als.</div>
<h3>2 · Infinitiv mit zu</h3>
<p>After certain verbs and expressions, a second action comes as <em>zu + infinitive</em> at the end of the clause:</p>
<div class="ex"><div class="ex-h">Triggers</div><p>Ich habe keine <b>Lust</b>, heute <b>zu kochen</b>.</p><p>Ich <b>versuche</b>, gesünder <b>zu essen</b>.</p><p><b>Vergiss nicht</b>, den Müll raus<b>zu</b>bringen.</p><p>Ich habe <b>vor</b>, am Wochenende auf<b>zu</b>räumen.</p><p><b>Es ist schwer</b>, in Zürich eine Wohnung <b>zu finden</b>.</p><p>Common triggers: <i>Lust/Zeit/Angst haben, anfangen, aufhören, versuchen, vergessen, vorhaben, beginnen, es ist wichtig/schön/schwer/verboten</i>.</p></div>
<p>Separable verbs put zu in the middle: <i>auf<b>zu</b>stehen, ein<b>zu</b>kaufen, an<b>zu</b>rufen</i>.</p>
<p><b>No zu</b> after modal verbs, <i>werden</i>, <i>lassen</i>, and verbs of movement like <i>gehen</i>: <i>Ich <b>muss</b> arbeiten. Ich <b>gehe</b> einkaufen.</i></p>
<div class="book">In the book: Ein Garten in der Stadt p. 199 (PDF 201), Teil C Sätze p. 210 (PDF 212).</div>`,
 extra:[
 {q:"___ ich 18 war, habe ich meinen Führerschein gemacht.",a:["Als"]},
 {q:"Jedes Mal, ___ ich nach Bern fahre, regnet es.",a:["wenn"]},

 read:{title:"Omas Garten",text:`Als ich ein Kind war, habe ich jeden Sommer zwei Wochen bei meiner Oma auf dem Land verbracht. Sie hatte einen riesigen Garten mit Gemüse, Kräutern und Obstbäumen. Immer wenn ich ankam, wartete sie schon mit einem Apfelkuchen auf mich. Morgens hatte ich keine Lust aufzustehen, aber Oma sagte: „Der Garten wartet nicht!“ Also haben wir Tomaten und Bohnen geerntet und Unkraut gezogen. Als ich 14 war, hat Oma mir gezeigt, wie man Konfitüre macht. Heute wohne ich in der Stadt und habe nur einen kleinen Balkon. Trotzdem versuche ich jedes Jahr, ein paar Tomaten und Kräuter anzupflanzen. Jedes Mal, wenn ich sie gieße, denke ich an Oma.`,

{id:"7.3",ch:7,title:"Essen und Restaurant: deshalb und trotzdem",pages:[200,206],ga:[[41,214]],topics:["deshalb"],
 goals:["Talk about eating habits and recipes","Connect ideas with deshalb (so) and trotzdem (anyway)","Order and complain in a restaurant"],
 theory:`
<h3>1 · Connectors in position 1</h3>
<p><i>deshalb</i> and <i>trotzdem</i> are adverbs, not subordinating words. They take position 1 in their clause, so the <b>verb comes immediately after</b>:</p>
<div class="formula">Ich esse gern Gemüse<span>,</span> <span>deshalb</span> <b>kaufe</b> ich jede Woche auf dem Markt ein.</div>
<div class="tablewrap"><table><tr><th>Meaning</th><th>Main clause (verb 2nd)</th><th>Subordinate clause (verb last)</th></tr>
<tr><td>reason → consequence</td><td>…, <b>deshalb</b> / <b>deswegen</b> / <b>darum</b> + verb</td><td>…, <b>weil</b> … verb</td></tr>
<tr><td>contrast</td><td>…, <b>trotzdem</b> + verb</td><td>…, <b>obwohl</b> … verb</td></tr></table></div>
<div class="ex"><div class="ex-h">Same meaning, two structures</div><p>Ich habe keine Zeit, <b>deshalb esse</b> ich in der Kantine.</p><p>Ich esse in der Kantine, <b>weil</b> ich keine Zeit <b>habe</b>.</p><p>Das Restaurant ist teuer, <b>trotzdem gehen</b> wir oft hin.</p><p>Wir gehen oft hin, <b>obwohl</b> das Restaurant teuer <b>ist</b>.</p></div>
<p>Compare: <i>und, aber, oder, denn, sondern</i> are "position 0" connectors: they don't count, so the order stays normal: <i>…, <b>aber</b> ich <b>habe</b> keine Zeit.</i></p>
<div class="trap"><b>Common mistake:</b> "…, deshalb ich kaufe …" After deshalb/trotzdem the verb comes first, then the subject.</div>
<h3>2 · In the restaurant</h3>
<div class="ex"><div class="ex-h">Redemittel</div><p>Ich hätte gern die Kürbissuppe. / Ich nehme das Tagesmenü.</p><p>Könnte ich bitte noch ein Glas Wasser haben?</p><p>Entschuldigung, das Essen ist kalt. / Ich glaube, Sie haben meine Bestellung vergessen.</p><p>Die Rechnung, bitte. / Zusammen oder getrennt? – Getrennt, bitte.</p><p>Guten Appetit! – Danke, gleichfalls. / Prost! / Zum Wohl!</p></div>
<p>Switzerland: service is included, but people round up (<i>Das stimmt so.</i> = keep the change). Some Swiss words: <i>das Znüni</i> (morning snack), <i>der Zmittag</i>, <i>das Poulet</i> (chicken), <i>die Rüebli</i> (carrots).</p>
<div class="book">In the book: Gesunde Ernährung p. 200 (PDF 202). Teil B is about the effect of colors, including on appetite.</div>`,

 read:{title:"Gesund essen im Alltag?",text:`Viele Menschen wissen, dass Gemüse gesund ist. Trotzdem essen die meisten Schweizerinnen und Schweizer zu wenig davon. Experten empfehlen fünf Portionen Obst und Gemüse pro Tag. Das klingt viel, ist aber nicht so schwer: Ein Apfel am Morgen, ein Salat zum Mittagessen und etwas Gemüse am Abend – und schon hat man drei Portionen. Das Problem ist oft die Zeit. Viele arbeiten lange, deshalb kaufen sie Fertigprodukte. Diese enthalten aber oft viel Salz, Zucker und Fett. Ein Tipp: Am Sonntag eine große Portion Gemüsesuppe kochen und sie für die Woche einfrieren. So hat man immer etwas Gesundes zu Hause.`,

{id:"8.1",ch:8,title:"Nachrichten: das Passiv",pages:[218,223],ga:[[57,284],[58,288]],topics:["passiv"],
 goals:["Understand short news items","Form the passive in present and past"],
 theory:`
<h3>1 · Why the passive exists</h3>
<p>News, instructions and official texts care about <b>what happens</b>, not who does it. That's the passive: <i>Die Brücke <b>wird</b> renoviert.</i> (Who renovates it? Doesn't matter.)</p>
<div class="formula"><span>werden</span> in position 2 &nbsp;+&nbsp; … &nbsp;+&nbsp; <span>Partizip II</span> at the end</div>
<div class="tablewrap"><table><tr><th></th><th>Active</th><th>Passive</th></tr>
<tr><td>Präsens</td><td>Die Stadt baut ein Stadion.</td><td>Ein Stadion <b>wird</b> gebaut.</td></tr>
<tr><td>Präteritum</td><td>Die Stadt baute ein Stadion.</td><td>Ein Stadion <b>wurde</b> gebaut.</td></tr>
<tr><td>Perfekt (B1 preview)</td><td>Die Stadt hat ein Stadion gebaut.</td><td>Ein Stadion <b>ist</b> gebaut <b>worden</b>.</td></tr></table></div>
<p>The accusative object of the active sentence becomes the <b>subject</b> (Nominativ) of the passive: <i>Man baut <b>den</b> Turm → <b>Der</b> Turm wird gebaut.</i> If you want to name the doer: <i>von + Dativ</i>: <i>Das Telefon wurde <b>von</b> Bell erfunden.</i></p>
<h3>2 · werden forms</h3>
<div class="tablewrap"><table><tr><th></th><th>ich</th><th>du</th><th>er/sie/es</th><th>wir</th><th>ihr</th><th>sie/Sie</th></tr>
<tr><td>Präsens</td><td>werde</td><td>wirst</td><td>wird</td><td>werden</td><td>werdet</td><td>werden</td></tr>
<tr><td>Präteritum</td><td>wurde</td><td>wurdest</td><td>wurde</td><td>wurden</td><td>wurdet</td><td>wurden</td></tr></table></div>
<div class="trap"><b>Watch out:</b> <i>werden</i> has three jobs. Future: <i>Ich <b>werde</b> kommen.</i> Becoming: <i>Sie <b>wird</b> Ärztin.</i> Passive: <i>Das Haus <b>wird</b> gebaut.</i> Look at the end of the clause: an infinitive means future, a participle means passive, a noun or adjective means "become".</div>
<h3>3 · News vocabulary</h3>
<div class="ex"><div class="ex-h">Typical headlines</div><p>Neue Brücke <b>wird</b> eröffnet. · Zwei Personen <b>wurden</b> verletzt. · Der Streik <b>wurde</b> beendet. · In Bern <b>wird</b> gewählt. · Hier <b>wird</b> nicht geraucht.</p></div>
<div class="book">In the book: Neues aus dem In- und Ausland p. 218 (PDF 220), Teil C Verben p. 234 (PDF 236).</div>`,

{id:"8.2",ch:8,title:"Umwelt und Meinung: um … zu, damit",pages:[224,226],ga:[[74,366]],topics:["umzu"],
 goals:["Give your opinion, agree and disagree","Express purpose with um … zu and damit"],
 theory:`
<h3>1 · Purpose: um … zu vs. damit</h3>
<div class="tablewrap"><table><tr><th></th><th>When</th><th>Example</th></tr>
<tr><td><b>um … zu</b> + infinitive</td><td>same subject in both parts</td><td>Ich fahre Velo, <b>um</b> Energie <b>zu sparen</b>. (I ride, I save)</td></tr>
<tr><td><b>damit</b> + verb last</td><td>different subjects (and always possible)</td><td>Ich spreche langsam, <b>damit</b> du mich <b>verstehst</b>. (I speak, you understand)</td></tr></table></div>
<p>Separable verbs: <i>um früh auf<b>zu</b>stehen</i>. Don't put a modal verb into an um-zu clause: <i>um zu können</i> is almost never needed.</p>
<div class="trap"><b>Common mistake:</b> "für zu sparen" (from English "for to"). German purpose = <i>um … zu</i>. Also: <i>damit</i> here means "so that", not "with it".</div>
<h3>2 · Opinions</h3>
<div class="ex"><div class="ex-h">Giving your opinion</div><p><b>Meiner Meinung nach</b> sollte man mehr Zug fahren. (note: verb comes next)</p><p><b>Ich bin der Meinung</b>, dass … / <b>Ich finde</b>, dass … / <b>Ich glaube</b>, dass …</p></div>
<div class="ex"><div class="ex-h">Agreeing / disagreeing</div><p>Das finde ich auch. / Da hast du recht. / Ich bin ganz deiner Meinung. / Ich bin dafür.</p><p>Das sehe ich anders. / Ich bin ganz anderer Meinung. / Ich bin dagegen. / Da muss ich widersprechen.</p><p>Softer: Einerseits …, andererseits … / Das stimmt, aber …</p></div>
<h3>3 · Environment vocabulary</h3>
<p><i>die Umwelt schützen, Energie sparen, den Müll trennen, recyceln, die Luftverschmutzung, der Klimawandel, erneuerbare Energien, öffentliche Verkehrsmittel benutzen, weniger fliegen, Plastik vermeiden</i>.</p>
<p>Switzerland detail: you pay per garbage bag (<i>Gebührensack</i>), which is a big reason people sort their trash (<i>Müll trennen</i>) so carefully.</p>
<div class="book">In the book: Neues zum Thema Umwelt p. 224 (PDF 226), Teil C Sätze p. 237 (PDF 239).</div>`,
 extra:[
 {q:"Ich lerne Deutsch, ___ in der Schweiz zu studieren.",a:["um"]},
 {q:"Er erklärt es noch einmal, ___ alle es verstehen.",a:["damit"]},
 {q:"Wir trennen den Müll, um die Umwelt ___ schützen.",a:["zu"]},
 {q:"Meiner Meinung nach ___ man weniger fliegen. (sollen, K II)",a:["sollte"]},
 {t:"o",w:["Ich","fahre","mit dem Zug",",","um","Geld","zu","sparen"],en:"I take the train to save money."}
 ],

{id:"8.3",ch:8,title:"Technik: Präpositionen mit Dativ und Gebrauchsanweisungen",pages:[227,239],ga:[[31,161]],topics:["datprep"],
 goals:["Understand simple instructions for devices","Describe a tech problem","Use aus, bei, mit, nach, seit, von, zu"],
 theory:`
<h3>1 · The seven dative prepositions</h3>
<p><em>aus, bei, mit, nach, seit, von, zu</em> (plus <i>gegenüber</i>) always take the dative. Chant it to the tune of the Blue Danube waltz ("aus-bei-mit, nach-seit-von-zu") if that helps.</p>
<div class="tablewrap"><table><tr><th>aus</th><td>from (inside), made of</td><td>aus der Schweiz, aus Plastik</td></tr>
<tr><th>bei</th><td>at someone's place / company, during</td><td>bei meinen Eltern, bei Google, beim Kochen</td></tr>
<tr><th>mit</th><td>with, by (transport)</td><td>mit dem Zug, mit einem Kabel</td></tr>
<tr><th>nach</th><td>after, to (cities/countries)</td><td>nach der Arbeit, nach Wien</td></tr>
<tr><th>seit</th><td>since, for (still going)</td><td>seit einem Jahr</td></tr>
<tr><th>von</th><td>from, of, by</td><td>von meiner Oma, von 9 bis 5</td></tr>
<tr><th>zu</th><td>to (people, institutions)</td><td>zum Arzt, zur Arbeit</td></tr></table></div>
<p>Contractions: <i>zu dem = zum, zu der = zur, von dem = vom, bei dem = beim</i>. Dative plural nouns add <b>-n</b>: <i>mit den Kinder<b>n</b>, mit meinen Freunde<b>n</b></i>.</p>
<h3>2 · Instructions</h3>
<p>Manuals use the infinitive or the <i>Sie</i>-imperative:</p>
<div class="ex"><div class="ex-h">Gebrauchsanweisung</div><p>Gerät <b>einschalten</b>: Taste A drücken. / <b>Drücken Sie</b> die Taste A.</p><p>Akku vor dem ersten Gebrauch vollständig <b>aufladen</b>.</p><p>Das Kabel <b>mit dem</b> Computer <b>verbinden</b>.</p><p>Nicht <b>mit</b> Wasser reinigen!</p></div>
<h3>3 · Describing a problem</h3>
<div class="ex"><div class="ex-h">Redemittel</div><p>Mein Laptop funktioniert nicht mehr. / Der Bildschirm bleibt schwarz.</p><p>Seit gestern lässt sich das Handy nicht mehr aufladen.</p><p>Ich habe ihn schon aus- und wieder eingeschaltet.</p><p>Das Gerät ist erst drei Monate alt. Ist das noch Garantie?</p><p>Können Sie ihn reparieren, oder bekomme ich ein neues Gerät?</p></div>
<div class="trap"><b>Common mistake:</b> "mit der Zug", "nach die Arbeit". These prepositions never take accusative: <i>mit <b>dem</b> Zug, nach <b>der</b> Arbeit</i>.</div>
<div class="book">In the book: Altes und Neues zum Thema Technik p. 227 (PDF 229), Teil C Präpositionen p. 238 (PDF 240), and the full review (Gesamtwiederholung) from p. 240.</div>`,
 extra:[
 {q:"Ich fahre jeden Tag ___ dem Velo zur Uni.",a:["mit"]},
 {q:"Das Handy ist ___ meinem Bruder.",a:["von"]},
 {q:"Nach ___ Kurs gehen wir essen. (der Kurs)",a:["dem"]},

{id:"9.1",ch:9,title:"Prüfungstraining: Start Deutsch 2 / A2",pages:[250,256],ga:[],topics:["perfekt","datakk","weilwenn","adjgen","wechselgen","relativ","k2polite","passiv"],
 goals:["Know the structure of an A2 exam","Practice the writing tasks under time pressure","Test yourself across all eight chapters"],
 theory:`
<h3>1 · The exam at a glance</h3>
<p>The Begegnungen appendix contains a practice test for <i>Start Deutsch 2</i>, the A2 exam that is now called the <b>Goethe-Zertifikat A2</b>. The format is roughly this (check your own exam's official page, since formats change):</p>
<div class="tablewrap"><table><tr><th>Part</th><th>Time</th><th>What you do</th></tr>
<tr><td>Hören (listening)</td><td>~30 min</td><td>Announcements, phone messages, short conversations, radio. Multiple choice and matching.</td></tr>
<tr><td>Lesen (reading)</td><td>~30 min</td><td>Newspaper notes, signs, ads, emails. You find specific information.</td></tr>
<tr><td>Schreiben (writing)</td><td>~30 min</td><td>Two short texts: an informal message (SMS, ~20–30 words) and a short formal or semi-formal email (~30–40 words). Cover every point listed.</td></tr>
<tr><td>Sprechen (speaking)</td><td>~15 min, in pairs</td><td>(1) Ask and answer questions with word cards. (2) Talk about your life on a topic. (3) Plan something together with your partner.</td></tr></table></div>
<p>You usually need about 60% to pass.</p>
<h3>2 · Writing: how points are lost</h3>
<p>Most lost points come from <b>missing one of the three task points</b>, not from grammar. Strategy: underline the three points, write one or two sentences per point, and check them off. Use a greeting and a closing that fit the register (<i>Lieber Marco / Liebe Grüße</i> vs. <i>Sehr geehrte Damen und Herren / Mit freundlichen Grüßen</i>).</p>
<div class="ex"><div class="ex-h">Model answer (SMS, 3 points)</div><p>Hallo Marco, es tut mir leid, aber ich kann am Samstag nicht zu deinem Geburtstag kommen. Meine Schwester heiratet an diesem Tag. Hast du nächste Woche Zeit? Wir könnten zusammen essen gehen. Liebe Grüße, Anna</p></div>
<h3>3 · Speaking: survival phrases</h3>
<div class="ex"><div class="ex-h">Redemittel</div><p>Wie bitte? Können Sie das bitte wiederholen?</p><p>Was bedeutet das Wort …?</p><p>Ich weiß nicht genau, wie man das sagt, aber …</p><p>Planning: Wann hast du Zeit? – Am Montag kann ich nicht, aber wie wäre es mit Dienstag? – Gute Idee, dann treffen wir uns um drei.</p></div>
<h3>4 · Your last two weeks</h3>
<p>(1) Do the practice test in the book (p. 250, PDF 252) with a timer. (2) Write both exam-format tasks in Schreiben and let Claude grade them. (3) Run the Mistakes tab until it's empty. (4) Do each role-play once more, this time without looking anything up.</p>
<div class="book">In the book: Übungstest p. 250 (PDF 252) and Grammatik in Übersichten from p. 257 (PDF 259), the best one-stop grammar review in the book.</div>`,
 extra:[],
 read:{title:"Aushang im Treppenhaus",text:`Liebe Nachbarinnen und Nachbarn,
am Samstag, 14. Dezember, feiern wir ab 16 Uhr im Hof ein kleines Winterfest. Es gibt Glühwein, Punsch für die Kinder und Kuchen. Wer möchte, kann gern etwas zu essen mitbringen. Bitte sagt mir bis Mittwoch Bescheid, wenn ihr kommt, damit ich genug Becher kaufen kann. Wenn es regnet, feiern wir im Keller.
Wichtig: Wegen Bauarbeiten ist der Lift vom 9. bis 13. Dezember außer Betrieb. Bitte benutzt die Treppe.
Herzliche Grüße
Carla Rossi, 3. Stock`,

{title:"Forum: Wie lernt ihr Vokabeln?",text:`Nina_92: Ich lerne seit einem Jahr Deutsch. Am Anfang habe ich die Wörter nur gelesen, aber ich habe sie schnell vergessen. Jetzt schreibe ich jeden Tag zehn neue Wörter auf Karten.
Tomasz: Ich habe viele Apps ausprobiert. Am besten hat mir eine App mit Wiederholungen gefallen. Sie zeigt die schwierigen Wörter öfter.
Ayla: Ich höre jeden Morgen im Zug einen deutschen Podcast. Neue Wörter schreibe ich auf und übe sie am Abend. So habe ich in drei Monaten viel gelernt.`,
qs:[RF("Nina hat am Anfang die Wörter schnell vergessen.",true),{t:"c",q:"Was gefällt Tomasz an seiner App?",o:["Sie ist gratis.","Sie zeigt schwierige Wörter öfter.","Sie hat viele Spiele."],a:1},{t:"c",q:"Wann hört Ayla den Podcast?",o:["am Abend","im Zug am Morgen","in der Mittagspause"],a:1}]}],
"1.3":[
{title:"Mein Wochenende",text:`Am Samstag schlafe ich lange, meistens bis neun Uhr. Dann dusche ich mich und frühstücke in Ruhe. Am Vormittag treffe ich mich oft mit meiner Freundin Julia. Wir gehen auf den Markt oder trinken einen Kaffee in der Altstadt. Am Nachmittag erhole ich mich und lese ein Buch. Am Abend ziehe ich mich schön an, denn wir gehen oft tanzen. Am Sonntag ist es ruhiger: Ich besuche meine Eltern und wir essen zusammen. Danach bereite ich mich auf die neue Woche vor.`,
qs:[RF("Am Samstag steht die Person früh auf.",false,"bis neun Uhr"),{t:"c",q:"Mit wem trifft sie sich am Samstag?",o:["mit ihren Eltern","mit ihrer Freundin Julia","mit Kollegen"],a:1},{t:"c",q:"Was macht sie am Sonntag?",o:["Sie geht tanzen.","Sie besucht ihre Eltern.","Sie geht auf den Markt."],a:1}]},
{title:"Hausordnung im Studentenwohnheim",text:`Liebe Bewohnerinnen und Bewohner,
bitte beachtet die folgenden Regeln:
Die Küche ist für alle da. Bitte räumt nach dem Kochen auf und wascht euer Geschirr sofort ab.
Von 22 bis 7 Uhr ist Nachtruhe. Bitte seid in dieser Zeit leise.
Der Müll wird am Dienstag und am Freitag abgeholt. Bringt ihn bitte am Abend vorher nach unten.
Besuch ist willkommen, aber Gäste dürfen höchstens drei Nächte bleiben.
Bei Problemen meldet euch beim Hausmeister, Herrn Brändli, Zimmer 001.`,
qs:[RF("Nach 22 Uhr soll man leise sein.",true),{t:"c",q:"Wann wird der Müll abgeholt?",o:["am Montag","am Dienstag und Freitag","jeden Tag"],a:1},{t:"c",q:"Wie lange dürfen Gäste bleiben?",o:["eine Nacht","höchstens drei Nächte","eine Woche"],a:1}]}],
"2.1":[
{title:"Kursangebot der Volkshochschule",text:`Fotografie für Anfänger: Sie lernen, wie Sie mit Ihrem Handy oder Fotoapparat schöne Bilder machen. Dienstag, 18–20 Uhr, 6 Abende, 180 Franken.
Malen und Zeichnen: Für alle, die kreativ sein möchten. Material bitte selbst mitbringen. Donnerstag, 9–11 Uhr, 8 Vormittage, 220 Franken.
Gitarre für Erwachsene: Sie haben noch nie ein Instrument gespielt? Kein Problem! Eine Gitarre können Sie bei uns leihen. Montag, 19–20.30 Uhr, 10 Abende, 260 Franken.
Anmeldung online oder am Schalter, Montag bis Freitag 8–12 Uhr.`,
qs:[{t:"c",q:"Welcher Kurs findet am Vormittag statt?",o:["Fotografie","Malen und Zeichnen","Gitarre"],a:1},RF("Für den Gitarrenkurs braucht man eine eigene Gitarre.",false,"Man kann eine leihen."),{t:"c",q:"Wie kann man sich anmelden?",o:["nur online","online oder am Schalter","nur am Telefon"],a:1}]},
{title:"Kein Fernseher, kein Problem?",text:`Familie Huber hat seit zwei Jahren keinen Fernseher mehr. „Am Anfang waren die Kinder nicht glücklich“, erzählt die Mutter. „Aber jetzt spielen wir am Abend zusammen Karten oder lesen.“ Der Vater ist nicht so begeistert: „Ich vermisse die Fußballspiele. Die schaue ich jetzt bei meinem Bruder.“ Die Tochter Mia (12) findet es gut: „Ich habe mehr Zeit für meine Hobbys. Ich spiele Klavier und bin in einem Theaterverein.“ Nur Handys gibt es noch – aber nicht beim Essen.`,
qs:[RF("Die Familie hat seit zwei Jahren keinen Fernseher.",true),{t:"c",q:"Wo schaut der Vater Fußball?",o:["im Stadion","bei seinem Bruder","auf dem Handy"],a:1},RF("Beim Essen benutzt die Familie Handys.",false)]}],
"2.2":[
{title:"Regeln im Schwimmbad",text:`Willkommen im Hallenbad Geiselweid!
Kinder unter 8 Jahren dürfen nur mit einer erwachsenen Person ins Bad.
Vor dem Schwimmen muss man duschen.
Im Bad darf man nicht essen. Für Essen und Getränke gibt es unser Café im Eingangsbereich.
Fotografieren und Filmen ist nicht erlaubt.
Ins Sportbecken darf man nur, wenn man gut schwimmen kann.
Öffnungszeiten: Montag bis Freitag 6–21 Uhr, Samstag und Sonntag 8–18 Uhr.`,
qs:[RF("Ein siebenjähriges Kind darf allein ins Bad.",false),{t:"c",q:"Was muss man vor dem Schwimmen machen?",o:["essen","duschen","fotografieren"],a:1},{t:"c",q:"Wann schließt das Bad am Sonntag?",o:["um 18 Uhr","um 21 Uhr","um 8 Uhr"],a:0}]},
{title:"Absage",text:`Liebe Sara,
leider kann ich am Samstag nicht mit dir ins Konzert gehen. Ich muss am Wochenende arbeiten, weil eine Kollegin krank ist. Ich wollte so gern mitkommen! Kannst du meine Karte vielleicht verkaufen oder einer Freundin geben? Letztes Mal konnte ich auch nicht kommen, das tut mir wirklich leid. Darf ich dich nächste Woche zum Essen einladen? Am Mittwoch oder Donnerstag habe ich Zeit.
Liebe Grüße
Katja`,
qs:[RF("Katja muss am Samstag arbeiten.",true),{t:"c",q:"Was soll Sara mit der Karte machen?",o:["sie wegwerfen","sie verkaufen oder verschenken","sie Katja zurückgeben"],a:1},{t:"c",q:"Wann möchte Katja Sara zum Essen einladen?",o:["am Samstag","am Mittwoch oder Donnerstag","am Sonntag"],a:1}]}],
"2.3":[
{title:"Albert Einstein in der Schweiz",text:`Albert Einstein wurde 1879 in Ulm geboren. Mit 16 Jahren kam er in die Schweiz und besuchte die Kantonsschule in Aarau. Danach studierte er in Zürich. Er fand zuerst keine Stelle an einer Universität und arbeitete deshalb ab 1902 im Patentamt in Bern. Dort hatte er neben der Arbeit Zeit für seine Ideen. 1905 schrieb er mehrere berühmte Artikel, auch über die Relativitätstheorie. Später lebte er in Berlin und ab 1933 in den USA. 1921 bekam er den Nobelpreis für Physik. Er starb 1955 in Princeton.`,
qs:[RF("Einstein wurde in der Schweiz geboren.",false,"in Ulm"),{t:"c",q:"Wo arbeitete er ab 1902?",o:["an der Universität Zürich","im Patentamt in Bern","in einer Schule in Aarau"],a:1},{t:"c",q:"Wann bekam er den Nobelpreis?",o:["1905","1921","1955"],a:1}]},
{title:"Filmkritik: Der letzte Zug",text:`Der neue Krimi von Regisseurin Anna Keller spielt in einem Nachtzug von Zürich nach Wien. Ein reicher Mann verschwindet in der Nacht, und eine junge Polizistin muss den Fall lösen. Die Schauspieler sind sehr gut, besonders Lena Graf als Polizistin. Die Landschaft ist wunderschön fotografiert. Leider ist der Film mit 2 Stunden und 40 Minuten zu lang. In der Mitte wird es ein bisschen langweilig. Aber das Ende ist spannend und überraschend. Unser Urteil: Vier von fünf Sternen.`,
qs:[RF("Der Film spielt in einem Zug.",true),{t:"c",q:"Was findet die Kritik nicht gut?",o:["die Schauspieler","die Länge des Films","das Ende"],a:1},{t:"c",q:"Wie viele Sterne bekommt der Film?",o:["drei","vier","fünf"],a:1}]}],
"3.1":[
{title:"Werbung: Großer Ausverkauf",text:`Nur diese Woche: Alles muss raus! Weil wir umbauen, gibt es bei Möbel Hofer bis zu 50 % Rabatt auf Sofas, Tische und Betten. Wenn Sie mehr als 1000 Franken ausgeben, liefern wir gratis. Wenn Sie mit Karte bezahlen, bekommen Sie zusätzlich 5 % Rabatt. Achtung: Reduzierte Ware kann man nicht umtauschen. Geöffnet Montag bis Samstag 9–19 Uhr, Donnerstag bis 21 Uhr.`,
qs:[RF("Es gibt Rabatt, weil das Geschäft umbaut.",true),{t:"c",q:"Wann ist die Lieferung gratis?",o:["immer","wenn man mehr als 1000 Franken ausgibt","wenn man mit Karte bezahlt"],a:1},RF("Reduzierte Ware kann man umtauschen.",false)]},
{title:"Wo bleibt das Geld?",text:`Studentin Elif (22) hat jeden Monat etwa 1800 Franken. Davon bezahlt sie 750 Franken für ihr Zimmer in einer WG. Für Essen gibt sie ungefähr 350 Franken aus. Krankenkasse und Handy kosten zusammen 300 Franken. „Wenn dann noch etwas übrig ist, gehe ich mit Freunden aus“, sagt sie. Kleidung kauft sie meistens im Secondhand-Laden, weil sie dort günstiger ist. „Ich spare jeden Monat 100 Franken, weil ich im Sommer nach Mexiko reisen will.“`,
qs:[{t:"c",q:"Wie viel kostet Elifs Zimmer?",o:["350 Franken","750 Franken","1800 Franken"],a:1},RF("Elif kauft Kleidung oft im Secondhand-Laden.",true),{t:"c",q:"Warum spart Elif?",o:["für ein neues Handy","für eine Reise nach Mexiko","für die Krankenkasse"],a:1}]}],
"3.2":[
{title:"Im Kleidergeschäft",text:`– Guten Tag. Kann ich Ihnen helfen?
– Ja, ich suche eine Jacke für meinen Mann. Er hat Größe L.
– Gefällt Ihnen diese hier? Sie ist warm und wasserdicht.
– Die Farbe gefällt mir nicht so. Haben Sie die auch in Blau?
– Ja, einen Moment … Hier, bitte.
– Schön. Und wenn sie ihm nicht passt, kann ich sie umtauschen?
– Natürlich, innerhalb von 30 Tagen mit dem Kassenzettel.
– Gut, dann nehme ich sie. Kann ich mit Karte bezahlen?
– Ja, gern.`,
qs:[RF("Die Kundin sucht eine Jacke für sich selbst.",false,"für ihren Mann"),{t:"c",q:"Welche Farbe möchte sie?",o:["Schwarz","Blau","Rot"],a:1},{t:"c",q:"Was braucht man zum Umtauschen?",o:["den Kassenzettel","die Kreditkarte","den Ausweis"],a:0}]},
{title:"Geschenkideen",text:`Sie wissen nicht, was Sie Ihren Liebsten schenken sollen? Hier ein paar Tipps:
Ihrer Mutter schenken Sie vielleicht einen Gutschein für ein Wellness-Hotel. Dann kann sie sich einen Tag lang erholen.
Ihrem Vater können Sie ein Kochbuch kaufen und ihm dann beim Kochen helfen.
Kindern gefallen Spiele besser als Kleidung. Wenn Sie ihnen ein Buch geben, lesen Sie es zusammen.
Und Ihren Freunden? Schenken Sie ihnen Zeit: ein gemeinsames Abendessen oder einen Ausflug.`,
qs:[{t:"c",q:"Was empfiehlt der Text für die Mutter?",o:["ein Kochbuch","einen Wellness-Gutschein","Kleidung"],a:1},RF("Kinder mögen Kleidung lieber als Spiele.",false),{t:"c",q:"Was soll man Freunden schenken?",o:["Zeit","Geld","Bücher"],a:0}]}],
"3.3":[
{title:"Umfrage: Ihr Traum",text:`Wir haben gefragt: Was würden Sie machen, wenn Sie nicht mehr arbeiten müssten?
Ruth (64): „Ich würde mit meinem Mann ein Jahr lang mit dem Wohnmobil durch Europa fahren.“
Samuel (29): „Ich würde ein kleines Café eröffnen. Dann wäre ich mein eigener Chef.“
Nadia (35): „Ich hätte endlich Zeit für meine Kinder. Wir würden jeden Tag zusammen kochen und spielen.“
Jan (41): „Ehrlich gesagt? Ich würde wahrscheinlich trotzdem arbeiten. Ohne Arbeit wäre mir langweilig.“`,
qs:[{t:"c",q:"Wer würde ein Café eröffnen?",o:["Ruth","Samuel","Jan"],a:1},RF("Nadia hätte gern mehr Zeit für ihre Kinder.",true),{t:"c",q:"Was sagt Jan?",o:["Er würde reisen.","Er würde weiter arbeiten.","Er würde ein Haus kaufen."],a:1}]},
{title:"Leserbrief: Lotto ist Geldverschwendung",text:`Ich verstehe nicht, warum so viele Leute jede Woche Lotto spielen. Mein Nachbar gibt jeden Monat 80 Franken für Lottoscheine aus. Das sind fast 1000 Franken im Jahr! Gewonnen hat er in zehn Jahren nur zweimal kleine Beträge. Wenn er das Geld gespart hätte, könnte er jetzt eine schöne Reise machen. Natürlich ist es schön zu träumen. Aber man sollte nicht mehr Geld ausgeben, als man verlieren kann.
Beat S., Schaffhausen`,
qs:[RF("Beat findet Lotto eine gute Idee.",false),{t:"c",q:"Wie viel gibt der Nachbar pro Monat aus?",o:["8 Franken","80 Franken","1000 Franken"],a:1},{t:"c",q:"Wie oft hat der Nachbar gewonnen?",o:["nie","zweimal kleine Beträge","einmal viel Geld"],a:1}]}],
"4.1":[
{title:"Öffnungszeiten über die Feiertage",text:`Liebe Kundinnen und Kunden,
über die Feiertage gelten bei uns besondere Öffnungszeiten:
24. Dezember: von 8 bis 12 Uhr
25. und 26. Dezember: geschlossen
27. bis 30. Dezember: normale Öffnungszeiten, 8 bis 18 Uhr
31. Dezember: von 8 bis 14 Uhr
1. und 2. Januar: geschlossen
Ab dem 3. Januar sind wir wieder wie gewohnt für Sie da. Bestellungen, die nach dem 20. Dezember bei uns ankommen, liefern wir erst im neuen Jahr.
Wir wünschen Ihnen schöne Feiertage!`,
qs:[{t:"c",q:"Wann ist das Geschäft am 31. Dezember geöffnet?",o:["8 bis 12 Uhr","8 bis 14 Uhr","8 bis 18 Uhr"],a:1},RF("Am 2. Januar ist das Geschäft geschlossen.",true),{t:"c",q:"Was passiert mit Bestellungen nach dem 20. Dezember?",o:["Sie kommen sofort.","Sie kommen im neuen Jahr.","Man kann sie nicht bestellen."],a:1}]},
{title:"Mein Arbeitstag als Pflegefachfrau",text:`Ich arbeite seit vier Jahren als Pflegefachfrau im Spital. Meine Arbeitszeiten sind jede Woche anders. Diese Woche habe ich Frühdienst: Ich beginne um 6.30 Uhr und arbeite bis 15 Uhr. Nächste Woche habe ich Nachtdienst, von 22 bis 7 Uhr. Am Wochenende arbeite ich jeden zweiten Samstag und Sonntag. Das ist manchmal anstrengend, vor allem für meine Familie. Aber ich liebe meinen Beruf. Im Februar habe ich drei Wochen Ferien. Dann fliegen wir nach Portugal.`,
qs:[RF("Sie arbeitet seit vier Jahren im Spital.",true),{t:"c",q:"Wann beginnt der Frühdienst?",o:["um 6.30 Uhr","um 15 Uhr","um 22 Uhr"],a:0},{t:"c",q:"Wann hat sie Ferien?",o:["im Januar","im Februar","im Sommer"],a:1}]}],
"4.2":[
{title:"Nachricht auf dem Anrufbeantworter",text:`Guten Tag, hier spricht Laura Schmid von der Praxis Dr. Huber. Sie haben für morgen, Mittwoch, um 10 Uhr einen Termin bei uns. Leider ist Dr. Huber krank. Könnten Sie vielleicht am Freitag um 14 Uhr kommen? Wenn das nicht geht, rufen Sie uns bitte zurück, damit wir einen anderen Termin finden. Unsere Nummer ist 052 213 45 67. Wir sind von 8 bis 12 und von 14 bis 17 Uhr erreichbar. Vielen Dank und auf Wiederhören.`,
qs:[RF("Der Termin am Mittwoch findet statt.",false),{t:"c",q:"Welchen neuen Termin schlägt die Praxis vor?",o:["Mittwoch, 10 Uhr","Freitag, 14 Uhr","Freitag, 10 Uhr"],a:1},{t:"c",q:"Wann ist die Praxis telefonisch erreichbar?",o:["den ganzen Tag","8–12 und 14–17 Uhr","nur am Nachmittag"],a:1}]},
{title:"Höflich fragen im Büro",text:`Neue Kollegen fragen oft: Wie sage ich das höflich? Hier ein paar Tipps. Sagen Sie nicht: „Drucken Sie das!“, sondern: „Könnten Sie das bitte für mich drucken?“ Wenn Sie etwas nicht wissen, fragen Sie: „Wissen Sie vielleicht, wo die Kopien sind?“ oder „Können Sie mir sagen, wann die Sitzung beginnt?“ Und wenn Sie Hilfe brauchen: „Hätten Sie kurz Zeit? Ich hätte eine Frage.“ Mit „bitte“ und „danke“ machen Sie nie etwas falsch.`,
qs:[{t:"c",q:"Welcher Satz ist höflich?",o:["Drucken Sie das!","Könnten Sie das bitte für mich drucken?","Das drucken!"],a:1},RF("Man soll fragen: „Wissen Sie vielleicht, wo die Kopien sind?“",true),{t:"c",q:"Was sagt man, wenn man Hilfe braucht?",o:["Hätten Sie kurz Zeit?","Helfen Sie mir sofort!","Ich will eine Antwort."],a:0}]}],
"4.3":[
{title:"Antwort vom Kundenservice",text:`Sehr geehrte Frau Horvat,
vielen Dank für Ihre E-Mail vom 2. November. Wir entschuldigen uns für die lange Wartezeit. Leider hatten wir Probleme mit unserem Lager. Ihr Drucker wurde gestern verschickt und kommt bis Donnerstag bei Ihnen an. Als Entschuldigung schenken wir Ihnen einen Gutschein über 30 Franken für Ihre nächste Bestellung. Wenn Sie noch Fragen haben, können Sie sich jederzeit an uns wenden.
Mit freundlichen Grüßen
Thomas Berger, Kundenservice`,
qs:[RF("Der Drucker wurde schon verschickt.",true),{t:"c",q:"Warum hat es so lange gedauert?",o:["Probleme mit dem Lager","Frau Horvat hat falsch bestellt","Der Drucker war kaputt"],a:0},{t:"c",q:"Was bekommt Frau Horvat als Entschuldigung?",o:["einen neuen Drucker","einen Gutschein über 30 Franken","ihr Geld zurück"],a:1}]},
{title:"Worüber ärgern Sie sich im Büro?",text:`Wir haben Angestellte gefragt, worüber sie sich am meisten ärgern.
Platz 1: Kollegen, die laut telefonieren. Viele Leute können sich dann nicht auf ihre Arbeit konzentrieren.
Platz 2: Sitzungen ohne Ergebnis. „Wir sprechen eine Stunde über ein Problem, und am Ende hat niemand eine Lösung“, sagt eine Mitarbeiterin.
Platz 3: die schmutzige Küche. Jeder wartet darauf, dass ein anderer aufräumt.
Und worüber freuen sich die Leute? Über ein Lob vom Chef und über Kuchen am Freitag.`,
qs:[{t:"c",q:"Was ärgert die Leute am meisten?",o:["die schmutzige Küche","laut telefonierende Kollegen","lange Sitzungen"],a:1},RF("In der Küche räumt jeder sofort auf.",false),{t:"c",q:"Worüber freuen sich die Angestellten?",o:["über Lob und Kuchen","über lange Sitzungen","über neue Computer"],a:0}]}],
"5.1":[
{title:"Durchsage am Bahnhof",text:`Achtung, eine Durchsage: Der Intercity nach Genf über Bern und Lausanne, Abfahrt 14.32 Uhr, fährt heute nicht auf Gleis 7, sondern auf Gleis 9. Wegen Bauarbeiten hat der Zug etwa 15 Minuten Verspätung. Reisende nach Basel steigen bitte in Olten um. Der Regionalzug nach Winterthur fährt wie geplant um 14.40 Uhr auf Gleis 3. Wir danken für Ihr Verständnis.`,
qs:[{t:"c",q:"Auf welchem Gleis fährt der Zug nach Genf?",o:["Gleis 3","Gleis 7","Gleis 9"],a:2},RF("Der Zug nach Genf ist pünktlich.",false,"15 Minuten Verspätung"),{t:"c",q:"Wo müssen Reisende nach Basel umsteigen?",o:["in Bern","in Olten","in Lausanne"],a:1}]},
{title:"Woher kommst du?",text:`In unserem Deutschkurs sind zwölf Personen aus neun Ländern. Pedro kommt aus Brasilien und arbeitet in einem Restaurant. Mei kommt aus China; sie ist mit einem Schweizer verheiratet. Ahmed kommt aus dem Iran und studiert an der ETH in Zürich. Anna und ihr Bruder kommen aus der Ukraine. Sie wohnen seit einem Jahr in der Schweiz. Lucy kommt aus den USA und fliegt jeden Sommer nach Hause zu ihrer Familie. Und unsere Lehrerin? Sie kommt aus Österreich und lebt seit zehn Jahren in Winterthur.`,
qs:[RF("Ahmed kommt aus dem Iran.",true),{t:"c",q:"Wohin fliegt Lucy jeden Sommer?",o:["nach Österreich","in die USA","nach Brasilien"],a:1},{t:"c",q:"Woher kommt die Lehrerin?",o:["aus der Schweiz","aus Deutschland","aus Österreich"],a:2}]}],
"5.2":[
{title:"Bewertung: Hotel Alpenrose",text:`★★★★☆ Schöner Urlaub, kleine Probleme
Wir waren eine Woche im Hotel Alpenrose in Grindelwald. Das Hotel liegt ruhig und hat einen herrlichen Blick auf die hohen Berge. Unser Zimmer war groß und sauber, aber das Bad war ziemlich alt. Das Frühstück war super: frisches Brot, guter Käse und leckere Konfitüre. Das Personal war sehr freundlich und hilfsbereit. Nur das WLAN war schlecht – im Zimmer hatten wir fast kein Internet. Für einen Urlaub ohne Handy ist das aber vielleicht gar nicht so schlecht!
Nicole, Basel`,
qs:[RF("Das Bad war neu.",false,"ziemlich alt"),{t:"c",q:"Was war nicht gut?",o:["das Frühstück","das WLAN","das Personal"],a:1},{t:"c",q:"Wie viele Sterne gibt Nicole?",o:["drei","vier","fünf"],a:1}]},
{title:"Ferienwohnung zu vermieten",text:`Gemütliche Ferienwohnung im Tessin, direkt am Lago Maggiore
Die helle 3-Zimmer-Wohnung hat einen großen Balkon mit tollem Seeblick. Es gibt eine moderne Küche, ein kleines Bad und zwei Schlafzimmer für maximal vier Personen. Zum Strand sind es nur fünf Minuten zu Fuß. Ein kleiner Supermarkt ist gleich um die Ecke. Haustiere sind leider nicht erlaubt.
Preis: 140 Franken pro Nacht, mindestens drei Nächte. Bettwäsche und Handtücher sind inklusive.`,
qs:[{t:"c",q:"Wie viele Personen können in der Wohnung schlafen?",o:["zwei","drei","vier"],a:2},RF("Man darf einen Hund mitbringen.",false),{t:"c",q:"Wie lange muss man mindestens bleiben?",o:["eine Nacht","drei Nächte","eine Woche"],a:1}]}],
"5.3":[
{title:"Wetterbericht",text:`Und nun das Wetter für morgen: Im Norden der Schweiz ist es am Vormittag noch bewölkt und neblig. Am Nachmittag scheint dann oft die Sonne. Die Temperaturen liegen bei 14 Grad. In den Alpen gibt es am Abend Gewitter, deshalb sollten Wanderer früh zurück sein. Im Tessin ist es sonnig und warm, bis 22 Grad. Am Wochenende wird es kälter: Am Sonntag regnet es im ganzen Land, und in den Bergen kann es schon schneien.`,
qs:[RF("Im Norden ist es morgen den ganzen Tag neblig.",false,"am Nachmittag Sonne"),{t:"c",q:"Wo ist es morgen am wärmsten?",o:["im Norden","in den Alpen","im Tessin"],a:2},{t:"c",q:"Wie wird das Wetter am Sonntag?",o:["sonnig und warm","Regen und vielleicht Schnee in den Bergen","Gewitter im Tessin"],a:1}]},
{title:"Was machen wir heute?",text:`– Es regnet schon wieder. Was machen wir heute?
– Wie wäre es mit dem Verkehrshaus? Da ist man drinnen.
– Gute Idee, aber da waren wir letztes Jahr schon.
– Hm. Wir könnten doch ins Kunstmuseum gehen. Es gibt eine neue Ausstellung.
– Ich weiß nicht. Ich habe keine Lust auf Kunst.
– Dann schlage ich vor, dass wir ins Hallenbad gehen und danach Fondue essen.
– Das klingt super! Obwohl es regnet, wird das ein schöner Tag.`,
qs:[RF("Sie waren schon einmal im Verkehrshaus.",true),{t:"c",q:"Warum gehen sie nicht ins Museum?",o:["Es ist geschlossen.","Eine Person hat keine Lust auf Kunst.","Es ist zu teuer."],a:1},{t:"c",q:"Was machen sie am Ende?",o:["Hallenbad und Fondue","Verkehrshaus","eine Wanderung"],a:0}]}],
"6.1":[
{title:"Katze oder Hund?",text:`Sind Katzen bessere Haustiere als Hunde? Das kommt darauf an. Katzen sind selbstständiger: Sie können länger allein bleiben und brauchen keinen Spaziergang. Außerdem sind sie meistens kleiner und ruhiger. Hunde sind dafür treuer und lernen schneller. Wer gern draußen ist, hat mit einem Hund den besten Freund. Hunde kosten aber mehr Geld und brauchen mehr Zeit. In der Schweiz leben übrigens mehr Katzen als Hunde: etwa 1,8 Millionen Katzen und eine halbe Million Hunde.`,
qs:[RF("Katzen brauchen mehr Spaziergänge als Hunde.",false),{t:"c",q:"Was ist ein Vorteil von Hunden?",o:["Sie sind billiger.","Sie lernen schneller.","Sie bleiben länger allein."],a:1},{t:"c",q:"Welches Tier gibt es in der Schweiz öfter?",o:["Katzen","Hunde","gleich viele"],a:0}]},
{title:"Im Zoo Zürich",text:`Der Zoo Zürich ist einer der größten Zoos der Schweiz. Besonders beliebt ist die Halle mit dem Regenwald: Dort ist es wärmer und feuchter als draußen, und man sieht Vögel, Affen und Schlangen. Die Elefanten leben in einer modernen Anlage mit einem großen Wasserbecken. Am interessantesten finden viele Kinder die Pinguine: Im Winter machen sie einen Spaziergang durch den Zoo. Tipp: Kommen Sie am Morgen, dann ist es ruhiger als am Nachmittag.`,
qs:[RF("In der Regenwaldhalle ist es kälter als draußen.",false),{t:"c",q:"Was machen die Pinguine im Winter?",o:["Sie schwimmen im See.","Sie machen einen Spaziergang.","Sie schlafen."],a:1},{t:"c",q:"Wann ist es im Zoo ruhiger?",o:["am Morgen","am Nachmittag","am Wochenende"],a:0}]}],
"6.2":[
{title:"Kontaktanzeige",text:`Ich (34, Lehrer) suche eine Partnerin, die gern lacht und die Natur liebt. Ich bin groß, sportlich und habe kurze, braune Haare und einen Bart. Meine Freunde sagen, ich bin geduldig, ehrlich und ein bisschen chaotisch. Am Wochenende bin ich oft in den Bergen oder auf dem Velo. Ich koche gern und lese viel. Eine Frau, die Tiere mag, wäre perfekt – ich habe nämlich einen alten Hund, der mich überallhin begleitet. Melde dich unter Chiffre 4711!`,
qs:[{t:"c",q:"Was ist der Mann von Beruf?",o:["Koch","Lehrer","Arzt"],a:1},RF("Er hat lange Haare.",false,"kurze, braune Haare"),{t:"c",q:"Warum sollte die Partnerin Tiere mögen?",o:["Er hat einen Hund.","Er arbeitet im Zoo.","Er möchte eine Katze kaufen."],a:0}]},
{title:"Der neue Nachbar",text:`Seit einer Woche haben wir einen neuen Nachbarn. Er heißt Herr Moser und ist etwa 70 Jahre alt. Er ist klein, hat weiße Haare und trägt immer einen Hut. Am ersten Tag hat er uns einen Kuchen gebracht, den er selbst gebacken hat. Er ist sehr freundlich, aber auch ein bisschen neugierig: Er fragt immer, wer uns besucht. Die Frau, die vorher in der Wohnung gewohnt hat, war ganz anders: Sie hat nie gegrüßt. Herr Moser ist mir viel lieber.`,
qs:[RF("Herr Moser trägt immer einen Hut.",true),{t:"c",q:"Was hat Herr Moser am ersten Tag gemacht?",o:["Er hat sich beschwert.","Er hat einen Kuchen gebracht.","Er hat eine Party gemacht."],a:1},{t:"c",q:"Wie war die Nachbarin vorher?",o:["sehr freundlich","unfreundlich, sie hat nie gegrüßt","neugierig"],a:1}]}],
"6.3":[
{title:"Tipps gegen Stress",text:`Fühlen Sie sich oft gestresst? Dann sollten Sie diese Tipps ausprobieren:
Sie sollten jeden Tag mindestens 30 Minuten an die frische Luft gehen, am besten ohne Handy.
Sie sollten nicht zu viel Kaffee trinken, vor allem nicht am Nachmittag.
Planen Sie Pausen! Wer ohne Pause arbeitet, macht mehr Fehler.
Und: Haustiere helfen gegen Stress. Schon zehn Minuten mit einem Hund oder einer Katze machen ruhiger.
Wenn der Stress trotzdem nicht weggeht, sollten Sie mit Ihrem Arzt sprechen.`,
qs:[RF("Man soll am Nachmittag viel Kaffee trinken.",false),{t:"c",q:"Wie lange soll man jeden Tag an die frische Luft?",o:["10 Minuten","30 Minuten","eine Stunde"],a:1},{t:"c",q:"Was soll man tun, wenn der Stress bleibt?",o:["mehr arbeiten","mit dem Arzt sprechen","ein Haustier kaufen"],a:1}]},
{title:"Feedback vom Chef",text:`Liebe Frau Brunner,
vielen Dank für Ihre Präsentation gestern. Die Folien waren sehr klar und die Zahlen gut erklärt – das haben Sie prima gemacht! Auch die Kunden waren begeistert. Ein kleiner Tipp für das nächste Mal: Vielleicht sollten Sie etwas langsamer sprechen. Am Ende hatten wir leider keine Zeit mehr für Fragen. Könnten Sie mir bitte die Präsentation bis Freitag schicken? Ich möchte sie an das ganze Team weiterleiten.
Machen Sie weiter so!
Daniel Keller`,
qs:[RF("Die Kunden fanden die Präsentation gut.",true),{t:"c",q:"Was soll Frau Brunner nächstes Mal anders machen?",o:["mehr Folien zeigen","langsamer sprechen","mehr Zahlen erklären"],a:1},{t:"c",q:"Was soll sie bis Freitag machen?",o:["die Präsentation schicken","eine neue Präsentation halten","mit den Kunden sprechen"],a:0}]}],
"7.1":[
{title:"Wohnungsanzeige",text:`Zu vermieten ab 1. Februar: helle 2,5-Zimmer-Wohnung in Winterthur-Seen
Die Wohnung liegt im dritten Stock (mit Lift) und hat einen Balkon nach Süden. Die Küche ist neu, im Bad gibt es eine Badewanne. Im Keller steht eine Waschmaschine für alle Mieter. Bushaltestelle und Supermarkt sind in der Nähe, zum Bahnhof fährt man zehn Minuten mit dem Bus.
Miete: 1650 Franken plus 180 Franken Nebenkosten pro Monat. Haustiere nach Absprache.
Besichtigung am Samstag, 10–12 Uhr. Kontakt: Frau Senn, Tel. 052 222 18 90.`,
qs:[RF("Die Wohnung hat keinen Lift.",false),{t:"c",q:"Wo steht die Waschmaschine?",o:["im Bad","in der Küche","im Keller"],a:2},{t:"c",q:"Wie viel kostet die Wohnung insgesamt pro Monat?",o:["1650 Franken","1830 Franken","180 Franken"],a:1}]},
{title:"Hilfe, wo ist mein Schlüssel?",text:`Jeden Morgen dasselbe: Ich suche meinen Schlüssel. Gestern lag er im Badezimmer neben dem Waschbecken. Vorgestern hing er an der Jacke im Flur – in der falschen Jacke. Und heute? Auf dem Tisch liegt er nicht, im Regal auch nicht. Endlich finde ich ihn unter dem Sofa. Meine Mitbewohnerin lacht: „Warum hängst du ihn nicht an den Haken neben der Tür? Dafür haben wir ihn doch!“ Sie hat recht. Ab morgen hängt mein Schlüssel immer am Haken. Hoffentlich.`,
qs:[{t:"c",q:"Wo lag der Schlüssel gestern?",o:["unter dem Sofa","neben dem Waschbecken","auf dem Tisch"],a:1},{t:"c",q:"Wo findet die Person den Schlüssel heute?",o:["im Regal","unter dem Sofa","an der Jacke"],a:1},RF("Neben der Tür gibt es einen Haken für Schlüssel.",true)]}],
"7.2":[
{title:"Früher war alles anders",text:`Als meine Großmutter jung war, hatte ihre Familie keinen Kühlschrank. Das Essen stand im kühlen Keller. Immer wenn sie Milch brauchten, ging sie zum Bauern im Dorf. Als sie zwölf Jahre alt war, kaufte ihr Vater das erste Radio. Die ganze Familie saß jeden Abend davor und hörte Nachrichten. Fernsehen gab es erst, als sie schon verheiratet war. Heute hat sie ein Handy und schreibt mir Nachrichten. „Es macht mir Spaß, neue Dinge zu lernen“, sagt sie. Sie ist 89.`,
qs:[RF("Die Familie hatte früher einen Kühlschrank.",false),{t:"c",q:"Was kaufte der Vater, als sie zwölf war?",o:["einen Fernseher","ein Radio","ein Handy"],a:1},{t:"c",q:"Wie alt ist die Großmutter heute?",o:["79","89","98"],a:1}]},
{title:"Gute Vorsätze",text:`Jedes Jahr im Januar habe ich gute Vorsätze. Dieses Jahr habe ich vor, mehr Sport zu machen und weniger Zucker zu essen. Außerdem versuche ich, früher ins Bett zu gehen. Letztes Jahr wollte ich auch jeden Tag joggen. Als es im Februar kalt wurde, habe ich aufgehört zu laufen. Dieses Mal mache ich es anders: Ich habe angefangen, mit einer Freundin zu trainieren. Es ist leichter, motiviert zu bleiben, wenn man nicht allein ist.`,
qs:[{t:"c",q:"Was hat die Person dieses Jahr vor?",o:["mehr Sport und weniger Zucker","mehr Zucker essen","später ins Bett gehen"],a:0},RF("Letztes Jahr ist sie das ganze Jahr gejoggt.",false,"Im Februar hat sie aufgehört."),{t:"c",q:"Was ist dieses Mal anders?",o:["Sie trainiert mit einer Freundin.","Sie joggt im Fitnessstudio.","Sie macht keinen Sport."],a:0}]}],
"7.3":[
{title:"Rezept: Rösti",text:`Rösti für 4 Personen
Zutaten: 1 kg Kartoffeln, 2 EL Butter, Salz, Pfeffer
Die Kartoffeln am Vortag in Wasser kochen, bis sie fast weich sind. Über Nacht im Kühlschrank lassen, deshalb kann man sie am nächsten Tag besser schneiden.
Die Kartoffeln schälen und grob reiben. Mit Salz und Pfeffer würzen.
Butter in einer Pfanne heiß machen. Die Kartoffeln in die Pfanne geben und flach drücken. Etwa 10 Minuten braten, bis sie unten goldbraun sind. Dann mit Hilfe eines Tellers wenden und die andere Seite 10 Minuten braten.
Tipp: Mit einem Spiegelei oder Käse servieren.`,
qs:[RF("Man kocht die Kartoffeln am selben Tag.",false,"am Vortag"),{t:"c",q:"Wie lange brät man jede Seite?",o:["etwa 5 Minuten","etwa 10 Minuten","etwa 20 Minuten"],a:1},{t:"c",q:"Womit kann man Rösti servieren?",o:["mit einem Spiegelei oder Käse","mit Schokolade","mit Reis"],a:0}]},
{title:"Restaurantkritik: Zum goldenen Löwen",text:`Das Restaurant in der Altstadt ist gemütlich und das Personal freundlich. Die Speisekarte ist klein, aber alles ist frisch. Als Vorspeise hatten wir eine Kürbissuppe – sehr lecker! Das Hauptgericht war leider eine Enttäuschung: Das Fleisch war zu trocken, und mein Gemüse war kalt. Die Kellnerin hat sich entschuldigt und uns das Dessert geschenkt. Der Schokoladenkuchen war fantastisch. Das Restaurant ist nicht billig, trotzdem kommen wir wieder – wegen der Suppe und des Kuchens.`,
qs:[{t:"c",q:"Was war nicht gut?",o:["die Suppe","das Hauptgericht","der Kuchen"],a:1},RF("Die Kellnerin hat ihnen das Dessert geschenkt.",true),{t:"c",q:"Warum kommen sie wieder?",o:["weil es billig ist","wegen der Suppe und des Kuchens","wegen des Fleisches"],a:1}]}],
"8.1":[
{title:"Polizeimeldung",text:`Winterthur: Am Montagabend wurde in einem Kiosk am Bahnhof eingebrochen. Die Täter kamen gegen 23 Uhr durch ein Fenster. Es wurden Zigaretten und etwa 800 Franken gestohlen. Niemand wurde verletzt. Eine Frau hat zwei junge Männer gesehen, die mit dem Velo weggefahren sind. Die Polizei sucht Zeugen. Wer etwas gesehen hat, wird gebeten, sich unter der Nummer 052 267 51 51 zu melden.`,
qs:[RF("Bei dem Einbruch wurde eine Person verletzt.",false),{t:"c",q:"Wie kamen die Täter in den Kiosk?",o:["durch die Tür","durch ein Fenster","durch den Keller"],a:1},{t:"c",q:"Was möchte die Polizei?",o:["dass Zeugen sich melden","dass der Kiosk schließt","dass niemand Velo fährt"],a:0}]},
{title:"So wird Schokolade gemacht",text:`Schokolade wird aus Kakaobohnen gemacht. Die Bohnen wachsen in warmen Ländern, zum Beispiel in Ghana oder Ecuador. Nach der Ernte werden sie getrocknet und in die Schweiz transportiert. In der Fabrik werden die Bohnen geröstet. Dann werden sie gemahlen, und Zucker und Milchpulver werden dazugegeben. Die Masse wird lange gerührt – manchmal bis zu drei Tage. So wird die Schokolade besonders fein. Diese Methode wurde 1879 von Rodolphe Lindt in Bern erfunden.`,
qs:[RF("Kakaobohnen wachsen in der Schweiz.",false),{t:"c",q:"Was passiert in der Fabrik zuerst?",o:["Die Bohnen werden geröstet.","Zucker wird dazugegeben.","Die Masse wird gerührt."],a:0},{t:"c",q:"Wer hat die Methode erfunden?",o:["Rodolphe Lindt","ein Bauer in Ghana","eine Fabrik in Ecuador"],a:0}]}],
"8.2":[
{title:"Müll trennen in der Schweiz",text:`Wer neu in die Schweiz kommt, ist oft überrascht: Hier wird Müll sehr genau getrennt. Glas, Papier, Karton, Alu und PET-Flaschen bringt man zu Sammelstellen oder in den Supermarkt. Für den normalen Müll braucht man spezielle Säcke, die man im Geschäft kauft. Ein Sack mit 35 Litern kostet etwa zwei Franken. Deshalb trennen die meisten Leute ihren Müll sehr sorgfältig, um Geld zu sparen. Wer seinen Müll falsch entsorgt, muss eine Strafe zahlen.`,
qs:[RF("Für normalen Müll braucht man spezielle Säcke.",true),{t:"c",q:"Wohin bringt man PET-Flaschen?",o:["in den normalen Müll","zu Sammelstellen oder in den Supermarkt","zur Post"],a:1},{t:"c",q:"Warum trennen viele Leute ihren Müll so genau?",o:["um Geld zu sparen","weil es Spaß macht","weil der Nachbar kontrolliert"],a:0}]},
{title:"Diskussion: Sollte Fliegen teurer werden?",text:`Lara (23): „Ich bin dafür. Fliegen ist viel zu billig. Ein Flug nach London kostet weniger als ein Zugticket nach Genf! Wenn Fliegen teurer wird, nehmen mehr Leute den Zug.“
Reto (45): „Ich bin dagegen. Dann können nur noch reiche Leute reisen. Meine Familie wohnt in Spanien, und ich möchte sie besuchen können.“
Mira (31): „Einerseits verstehe ich Reto. Andererseits müssen wir etwas für das Klima tun. Vielleicht sollte nur der dritte oder vierte Flug im Jahr teurer werden, damit Familienbesuche möglich bleiben.“`,
qs:[{t:"c",q:"Wer ist gegen teurere Flüge?",o:["Lara","Reto","Mira"],a:1},RF("Laut Lara ist ein Flug nach London billiger als ein Zugticket nach Genf.",true),{t:"c",q:"Was schlägt Mira vor?",o:["Alle Flüge sollen teurer werden.","Nur weitere Flüge im Jahr sollen teurer werden.","Fliegen soll billiger werden."],a:1}]}],
"8.3":[
{title:"Gebrauchsanweisung: Kaffeemaschine",text:`1. Den Wassertank mit frischem Wasser füllen.
2. Das Gerät mit dem Kabel an die Steckdose anschließen und mit dem Schalter auf der Rückseite einschalten.
3. Warten, bis die grüne Lampe leuchtet (ca. 30 Sekunden).
4. Eine Kapsel einlegen und eine Tasse unter die Maschine stellen.
5. Die Taste drücken: kleine Tasse = 1x drücken, große Tasse = 2x drücken.
Wichtig: Die Maschine nie mit Wasser abspülen! Nach dem Gebrauch ausschalten. Die Maschine schaltet sich nach 9 Minuten automatisch aus.`,
qs:[{t:"c",q:"Was macht man zuerst?",o:["eine Kapsel einlegen","den Wassertank füllen","die Taste drücken"],a:1},RF("Für eine große Tasse drückt man die Taste zweimal.",true),{t:"c",q:"Was darf man nicht machen?",o:["die Maschine mit Wasser abspülen","die Maschine ausschalten","eine Tasse unter die Maschine stellen"],a:0}]},
{title:"Ohne Handy leben?",text:`Simon (19) hat ein Experiment gemacht: Er hat einen Monat lang kein Smartphone benutzt. „Am Anfang war es schwer“, erzählt er. „Ich wusste nicht, wann mein Bus kommt, und ich habe mich zweimal verlaufen.“ Mit seinen Freunden hat er über ein altes Handy ohne Internet telefoniert. Nach zwei Wochen fühlte er sich aber ruhiger und schlief besser. Er hat sogar zwei Bücher gelesen. Jetzt benutzt er sein Smartphone wieder, aber nicht mehr nach 21 Uhr.`,
qs:[RF("Simon hat ein Jahr ohne Smartphone gelebt.",false,"einen Monat"),{t:"c",q:"Was war am Anfang schwierig?",o:["Er wusste nicht, wann der Bus kommt.","Er konnte nicht schlafen.","Er hatte keine Freunde."],a:0},{t:"c",q:"Was macht Simon jetzt anders?",o:["Er benutzt nach 21 Uhr kein Smartphone.","Er hat kein Handy mehr.","Er liest keine Bücher mehr."],a:0}]}],

function norm(s){

    .replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
    .replace(/[’'`´]/g,"").replace(/[.,!?;:…"„“()]/g," ").replace(/\s+/g," ").trim();
}
function lev(a,b){
  if(a===b)return 0; const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}
  return prev[n];
}
/* returns "ok" | "typo" | "no" */
function judge(given,accepted,{typo=true}={}){
  const g=norm(given); if(!g)return "no";
  const alts=String(accepted).split("|").map(norm);
  if(alts.includes(g))return "ok";
  if(typo&&alts.some(a=>a.length>=6&&lev(a,g)===1))return "typo";
  return "no";
}

function umlautLast(w){

  if(w[i]==="u"&&w[i-1]==="a")return w.slice(0,i-1)+"ä"+w.slice(i);
  return w.slice(0,i)+{a:"ä",o:"ö",u:"ü"}[w[i]]+w.slice(i+1);
}
/* plural answer: "die Stellen", "Stellen", or dictionary shorthand "-n", "¨-e", "-" */
function judgePlural(c,given){
  let g=String(given||"").trim().replace(/^die\s+/i,"");if(!g)return "no";
  if(/^(¨?\s*[-–]\s*¨?\s*[a-zäöüß]*|¨[a-zäöüß]*)$/i.test(g)){

const WORD_RE=/[A-Za-zÄÖÜäöüßéèàâç]+(?:-[A-Za-zÄÖÜäöüßéèàâç]+)*/g;
const EMAIL_RE=/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g;
/* split text into plain strings and {w} word tokens; emails and single letters stay plain */
function tokenizeText(text){
  const out=[];
  String(text).split(/([\w.+-]+@[\w-]+(?:\.[\w-]+)+)/).forEach((part,i)=>{
    if(i%2){out.push(part);return;}
    let last=0;part.replace(WORD_RE,(w,idx)=>{if(idx>last)out.push(part.slice(last,idx));out.push(w.length>1?{w}:w);last=idx+w.length;return w;});
    if(last<part.length)out.push(part.slice(last));
  });
  return out;
}
const SEP_PREFIX=["zurück","zusammen","weiter","fest","fern","teil","kennen","spazieren","ab","an","auf","aus","ein","mit","nach","vor","weg","zu","um","her","hin","los","dazu"];
const INSEP=/^(be|ver|er|ent|emp|ge|zer|miss|über|hinter|wider)/;
let GLOSS=null;
function buildGloss(){
  const G=new Map();
  const put=(form,e,force)=>{if(!form)return;if(force||!G.has(form))G.set(form,e);};
  const verbForms=(inf)=>{
    let pre="",base=inf;
    for(const p of SEP_PREFIX)if(inf.startsWith(p)&&inf.length>p.length+3){pre=p;base=inf.slice(p.length);break;}
    const stem=/(el|er)n$/.test(base)?base.slice(0,-1):base.replace(/(e?n)$/,"");const ins=INSEP.test(base)||/ieren$/.test(base);
    const t=/[dt]$/.test(stem)?"et":"t", te=/[dt]$/.test(stem)?"ete":"te";
    const fin=[stem+"e",stem+"st",stem+t,base,stem+(t==="et"?"et":"t"),stem+te,stem+te+"st",stem+te+"n",stem+te+"t"];
    const part=(ins?"":"ge")+stem+t;
    return {fin,nonfin:[inf,pre+part,pre?pre+"zu"+base:"",pre?pre+stem+"e":"",pre?pre+stem+t:""]};
  };
  for(const id of CARD_ORDER){
    const c=CARDS[id];
    if(c.t==="v"){
      const e={l:c.inf,en:c.en,card:id,verb:true};
      const vf=verbForms(c.inf);
      put(c.pf.split(" ").pop(),e,true);
      vf.nonfin.forEach(f=>put(f,e));
      if(c.pr.includes(" "))continue; // separable: finite forms are split in the sentence, so they belong to the base verb
      vf.fin.forEach(f=>put(f,e));
      [c.pr,c.pt].forEach(f=>put(f,e,true));
      const pt=c.pt;put(pt+"en",e,true);put(pt+"st",e);put(pt+"t",e);
      if(/e$/.test(pt))put(pt+"n",e,true);
      continue;
    }
    if(c.kind==="noun"){
      const e={l:`${c.art} ${c.noun}`,pl:c.pl,en:c.en,card:id,art:c.art};
      [c.noun,c.pl,c.pl&&datPl(c.pl),c.noun+"s",c.noun+"es",c.noun+"n"].forEach(f=>put(f,e,true));
      continue;
    }
    const toks=c.de.replace(/[.?!…]/g,"").split(/\s+/).filter(w=>!/^(sich|etwas|für|um|an|auf|über|von|vor|in|mit)$/.test(w));
    if(c.kind==="phrase"||toks.length!==1)continue;
    const w=toks[0],e={l:c.de,en:c.en,card:id};
    if(/^to /.test(c.en)&&/n$/.test(w)){const vf=verbForms(w);const sep=SEP_PREFIX.some(p=>w.startsWith(p)&&w.length>p.length+3);[...(sep?[]:vf.fin),...vf.nonfin].forEach(f=>put(f,e,true));}
    else ["","e","en","er","es","em"].forEach(s=>put(w+s,e,true));
  }
  for(const line of GLOSS_TXT.split("\n")){
    const [forms,lemma,pl,en]=line.split("|");if(!forms||en==null)continue;
    const fs=forms.split(",").map(x=>x.trim()).filter(Boolean);
    const l=(lemma||fs[0]).trim(),m=l.match(/^(der|die|das) (.+)$/);
    const e={l,pl:(pl||"").trim(),en:en.trim(),art:m?m[1]:"",name:/^\(name|^\(place/.test(en.trim())};
    fs.forEach(f=>put(f,e,true));
  }
  return G;
}
function lookupWord(w){
  if(!GLOSS)GLOSS=buildGloss();
  return GLOSS.get(w)||GLOSS.get(w.toLowerCase())||GLOSS.get(w[0].toUpperCase()+w.slice(1))||null;
}

function genAdj(){

  let noun,g,adj,shown;
  if(type==="none"){
    if(Math.random()<.55){const m=pick(ADJ_MASS);noun=m.n;g=m.g;adj=pick(m.a);}
    else{const x=pick(ADJ_NOUNS);g="pl";noun=cs==="D"?datPl(x.pl):x.pl;adj=pick(x.p?ADJ_PERS:ADJ_THING);}
  }else{
    const x=pick(ADJ_NOUNS);const plural=Math.random()<.22;
    g=plural?"pl":x.g;noun=plural?(cs==="D"?datPl(x.pl):x.pl):x.n;adj=pick(x.p?ADJ_PERS:ADJ_THING);
  }
  const gi=GI[g], end=ENDINGS[type][cs][gi];
  const frame={N:g==="pl"?"Hier sind":"Hier ist",A:"für",D:"mit"}[cs];
  const art=type==="none"?"":ARTS[type][cs][gi];
  const blankArt=type!=="none"&&Math.random()<.35;
  const base=type==="def"?"der/die/das":"ein/kein";
  const q=`${frame} ${type==="none"?"":blankArt?"___ ":art+" "}${stemOf(adj)}___ ${noun}.`;
  const a=blankArt?[art,end]:[end];
  const gname={m:"masculine",f:"feminine",n:"neuter",pl:"plural"}[g];
  let why=`${CASE_NAME[cs]}, ${gname}`;
  if(type==="none")why+=", no article → the adjective carries the der/die/das signal (-"+end+")";
  else if(type==="ind"&&["er","es"].includes(end))why+=`: "${art}" hides the gender, so the adjective shows it (-${end})`;
  else why+=`: the article already shows it, so the adjective takes -${end}`;
  return {q,a,hint:`${CASE_NAME[cs]} · ${gname}${blankArt?" · article: "+base:""}`,why,gen:"adjgen",tile:end};
}

const dirty=new Set(), lastJSON={}; let saveTimer=null, writing=false;

function touch(...names){for(const n of names)dirty.add(n);localSave();clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200);}
async function flush(){
  if(!db||writing||!dirty.size){setSave();return;}
  writing=true;setSave("saving");
  try{
    for(const n of [...dirty]){
      dirty.delete(n);
      const body=clone(S[n]);const j=JSON.stringify(body);
      if(j===lastJSON[n])continue;
      await db.doc("a2/"+n).set(body);lastJSON[n]=j;
    }
    saveState="db";
  }catch(e){saveState="err";console.warn(e);}
  writing=false;setSave();
  if(dirty.size){clearTimeout(saveTimer);saveTimer=setTimeout(flush,1500);}
}
function setSave(s){const el=$("#save");if(!el)return;const st=s||saveState;el.dataset.s=st;el.textContent={db:"Saved to Claude",saving:"Saving…",err:"Save failed, kept on this device",local:"Saved on this device"}[st];}

async function connect(){
  const c=window.claude;
  try{db=c&&c.use?await c.use("db"):null;}catch(e){db=null;}
  try{sample=c&&c.use?await c.use("sample"):null;}catch(e){sample=null;}
  if(db){
    try{
      const snaps=await Promise.all(DOCS.map(n=>db.doc("a2/"+n).get()));
      let migrate=[];
      snaps.forEach((sn,i)=>{const n=DOCS[i];
        if(sn.exists){S[n]=Object.assign(clone(DEF[n]),clone(sn.data()));lastJSON[n]=JSON.stringify(sn.data());}
        else if(JSON.stringify(S[n])!==JSON.stringify(DEF[n]))migrate.push(n);});
      saveState="db";localSave();
      if(migrate.length)touch(...migrate);
      for(const n of DOCS)db.doc("a2/"+n).onSnapshot(sn=>{
        if(!sn.exists||sn.metadata.hasPendingWrites||dirty.has(n))return;
        const j=JSON.stringify(sn.data());if(j===lastJSON[n])return;
        lastJSON[n]=j;S[n]=Object.assign(clone(DEF[n]),clone(sn.data()));localSave();
        if(!ui.sess&&!ui.write.busy&&!ui.chat.busy)render();
      },()=>{});
    }catch(e){console.warn(e);saveState="err";}
  }

}

function commitTime(){if(pendingSec<15)return;const d=today();S.progress.days[d]=Math.round(((S.progress.days[d]||0)+pendingSec/60)*10)/10;pendingSec=0;touch("progress");}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){commitTime();flush();}});
const minutesOn=d=>Math.round((S.progress.days[d]||0)+(d===today()?pendingSec/60:0));
function streak(){let n=0,d=today();if(!minutesOn(d))d=addDays(d,-1);while(minutesOn(d)>=5){n++;d=addDays(d,-1);}return n;}
function weekMinutes(){const m=mondayOf(today());let t=0;for(let i=0;i<7;i++)t+=minutesOn(addDays(m,i));return t;}

/* ---------- schedule ---------- */
function scheduledChapter(d=today()){for(const c of CHAPTERS)if(d<=c.to)return c.n;return 9;}
function currentChapter(){return S.progress.current||Math.min(8,scheduledChapter());}
function bookToday(){
  const n=currentChapter(),c=CHAPTERS[n-1],t=today();
  const span=daysBetween(c.from,c.to)+1,idx=Math.max(0,Math.min(span-1,daysBetween(c.from,t)));
  const parts=c.parts;const pi=Math.min(parts.length-1,Math.floor(idx/span*parts.length));

}

/* ---------- SRS ---------- */
const srs=id=>S.srs.cards[id];

  c.n++;
  if(ok){c.b=Math.min(5,c.b+1);}else{c.b=1;c.l=(c.l||0)+1;}

}
const dueCards=(filter=()=>true)=>CARD_ORDER.filter(id=>isDue(id)&&filter(CARDS[id])).sort((a,b)=>srs(a).due.localeCompare(srs(b).due)||srs(a).b-srs(b).b);
function newCards(maxCh,n,filter=()=>true){
  const out=[];for(const id of CARD_ORDER){if(out.length>=n)break;const c=CARDS[id];if(c.ch<=maxCh&&!srs(id)&&filter(c))out.push(id);}
  // vocabulary first, verbs mixed in every 4th
  const w=out.filter(i=>CARDS[i].t==="w"),v=out.filter(i=>CARDS[i].t==="v"),r=[];
  while(w.length||v.length){r.push(...w.splice(0,3));if(v.length)r.push(v.shift());}

const newLeftToday=()=>Math.max(0,(S.progress.settings.newPerDay||NEW_PER_DAY)-(S.progress.introduced[today()]||0));

/* ---------- topic stats + mistakes ---------- */
function topicAcc(tid){const s=S.progress.topic[tid];if(!s||s.r+s.w===0)return null;return s.r/(s.r+s.w);}
function recordTopic(tid,ok){const s=S.progress.topic[tid]||{r:0,w:0};ok?s.r++:s.w++;s.last=today();S.progress.topic[tid]=s;touch("progress");}

}
function fixMistake(tid,item){const m=S.mistakes.items.find(x=>x.key===itemKey(tid,item));if(m&&!m.fixed){m.fixed=true;touch("mistakes");}}
const openMistakes=()=>S.mistakes.items.filter(m=>!m.fixed&&m.tid!=="writing");
function weakTopics(){
  return Object.entries(S.progress.topic).filter(([id,s])=>ALLTOPICS[id]&&s.r+s.w>=4).map(([id,s])=>({id,acc:s.r/(s.r+s.w)})).filter(x=>x.acc<.85).sort((a,b)=>a.acc-b.acc).slice(0,3);
}
function gramItem(tid){const t=ALLTOPICS[tid];if(t.gen)return GENFN[tid]();return pick(t.items);}

/* ---------- sessions ---------- */
function startSession(title,queue,opts={}){
  if(!queue.length){toast("Nothing to practice here right now.");return;}
  ui.sess={title,q:queue,i:0,ok:0,no:0,start:Date.now(),ret:ui.tab,...opts};
  ui.tab="drill";render();window.scrollTo({top:0});
}
function sessToday(){
  const cur=currentChapter();
  const due=dueCards().slice(0,30).map(id=>({k:"card",id}));
  const fresh=newCards(cur,newLeftToday()).map(id=>({k:"card",id,intro:true}));
  const curTopics=[...CHAPTERS[cur-1].topics];
  const prev=CHAPTERS.slice(0,cur-1).flatMap(c=>c.topics);
  const weak=weakTopics().map(w=>w.id);
  const gram=[];
  for(let i=0;i<5;i++){const tid=curTopics[i%curTopics.length];gram.push({k:"gram",tid,item:gramItem(tid)});}
  weak.slice(0,2).forEach(tid=>gram.push({k:"gram",tid,item:gramItem(tid)}));
  if(prev.length)for(let i=0;i<2;i++){const tid=pick(prev);gram.push({k:"gram",tid,item:gramItem(tid)});}
  openMistakes().slice(0,3).forEach(m=>gram.push({k:"gram",tid:m.tid,item:m.item,redo:true}));
  const cards=[...fresh.slice(0,4),...due,...fresh.slice(4)];
  const g=shuffle(gram), q=[];
  while(cards.length||g.length){q.push(...cards.splice(0,5));if(g.length)q.push(...g.splice(0,2));}
  startSession("Heute · today's session",q,{daily:true});
}
function sessTopic(tid,n=10){startSession(ALLTOPICS[tid].title,topicItems(tid,n).map(item=>({k:"gram",tid,item})));}
function sessChapterWords(ch){
  const f=c=>c.ch===ch&&c.t==="w";
  const due=dueCards(f).map(id=>({k:"card",id}));
  const fresh=newCards(ch,Math.max(6,newLeftToday()),f).map(id=>({k:"card",id,intro:true}));
  let q=[...due,...fresh];
  if(q.length<8){const rest=CARD_ORDER.filter(id=>f(CARDS[id])&&srs(id)&&!isDue(id)).sort((a,b)=>srs(a).b-srs(b).b).slice(0,10-q.length).map(id=>({k:"card",id,cram:true}));q=q.concat(rest);}
  startSession(`Kapitel ${ch} · words`,q.slice(0,25));
}
function sessVerbs(){
  const f=c=>c.t==="v";
  const cur=Math.max(currentChapter(),1);
  let q=[...dueCards(f).map(id=>({k:"card",id})),...newCards(8,5,c=>c.t==="v"&&c.ch<=cur).map(id=>({k:"card",id,intro:true}))];
  if(q.length<12){const rest=CARD_ORDER.filter(id=>f(CARDS[id])&&srs(id)&&!isDue(id)).sort((a,b)=>srs(a).b-srs(b).b).slice(0,12-q.length).map(id=>({k:"card",id,cram:true}));q=q.concat(rest);}
  startSession("Verben · irregular verbs",q.slice(0,15));
}
function sessMistakes(){startSession("Fehler · redo my mistakes",shuffle(openMistakes()).slice(0,15).map(m=>({k:"gram",tid:m.tid,item:m.item,redo:true})));}

/* ---------- course ---------- */
const LESSON=Object.fromEntries(LESSONS.map(l=>[l.id,l]));

function readDone(id,ti){const r=lp(id).read;if(!r)return null;if(r.total!=null)return ti===0?r:null;return r[ti]||null;}
function setReadDone(id,ti,res){const prev=lp(id).read;const base=prev&&prev.total!=null?{0:prev}:Object.assign({},prev||{});base[ti]=res;setLp(id,{read:base});}
function lessonLabel(l){return l.ch<9?`Kapitel ${l.ch} · Lektion ${l.id}`:"Abschluss · Prüfungstraining";}

function sessLessonPractice(id){
  const l=LESSON[id];let items=l.extra.map(item=>({k:"gram",tid:l.topics[0],item}));
  const need=Math.max(4,10-items.length);const per=Math.ceil(need/l.topics.length);
  l.topics.forEach(tid=>topicItems(tid,per).forEach(item=>items.push({k:"gram",tid,item})));
  startSession(`Lektion ${id} · Übungen`,[...items.slice(0,l.extra.length),...shuffle(items.slice(l.extra.length)).slice(0,need)],{lesson:id,kind:"practice",ret:"kurs"});
}
function sessLessonTest(id){
  const l=LESSON[id];const tid0=l.topics[0];
  const own=l.test.map(item=>({k:"gram",tid:tid0,item}));
  const extra=[];const pool=shuffle(l.topics);for(let i=0;i<4;i++){const tid=pool[i%pool.length];extra.push({k:"gram",tid,item:gramItem(tid)});}

function finishSession(s){
  if(s.finished)return;s.finished=true;commitTime();
  if(!s.lesson)return;
  const tot=s.ok+s.no,pct=tot?Math.round(s.ok/tot*100):0,p=lp(s.lesson);
  if(s.kind==="practice")setLp(s.lesson,{practice:Math.max(p.practice||0,pct)});
  if(s.kind==="test"){const best=Math.max(p.test||0,pct);setLp(s.lesson,{test:best,passed:p.passed||pct>=80,lastTest:pct});}
  s.pct=pct;
