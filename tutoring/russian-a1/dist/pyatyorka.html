<title>Пятёрка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;700&display=swap">
<style>
:root{
  --paper:#F4F6FA; --grid:rgba(52,86,170,.075); --surface:#FFFFFF; --surface-2:#EEF1F7;
  --ink:#1A2030; --ink-soft:#545D74; --ink-faint:#8A92A6; --line:#DADFEA; --line-strong:#BFC6D6;
  --blue:#2446A8; --blue-soft:#E3E9F8; --red:#C42E27; --red-soft:#F8E4E2; --green:#2C7A4B; --green-soft:#E0F1E7;
  --amber:#A86B00; --amber-soft:#F7ECD5;
  --shadow:0 1px 2px rgba(26,32,48,.06),0 8px 24px rgba(26,32,48,.06);
  --f-display:'Unbounded','PT Sans',system-ui,sans-serif; --f-body:'PT Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-hand:'Caveat','Segoe Print','Bradley Hand',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#11141B; --grid:rgba(138,166,240,.06); --surface:#191D27; --surface-2:#222735;
    --ink:#E7EAF2; --ink-soft:#A3ABBF; --ink-faint:#737B90; --line:#2A3040; --line-strong:#3A4254;
    --blue:#8EA8F2; --blue-soft:#232E4D; --red:#F27B70; --red-soft:#3D2323; --green:#6FCB94; --green-soft:#1C3326;
    --amber:#E3B04F; --amber-soft:#3A2F17;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#11141B; --grid:rgba(138,166,240,.06); --surface:#191D27; --surface-2:#222735;
  --ink:#E7EAF2; --ink-soft:#A3ABBF; --ink-faint:#737B90; --line:#2A3040; --line-strong:#3A4254;
  --blue:#8EA8F2; --blue-soft:#232E4D; --red:#F27B70; --red-soft:#3D2323; --green:#6FCB94; --green-soft:#1C3326;
  --amber:#E3B04F; --amber-soft:#3A2F17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55;
}
h1,h2,h3{margin:0; text-wrap:balance}
p{margin:0 0 10px}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hand{font-family:var(--f-hand); color:var(--red); font-weight:700}
.de{font-size:.86em; color:var(--ink-faint); white-space:nowrap}
.de::before{content:'DE '; font-weight:700; font-size:.75em; letter-spacing:.06em}
i.ru{font-style:normal; color:var(--blue); cursor:pointer; border-bottom:1px dotted transparent}
i.ru:hover{border-bottom-color:var(--blue)}
.muted{color:var(--ink-soft)} .faint{color:var(--ink-faint)}

/* shell */
.app{display:flex; min-height:100vh; max-width:1320px; margin:0 auto}
.rail{width:250px; flex:none; padding:22px 14px 22px 16px; position:sticky; top:env(safe-area-inset-top,0px); align-self:flex-start; height:100vh; overflow-y:auto; border-right:1px solid var(--line); background:color-mix(in srgb,var(--paper) 88%,transparent)}
.brand{display:flex; align-items:center; gap:10px; margin-bottom:4px}
.brand-mark{position:relative; width:44px; height:44px; flex:none}
.brand-mark svg{position:absolute; inset:0}
.brand-mark span{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-hand); font-size:34px; font-weight:700; color:var(--red); line-height:1; padding-top:2px}
.brand-name{font-family:var(--f-display); font-weight:700; font-size:19px; letter-spacing:-.01em}
.brand-sub{font-size:12px; color:var(--ink-faint); margin:2px 0 14px}
.sync{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-faint); padding:8px 0 14px; border-bottom:1px solid var(--line); margin-bottom:10px}
.sync .dot{width:7px; height:7px; border-radius:50%; background:var(--ink-faint)}
.sync.ok{color:var(--green)} .sync.ok .dot{background:var(--green)}
.sync.local .dot{background:var(--amber)}
.sync.busy .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.nav-label{font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-faint); font-weight:700; margin:14px 6px 4px}
.nav{display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:0; border-radius:7px; padding:6px 8px; font-size:14.5px}
.nav:hover{background:var(--blue-soft)}
.nav.on{background:var(--blue); color:#fff}
.nav.on .nav-meta{color:rgba(255,255,255,.75)}
.nav-n{font-family:var(--f-display); font-size:11px; font-weight:700; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; border:1.5px solid currentColor; flex:none; opacity:.8}
.nav-n.done{background:var(--green); border-color:var(--green); color:#fff; opacity:1}
.nav.on .nav-n.done{background:#fff; color:var(--green)}
.nav-body{flex:1; min-width:0}
.nav-t{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.nav-meta{display:block; font-size:11.5px; color:var(--ink-faint)}
.nav-badge{font-size:11px; font-weight:700; background:var(--red); color:#fff; border-radius:99px; padding:1px 7px}
.nav.out{opacity:.45}
.main{flex:1; min-width:0; padding:26px 36px 120px; position:relative}
.main::before{content:''; position:absolute; top:0; bottom:0; left:18px; width:1.5px; background:var(--red); opacity:.35}

/* page header */
.ph{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:22px}
.eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--blue); font-weight:700; margin-bottom:4px}
.title{font-family:var(--f-display); font-weight:700; font-size:30px; line-height:1.15; letter-spacing:-.01em}
.title-en{font-size:17px; color:var(--ink-soft); margin-top:4px}
.tabs{display:flex; gap:3px; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:3px; flex-wrap:wrap}
.tab{border:0; background:none; border-radius:7px; padding:6px 13px; font-size:14px; color:var(--ink-soft)}
.tab.on{background:var(--blue); color:#fff}

.sheet{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:26px 30px}
.stack{display:flex; flex-direction:column; gap:16px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 20px}
.card h3{font-family:var(--f-display); font-size:15px; font-weight:700; margin-bottom:10px}
.btn{border:0; border-radius:8px; padding:9px 16px; font-weight:700; font-size:14.5px; background:var(--blue); color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{background:var(--line-strong); cursor:default; filter:none}
.btn.ghost{background:none; border:1px solid var(--line-strong); color:var(--ink)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.red{background:var(--red)}
.btn.sm{padding:5px 11px; font-size:13px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; border-radius:99px; padding:3px 10px; background:var(--surface-2); color:var(--ink-soft)}
.chip.g{background:var(--green-soft); color:var(--green)} .chip.r{background:var(--red-soft); color:var(--red)} .chip.b{background:var(--blue-soft); color:var(--blue)} .chip.a{background:var(--amber-soft); color:var(--amber)}
.bar{height:6px; border-radius:3px; background:var(--line); overflow:hidden}
.bar i{display:block; height:100%; background:var(--blue); border-radius:3px}
.input,.ta,select.input{border:1px solid var(--line-strong); border-radius:8px; background:var(--paper); padding:8px 11px; font-size:16px; min-width:0}
.ta{width:100%; min-height:160px; resize:vertical; line-height:1.6}
.input:focus,.ta:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft)}

/* grammar */
.gram h3{font-family:var(--f-display); font-size:16px; font-weight:700; margin:26px 0 10px; color:var(--ink)}
.gram h3:first-child{margin-top:0}
.gram p{max-width:70ch}
.tbl-wrap{overflow-x:auto}
table.gt{border-collapse:collapse; margin:8px 0 14px; font-size:15px; min-width:min(100%,420px)}
table.gt td,table.gt th{border:1px solid var(--line); padding:6px 11px; text-align:left; vertical-align:top}
table.gt th{background:var(--surface-2); font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft)}
.tip{background:var(--amber-soft); border-left:3px solid var(--amber); padding:10px 14px; border-radius:0 8px 8px 0; font-size:15px; max-width:74ch}
.cando{margin:0; padding-left:20px; color:var(--ink-soft)} .cando li{margin:2px 0}

/* quiz */
.q{border:1px solid var(--line); border-radius:10px; padding:14px 16px; background:var(--surface)}
.q + .q{margin-top:10px}
.q-n{font-family:var(--f-display); font-size:11px; font-weight:700; color:var(--ink-faint); margin-bottom:4px}
.q-p{margin-bottom:10px; font-size:16.5px}
.opts{display:flex; gap:8px; flex-wrap:wrap}
.opt{border:1.5px solid var(--line-strong); background:var(--paper); border-radius:8px; padding:6px 14px; font-size:16px}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.ok{border-color:var(--green); background:var(--green-soft); color:var(--green); font-weight:700}
.opt.bad{border-color:var(--red); background:var(--red-soft); color:var(--red); text-decoration:line-through}
.opt[disabled]{cursor:default}
.why{margin-top:8px; font-size:14.5px; color:var(--ink-soft)}
.why b{color:var(--ink)}
.score{display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:18px 20px; border:2px solid var(--ink); border-radius:12px; margin-top:16px; background:var(--surface)}
.score .big{font-family:var(--f-display); font-size:34px; font-weight:700}

/* drills */
.dr{display:grid; grid-template-columns:minmax(0,1fr) minmax(140px,240px) auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px dashed var(--line)}
.dr:last-child{border-bottom:0}
.dr .mark{width:26px; text-align:center; font-family:var(--f-hand); font-size:24px; font-weight:700; line-height:1}
.dr .mark.ok{color:var(--green)} .dr .mark.bad{color:var(--red)}
.dr .fix{grid-column:1/-1; font-size:14px; color:var(--red); margin-top:-4px}
@media (max-width:560px){.dr{grid-template-columns:1fr auto}.dr .input{grid-column:1/2}}

/* words */
table.words{width:100%; border-collapse:collapse; font-size:15px}
table.words td,table.words th{padding:7px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top}
table.words th{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint)}
table.words td.w{font-size:17px; white-space:nowrap}
.spk{border:0; background:none; color:var(--ink-faint); padding:2px 4px; vertical-align:middle; border-radius:5px}
.spk:hover{color:var(--blue); background:var(--blue-soft)}
.box-dots{display:inline-flex; gap:2px}
.box-dots i{width:6px; height:6px; border-radius:50%; background:var(--line-strong)}
.box-dots i.on{background:var(--green)}

/* flashcards */
.fc-wrap{max-width:560px; margin:0 auto}
.fc{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:34px 28px; text-align:center; min-height:260px; display:flex; flex-direction:column; justify-content:center; gap:10px; position:relative}
.fc .front{font-size:34px; font-weight:700; color:var(--ink); line-height:1.25}
.fc .front.en{font-size:24px}
.fc .back{border-top:1px dashed var(--line-strong); padding-top:14px; margin-top:6px}
.fc .back .a{font-size:22px; font-weight:700}
.fc .meta{font-size:13px; color:var(--ink-faint)}
.fc .lesson-tag{position:absolute; top:12px; left:14px; font-size:12px; color:var(--ink-faint)}
.fc-actions{display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap}
.fc-actions .btn{min-width:140px}
.stat-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:14px}

/* home */
.hero{display:grid; grid-template-columns:auto 1fr; gap:24px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px 26px; box-shadow:var(--shadow)}
.count{font-family:var(--f-display); font-weight:700; font-size:64px; line-height:1; color:var(--ink); letter-spacing:-.03em}
.count small{display:block; font-family:var(--f-body); font-size:14px; font-weight:400; color:var(--ink-soft); letter-spacing:0; margin-top:6px}
.week{font-size:18px}
.note{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--red); border-radius:0 12px 12px 0; padding:14px 18px}
.note .hand{font-size:24px; line-height:1.25; white-space:pre-wrap}
.todo{display:flex; flex-direction:column; gap:8px}
.todo-i{display:flex; gap:12px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--paper)}
.todo-i .t{flex:1; min-width:0}
.ready{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:10px}
.rl{border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--surface); text-align:left; border-width:1px}
.rl:hover{border-color:var(--blue)}
.rl .n{font-family:var(--f-display); font-size:12px; font-weight:700; color:var(--ink-faint)}
.rl .p{font-family:var(--f-display); font-size:20px; font-weight:700}
.rl.out{opacity:.4}
.grade{display:inline-grid; place-items:center; width:46px; height:46px; border:2px solid var(--red); border-radius:50%; font-family:var(--f-hand); font-size:32px; font-weight:700; color:var(--red); transform:rotate(-8deg); line-height:1}

/* alphabet */
.abc{display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:10px}
.lt{border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:10px 12px; text-align:left}
.lt:hover{border-color:var(--blue)}
.lt .L{font-family:var(--f-display); font-size:26px; font-weight:700}
.lt .s{font-size:13px; color:var(--ink-soft)}
.lt .x{font-size:13.5px; color:var(--blue)}
.lt.trap{border-color:var(--red); background:var(--red-soft)}
.lt .tr{font-size:12px; color:var(--red); font-weight:700}

/* exam */
.timer{font-family:var(--f-display); font-weight:700; font-size:20px}
.part-h{font-family:var(--f-display); font-size:15px; font-weight:700; margin:22px 0 10px}
.reading{font-size:17.5px; line-height:1.7; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin-bottom:12px}
.tf{display:flex; gap:10px; align-items:center; padding:7px 0; border-bottom:1px dashed var(--line); flex-wrap:wrap}
.tf .t{flex:1; min-width:180px}

/* tutor */
table.stats{width:100%; border-collapse:collapse; font-size:14.5px}
table.stats td,table.stats th{padding:7px 8px; border-bottom:1px solid var(--line); text-align:left}
table.stats th{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint)}
.fb{border-top:1px dashed var(--line-strong); margin-top:12px; padding-top:12px}
.sub{white-space:pre-wrap; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:12px 14px; font-size:16.5px; line-height:1.6}
.pill-btn{border:1.5px solid var(--line-strong); background:var(--paper); border-radius:99px; padding:3px 12px; font-weight:700}
.pill-btn.on{background:var(--red); border-color:var(--red); color:#fff}

/* keyboard */
.kbd-toggle{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:40; border:0; border-radius:99px; background:var(--ink); color:var(--paper); font-weight:700; padding:10px 16px; box-shadow:var(--shadow); font-size:15px}
.kbd{position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--surface); border-top:1px solid var(--line-strong); box-shadow:0 -8px 24px rgba(0,0,0,.12); padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.kbd-rows{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:5px}
.kbd-row{display:flex; gap:4px; justify-content:center}
.key{flex:1; max-width:52px; min-width:0; height:42px; border:1px solid var(--line-strong); border-radius:7px; background:var(--paper); font-size:18px; padding:0}
.key:active{background:var(--blue-soft)}
.key.w{max-width:120px; font-size:13px; font-weight:700}
.key.on{background:var(--blue); color:#fff}
.toast{position:fixed; left:50%; top:calc(16px + env(safe-area-inset-top,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:9px; font-size:14px; z-index:60; box-shadow:var(--shadow); max-width:calc(100% - 32px)}

@media (max-width:900px){
  .app{flex-direction:column}
  .rail{position:static; width:auto; height:auto; border-right:0; border-bottom:1px solid var(--line); padding:14px 16px 8px}
  .nav-scroll{display:flex; gap:4px; overflow-x:auto; padding-bottom:6px}
  .nav-scroll .nav-label{display:none}
  .nav-scroll .nav{width:auto; flex:none; white-space:nowrap}
  .nav-scroll .nav-meta{display:none}
  .brand-sub{margin-bottom:4px}
  .main{padding:20px 16px 120px}
  .main::before{display:none}
  .hero{grid-template-columns:1fr}
  .sheet{padding:18px 16px}
  .title{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 44 44"><path d="M22 3.5c10.5-.4 19 7.6 18.5 18.2-.5 10-8.6 18.6-19 18.4C11.3 39.9 3.6 31.6 4 21.4 4.4 11.8 12 5 23.8 4.6" fill="none" stroke="var(--red)" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span>5</span>
      </div>
      <div><div class="brand-name">Пятёрка</div></div>
    </div>
    <div class="brand-sub">Russian A1 · Jasno! neu · exam Wed 16 Dec</div>
    <div class="sync" id="sync"><span class="dot"></span><span id="sync-t">Connecting…</span></div>
    <div class="nav-scroll" id="nav"></div>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<button class="kbd-toggle" id="kbd-toggle" hidden>АБВ keyboard</button>

<h3>1 · No "to be" in the present</h3>
<p>Russian simply drops <em>am / is / are</em> in the present tense. The book calls this <span class="de">das Hilfsverb „sein“</span>.</p>
<table class="gt"><tr><td><i class="ru">Это Москва.</i></td><td>This <b>is</b> Moscow.</td></tr>
<tr><td><i class="ru">Я Анна.</i></td><td>I <b>am</b> Anna.</td></tr>
<tr><td><i class="ru">Кто это?</i></td><td>Who <b>is</b> this?</td></tr>
<tr><td><i class="ru">Что это?</i></td><td>What <b>is</b> this?</td></tr></table>
<p><b>кто</b> asks about people (and animals), <b>что</b> about things.</p>

<h3>2 · Questions are just intonation</h3>
<p>A yes/no question has the same word order as a statement. Only the voice rises on the word you're asking about. In writing, only the <b>?</b> changes.</p>
<table class="gt"><tr><td><i class="ru">Это Анна.</i></td><td>That's Anna.</td></tr><tr><td><i class="ru">Это Анна?</i></td><td>Is that Anna?</td></tr></table>

<h3>3 · Saying "no" and "not"</h3>
<p><b>нет</b> = no (the answer). <b>не</b> = not (goes right before the word it negates).</p>
<table class="gt"><tr><td><i class="ru">Это Анна? — Нет, это не Анна. Это Ольга.</i></td><td>Is that Anna? No, that's not Anna. That's Olga.</td></tr></table>

<h3>4 · ты vs. вы</h3>
<p><b>ты</b> = one person you know well (friend, kid, family). <b>вы</b> = polite "you" <em>or</em> any group. Your teacher is always <b>вы</b>. Greetings follow the same split: <i class="ru">Здравствуй!</i> (ты) vs. <i class="ru">Здравствуйте!</i> (вы). <i class="ru">Привет!</i> and <i class="ru">Пока!</i> are casual only.</p>

<h3>5 · Stress changes the sound</h3>
<p>Each word has one stressed vowel (the book marks it with an accent: <i class="ru">молоко́</i>). An <b>unstressed о sounds like "a"</b>: <i class="ru">молоко́</i> ≈ "ma-la-KO". This is why every word in this platform shows its stress mark. Learn it with the word. <span class="de">Betonung = stress</span></p>`,

<h3>1 · Pronouns: nominative and accusative</h3>
<p>Russian says "they call me …" instead of "my name is …". The person being called goes in the <b>accusative</b> (<span class="de">Akkusativ</span>).</p>
<table class="gt"><tr><th>Nominative</th><th>Accusative</th><th></th></tr>
<tr><td><i class="ru">я</i></td><td><i class="ru">меня</i></td><td><i class="ru">Меня зовут Лиза.</i></td></tr>

<tr><td><i class="ru">она</i></td><td><i class="ru">её</i></td><td><i class="ru">Её зовут Анна.</i></td></tr>
<tr><td><i class="ru">мы</i></td><td><i class="ru">нас</i></td><td></td></tr>

<h3>2 · Every noun has a gender, and the ending tells you</h3>
<table class="gt"><tr><th>Masculine</th><th>Neuter</th><th>Feminine</th></tr>
<tr><td>consonant / -ь / -й<br><i class="ru">фильм, кремль, музей</i></td><td>-о / -е<br><i class="ru">слово, море</i></td><td>-а / -я<br><i class="ru">фирма, неделя</i></td></tr></table>

<table class="gt"><tr><th>m / n</th><th>add -а / -я</th></tr>

<h3>4 · Nationality has two forms</h3>
<table class="gt"><tr><td><i class="ru">Он русский. Она русская.</i></td><td>He's Russian. She's Russian.</td></tr>
<tr><td><i class="ru">Он немец. Она немка.</i></td><td>He's German. She's German.</td></tr></table>
<p>Ask: <i class="ru">Кто вы по национальности?</i> Answer with your own gender form.</p>

<h3>5 · Formal names</h3>
<p>Russians address each other formally with first name + patronymic (<i class="ru">отчество</i>): <i class="ru">Анна Сергеевна, Игорь Андреевич</i>. That's the cue for <b>вы</b> and <i class="ru">ваши дела</i>. First name alone means <b>ты</b> and <i class="ru">твои дела</i>.</p>`,

  grammar:`
<h3>1 · Countries in -ия</h3>
<p>Feminine nouns ending in <b>-ия</b> take <b>-ии</b> in both genitive and prepositional:</p>
<table class="gt"><tr><th>Nominative</th><th>из + genitive</th><th>в + prepositional</th></tr>
<tr><td><i class="ru">Германия</i></td><td><i class="ru">из Германии</i></td><td><i class="ru">в Германии</i></td></tr>

<p class="tip">Foreign names ending in a vowel (except unstressed -а) never change: <i class="ru">из Токио, в Баку, в Хельсинки</i>. Same for <i class="ru">кафе, кино, метро, такси</i>: <i class="ru">в кафе, в метро</i>.</p>

<p>Verbs come in two families, named after the vowel in their endings (<span class="de">e-Konjugation / и-Konjugation</span>). Learn the <b>я</b>, <b>ты</b> and <b>они</b> forms and you can build the rest.</p>
<table class="gt"><tr><th></th><th>жить (е-conj.)</th><th>говорить (и-conj.)</th></tr>

<tr><td>вы</td><td><i class="ru">живёте</i></td><td><i class="ru">говорите</i></td></tr>

<p class="tip">The <b>ты</b> form always ends in <b>-шь</b>, with a soft sign. Leaving off the ь is the most common exam mistake here.</p>

<h3>3 · Where? = в / на + prepositional</h3>

<tr><td><i class="ru">Москва → в Москве</i></td><td><i class="ru">улица → на улице</i></td></tr>
<tr><td><i class="ru">море → на море</i></td><td><i class="ru">Россия → в России</i> (-ия → -ии)</td></tr></table>
<p><b>на</b> goes with streets, open spaces and some fixed words: <i class="ru">на улице, на море, на севере</i>. Learn those as a set.</p>

<h3>4 · Languages: по-русски</h3>
<p>With <i class="ru">говорить</i> use the adverb form: <i class="ru">Я говорю по-немецки, по-английски и немного по-русски.</i> How well: <i class="ru">свободно</i> (fluently), <i class="ru">хорошо</i>, <i class="ru">немного</i>, <i class="ru">плохо</i>, <i class="ru">к сожалению, не говорю</i>.</p>

<script>
// ============================================================
// Пятёрка: app logic
// Data: VOCAB (per lesson [ru, en, de, extra]), LESSONS, READINGS, ... from content.js
// Two shared db docs: p5/student (her progress, she writes) and p5/tutor (plan, notes, feedback, tutor writes).
// ============================================================
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STRESS = /́/g;
const norm = s => String(s||'').replace(STRESS,'').toLowerCase().replace(/ё/g,'е').replace(/[.,!?…:;"«»()]/g,' ').replace(/\s+/g,' ').trim();
const answers = a => Array.isArray(a) ? a : [a];
const isRight = (given, a) => answers(a).some(x => norm(x) === norm(given));
const uid = () => Math.random().toString(36).slice(2,9);
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const dayNum = (s=todayStr()) => Math.round(Date.parse(s+'T00:00:00Z')/864e5);
const fmtDate = s => new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
const pct = x => Math.round((x||0)*100);
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };

// ---------- words ----------
const WORDS = [];
Object.keys(VOCAB).forEach(L => VOCAB[L].forEach((w,i) => WORDS.push({id:L+'-'+i, L:+L, ru:w[0], en:w[1], de:w[2], x:w[3]})));
// Accepted typed answers for a headword: "Как вас / тебя зовут?" → both variants; "мой, моя" → each part.
function ruAnswers(ru){
  const base = ru.replace(/…/g,'').trim(); const out=[base];
  if(/ \/ /.test(base)){ const m=base.match(/(\S+) \/ (\S+)/); out.push(base.replace(m[0],m[1]), base.replace(m[0],m[2])); }
  if(base.includes(',')) out.push(...base.split(',').map(x=>x.trim()));
  return out;
}
const WORD = Object.fromEntries(WORDS.map(w => [w.id, w]));
const SRS_DAYS = [0, 1, 3, 7, 14, 30]; // interval after reaching box n

// ---------- state ----------
const DEF_STUDENT = () => ({ srs:{}, newLog:{}, quiz:{}, drill:{}, mistakes:[], writing:{}, mocks:[], hw:{}, read:{}, streak:{last:'', n:0}, _v:0 });
const DEF_TUTOR = () => ({ scope:[1,2,3,4,5,6,7,8,9], classAt:1, newPerDay:15, note:'', noteTs:0, weeks:DEFAULT_WEEKS.map(([d,f])=>({d,f})), homework:[], fb:{}, _v:0 });
const loadLocal = (k, def) => { try { const v = JSON.parse(localStorage.getItem(k)||'null'); return v ? Object.assign(def(), v) : def(); } catch(e){ return def(); } };
const saveLocal = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const S = { student: loadLocal('p5-student', DEF_STUDENT), tutor: loadLocal('p5-tutor', DEF_TUTOR), scratch: DEF_STUDENT() };
let role = 'student';          // becomes 'tutor' for the artifact owner
let preview = false;           // tutor looking at the student pages
const ui = (() => { try { return JSON.parse(localStorage.getItem('p5-ui')||'{}'); } catch(e){ return {}; } })();
const saveUi = () => { try { localStorage.setItem('p5-ui', JSON.stringify(ui)); } catch(e){} };
// Where practice gets recorded: her record for her, a throwaway scratch record for the tutor.
const P = () => role === 'tutor' ? S.scratch : S.student;
const T = () => S.tutor;
const inScope = L => T().scope.includes(L);

// ---------- sync (db capability, with localStorage as the always-on cache) ----------
const refs = {}; const timers = {}; const lastJSON = {};
let dbOK = false;
function setSync(t, cls){ const el=$('#sync'); el.className='sync '+cls; $('#sync-t').textContent=t; }
function save(which){
  if(which==='student' && role==='tutor') return; // tutor's own practice stays in scratch
  if(which==='tutor' && role!=='tutor') return;
  const obj = S[which]; obj._v = (obj._v||0)+1;
  saveLocal('p5-'+which, obj);
  if(!refs[which]) return;
  setSync('Saving…','ok busy');
  clearTimeout(timers[which]);
  timers[which] = setTimeout(async () => {
    const json = JSON.stringify(obj);
    if(json === lastJSON[which]) { setSync('Synced','ok'); return; }
    try { await refs[which].set(JSON.parse(json)); lastJSON[which]=json; setSync('Synced','ok'); }
    catch(e){ setSync('Saved on this device only','local'); }
  }, 700);
}
function adopt(which, data){
  if(!data) return false;
  if((data._v||0) <= (S[which]._v||0)) return false;
  const def = which==='student' ? DEF_STUDENT() : DEF_TUTOR();
  S[which] = Object.assign(def, data);
  lastJSON[which] = JSON.stringify(S[which]);
  saveLocal('p5-'+which, S[which]);
  return true;
}
async function initSync(){
  let db=null, user=null;
  try { if(window.claude && typeof window.claude.use==='function'){ [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } } catch(e){}
  try { if(user && await user.isOwner()) { role='tutor'; if(!location.hash) route='tutor'; } } catch(e){}
  if(!db){ setSync('Saved on this device only','local'); render(); return; }
  refs.student = db.doc('p5/student'); refs.tutor = db.doc('p5/tutor');
  try {
    for(const w of ['student','tutor']){
      const snap = await refs[w].get();
      const mine = (w==='student' && role!=='tutor') || (w==='tutor' && role==='tutor');
      if(snap.exists){
        const remote = snap.data();
        if(!adopt(w, remote) && mine && (S[w]._v||0) > (remote._v||0)) { await refs[w].set(S[w]); lastJSON[w]=JSON.stringify(S[w]); }
      } else if(mine && S[w]._v > 0){ await refs[w].set(S[w]); lastJSON[w]=JSON.stringify(S[w]); }
    }
    dbOK = true; setSync(role==='tutor' ? 'Synced · tutor view' : 'Synced','ok');
  } catch(e){ setSync('Saved on this device only','local'); render(); return; }
  for(const w of ['student','tutor']){
    refs[w].onSnapshot(snap => { if(snap.exists && adopt(w, snap.data())) softRender(); }, () => setSync('Saved on this device only','local'));
  }
  render();
}
// Never re-render under someone's cursor: wait until they leave the field.
let pendingRender=false;
function softRender(){
  const a=document.activeElement;
  if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT') && $('#main').contains(a)){ pendingRender=true; return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(() => { if(pendingRender && !$('#main').contains(document.activeElement)){ pendingRender=false; render(); } }, 50));

// ---------- speech ----------
let ruVoice=null;
function loadVoices(){ try { const vs=speechSynthesis.getVoices(); ruVoice = vs.find(v=>/^ru/i.test(v.lang)) || null; } catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
let warnedVoice=false;
function speak(t){
  if(!('speechSynthesis' in window)) return toast('This browser can\'t read aloud.');
  const u = new SpeechSynthesisUtterance(String(t).replace(STRESS,'').replace(/…/g,''));
  u.lang='ru-RU'; u.rate=.85; if(ruVoice) u.voice=ruVoice;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
  if(!ruVoice && !warnedVoice){ warnedVoice=true; setTimeout(()=>{ loadVoices(); if(!ruVoice) toast('No Russian voice found on this device. Add one in your system language settings for real pronunciation.'); }, 600); }
}
const SPK = '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>';
const spkBtn = t => `<button class="spk" data-say="${esc(t)}" aria-label="Hear it">${SPK}</button>`;

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3200); }

// ---------- progress maths ----------
function mastery(L){ const ws=WORDS.filter(w=>w.L===L); if(!ws.length) return 0; const r=P().srs; return ws.filter(w => r[w.id] && r[w.id][0]>=3).length / ws.length; }
function seenShare(L){ const ws=WORDS.filter(w=>w.L===L); const r=P().srs; return ws.filter(w=>r[w.id]).length/ws.length; }
function lessonReady(L, rec=P()){
  const q=rec.quiz[L]?.best||0, d=rec.drill[L]?.best||0;
  const ws=WORDS.filter(w=>w.L===L); const m = ws.filter(w => rec.srs[w.id] && rec.srs[w.id][0]>=3).length/ws.length;
  return .4*q + .3*d + .3*m;
}
function overall(rec=P()){ const sc=T().scope; if(!sc.length) return 0; return sc.reduce((a,L)=>a+lessonReady(L,rec),0)/sc.length; }
function gradeFor(x){ return x>=.9?['5','A']:x>=.75?['4','B']:x>=.6?['3','C']:['2','not yet']; }
function dueCards(){
  const r=P().srs, today=dayNum();
  return WORDS.filter(w => inScope(w.L) && r[w.id] && r[w.id][1] <= today);
}
function newCards(onlyL){
  const r=P().srs, t=todayStr();
  const left = Math.max(0, (T().newPerDay||15) - (P().newLog[t]||0));
  return WORDS.filter(w => (onlyL ? w.L===onlyL : inScope(w.L)) && !r[w.id]).slice(0, onlyL ? 20 : left);
}
function daysLeft(){ return dayNum(EXAM_DATE) - dayNum(); }
function thisWeek(){ const t=todayStr(); const ws=[...T().weeks].sort((a,b)=>a.d<b.d?-1:1); let cur=null; for(const w of ws){ if(w.d<=t) cur=w; } return cur || ws[0] || {d:todayStr(), f:'No plan set yet'}; }
function touchStreak(){
  const rec=P(), t=todayStr(); if(rec.streak.last===t) return;
  const y = new Date(Date.now()-864e5); const ys = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  rec.streak = {last:t, n: rec.streak.last===ys ? rec.streak.n+1 : 1};
}
function logMistake(src, q, given, right){
  const rec=P();
  const key = norm(q).slice(0,80);
  const ex = rec.mistakes.find(m => m.key===key);
  if(ex){ ex.n=(ex.n||1)+1; ex.given=given; ex.ts=Date.now(); }
  else rec.mistakes.unshift({key, src, q, given, right, ts:Date.now(), n:1});
  rec.mistakes = rec.mistakes.slice(0,150);
}

// ---------- routing ----------
let route = (location.hash||'#home').slice(1) || 'home';
let lessonTab = ui.lessonTab || 'grammar';
function go(r){ route=r; if(location.hash.slice(1)!==r) history.replaceState(null,'','#'+r); render(); $('#main').focus({preventScroll:true}); window.scrollTo({top:0}); }
window.addEventListener('hashchange', () => { const r=location.hash.slice(1)||'home'; if(r!==route){ route=r; render(); } });

// ---------- nav ----------
function renderNav(){
  const rec=P(); const due=dueCards().length;
  const item = (r, n, t, meta, extra='') => `<button class="nav ${route===r||route.startsWith(r+':')?'on':''} ${extra}" data-go="${r}">${n}<span class="nav-body"><span class="nav-t">${t}</span>${meta?`<span class="nav-meta">${meta}</span>`:''}</span></button>`;
  let h='';
  if(role==='tutor'){
    h += `<div class="nav-label">Tutor</div>`;
    h += item('tutor','<span class="nav-n">T</span>','Tutor desk', subsCount()? subsCount()+' to grade':'plan · progress · feedback');

    const r = lessonReady(l.n); const done = r>=.85;

  });

  h += item('mock','<span class="nav-n">✎</span>','Mock exam', rec.mocks.length? 'best '+pct(Math.max(...rec.mocks.map(m=>m.score/m.max)))+'%':'timed, like the real thing');
  h += item('mistakes','<span class="nav-n">!</span>','Mistake log', rec.mistakes.length? rec.mistakes.length+' to fix':'empty');
  h += item('abc','<span class="nav-n">А</span>','Alphabet','33 letters, sounds, traps');

}
function subsCount(){ const st=S.student, fb=T().fb; return Object.keys(st.writing||{}).filter(k => !fb[k] || fb[k].ts < st.writing[k].ts).length; }

function render(){
  renderNav();

  if(route==='cards') mountCard();

}

function vHome(){
  const rec=P(), T_=T(), dl=daysLeft(), wk=thisWeek(), due=dueCards().length, nw=newCards().length;
  const ov=overall(), [g,letter]=gradeFor(ov);
  const next = LESSONS.find(l => inScope(l.n) && lessonReady(l.n) < .85);
  const hw = T_.homework.filter(x=>!rec.hw[x.id]);

function nextStep(L){ const rec=P(); if(!rec.read[L]) return 'start with the grammar'; if(!rec.quiz[L]) return 'take the self-test'; if(!rec.drill[L]) return 'do the drill'; if(mastery(L)<.6) return 'learn the words'; return 'retake what\'s weakest'; }

// quiz: answers are kept in memory until the whole test is done
const quizRun = {};
function vQuiz(l){
  const run = quizRun[l.n] || (quizRun[l.n] = {ans:{}});
  const done = Object.keys(run.ans).length, total=l.quiz.length;
  let h = `<div class="sheet"><p class="muted">From the workbook (<b>Что правильно?</b>, end of the lesson). Pick the right form. You get the reason right after each answer.</p>
    <div class="row" style="margin-bottom:14px"><div class="bar" style="flex:1"><i style="width:${done/total*100}%"></i></div><span class="num faint">${done} / ${total}</span></div>`;
  h += l.quiz.map((q,i)=>{
    const a = run.ans[i];
    return `<div class="q"><div class="q-n">${i+1}</div><div class="q-p">${ruify(q[0])}</div><div class="opts">${q[1].map((o,j)=>{
      let c=''; if(a!==undefined){ if(j===q[2]) c='ok'; else if(j===a) c='bad'; }
      return `<button class="opt ${c}" data-act="qa" data-l="${l.n}" data-i="${i}" data-j="${j}" ${a!==undefined?'disabled':''}>${esc(o)}</button>`;}).join('')}</div>
      ${a!==undefined?`<div class="why">${a===q[2]?'<b style="color:var(--green)">Right.</b>':'<b style="color:var(--red)">Not quite.</b>'} ${esc(q[3])}</div>`:''}</div>`;
  }).join('');
  if(done===total){
    const sc = l.quiz.filter((q,i)=>run.ans[i]===q[2]).length;
    h += `<div class="score"><span class="big num">${sc}/${total}</span><span class="grade">${gradeFor(sc/total)[0]}</span><span class="muted">${sc===total?'Perfect. Move on to the drill.':sc/total>=.85?'Solid. Check the red ones, then the drill.':'Re-read the grammar box for the ones you missed, then retake.'}</span><button class="btn ghost" data-act="q-reset" data-l="${l.n}">Retake</button></div>`;
  }
  return h+'</div>';
}
function ruify(s){ // wrap Cyrillic runs so they are clickable/speakable, keep existing tags
  if(/<i class="ru">/.test(s)) return s;
  return s.split(/(<[^>]+>)/).map(p => p.startsWith('<') ? p : p.replace(/([А-Яа-яЁё][А-Яа-яЁё́\- ,…!?–—.]*[А-Яа-яЁё.!?…])/g, m=>`<i class="ru">${m}</i>`)).join('');
}

const drillRun = {};

      <span class="mark ${run.checked?(ok?'ok':'bad'):''}">${run.checked?(ok?'✓':'✗'):''}</span>
      ${run.checked&&!ok?`<div class="fix">→ ${esc(answers(d[1])[0])}</div>`:''}</div>`;

function grade(ok){
  const w = WORD[deck.cards[deck.i]], rec=P(), cur=rec.srs[w.id];

// ----- mock exam -----
const mock = {on:false};

  const qpool = shuffle(LESSONS.filter(l=>sc.includes(l.n)).flatMap(l=>l.quiz.map(q=>({L:l.n,q})))).slice(0,15);
  const dpool = shuffle(LESSONS.filter(l=>sc.includes(l.n)).flatMap(l=>l.drill.map(d=>({L:l.n,d})))).slice(0,10);
  const wpool = LESSONS.filter(l=>sc.includes(l.n) && l.write).map(l=>l.write);
  const w = wpool.length ? wpool[Math.floor(Math.random()*wpool.length)] : null;
  Object.assign(mock, {on:true, start:Date.now(), mins:60, readings:shuffle(readings).slice(0,2), qpool, dpool, w, ra:{}, qa:{}, da:{}, wtext:'', done:false});

      return `<div class="tf"><span class="t">${esc(it[0])}</span><button class="opt ${cls(true)}" data-act="m-r" data-k="${k}" data-v="1" ${mock.done?'disabled':''}>richtig</button><button class="opt ${cls(false)}" data-act="m-r" data-k="${k}" data-v="0" ${mock.done?'disabled':''}>falsch</button></div>`}).join(''); }); }
  h += `<div class="part-h">Teil 2 · Wählen Sie die richtige Antwort.</div>`;

let timerInt=null;
function tickTimer(){
  clearInterval(timerInt);
  const upd=()=>{ const el=$('#timer'); if(!el||!mock.on||mock.done){ clearInterval(timerInt); if(el&&mock.done) el.textContent=''; return; } const left=mock.start+mock.mins*6e4-Date.now(); const m=Math.max(0,Math.floor(left/6e4)), s=Math.max(0,Math.floor(left/1e3)%60); el.textContent=`${m}:${String(s).padStart(2,'0')} left`; el.style.color=left<5*6e4?'var(--red)':''; };
  upd(); timerInt=setInterval(upd,1000);
}
function submitMock(){
  let score=0, max=0; const byL={};
  const add=(L,ok)=>{ byL[L]=byL[L]||[0,0]; byL[L][1]++; if(ok) byL[L][0]++; };
  mock.readings.forEach(r=>r.items.forEach((it,i)=>{ max++; const ok=mock.ra[r.id+i]===it[1]; if(ok) score++; add(Math.max(...r.lessons),ok); }));
  mock.qpool.forEach(({L,q},i)=>{ max++; const ok=mock.qa[i]===q[2]; if(ok) score++; else logMistake('Mock · L'+L, q[0].replace(/<[^>]+>/g,' '), q[1][mock.qa[i]]??'(blank)', q[1][q[2]]); add(L,ok); });
  mock.dpool.forEach(({L,d},i)=>{ max++; const ok=isRight(mock.da[i]||'',d[1]); if(ok) score++; else logMistake('Mock · L'+L, d[0], mock.da[i]||'(blank)', answers(d[1])[0]); add(L,ok); });
  const weak = Object.entries(byL).filter(([L,[a,b]])=>a/b<.7).map(([L])=>'Lektion '+L).join(', ');
  const ts=Date.now();
  const rec=P(); rec.mocks.push({ts, score, max, byL}); rec.mocks=rec.mocks.slice(-20);
  if(mock.w && mock.wtext.trim() && role!=='tutor') rec.writing['mock-'+ts]={text:mock.wtext, ts, prompt:mock.w.prompt};
  touchStreak(); save('student');
  mock.done=true; mock.result={score,max,weak};
}

    // tutor
    case 'note-save': T().note=$('#t-note').value; T().noteTs=Date.now(); save('tutor'); toast('Pinned to her home page.'); break;
    case 'hw-add': { const tx=$('#hw-text').value.trim(); if(!tx) return; T().homework.push({id:uid(), text:tx, due:$('#hw-due').value||''}); save('tutor'); render(); break; }
    case 'hw-del': T().homework=T().homework.filter(x=>x.id!==a.dataset.id); save('tutor'); render(); break;
    case 'fb-grade': { const k=a.dataset.k; const ta=$('#fb-'+k); T().fb[k]=Object.assign({text:'',ts:0}, T().fb[k], {grade:a.dataset.g, text:ta?ta.value:(T().fb[k]?.text||'')}); render(); break; }
    case 'fb-save': { const k=a.dataset.k; T().fb[k]=Object.assign({}, T().fb[k], {text:$('#fb-'+k).value, ts:Date.now()}); save('tutor'); toast('Feedback sent.'); render(); break; }
  }
});
document.addEventListener('input', e => {
  const t=e.target;
  if(t.dataset.write){ try{ localStorage.setItem('p5-draft-'+t.dataset.write, t.value); }catch(err){} const c=$('#wc-'+t.dataset.write); if(c) c.textContent=(t.value.trim()?t.value.trim().split(/\s+/).length:0)+' words'; }
  if(t.dataset.drill){ const run=drillRun[+t.dataset.drill]; if(run) run.val[+t.dataset.i]=t.value; }
  if(t.dataset.mdrill) mock.da[+t.dataset.mdrill]=t.value;
  if(t.dataset.mwrite) mock.wtext=t.value;
});
document.addEventListener('change', e => {
  const t=e.target;
  if(t.dataset.scope){ const L=+t.dataset.scope; let sc=T().scope.filter(x=>x!==L); if(t.checked) sc.push(L); T().scope=sc.sort((a,b)=>a-b); save('tutor'); render(); }
  if(t.dataset.tset){ T()[t.dataset.tset]=+t.value; save('tutor'); renderNav(); }
  if(t.dataset.week!==undefined){ T().weeks[+t.dataset.week].f=t.value; save('tutor'); }
});
document.addEventListener('keydown', e => {
  if(e.key!=='Enter' || e.shiftKey) return;
  const t=e.target;
  if(t.id==='fc-in'){ e.preventDefault(); $('[data-act="pro-check"]:not([data-skip])')?.click(); return; }
  if(route==='cards' && deck && deck.reveal && t.tagName!=='INPUT' && t.tagName!=='TEXTAREA'){ const n=$('#next-btn'); if(n){ e.preventDefault(); n.click(); } return; }
  if(t.dataset.drill!==undefined){ e.preventDefault(); const nx=$(`#dr-${t.dataset.drill}-${+t.dataset.i+1}`); if(nx) nx.focus(); else $(`[data-act="d-check"][data-l="${t.dataset.drill}"]`)?.click(); }
  if(t.dataset.mdrill!==undefined){ e.preventDefault(); $(`#md-${+t.dataset.mdrill+1}`)?.focus(); }
  if(t.id==='hw-text'){ e.preventDefault(); $('[data-act="hw-add"]').click(); }
});
document.addEventListener('keydown', e => { // space reveals a flashcard
  if(route==='cards' && deck && deck.mode==='rec' && !deck.reveal && e.key===' ' && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); deck.reveal=true; mountCard(); }
});

// ---------- on-screen Cyrillic keyboard ----------
const KROWS = ['йцукенгшщзхъ','фывапролджэ','ячсмитьбюё'];
let kTarget=null, kShift=false, kOpen=false;
function drawKbd(){
  const up = s => kShift ? s.toUpperCase() : s;
  $('#kbd').innerHTML = `<div class="kbd-rows">${KROWS.map(r=>`<div class="kbd-row">${[...r].map(c=>`<button class="key" data-k="${up(c)}" tabindex="-1">${up(c)}</button>`).join('')}</div>`).join('')}
   <div class="kbd-row"><button class="key w ${kShift?'on':''}" data-k="SHIFT" tabindex="-1">Shift</button><button class="key w" data-k=" " tabindex="-1" style="max-width:260px">space</button><button class="key w" data-k="BK" tabindex="-1">⌫</button><button class="key w" data-k="HIDE" tabindex="-1">Hide</button></div></div>`;
}
document.addEventListener('focusin', e => {
  const t=e.target;
  if((t.tagName==='INPUT' && t.getAttribute('lang')==='ru') || (t.tagName==='TEXTAREA' && t.getAttribute('lang')==='ru')){ kTarget=t; $('#kbd-toggle').hidden = kOpen; }
});
$('#kbd-toggle').addEventListener('mousedown', e=>e.preventDefault());
$('#kbd-toggle').addEventListener('click', () => { kOpen=true; drawKbd(); $('#kbd').hidden=false; $('#kbd-toggle').hidden=true; kTarget?.focus(); });
$('#kbd').addEventListener('mousedown', e => e.preventDefault()); // keep focus in the field
$('#kbd').addEventListener('click', e => {
  const k=e.target.closest('[data-k]'); if(!k) return; const v=k.dataset.k;
  if(v==='HIDE'){ kOpen=false; $('#kbd').hidden=true; $('#kbd-toggle').hidden=false; return; }
  if(v==='SHIFT'){ kShift=!kShift; drawKbd(); return; }
  if(!kTarget || !document.body.contains(kTarget) || kTarget.readOnly) return;
  const s=kTarget.selectionStart ?? kTarget.value.length, en=kTarget.selectionEnd ?? s, val=kTarget.value;
  if(v==='BK'){ const from = s===en ? Math.max(0,s-1) : s; kTarget.value = val.slice(0,from)+val.slice(en); kTarget.setSelectionRange(from,from); }
  else { kTarget.value = val.slice(0,s)+v+val.slice(en); kTarget.setSelectionRange(s+v.length,s+v.length); if(kShift){ kShift=false; drawKbd(); } }
  kTarget.dispatchEvent(new Event('input',{bubbles:true}));
  kTarget.focus();
});

// ---------- boot ----------
render();
initSync();

</script>
