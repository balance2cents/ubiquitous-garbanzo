const VIEWS=[
  ['learn','Theory','nav-learn'],['drill','Mixed drill','nav-practice'],['topic','By topic','nav-practice'],['lab','Excel lab','nav-practice'],
  ['traps','Traps','nav-ref'],['calc','Calculator','nav-ref'],['formulas','Formula sheet','nav-ref'],
  ['map','Course map','nav-you'],['log','Mistake log','nav-you']
];
function acc(ids){let n=0,ok=0;ids.forEach(id=>{const s=S.stats[id];if(s){n+=s.n;ok+=s.ok;}});return {n,ok,p:n?ok/n:null};}
function renderNav(){
  const groups={'nav-learn':'','nav-practice':'','nav-ref':'','nav-you':''};
  VIEWS.forEach(([id,name,g])=>{
    let meta='';
    if(id==='drill')meta=S.answered?`${S.answered} done`:'';
    if(id==='lab')meta=String(Object.values(G).filter(g=>g.topic==='excel').length);
    if(id==='log')meta=S.misses.length?String(S.misses.length):'';
    if(id==='traps')meta=String(TRAPS.length);
    if(id==='learn')meta=`${LEARN.filter(l=>(S.read||{})[l.id]).length}/${LEARN.length} read`;
    groups[g]+=`<button data-view="${id}" ${current.view===id?'aria-current="page"':''}><span>${name}</span><span class="nav-meta">${meta}</span></button>`;
  });
  Object.entries(groups).forEach(([k,v])=>{$('#'+k).innerHTML=v;});
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));
  const days=Math.ceil((new Date('2027-01-04T00:00:00')-new Date())/864e5);
  $('#exam-count').textContent=days>0?`${days} days`:'Exam block is on';
}
function go(v){current.view=v;if(v==='drill'){current.session=[];current.q=null;}if(v==='topic'){current.q=null;}try{history.replaceState(null,'','#'+v);}catch(e){}render();window.scrollTo(0,0);}
function head(eyebrow,title,right=''){return `<div class="view-head"><div><div class="eyebrow">${eyebrow}</div><h1 class="view-title">${title}</h1></div>${right}</div>`;}
function render(){renderNav();({learn:vLearn,lab:vLab,drill:vDrill,topic:vTopic,traps:vTraps,calc:vCalc,formulas:vFormulas,map:vMap,log:vLog}[current.view]||vDrill)();}

function renderPips(){
  const el=$('#pips'); if(!el)return;
  const s=current.session, n=current.sessionSize;
  el.innerHTML=Array.from({length:n},(_,i)=>`<span class="pip ${i<s.length?(s[i]?'ok':'miss'):i===s.length&&!current.answered?'now':''}"></span>`).join('');
  $('#score').textContent=s.length?`${s.filter(Boolean).length} of ${s.length} correct`:'';
}
function vDrill(){
  $('#view').innerHTML=head('Practice','Mixed drill')+`<p class="lede">Every question type from weeks 2–13, with fresh numbers each time. Stuck on a topic? Read its chapter under Theory first. Types you miss come back more often. Types you get right three times in a row fade out.</p><div class="session"><span>Set of ${current.sessionSize}</span><span class="pips" id="pips"></span><span id="score"></span></div><div id="drill-body"></div>`;
  if(!current.q)newQuestion();
  renderDrillBody();
}
function renderDrillBody(){
  const el=$('#drill-body'); if(!el)return;
  el.innerHTML=questionHTML(); bindQuestion(); renderPips();
}
function renderSetDone(){
  const s=current.session, ok=s.filter(Boolean).length;
  const ids=Object.keys(G).filter(id=>S.stats[id]&&S.stats[id].n>=2).sort((a,b)=>(S.stats[a].ok/S.stats[a].n)-(S.stats[b].ok/S.stats[b].n));
  const weak=ids.slice(0,3).filter(id=>S.stats[id].ok<S.stats[id].n);
  $('#drill-body').innerHTML=`<div class="card done-card"><div class="eyebrow">Set done</div><div class="big">${ok}/${s.length}</div><p style="margin:10px auto 18px;max-width:46ch;color:var(--muted)">${ok===s.length?'Clean set. The mix now leans toward types you have seen least.':ok>=7?'Solid. Look at the weak spots below before the next set.':'Rough set. That is useful: the next one will lean hard on what you missed.'}</p>${weak.length?`<p style="font-size:13px;color:var(--faint);margin-bottom:6px">Weakest so far</p><div class="topics" style="justify-content:center">${weak.map(id=>`<button data-gen="${id}">${G[id].name} · ${Math.round(S.stats[id].ok/S.stats[id].n*100)}%</button>`).join('')}</div>`:''}<div class="actions" style="justify-content:center"><button class="btn btn-primary" id="again">Start another set</button></div></div>`;
  $('#again').onclick=()=>{current.session=[];newQuestion();renderDrillBody();};
  document.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>{current.view='topic';current.topic=G[b.dataset.gen].topic;current.gen=b.dataset.gen;current.q=null;render();});
  renderPips();
}

function vTopic(){
  const gens=Object.values(G).filter(g=>g.topic===current.topic);
  if(current.gen&&G[current.gen].topic!==current.topic)current.gen=null;
  $('#view').innerHTML=head('Practice','By topic')+`<p class="lede">Pick a week, then one question type to hammer, or "All of this topic" for a mix.</p>
  <div class="topics" role="group" aria-label="Topic">${TOPICS.map(t=>`<button data-topic="${t.id}" aria-pressed="${t.id===current.topic}">${t.week?'W'+t.week+' · ':''}${t.name}</button>`).join('')}</div>
  <div class="gen-list"><button class="gen" data-g="" aria-pressed="${!current.gen}"><span class="gen-name">All of this topic</span><span class="gen-sub">Weighted toward your weak spots</span>${meterHTML(acc(gens.map(g=>g.id)))}</button>${gens.map(g=>`<button class="gen" data-g="${g.id}" aria-pressed="${current.gen===g.id}"><span class="gen-name">${g.name}</span><span class="gen-sub">${g.sub}</span>${meterHTML(acc([g.id]))}</button>`).join('')}</div>
  <div id="drill-body"></div>`;
  document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{current.topic=b.dataset.topic;current.gen=null;current.q=null;vTopic();});
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{current.gen=b.dataset.g||null;current.q=null;vTopic();});
  if(!current.q||G[current.genId].topic!==current.topic||(current.gen&&current.genId!==current.gen))newQuestion();
  renderDrillBody();
}
function meterHTML(a){
  if(a.p===null)return `<span class="meter"><i style="width:0"></i></span><span class="gen-stat">not tried yet</span>`;
  const cls=a.p<0.5?'low':a.p<0.8?'mid':'';
  return `<span class="meter ${cls}"><i style="width:${Math.round(a.p*100)}%"></i></span><span class="gen-stat">${a.ok}/${a.n} correct · ${Math.round(a.p*100)}%</span>`;
}

  ${R('Binomial cdf: P(X ≤ x)',seq(K('2nd','k2'),K('VARS'),'(DISTR)',A,M('B:binomcdf('),M('n,p,x)')),'At least k: 1 − binomcdf(n,p,k−1). More than k: 1 − binomcdf(n,p,k).')}
  ${R('Expected value of a table',seq('x in L1, P in L2',A,M('sum(L1*L2)')),'Variance: '+M('sum(L2*(L1−E)²)')+' with E typed in.')}
  </div></div>`;
}

const LEARN=[
{id:'ch1',week:1,topic:null,title:'Excel for data analysis',mins:8,
 idea:'Excel is your lab notebook for the whole semester. You only need a handful of moves, and the most important one is the <b>$ sign</b>.',
 body:`
<h2 id="ch1-cells">Values and formulas</h2>
<p>Every cell holds either a <b>value</b> (text, a date, a number) or a <b>formula</b>, which always starts with <code class="x">=</code>. Columns are letters and rows are numbers, so the top-left cell is <code class="x">A1</code>.</p>
<h2 id="ch1-refs">Relative and absolute references</h2>
<p>This is the one Excel idea you can’t skip, because every solution spreadsheet in this course depends on it.</p>
<ul>
<li><code class="x">A1</code> is <b>relative</b>. Copy the formula one row down and it becomes <code class="x">A2</code>.</li>
<li><code class="x">$A$1</code> is <b>absolute</b>. It stays <code class="x">A1</code> wherever you copy it.</li>
<li><code class="x">A$1</code> locks only the row, and <code class="x">$A1</code> locks only the column.</li>
</ul>
${ex('From the week 5 solution sheet',`<p>To index a GDP series to its first year, cell D5 holds <code class="x">=C5/$C$5*100</code>. Drag it down and D6 becomes <code class="x">=C6/$C$5*100</code>: the numerator moves with you and the base stays fixed. That is exactly what an index is.</p>`)}
<h2 id="ch1-fill">Filling and random numbers</h2>
<p>Drag the small square at the bottom right of a cell (the fill handle), or select a range and press <b>Ctrl+D</b> (German Excel: Ctrl+U) to fill down. <code class="x">=RAND()</code> (German: <code class="x">ZUFALLSZAHL()</code>) gives a random number between 0 and 1. It changes every time the sheet recalculates (F9). To freeze the numbers, copy them and paste them as values. You will need this in week 12 (simulation).</p>
<h2 id="ch1-fns">The functions you will actually use</h2>
<div class="tbl-wrap"><table class="ref"><thead><tr><th>Job</th><th>English</th><th>German</th></tr></thead><tbody>
<tr><td>Add up</td><td class="f">SUM</td><td class="f">SUMME</td></tr>
<tr><td>Multiply row by row, then add</td><td class="f">SUMPRODUCT</td><td class="f">SUMMENPRODUKT</td></tr>
<tr><td>Look up a value in a table</td><td class="f">XLOOKUP / VLOOKUP</td><td class="f">XVERWEIS / SVERWEIS</td></tr>
<tr><td>If–then</td><td class="f">IF</td><td class="f">WENN</td></tr>
<tr><td>Count matching cells</td><td class="f">COUNTIF</td><td class="f">ZÄHLENWENN</td></tr>
</tbody></table></div>
<p><b>SUMPRODUCT</b> is the workhorse. A weighted mean is <code class="x">=SUMPRODUCT(values, weights)/SUM(weights)</code>, and the same pattern shows up again for variance, Laspeyres and covariance.</p>
<h2 id="ch1-pivot">Pivot tables and Solver</h2>
<p>A <b>pivot table</b> summarizes a long list without formulas: drag "Canton" to Columns, "Revenue" to Values and "Date" to Rows, and you get revenue per canton per month. It never changes the original data. <b>Solver</b> searches for the input value that makes a formula hit a target. Both are covered in the week 1 video. Know what they do; you won’t need to do them by hand in a written exam.</p>`,
 gloss:[['Formula','Formel','A cell entry starting with =, calculated by Excel.'],['Absolute reference','Absoluter Bezug','A reference with $ that does not move when copied.'],['Pivot table','Pivot-Tabelle','A summary table built by dragging fields, without formulas.']],
 check:[['In D5 you type <code class="x">=C5/$C$5*100</code> and drag it down to D6. What does D6 contain?',['=C6/$C$5*100','=C6/$C$6*100','=C5/$C$5*100','=D6/$C$5*100'],0,'The relative part (C5) moves down one row. The absolute part ($C$5) stays.']]},

{id:'ch2',week:2,topic:'basics',title:'Basics and terminology',mins:15,
 idea:'Before you calculate anything, ask <b>what kind of data</b> you have. The scale of the data decides which calculations are even allowed.',
 body:`
<h2 id="ch2-words">The vocabulary</h2>
<p>Lectures move fast through these words, and everything later is built on them.</p>
<ul>
<li><b>Statistics</b> is the science of collecting, preparing, analyzing and interpreting numerical data. <b>A statistic</b> is one result of that, such as a table, a chart or a number like the average.</li>
<li>The <b>population</b> is the set of all elements you care about: all residents of Switzerland, all stock market crashes since 1900.</li>
<li>An <b>attribute</b> (also called a variable or characteristic) is what you measure on each element, for example body height or gender. Each element has a <b>value</b> of that attribute.</li>
<li>The <b>frequency distribution</b> says how often each value occurs. <b>Absolute frequency</b> N<sub>i</sub> is a count. <b>Relative frequency</b> w<sub>i</sub> = N<sub>i</sub> / N is a share of the total.</li>
</ul>
${ex('Example 2.1',`<p>Fall 2017, HSLU had N = 5 611 students, of which N<sub>2</sub> = 1 768 were in Business. Relative frequency: w<sub>2</sub> = 1 768 / 5 611 = 31.51%.</p>`)}
<h2 id="ch2-scales">The four scales</h2>
<p>Run through these three questions in order. Where you stop is the scale.</p>
<ol class="ladder">
<li><span class="lq">Can the values be put in a meaningful order?</span><span class="la">No → <b>nominal</b>. Car color, marital status, gender. Numbers used as codes (1 = single, 2 = married) are just labels.</span></li>
<li><span class="lq">Are the distances between values meaningful?</span><span class="la">No → <b>ordinal</b>. Customer satisfaction, school level, price category. "Good" is better than "satisfactory", but by how much is undefined.</span></li>
<li><span class="lq">Is there a natural zero, so that "twice as much" makes sense?</span><span class="la">No → <b>interval</b>. Temperature in °C, calendar years. 60 °C is not twice as hot as 30 °C (in °F it’s 140 vs 86).<br>Yes → <b>ratio</b>. Income, age, number of employees. CHF 2 million really is twice CHF 1 million.</span></li>
</ol>
<p>The scales form a <b>hierarchy</b>: nominal &lt; ordinal &lt; interval &lt; ratio. A method that works on one level also works on every higher level, never on a lower one. When you combine attributes, the lowest scale involved decides.</p>
${note('<b>Why you care:</b> the mean is only meaningful for interval and ratio data, and percentage changes only for ratio data. Getting the scale wrong means using a forbidden method.')}
<h2 id="ch2-more">Metric, discrete, continuous</h2>
<p><b>Metric</b> (= quantitative) means interval or ratio: measured in a unit. <b>Non-metric</b> (= qualitative) means nominal or ordinal. Metric attributes are either <b>discrete</b> (only specific values, like the number of children: 1.5 children makes no sense) or <b>continuous</b> (any value on a scale, like weight, distance or time).</p>
<h2 id="ch2-tables">Tables</h2>
<p>A <b>frequency table</b> lists each value with its absolute and/or relative frequency, plus a total and a source. Continuous data is grouped into classes written as <b>"from … to under …"</b>, for example "20 000 to under 50 000". A <b>contingency table</b> (cross-tab) shows two attributes at once.</p>
<p>Official statistics use three symbols you may see in a table: <b>.</b> means the number can’t exist (conceptually impossible), <b>–</b> means zero, and <b>0</b> means more than nothing but less than half the counting unit.</p>
<h2 id="ch2-charts">Which chart for what</h2>
<div class="tbl-wrap"><table class="ref"><thead><tr><th>Chart</th><th>Use it for</th><th>Watch out</th></tr></thead><tbody>
<tr><td>Clustered column</td><td>Comparing components side by side</td><td>Total not visible; messy with many components</td></tr>
<tr><td>Stacked column</td><td>Proportions within each total</td><td>Only the bottom segment’s changes are easy to read</td></tr>
<tr><td>Bar (horizontal)</td><td>Long category labels</td><td>Start the axis at 0, or differences look bigger than they are</td></tr>
<tr><td>Pie</td><td>How a whole splits into parts</td><td>Relative frequencies only</td></tr>
<tr><td>Line</td><td>Time series</td><td>The y-scale can exaggerate; use a log scale for relative changes</td></tr>
</tbody></table></div>
<p>3D effects are discouraged because they make values harder to read.</p>
<h2 id="ch2-sigma">The summation sign Σ</h2>
<p>Σ<sub>i=m</sub><sup>n</sup> x<sub>i</sub> means: start with i = m, add x<sub>i</sub>, increase i by 1, and stop after i = n. That’s all. Two rules cover nearly everything:</p>
<div class="eq">Σ c·x<sub>i</sub> = c · Σ x<sub>i</sub>   (constants come out of the sum)</div>
<div class="eq">Σ (x<sub>i</sub> − a)² = Σ x<sub>i</sub>² − 2a Σ x<sub>i</sub> + n·a²</div>
${ex('Exercise 2.1 (x = 3, 5, 9, 13 and w = 0.1, 0.4, 0.3, 0.2)',`<p>Σ x<sub>i</sub> = 30. Σ x<sub>i</sub>/4 = 7.5. Σ (x<sub>i</sub> − 2)² = 1 + 9 + 49 + 121 = 180. Σ w<sub>i</sub>x<sub>i</sub> = 0.3 + 2.0 + 2.7 + 2.6 = 7.6. Since the weights sum to 1, the last one is already a weighted mean.</p>`)}`,
 gloss:[['Population','Grundgesamtheit','All elements you want to describe.'],['Attribute / variable','Merkmal','What you measure on each element.'],['Value','Merkmalsausprägung','The specific result for one element.'],['Absolute frequency','Absolute Häufigkeit','A count, N<sub>i</sub>.'],['Relative frequency','Relative Häufigkeit','A share, N<sub>i</sub> / N.'],['Nominal / ordinal scale','Nominal- / Ordinalskala','No order / order without distances.'],['Interval / ratio scale','Intervall- / Verhältnisskala','Distances meaningful; ratio also has a true zero.'],['Contingency table','Kontingenztafel','A table of two attributes at once.']],
 check:[['Year of birth (e.g. 1990) is measured on which scale?',['Interval','Ratio','Ordinal','Nominal'],0,'Differences between years make sense, but year 0 is a convention, so "twice as late" is meaningless.'],
  ['Which statement is true?',['You can compute a median for ordinal data.','You can compute a mean for ordinal data.','Percentage changes are fine for interval data.','Nominal data has a natural order.'],0,'Ordinal data can be sorted, so it has a middle value. It can’t be added up, so no mean.'],
  ['Which chart is best for the monthly unemployment count over 10 years?',['Line chart','Pie chart','Stacked column chart','Bar chart'],0,'Development over time is a time series, which belongs in a line chart.']]},

{id:'ch3',week:3,topic:'loc',title:'Measures of location',mins:20,
 idea:'Summarize "where the data sits" in one number. The <b>mean</b> is the balance point, and the <b>median</b> is the person in the middle. When the two disagree, that disagreement itself tells you something.',
 body:`
<h2 id="ch3-mean">The arithmetic mean</h2>
<p>Add all values and divide by how many there are:</p>
<div class="eq">x̄ = (1/n) · Σ x<sub>i</sub></div>
<p>Only for metric data. You can’t add "satisfied" and "dissatisfied".</p>
${ex('Example 3.1',`<p>Five stores ask 6.60, 6.80, 6.20, 6.50 and 7.20 CHF. Average asking price: x̄ = 33.30 / 5 = <b>6.66</b>.</p>`)}
<h2 id="ch3-wmean">The weighted mean: who is the observation?</h2>
<p>This is the idea that trips people up. In the example above, each <b>store</b> counted once. But what if you ask what the average <b>customer</b> paid? Then each <b>unit sold</b> is an observation, and a store that sold 350 units must count 350 times.</p>
<div class="eq">x̄ = Σ N<sub>i</sub>·x<sub>i</sub> / Σ N<sub>i</sub> = Σ w<sub>i</sub>·x<sub>i</sub></div>
${ex('Example 3.1 continued',`<p>The stores sold 200, 150, 350, 220 and 80 units. The cheapest store (6.20) sold the most, so the average price paid drops:</p><div class="eq">(6.60·200 + 6.80·150 + 6.20·350 + 6.50·220 + 7.20·80) / 1 000 = 6.52</div><p>Same prices, different question, different answer. Always ask yourself what counts as one observation.</p>`)}
<p><b>Grouped data:</b> when you only know classes ("20 000 to under 50 000"), use each class <b>midpoint</b> as its value. An open class ("200 000 and more") has no midpoint, so you need an assumption. The notes assume 500 000 and get an average Lucerne income of <b>CHF 62 762</b>.</p>
<h2 id="ch3-median">The median</h2>
<p><b>Sort</b> the data, then take the value in the middle: position (n + 1)/2. If n is even, that position falls between two values, so average them.</p>
${ex('From the slides',`<p>1, 1, 2, 4, 5, 6, 6, 7 has n = 8, so position 4.5. Average the 4th and 5th values: (4 + 5)/2 = <b>4.5</b>.</p>`)}
${ex('Example 3.3: median price paid',`<p>Sorted by price with units: 6.20 (350), 6.50 (220), 6.60 (200), 6.80 (150), 7.20 (80). There are 1 000 units, so the median is between the 500th and 501st. The first 350 paid 6.20; units 351 to 570 paid 6.50. Both the 500th and 501st paid <b>6.50</b>.</p>`)}
<h2 id="ch3-outliers">Why have two measures?</h2>
<p>The mean uses every value, so one extreme value drags it. The median only cares about position, so it doesn’t move. Try it:</p>
${W('meanmed')}
<p>The slides’ village example makes the same point: 199 people earn CHF 60 000 and one earns CHF 100 million. The mean is CHF 559 700, which describes nobody. The median is CHF 60 000.</p>
<h2 id="ch3-grouped">Median of grouped data: interpolation</h2>
<p>With classes you don’t know the individual values, so you can’t point at "the middle person". Instead you <b>assume the values are spread evenly within each class</b> and walk along the class until you reach 50%.</p>
<ol>
<li>Compute the cumulative relative frequencies.</li>
<li>Find the <b>median class</b>: the first class where the cumulative share reaches 50%.</li>
<li>Go into that class as far as you still need:</li>
</ol>
<div class="eq">median = lower bound + (50% − cumulative share before the class) / (share of the class) · class width</div>
${ex('Example 3.4: Lucerne incomes',`<p>20% earn under 20 000, and 56.31% earn under 50 000. So the median is in "20 000 to under 50 000". You need 30 more percentage points out of the 36.31 that class contains:</p><div class="eq">20 000 + (50% − 20%) / 36.31% · 30 000 = 44 780</div><p>That’s also what Excel’s <code class="x">TREND</code> does: a straight line between the two class bounds.</p>`)}
<p>Geometrically, you are reading a value off the cumulative curve. Move the slider:</p>
${W('ogive')}
<p>The calculator’s 1-Var Stats median only works for raw data. For classes, use the formula. The week 3 slides warn about exactly this.</p>
<h2 id="ch3-quantiles">Quantiles</h2>
<p>The median is the value not exceeded by 50% of observations. Replace 50% by any p and you get the <b>p-quantile</b>. Some have names: 25% = <b>1st quartile</b>, 75% = <b>3rd quartile</b>, 10% = <b>1st decile</b>, and percentiles go in 1% steps. For grouped data, use the same interpolation with p instead of 50%.</p>
${ex('Example 3.5: Lucerne',`<p>1st quartile = 20 000 + (25 − 20)/36.32 · 30 000 = <b>24 130</b>. 3rd quartile = 50 000 + (75 − 56.31)/33.38 · 50 000 = <b>77 996</b>. 90% quantile = 100 000 + (90 − 89.69)/8.15 · 100 000 = <b>103 804</b>.</p>`)}
<h2 id="ch3-skew">Skewness: reading mean vs median</h2>
<ul>
<li><b>Right-skewed</b>: mean &gt; median. A long tail of large values pulls the mean up. Incomes are the textbook case (Lucerne: mean 62 762, median 44 780).</li>
<li><b>Left-skewed</b>: mean &lt; median.</li>
<li><b>Symmetric</b>: mean = median.</li>
</ul>
<h2 id="ch3-which">Which measure when?</h2>
<div class="tbl-wrap"><table class="ref"><thead><tr><th>Data</th><th>Allowed</th></tr></thead><tbody>
<tr><td>Nominal</td><td>Frequencies only (which value is most common)</td></tr>
<tr><td>Ordinal</td><td>Median and quantiles</td></tr>
<tr><td>Metric</td><td>Mean, median, quantiles. Prefer the median when there are outliers or strong skew.</td></tr>
</tbody></table></div>`,
 gloss:[['Arithmetic mean','Arithmetisches Mittel','Sum divided by count.'],['Weighted mean','Gewichtetes Mittel','Each value counted by its frequency.'],['Median','Median / Zentralwert','The middle value of sorted data.'],['Class midpoint','Klassenmitte','(lower + upper bound) / 2.'],['Cumulative frequency','Kumulierte Häufigkeit','Share of observations up to and including a value or class.'],['Quartile / decile','Quartil / Dezil','25% steps / 10% steps.'],['Right-skewed','Rechtsschief','Long tail to the right; mean > median.'],['Linear interpolation','Lineare Interpolation','Reading a value off a straight line between two known points.']],
 check:[['A shop chain wants the average price its customers actually paid. Which do you use?',['Mean weighted by units sold','Plain mean of the store prices','Median of the store prices','The most common price'],0,'Each unit sold is one purchase, so it must count once. That is the weighted mean.'],
  ['Mean income in a town is CHF 71 000, the median is CHF 52 000. The distribution is…',['right-skewed','left-skewed','symmetric','impossible to tell'],0,'Mean > median means a long right tail (a few very high incomes).'],
  ['For grouped income data, the median class is "50 000 to under 80 000". The median is…',['interpolated inside that class','always 65 000, the midpoint','always 50 000, the lower bound','the value 1-Var Stats shows for the midpoints'],0,'Use lower bound + (50% − cum. before) / share · width. The midpoint is only right by coincidence.']]},

{id:'ch4',week:4,topic:'disp',title:'Measures of dispersion',mins:20,
 idea:'Two data sets can have the <b>same average</b> and tell completely different stories. Dispersion measures how far the values spread around the center, and in finance that spread is called <b>risk</b>.',
 body:`
<p>The notes open with a pill factory calibrated to 100 mg. If quality control only checks the average, half the pills could contain 50 mg and half 150 mg, and the average would still be perfect. Dispersion is what catches that.</p>
<h2 id="ch4-four">Four classes, one average</h2>
<p>Example 4.1 uses four classes of 100 students. All four have an average grade of 4.5, yet they look nothing alike. Click through them and watch the measures:</p>
${W('grades')}
<h2 id="ch4-range">Range</h2>
<div class="eq">range = maximum − minimum</div>
<p>Easy, but it only looks at the two extremes. Class B has range 5.0 only because of one student with a 1.0. Without that outlier, A and B look almost the same.</p>
<h2 id="ch4-iqr">Interquartile range (IQR)</h2>
<div class="eq">IQR = 3rd quartile − 1st quartile</div>
<p>The spread of the <b>middle 50%</b>, so outliers don’t affect it. With a frequency table of individual values (like grades), read the quartiles off the cumulative shares: Q1 is the first value where the cumulative share reaches 25%, Q3 the first that reaches 75%.</p>
${ex('Example 4.3: class A',`<p>Cumulative shares: grade 3.5 → 7%, grade 4.0 → 32%, grade 4.5 → 68%, grade 5.0 → 92%. Q1 = <b>4.0</b> (first to reach 25%) and Q3 = <b>5.0</b> (first to reach 75%), so IQR = 1.0. Class D has IQR = 0 because 55 of 100 students got exactly 4.5. The IQR simply can’t see its spread.</p>`)}
<p>For raw data in Excel, use <code class="x">PERCENTILE.EXC</code> (German: <code class="x">QUANTIL.EXKL</code>). The calculator’s Q1 and Q3 are for raw data only, never for grouped data.</p>
<h2 id="ch4-box">The boxplot</h2>
<p>One picture showing median, IQR and range: the <b>box</b> runs from Q1 to Q3, the line inside is the median, and the <b>whiskers</b> reach to the min and max. Rule of thumb for outliers: a value more than <b>1.5 × IQR</b> beyond the box is drawn as a separate dot. You can see this for class B in the figure above.</p>
<h2 id="ch4-var">Variance: averaging the deviations, properly</h2>
<p>Natural idea: compute each value’s deviation from the mean, x<sub>i</sub> − x̄, and average them. Problem: they <b>always add up to zero</b>, because the positives and negatives cancel. That’s the definition of the mean as the balance point. Two ways out:</p>
<ul>
<li>Average the <b>absolute</b> deviations. For class A that gives 0.4. Intuitive, but awkward to compute with, so it’s rarely used.</li>
<li>Average the <b>squared</b> deviations. That is the <b>variance</b>. Its square root brings you back to the original unit: the <b>standard deviation</b>.</li>
</ul>
<div class="eq">σ² = (1/n) · Σ (x<sub>i</sub> − x̄)²     σ = √σ²</div>
${ex('Example 4.4: class A',`<p>Mean 4.5. Weighting each squared deviation by its frequency: Σ N<sub>i</sub>(x<sub>i</sub> − x̄)² = 28.5 over n = 100 students. σ² = 28.5/100 = <b>0.285</b>, σ = <b>0.534</b>.</p>`)}
<p>Units: the variance has squared units (CHF²), and the standard deviation has the same unit as the data (CHF). That’s why people quote σ.</p>
<h2 id="ch4-s">σ or s? The course’s rule</h2>
<p>The formula above is only right if your data is the <b>whole population</b>. Usually you have a <b>sample</b>, and then dividing by n systematically underestimates the true spread. The fix is to divide by n − 1:</p>
<div class="eq">s² = 1/(n − 1) · Σ (x<sub>i</sub> − x̄)²     s = √s²</div>
<p>The notes call s the <b>empirical</b> (or sample) standard deviation.</p>
<div class="tbl-wrap"><table class="ref"><thead><tr><th></th><th>Population σ</th><th>Empirical / sample s</th></tr></thead><tbody>
<tr><td>Divide by</td><td>n</td><td>n − 1</td></tr>
<tr><td>Use when</td><td>Complete survey (e.g. every taxpayer in a city)</td><td>A sample, or the question says "empirical"</td></tr>
<tr><td>Excel</td><td class="f">VAR.P · STDEV.P (DE: STABW.N)</td><td class="f">VAR.S · STDEV.S (DE: STABW.S)</td></tr>
<tr><td>TI-84</td><td>σx in 1-Var Stats</td><td>Sx, stdDev(, variance(</td></tr>
</tbody></table></div>
${note('<b>With frequencies, n is the total count, not the number of rows.</b> Example 4.5: five stores but 1 000 units sold, so n − 1 = 999, and s = √(85.944/999) = 0.29. On the calculator, L2 must hold <b>absolute</b> frequencies, because it sets n = sum of L2. If you put relative weights there, n = 1 and s is nonsense.')}
<p>For large n, σ and s are almost equal. For the Lucerne incomes (n = 37 573, a complete survey) the notes use σ = CHF 75 057.</p>
<h2 id="ch4-cv">Coefficient of variation</h2>
<div class="eq">v = σ / x̄</div>
<p>The standard deviation grows with the level of the data. A CHF 0.29 spread is huge for a CHF 1 item and nothing for a CHF 1 000 item. Dividing by the mean removes the level and the unit, so you can compare anything.</p>
${ex('Prices vs incomes',`<p>Prices: v = 0.29 / 6.52 = <b>4.45%</b>. Lucerne incomes: v = 75 057 / 62 762 = <b>119.59%</b>. Incomes are far more spread out, relative to their level.</p>`)}
<h2 id="ch4-trans">Shifting and scaling (Exercise 3b–d)</h2>
<ul>
<li><b>Everyone gets + CHF 10 000:</b> the mean moves up by 10 000. Every value moves together, so the deviations don’t change and <b>σ stays the same</b>. The CV falls.</li>
<li><b>Everyone gets + 10%:</b> the mean and σ are both multiplied by 1.1 (the variance by 1.1²). The <b>CV stays the same</b>.</li>
</ul>`,
 gloss:[['Dispersion / spread','Streuung','How far values scatter around the center.'],['Range','Spannweite','Max − min.'],['Interquartile range','Interquartilsabstand','Q3 − Q1.'],['Variance','Varianz','Average squared deviation from the mean.'],['Standard deviation','Standardabweichung','Square root of the variance.'],['Empirical / sample SD','Empirische Standardabweichung','Divides by n − 1.'],['Coefficient of variation','Variationskoeffizient','σ / x̄, no unit.'],['Outlier','Ausreisser','Value far from the rest; boxplot rule 1.5 × IQR.']],
 check:[['You survey 40 customers about waiting times. Which standard deviation do you report?',['The empirical s (÷ n − 1)','The population σ (÷ n)','Either, they are identical','The variance'],0,'40 customers are a sample of all customers, so use s.'],
  ['On the TI-84 you enter grades in L1 and relative frequencies (0.25, 0.40, …) in L2, then run stdDev(L1,L2). What happens?',['Nonsense: the calculator takes n = sum of L2 = 1','You get σ','You get s','You get the variance'],0,'L2 must contain absolute counts. The notes warn about exactly this.'],
  ['Everyone’s income rises by CHF 5 000. The standard deviation…',['stays the same','rises by 5 000','rises by 5%','falls'],0,'Every value and the mean move by the same amount, so deviations are unchanged.']]},

{id:'ch5',week:5,topic:'idx',title:'Indices',mins:18,
 idea:'Rescale a series so that one moment equals <b>100</b>. After that, every number reads as "percent of then", and series with completely different units become comparable.',
 body:`
<h2 id="ch5-simple">The simple index</h2>
<div class="eq">I<sub>t</sub> = X<sub>t</sub> / X<sub>0</sub> · B     (usually B = 100)</div>
<p>X<sub>0</sub> is the value in the <b>reference period</b> (base year). Every other value is divided by it.</p>
${ex('Example 5.1: Swiss real GDP',`<p>GDP was 447 604 (CHF million) in 1990 and 661 184 in 2016. With base 1990: I<sub>2016</sub> = 661 184 / 447 604 · 100 = <b>147.72</b>. You can read the growth straight off: +47.72% since 1990.</p>`)}
<h2 id="ch5-pct">Percent changes from any index</h2>
<p>The percent change between two periods is new / old − 1. It doesn’t matter which base the index uses, because the base cancels:</p>
<div class="eq">623 737 / 617 231 − 1 = 139.35 / 137.90 − 1 = 123.64 / 122.35 − 1 = 1.05%</div>
${note('<b>Points are not percent.</b> An index going from 102.50 to 128.75 rose by 26.25 <b>points</b> but by 128.75 / 102.50 − 1 = <b>25.61%</b>. Points and percent only match when you start from exactly 100.')}
<p>Here is the same GDP series. Pick any year as the base: the numbers change, but the shape of the line and every ratio between years stays the same.</p>
${W('rebase')}
<h2 id="ch5-lasp">The Laspeyres price index</h2>
<p>To track the price of many goods at once, fix a <b>basket</b>: the quantities N<sup>(i)</sup> people bought in the base period. Then each period, ask what that same basket costs at today’s prices.</p>
<div class="eq">I<sub>t</sub> = Σ N<sup>(i)</sup>·p<sub>t</sub><sup>(i)</sup> / Σ N<sup>(i)</sup>·p<sub>0</sub><sup>(i)</sup> · 100</div>
<p>Only the prices change; the quantities are frozen at the base. That’s what makes it Laspeyres. (A Paasche index would update the quantities, but this course doesn’t cover it.)</p>
${ex('Example 5.2',`<p>Basket: 18 units of good 1, 340 m of good 2, 520 kg of good 3. Prices in month 0: 31, 11, 8.7. In month 2: 55, 20, 9.0.</p><div class="eq">I<sub>2</sub> = (18·55 + 340·20 + 520·9.0) / (18·31 + 340·11 + 520·8.7) · 100 = 141.4</div><p>The basket became 41.4% more expensive.</p>`)}
<p><b>The same thing, seen differently:</b> the Laspeyres index is a <b>weighted average of the simple price indices</b>, where the weights are each good’s share of the basket’s value in the base period.</p>
<div class="eq">I<sub>t</sub> = Σ w<sub>0</sub><sup>(i)</sup> · I<sub>t</sub><sup>(i)</sup>     with  w<sub>0</sub><sup>(i)</sup> = N<sup>(i)</sup>p<sub>0</sub><sup>(i)</sup> / Σ N p<sub>0</sub></div>
${ex('Example 5.3',`<p>Base values: 558, 3 740, 4 524 (total 8 822), so the weights are 6.33%, 42.39% and 51.28%. Simple indices in month 2: 177.4, 181.8, 103.4.</p><div class="eq">0.0633·177.4 + 0.4239·181.8 + 0.5128·103.4 = 141.4</div><p>Good 1 nearly doubled in price, but it barely moves the index because it’s only 6% of the basket. The Swiss CPI (LIK) is built this way.</p>`)}
<h2 id="ch5-base">Change of base</h2>
<p>Two indices can only be compared if they share the same base. To move an index to a new base year b, divide every value by the value in year b:</p>
<div class="eq">I<sub>new</sub>(t) = I(t) / I(b) · 100</div>
${ex('Example 5.4',`<p>Index 2 has base 1997 and stands at 250 in 2011 and 265 in 2012. Rebased to 2011: 265 / 250 · 100 = <b>106.0</b>.</p>`)}
<h2 id="ch5-chain">Chaining</h2>
<p>A Laspeyres basket goes stale: people stop buying some goods and start buying new ones. So every few years the statistics office <b>revises</b> the basket, and the new index restarts at 100. For a while, both indices are published. Chaining links them into one long series, using the ratio in the overlap month.</p>
${ex('Exercise 7: the December 2015 revision',`<p>In December 2015 the old index (base Dec 2010) stood at 97.3 and the new one at 100.</p><p>Old → new (going back): Sep 2015 = 97.7 / 97.3 · 100 = <b>100.4</b>.</p><p>New → old (going forward): Jan 2016 = 99.6 · 97.3 / 100 = <b>96.9</b>.</p>`)}
<p>Rebasing and chaining are both <b>multiplication by a constant ratio</b>. Never add or subtract to line two indices up.</p>
<h2 id="ch5-real">Purchasing power and real returns</h2>
<p>The CPI tells you what money is worth in different years. To move an amount from year a to year b, multiply by the price ratio:</p>
<div class="eq">amount in year b = amount in year a · CPI<sub>b</sub> / CPI<sub>a</sub></div>
${ex('Exercises 2 and 3',`<p>CPI (base 1939): 160.8 in 1950, 755.7 at the end of 2018. CHF 1 000 in 1950 had the purchasing power of 1 000 · 755.7 / 160.8 ≈ <b>CHF 4 700</b> in 2018. A 2018 salary of CHF 7 000 corresponds to 7 000 · 160.8 / 755.7 ≈ <b>CHF 1 490</b> in 1950.</p>`)}
<p><b>Real return</b> = how much more you can buy. Divide the growth factors, don’t subtract the rates:</p>
<div class="eq">real return = (1 + nominal) / (1 + inflation) − 1</div>
${ex('Exercise 4: SNB deposits 1970–2006',`<p>CHF 1 reinvested every 3 months grew to CHF 3.25. Prices grew by a factor of 2.94. Real: 3.25 / 2.94 − 1 = <b>+11%</b> over 36 years.</p>`)}`,
 gloss:[['Index (pl. indices)','Index (Indizes)','A series rescaled so the base period = 100.'],['Reference period / base','Basisperiode','The period set to 100.'],['Basket of goods','Warenkorb','The fixed quantities a price index reprices.'],['Laspeyres index','Laspeyres-Index','Base-period quantities, current prices.'],['Change of base','Basiswechsel / Umbasierung','Dividing by the new base year’s value.'],['Chaining','Verkettung','Linking an old and a new index at their overlap.'],['Consumer price index','Landesindex der Konsumentenpreise (LIK)','Switzerland’s inflation measure.'],['Purchasing power','Kaufkraft','What an amount of money can buy.']],
 check:[['An index rises from 104 to 108. Prices rose by…',['3.85%','4%','4 points and 4%','104%'],0,'108 / 104 − 1 = 3.85%. It’s 4 points, not 4%.'],
  ['What stays fixed in a Laspeyres price index?',['The quantities in the basket','The prices','Both','Neither'],0,'Quantities are frozen at the base period. Only prices are updated.'],
  ['A good that is 5% of the basket doubles in price. Everything else is unchanged. The Laspeyres index…',['rises by about 5%','doubles','rises by about 100 points','stays at 100'],0,'Weighted average: 0.95·100 + 0.05·200 = 105.']]},

];

/* ---------- small SVG helpers ---------- */
const svgOpen=(w,h,label)=>`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">`;
const sc=(d0,d1,r0,r1)=>v=>r0+(v-d0)/(d1-d0)*(r1-r0);
function niceTicks(lo,hi,n=5){const span=hi-lo, step0=span/n, mag=10**Math.floor(Math.log10(step0)), err=step0/mag, step=(err>=7.5?10:err>=3.5?5:err>=1.5?2:1)*mag;const out=[];for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)out.push(+v.toFixed(10));return out;}

const WIDGETS={
meanmed(el){
  const base=[38,42,45,48,52,55,60,66];
  el.innerHTML=`<h3>Mean vs median: make one person richer</h3><p class="sub">Nine incomes in CHF 1 000. Move the slider to raise the top income.</p><div class="cw" id="mm-c"></div><label class="sl"><span>Top income</span><input type="range" class="slider" id="mm-s" min="0" max="100" value="0"></label><div class="readout" id="mm-r"></div>`;
  const draw=()=>{
    const s=+$('#mm-s').value, X=Math.round(70*Math.pow(2000/70,s/100)), d=[...base,X];
    const m=mean(d), med=52, max=Math.max(100,X*1.06);
    const W=640,H=150,x=sc(0,max,30,W-20);
    let g=svgOpen(W,H,'Nine incomes on a line with mean and median marked');
    niceTicks(0,max,5).forEach(t=>{g+=`<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="30" y2="108"/><text x="${x(t)}" y="126" text-anchor="middle">${fmt(t,0)}</text>`;});
    g+=`<line class="ax" x1="30" x2="${W-20}" y1="108" y2="108"/>`;
    d.forEach((v,i)=>{g+=`<circle class="${i===8?'mk':'mk-dim'}" cx="${x(v)}" cy="${80-(i%2)*10}" r="6"><title>Person ${i+1}: CHF ${fmt(v*1000,0)}</title></circle>`;});
    g+=`<line class="guide2" x1="${x(med)}" x2="${x(med)}" y1="22" y2="108"/><text class="lbl-ink" x="${x(med)+4}" y="20">median ${fmt(med,0)}</text>`;
    g+=`<line class="guide" x1="${x(m)}" x2="${x(m)}" y1="40" y2="108"/><text class="lbl-acc" x="${x(m)+4}" y="${m-med<max*0.12?146:38}">mean ${fmt(m,1)}</text>`;
    $('#mm-c').innerHTML=g+'</svg>';
    $('#mm-r').innerHTML=`<div class="ro"><span class="l">Top income</span><span class="v">CHF ${fmt(X*1000,0)}</span></div><div class="ro"><span class="l">Mean</span><span class="v">CHF ${fmt(m*1000,0)}</span></div><div class="ro"><span class="l">Median</span><span class="v">CHF ${fmt(med*1000,0)}</span></div><div class="ro"><span class="l">Shape</span><span class="v">${m>med+1?'right-skewed':'about symmetric'}</span></div>`;
  };
  $('#mm-s').oninput=draw; draw();
},
ogive(el){
  const b=[0,20,50,100,200], cum=[0,20.00,56.31,89.69,97.84];
  el.innerHTML=`<h3>Interpolating on the cumulative curve</h3><p class="sub">Lucerne taxable income 2006. The curve joins the cumulative shares at each class bound with straight lines: that is the "evenly spread within a class" assumption.</p><div class="cw" id="og-c"></div><label class="sl"><span>Quantile p</span><input type="range" class="slider" id="og-s" min="5" max="95" value="50"></label><div id="og-f"></div>`;
  const draw=()=>{
    const p=+$('#og-s').value, i=cum.findIndex((c,k)=>k>0&&c>=p)-1;
    const v=b[i]+(p-cum[i])/(cum[i+1]-cum[i])*(b[i+1]-b[i]);
    const W=640,H=300,x=sc(0,200,52,W-16),y=sc(0,100,262,14);
    let g=svgOpen(W,H,'Cumulative share of taxpayers by income');
    [0,25,50,75,100].forEach(t=>{g+=`<line class="grid" x1="52" x2="${W-16}" y1="${y(t)}" y2="${y(t)}"/><text x="44" y="${y(t)+4}" text-anchor="end">${t}%</text>`;});
    b.forEach(t=>{g+=`<text x="${x(t)}" y="282" text-anchor="middle">${t}k</text>`;});
    g+=`<text x="${(52+W-16)/2}" y="298" text-anchor="middle">Taxable income (CHF)</text>`;
    g+=`<rect class="band" x="${x(b[i])}" y="14" width="${x(b[i+1])-x(b[i])}" height="248"><title>Quantile class: ${b[i]}k to under ${b[i+1]}k</title></rect>`;
    g+=`<line class="ax" x1="52" x2="${W-16}" y1="262" y2="262"/><polyline class="ln" points="${b.map((t,k)=>`${x(t)},${y(cum[k])}`).join(' ')}"/>`;
    b.forEach((t,k)=>{g+=`<circle class="mk-dim" cx="${x(t)}" cy="${y(cum[k])}" r="4"><title>Under ${t}k: ${fx(cum[k],2)}%</title></circle>`;});
    g+=`<line class="guide" x1="52" x2="${x(v)}" y1="${y(p)}" y2="${y(p)}"/><line class="guide" x1="${x(v)}" x2="${x(v)}" y1="${y(p)}" y2="262"/><circle class="mk" cx="${x(v)}" cy="${y(p)}" r="6"><title>${p}% quantile ≈ CHF ${fmt(v*1000,0)}</title></circle>`;
    g+=`<text class="lbl-acc" x="${x(v)+8}" y="${y(p)-8}">${p}% → CHF ${fmt(v*1000,0)}</text>`;
    $('#og-c').innerHTML=g+'</svg>';
    $('#og-f').innerHTML=`<div class="eq">x<sub>${p}%</sub> = ${fmt(b[i]*1000,0)} + (${p}% − ${fx(cum[i],2)}%) / ${fx(cum[i+1]-cum[i],2)}% · ${fmt((b[i+1]-b[i])*1000,0)} = ${fmt(v*1000,0)}</div>`;
  };
  $('#og-s').oninput=draw; draw();
},
grades(el){
  const G=[1,1.5,2,2.5,3,3.5,4,4.5,5,5.5,6];
  const D={A:[0,0,0,0,1,6,25,36,24,8,0],B:[1,0,0,0,1,5,23,35,28,6,1],C:[3,2,3,5,9,5,10,10,11,22,20],D:[0,0,0,0,0,0,23,55,21,1,0]};
  let cur='A';
  el.innerHTML=`<h3>Example 4.1: four classes, each with mean 4.5</h3><p class="sub">Swiss grades, 6 = best. Bars show how many of the 100 students got each grade; the boxplot below uses the 1.5 × IQR outlier rule.</p><div class="topics" role="group" aria-label="Class" id="gr-b">${Object.keys(D).map(k=>`<button data-k="${k}" aria-pressed="${k===cur}">Class ${k}</button>`).join('')}</div><div class="cw" id="gr-c"></div><div class="readout" id="gr-r"></div><p class="sub" id="gr-n"></p>`;
  const q=(N,p)=>{let c=0;for(let i=0;i<N.length;i++){c+=N[i];if(c>=p)return G[i];}};
  const draw=()=>{
    const N=D[cur], n=100, m=sum(N.map((v,i)=>v*G[i]))/n, ss=sum(N.map((v,i)=>v*(G[i]-m)**2));
    const vals=G.filter((g,i)=>N[i]>0), mn=Math.min(...vals), mx=Math.max(...vals);
    const q1=q(N,25), md=q(N,50), q3=q(N,75), iqr=q3-q1, lo=q1-1.5*iqr, hi=q3+1.5*iqr;
    const inV=vals.filter(v=>v>=lo&&v<=hi), out=vals.filter(v=>v<lo||v>hi);
    const W=640,H=300,x=sc(0.6,6.4,40,W-16),y=sc(0,60,200,16),bw=(x(1.5)-x(1))-6;
    let g=svgOpen(W,H,`Grade distribution of class ${cur}`);
    [0,20,40,60].forEach(t=>{g+=`<line class="grid" x1="40" x2="${W-16}" y1="${y(t)}" y2="${y(t)}"/><text x="32" y="${y(t)+4}" text-anchor="end">${t}</text>`;});
    G.forEach((gr,i)=>{const h=y(0)-y(N[i]);g+=`<rect class="bar" x="${x(gr)-bw/2}" y="${y(N[i])}" width="${bw}" height="${Math.max(0,h)}" rx="${h>4?3:0}"><title>Grade ${fx(gr,1)}: ${N[i]} students</title></rect><text x="${x(gr)}" y="216" text-anchor="middle">${fx(gr,1)}</text>`;});
    g+=`<line class="ax" x1="40" x2="${W-16}" y1="200" y2="200"/>`;
    const by=258;
    g+=`<line class="whisk" x1="${x(Math.min(...inV))}" x2="${x(Math.max(...inV))}" y1="${by}" y2="${by}"/><line class="whisk" x1="${x(Math.min(...inV))}" x2="${x(Math.min(...inV))}" y1="${by-8}" y2="${by+8}"/><line class="whisk" x1="${x(Math.max(...inV))}" x2="${x(Math.max(...inV))}" y1="${by-8}" y2="${by+8}"/>`;
    g+=`<rect class="box" x="${x(q1)}" y="${by-14}" width="${Math.max(2,x(q3)-x(q1))}" height="28" rx="3"><title>Q1 ${fx(q1,1)}, Q3 ${fx(q3,1)}</title></rect><line class="medline" x1="${x(md)}" x2="${x(md)}" y1="${by-14}" y2="${by+14}"/>`;
    out.forEach(v=>{g+=`<circle class="outl" cx="${x(v)}" cy="${by}" r="5"><title>Outlier: grade ${fx(v,1)}</title></circle>`;});
    g+=`<text x="40" y="${by+34}">boxplot</text>`;
    $('#gr-c').innerHTML=g+'</svg>';
    $('#gr-r').innerHTML=[['Mean',fx(m,2)],['Range',fx(mx-mn,1)],['IQR',fx(iqr,1)],['σ (÷ n)',fx(Math.sqrt(ss/n),3)],['s (÷ n − 1)',fx(Math.sqrt(ss/(n-1)),3)]].map(([l,v])=>`<div class="ro"><span class="l">${l}</span><span class="v">${v}</span></div>`).join('');
    $('#gr-n').innerHTML={A:'Bell-shaped in the upper range. The reference case.',B:'Almost class A, plus two outliers (a 1.0 and a 6.0). The range doubles; the IQR doesn’t move. The 1.0 is beyond Q1 − 1.5 × IQR, so it’s drawn as a dot.',C:'Spread evenly across the whole scale: largest IQR and largest σ.',D:'Packed around 4.5: smallest range and σ. IQR = 0, so the IQR can’t measure this spread at all, and the outlier rule flags every grade except 4.5.'}[cur];
    document.querySelectorAll('#gr-b button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===cur));
  };
  document.querySelectorAll('#gr-b button').forEach(b=>b.onclick=()=>{cur=b.dataset.k;draw();});
  draw();
},

corr(el){
  let seed=11; const rnd01=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
  const nrm=()=>Math.sqrt(-2*Math.log(rnd01()+1e-12))*Math.cos(2*Math.PI*rnd01());
  const Z=Array.from({length:40},()=>[nrm(),nrm()]);
  let mode='line', outlier=false;
  el.innerHTML=`<h3>What r sees</h3><p class="sub">40 points. Set the strength of the linear relationship, or switch to a U-shape.</p><div class="topics" role="group" aria-label="Pattern" id="co-b"><button data-m="line" aria-pressed="true">Straight-line pattern</button><button data-m="u" aria-pressed="false">U-shape</button><button data-o="1" aria-pressed="false">Add one outlier</button></div><div class="cw" id="co-c"></div><label class="sl" id="co-sl"><span>Relationship</span><input type="range" class="slider" id="co-s" min="-100" max="100" value="70"></label><div class="readout" id="co-r"></div>`;
  const draw=()=>{
    const rho=+$('#co-s').value/100;
    let P=Z.map(([a,b])=>mode==='u'?[a,a*a-1+0.15*b]:[a,rho*a+Math.sqrt(1-rho*rho)*b]);
    if(outlier)P=P.concat([[3.2,mode==='u'?-3:(rho>=0?-3.2:3.2)]]);
    const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),mx=mean(xs),my=mean(ys);
    const sxy=sum(P.map(p=>(p[0]-mx)*(p[1]-my))),sx=Math.sqrt(sum(xs.map(v=>(v-mx)**2))),sy=Math.sqrt(sum(ys.map(v=>(v-my)**2))),r=sxy/(sx*sy);
    const W=640,H=300,x=sc(-3.6,3.6,30,W-16),y=sc(-3.6,mode==='u'?8:3.6,272,14);
    let g=svgOpen(W,H,'Scatter plot of 40 points');
    g+=`<line class="grid" x1="${x(mx)}" x2="${x(mx)}" y1="14" y2="272"/><line class="grid" x1="30" x2="${W-16}" y1="${y(my)}" y2="${y(my)}"/><text x="${x(mx)+4}" y="26">x̄</text><text x="${W-22}" y="${y(my)-6}" text-anchor="end">ȳ</text>`;
    g+=`<line class="ax" x1="30" x2="${W-16}" y1="272" y2="272"/><line class="ax" x1="30" x2="30" y1="14" y2="272"/>`;
    P.forEach((p,i)=>{const pos=(p[0]-mx)*(p[1]-my)>=0;g+=`<circle class="${i===40?'outl':pos?'mk':'mk-neg'}" cx="${x(p[0])}" cy="${y(p[1])}" r="${i===40?7:5}"><title>${i===40?'Outlier':'Point'}: product of deviations ${pos?'positive':'negative'}</title></circle>`;});
    $('#co-c').innerHTML=g+'</svg>';
    const a=Math.abs(r), word=a>=0.8?'strong':a>=0.5?'moderate':a>=0.2?'weak':'almost no';
    $('#co-r').innerHTML=`<div class="ro"><span class="l">r</span><span class="v">${fx(r,3)}</span></div><div class="ro"><span class="l">Reading (rough guide)</span><span class="v">${word} ${a>=0.2?(r>0?'positive':'negative'):''} linear relationship</span></div><div class="ro"><span class="l">Legend</span><span class="v" style="font-size:13px;font-weight:500"><span class="key-dot mk"></span> product &gt; 0  <span class="key-dot mk-neg"></span> product &lt; 0</span></div>`;
    $('#co-sl').hidden=mode==='u';
    document.querySelectorAll('#co-b [data-m]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
    document.querySelector('#co-b [data-o]').setAttribute('aria-pressed',outlier);
  };
  document.querySelectorAll('#co-b [data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw();});
  document.querySelector('#co-b [data-o]').onclick=()=>{outlier=!outlier;draw();};
  $('#co-s').oninput=draw; draw();
}
};

/* ---------- maths helpers ---------- */
const lnFact=n=>{let s=0;for(let i=2;i<=n;i++)s+=Math.log(i);return s;};
const nCr=(n,k)=>k<0||k>n?0:Math.round(Math.exp(lnFact(n)-lnFact(k)-lnFact(n-k)));
const nCrF=(n,k)=>k<0||k>n?0:Math.exp(lnFact(n)-lnFact(k)-lnFact(n-k));
const fact=n=>{let f=1;for(let i=2;i<=n;i++)f*=i;return f;};
const bpmf=(k,n,p)=>k<0||k>n?0:Math.exp(lnFact(n)-lnFact(k)-lnFact(n-k)+k*Math.log(p)+(n-k)*Math.log(1-p));
const bcdf=(k,n,p)=>{let s=0;for(let i=0;i<=Math.min(k,n);i++)s+=bpmf(i,n,p);return Math.min(1,s);};
function linreg(x,y){const mx=mean(x),my=mean(y),sxy=sum(x.map((v,i)=>(v-mx)*(y[i]-my))),sxx=sum(x.map(v=>(v-mx)**2)),syy=sum(y.map(v=>(v-my)**2));const b1=sxy/sxx;return {mx,my,sxy,sxx,syy,beta:b1,b:my-b1*mx,r:sxy/Math.sqrt(sxx*syy)};}
function pctExc(arr,p){const s=arr.slice().sort((a,b)=>a-b),n=s.length,h=p*(n+1);if(h<1)return s[0];if(h>=n)return s[n-1];const lo=Math.floor(h);return s[lo-1]+(h-lo)*(s[lo]-s[lo-1]);}
const fmtP=x=>fx(x,4);

parseNum=function(raw){const s=String(raw).trim().replace(/\s/g,'');const m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);if(m&&+m[2]!==0)return +m[1]/+m[2];return _parseNum(raw);};
