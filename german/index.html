  <p class="hint">Each card asks for all three forms, the way the book's "Kleines Wörterbuch der Verben" lists them. Perfekt includes hat/ist. Unlocked up to your current chapter.</p>
  <div class="grid g3" style="margin-top:12px"><div class="stat"><b>${started}/${ids.length}</b><span>started</span></div><div class="stat"><b>${solid}</b><span>solid (box 3+)</span></div><div class="stat"><b>${due}</b><span>due now</span></div></div></section>
  <section class="card"><div class="card-h"><h3>Reference</h3><button class="mini" data-act="toggle-forms">${ui.showForms?"Hide forms (self-test)":"Show forms"}</button></div>
  <div class="tablewrap"><table class="vtable"><thead><tr><th>Infinitiv</th><th>er/sie</th><th>Präteritum</th><th>Perfekt</th><th>K</th><th></th></tr></thead><tbody>
  ${ids.map(id=>{const c=CARDS[id];const h=ui.showForms?"":"style=\"color:transparent;background:var(--surface-2);border-radius:4px\"";return `<tr><td>${esc(c.inf)}<div class="faint" style="font-size:.75rem;font-weight:400">${esc(c.en)}</div></td><td ${h}>${esc(c.pr)}</td><td ${h}>${esc(c.pt)}</td><td ${h}>${esc(c.pf)}</td><td class="mono faint">${c.ch}</td><td>${boxes(id)}</td></tr>`;}).join("")}
  </tbody></table></div></section></div>`;
}
function vGrammatik(){
  return `<div class="stack">
  <section class="card"><h2>Grammatik</h2><p class="hint" style="margin-top:6px">Every topic points to the matching Grammatik aktiv chapter (GA §) and its PDF page. Read the rule there, then practice here. The three topics marked ∞ generate new items every time.</p></section>
  ${CHAPTERS.map(c=>`<section class="card"><div class="card-h"><h3>Kapitel ${c.n} · ${esc(c.de)}</h3></div><div class="topiclist">
    ${c.topics.map(tid=>{const t=ALLTOPICS[tid],a=topicAcc(tid),s=S.progress.topic[tid];const open=ui.rule[tid];
      return `<div class="topic-row" style="flex-direction:column;align-items:stretch"><div class="row" style="justify-content:space-between"><div><div class="t">${t.gen?"∞ ":""}${esc(t.title)}</div><div class="ref">${gaRef(t)}${s?` · ${s.r+s.w} answered`:""}</div></div>
      <div class="row">${a==null?"":`<span class="pill ${a>=.85?"ok":a>=.6?"warn":"bad"}">${Math.round(a*100)}%</span>`}<button class="mini" data-act="rule" data-t="${tid}" aria-expanded="${!!open}">Rule</button><button class="mini" data-act="topic" data-t="${tid}" style="color:var(--accent);border-color:var(--accent)">Practice</button></div></div>
      ${open?`<div class="rule" style="margin-top:10px">${t.rule}</div>`:""}</div>`;}).join("")}
  </div></section>`).join("")}</div>`;
}
function resultBlock(r,isChat){
  if(!r)return "";
  const g=Number(r.grade);const gc=g>=5?"ok":g>=4?"warn":"bad";
  return `<div class="corr">
   <div class="row" style="align-items:flex-end;gap:16px"><div><div class="eyebrow">Note</div><div class="grade" style="color:var(--${gc})">${isFinite(g)?g.toFixed(1):"–"}</div></div><p style="flex:1;min-width:200px">${esc(r.verdict||"")}</p></div>
   ${r.task_check?`<p class="hint">${esc(r.task_check)}</p>`:""}
   ${r.corrected?`<div><div class="eyebrow" style="margin-bottom:6px">Corrected</div><div class="corrected">${esc(r.corrected)}</div></div>`:""}
   ${Array.isArray(r.errors)&&r.errors.length?`<div><div class="eyebrow">Errors (${r.errors.length}) · saved to Fehler</div>${r.errors.map(e=>`<div class="err"><span class="pill">${esc(e.type||"")}</span><div><s>${esc(e.wrong)}</s> → <ins>${esc(e.right)}</ins><div class="hint">${esc(e.why||"")}</div></div></div>`).join("")}</div>`:`<p class="pill ok">No errors found</p>`}
   ${Array.isArray(r.good)&&r.good.length?`<div><div class="eyebrow">What worked</div><ul style="margin:6px 0 0;padding-left:18px">${r.good.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
   ${r.upgrade?`<div class="note">Level up: ${esc(r.upgrade)}</div>`:""}
   ${Array.isArray(r.phrases)&&r.phrases.length?`<div><div class="eyebrow">Phrases to steal</div><ul style="margin:6px 0 0;padding-left:18px">${r.phrases.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
  </div>`;
}
function vSchreiben(){
  const noClaude=!sample?`<div class="note">Claude grading and role-play need this page open in Claude. Everything else works without it.</div>`:"";
  return `<div class="stack">
  <div class="seg" role="group" aria-label="Mode"><button aria-pressed="${ui.wtab==="write"}" data-act="wtab" data-t="write">Schreiben · writing</button><button aria-pressed="${ui.wtab==="talk"}" data-act="wtab" data-t="talk">Sprechen · role-play</button></div>
  ${noClaude}${ui.wtab==="write"?vWrite():vTalk()}</div>`;
}
function vWrite(){
  const w=ui.write;const ps=promptsSorted();
  if(w.prompt==null){
    const hist=S.writing.items;
    return `<section class="card"><div class="card-h"><h2>Pick a task</h2><span class="hint">Current chapter first</span></div>
    <div class="grid g2">${ps.map(p=>`<button class="scen" data-act="write-open" data-p="${p.i}"><span class="eyebrow">${p.ch<9?"Kapitel "+p.ch:"Exam format"} · ${esc(p.words)} words</span><b>${esc(p.title)}</b><span>${esc(p.focus)}</span></button>`).join("")}</div></section>
    ${hist.length?`<section class="card"><div class="card-h"><h2>History</h2></div>${hist.map((h,k)=>`<div class="mist"><div><b>${esc(WRITING[h.p]?.title||"")}</b><div class="hint">${fmt(h.d)} · ${wordCount(h.text)} words · ${(h.r.errors||[]).length} errors</div></div><div class="row"><span class="pill ${h.r.grade>=5?"ok":h.r.grade>=4?"warn":"bad"}">${Number(h.r.grade).toFixed(1)}</span><button class="mini" data-act="hist" data-k="${k}">Open</button></div></div>`).join("")}</section>`:""}`;
  }
  const p=WRITING[w.prompt];const wc=wordCount(w.text);
  return `<section class="card stack" style="gap:12px"><div class="row" style="justify-content:space-between"><button class="mini" data-act="write-back">← All tasks</button><span class="pill">${p.ch<9?"Kapitel "+p.ch:"Exam format"}</span></div>
    <h2>${esc(p.title)}</h2><p>${esc(p.task)}</p><p class="hint">Target: ${esc(p.words)} words · Focus: ${esc(p.focus)}</p>
    <textarea class="field" id="wtext" placeholder="Schreib hier …" ${w.busy?"disabled":""} spellcheck="false" lang="de">${esc(w.text)}</textarea>
    <div class="row" style="justify-content:space-between">${umlautRow()}<span class="mono faint" id="wc">${wc} words</span></div>
    <div class="row"><button class="btn primary" data-act="write-go" ${w.busy||!sample?"disabled":""}>${w.busy?"Claude is reading…":"Correct and grade"}</button>${w.result?`<button class="btn ghost" data-act="write-new">Start over</button>`:""}</div>
    ${w.err?`<p class="pill bad">${esc(w.err)}</p>`:""}
  </section>
  ${w.result?`<section class="card">${resultBlock(w.result)}</section>`:""}`;
}
function vTalk(){
  const c=ui.chat;
  if(c.scene==null)return `<section class="card"><div class="card-h"><h2>Pick a situation</h2><span class="hint">Claude plays the other person and fixes your sentences as you go</span></div>
    <div class="grid g2">${SCENES.map((s,k)=>`<button class="scen" data-act="scene" data-k="${k}"><span class="eyebrow">Kapitel ${s.ch}</span><b>${esc(s.title)}</b><span>“${esc(s.open)}”</span></button>`).join("")}</div></section>`;
  const sc=SCENES[c.scene];
  const bubble=t=>{if(t.role==="user")return `<div class="msg me">${esc(t.content)}</div>`;
    const lines=t.content.split("\n");const fix=lines.filter(l=>l.trim().startsWith("✎"));const main=lines.filter(l=>!l.trim().startsWith("✎")).join("\n").trim();
    return `<div class="msg them">${esc(main)}${fix.map(f=>`<span class="fix">${esc(f.trim())}</span>`).join("")}</div>`;};
  return `<section class="card stack" style="gap:12px"><div class="row" style="justify-content:space-between"><button class="mini" data-act="scene-back">← All situations</button><span class="pill">Kapitel ${sc.ch}</span></div>
    <h2>${esc(sc.title)}</h2>
    <div class="chat" id="chatlog" aria-live="polite"><div class="msg them">${esc(sc.open)}</div>${c.turns.map(bubble).join("")}${c.busy&&!c.feedback?`<div class="msg them" id="streaming">${esc(c.stream||"…")}</div>`:""}</div>
    <div class="row" style="flex-wrap:nowrap"><input class="field" id="chatin" placeholder="Antworte auf Deutsch …" autocomplete="off" spellcheck="false" lang="de" ${c.busy||!sample?"disabled":""}><button class="btn primary" data-act="chat-send" ${c.busy||!sample?"disabled":""}>Send</button></div>
    <div class="row" style="justify-content:space-between">${umlautRow()}<div class="row"><button class="btn" data-act="chat-feedback" ${c.busy||!c.turns.length?"disabled":""}>End and get feedback</button><button class="btn ghost" data-act="chat-reset">Restart</button></div></div>
    ${c.err?`<p class="pill bad">${esc(c.err)}</p>`:""}
  </section>${c.feedback?`<section class="card">${resultBlock(c.feedback,true)}</section>`:""}`;
}
function vFehler(){
  const open=openMistakes();const wr=S.mistakes.items.filter(m=>m.tid==="writing"&&!m.fixed);
  const by={};open.forEach(m=>{(by[m.tid]=by[m.tid]||[]).push(m);});
  return `<div class="stack">
  <section class="card"><div class="card-h"><h2>Fehler</h2><button class="btn primary" data-act="go-mistakes" ${open.length?"":"disabled"}>Redo ${Math.min(15,open.length)} mistakes</button></div>
  <p class="hint">Every wrong grammar answer lands here. Get it right on a redo and it's cleared. Writing and role-play errors are listed below for review.</p></section>
  ${Object.keys(by).length?Object.entries(by).sort((a,b)=>b[1].length-a[1].length).map(([tid,ms])=>`<section class="card"><div class="card-h"><h3>${esc(ALLTOPICS[tid]?.title||tid)} <span class="pill bad">${ms.length}</span></h3><button class="mini" data-act="topic" data-t="${tid}">Practice topic</button></div>
    ${ms.map(m=>{const x=m.item;const right=x.t==="c"?x.o[x.a]:x.t==="o"?x.w.join(" "):fillAnswer(x);return `<div class="mist"><div><div>${esc(x.q||x.en||"")}</div><div class="hint">You: <s style="color:var(--bad)">${esc(m.given||"–")}</s> · Right: <b style="color:var(--ok)">${esc(right)}</b>${m.n>1?` · missed ${m.n}×`:""}</div></div><button class="mini" data-act="mist-del" data-key="${esc(m.key)}" aria-label="Remove">✕</button></div>`;}).join("")}</section>`).join(""):`<section class="card"><p class="empty">No open grammar mistakes. Suspicious. Go drill something.</p></section>`}
  ${wr.length?`<section class="card"><div class="card-h"><h3>From your writing and role-plays</h3><button class="mini" data-act="wr-clear">Mark all reviewed</button></div>${wr.slice(0,40).map(m=>`<div class="mist"><div><s style="color:var(--bad)">${esc(m.item.wrong)}</s> → <b style="color:var(--ok)">${esc(m.item.right)}</b><div class="hint">${esc(m.item.type)} · ${esc(m.item.why)}</div></div><button class="mini" data-act="mist-del" data-key="${esc(m.key)}" aria-label="Remove">✕</button></div>`).join("")}</section>`:""}
  </div>`;
}

/* ---------- render + events ---------- */
function render(){
  const main={heute:vHeute,kurs:vKurs,kapitel:vKapitel,woerter:vWoerter,verben:vVerben,grammatik:vGrammatik,schreiben:vSchreiben,fehler:vFehler,drill:vDrill}[ui.tab]||vHeute;
  $("#app").innerHTML=header()+`<main>${main()}</main>`+(ui.toast?`<div class="toast" role="status">${esc(ui.toast)}</div>`:"");
  setSave();
}
function toast(m){ui.toast=m;render();setTimeout(()=>{ui.toast=null;render();},2200);}
let lastFocus=null;
document.addEventListener("focusin",e=>{if(e.target.matches("input,textarea"))lastFocus=e.target;});
document.addEventListener("click",e=>{
  const u=e.target.closest("[data-uml]");
  if(u){e.preventDefault();const el=lastFocus&&document.body.contains(lastFocus)?lastFocus:document.querySelector(".drill input:not([disabled]),#wtext,#chatin");if(!el||el.disabled)return;const s=el.selectionStart??el.value.length,en=el.selectionEnd??el.value.length;el.value=el.value.slice(0,s)+u.dataset.uml+el.value.slice(en);el.focus();el.setSelectionRange(s+1,s+1);el.dispatchEvent(new Event("input",{bubbles:true}));return;}
  const tab=e.target.closest("[data-tab]");
  if(tab){if(ui.sess&&ui.tab==="drill"){ui.sess=null;commitTime();}ui.tab=tab.dataset.tab;try{localStorage.setItem("roterfaden.tab",ui.tab);}catch(_){}render();window.scrollTo({top:0});return;}
  const o=e.target.closest("[data-opt]");if(o){const it=curItem();if(it&&!it.res){it.pickd=+o.dataset.opt;check();}return;}
  const b=e.target.closest("[data-build]");if(b){const it=curItem();(it.built=it.built||[]).push(+b.dataset.build);render();return;}
  const ub=e.target.closest("[data-unbuild]");if(ub){const it=curItem();it.built.splice(+ub.dataset.unbuild,1);render();return;}
  const a=e.target.closest("[data-act]");if(!a)return;const d=a.dataset;
  switch(d.act){
    case "start-today":sessToday();break;
    case "lesson-open":ui.sess=null;ui.lesson=d.l;ui.lmode=lp(d.l).theory?(lp(d.l).passed?"theory":"practice"):"theory";ui.tab="kurs";ui.railOpen=false;try{localStorage.setItem("roterfaden.tab","kurs");}catch(_){}render();window.scrollTo({top:0});break;
    case "lmode":ui.lmode=d.m;render();window.scrollTo({top:0});break;
    case "rail-toggle":ui.railOpen=!ui.railOpen;render();break;
    case "theory-done":setLp(d.l,{theory:true});ui.lmode="practice";render();window.scrollTo({top:0});break;
    case "lesson-words":sessLessonWords(d.l);break;
    case "lesson-practice":sessLessonPractice(d.l);break;
    case "lesson-test":ui.sess=null;sessLessonTest(d.l);break;
    case "read-ans":{const a=ui.readAns[d.l]||(ui.readAns[d.l]={});a[+d.k]=+d.j;const r=LESSON[d.l].read;if(r.qs.every((_,k)=>a[k]!=null)){const right=r.qs.filter((q,k)=>a[k]===q.a).length;setLp(d.l,{read:{right,total:r.qs.length}});}render();break;}
    case "read-reset":ui.readAns[d.l]={};render();break;
    case "scene-open":ui.tab="schreiben";ui.wtab="talk";ui.chat={scene:+d.k,turns:[],busy:false,feedback:null,err:""};render();window.scrollTo({top:0});break;
    case "check":check();break;
    case "next":next();break;
    case "reveal":curItem().revealed=true;render();break;
    case "self-ok":case "self-no":{const it=curItem();const ok=d.act==="self-ok";it.res={ok};grade(it.id,ok);ok?ui.sess.ok++:(ui.sess.no++,requeue(it));render();focusNext();break;}
    case "intro-go":{const it=curItem();introduce(it.id,false);ui.sess.q.splice(Math.min(ui.sess.q.length,ui.sess.i+3),0,{k:"card",id:it.id});ui.sess.i++;render();focusFirst();break;}
    case "intro-know":{const it=curItem();introduce(it.id,true);ui.sess.i++;if(ui.sess.i>=ui.sess.q.length)finishSession(ui.sess);render();focusFirst();break;}
    case "tiles-reset":curItem().built=[];render();break;
    case "explain":explain();break;
    case "sess-quit":case "sess-close":{const r=ui.sess?.ret||"heute";ui.sess=null;commitTime();ui.tab=r==="drill"?"heute":r;render();window.scrollTo({top:0});break;}
    case "go-mistakes":ui.sess=null;sessMistakes();break;
    case "topic":sessTopic(d.t);break;
    case "rule":ui.rule[d.t]=!ui.rule[d.t];render();break;
    case "ch-words":sessChapterWords(+d.ch);break;
    case "due-words":startSession("Wörter · due",dueCards(c=>c.t==="w").slice(0,40).map(id=>({k:"card",id})));break;
    case "verbs":sessVerbs();break;
    case "wch":ui.chFilter=+d.ch;ui.search="";render();break;
    case "toggle-forms":ui.showForms=!ui.showForms;render();break;
    case "goto-ch":if(+d.ch<9){ui.tab="kapitel";render();requestAnimationFrame(()=>{const el=document.getElementById("ch-"+d.ch);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});});}else{ui.tab="kapitel";render();}break;
    case "goto-tab":ui.tab=d.t;render();break;
    case "set-current":S.progress.current=+d.ch;touch("progress");toast("Kapitel "+d.ch+" is now current");break;
    case "toggle-done":S.progress.done[d.ch]=!S.progress.done[d.ch];touch("progress");render();break;
    case "cando":{const k=d.k,v=+d.v;S.progress.cando[k]=S.progress.cando[k]===v?0:v;touch("progress");render();break;}
    case "wtab":ui.wtab=d.t;render();break;
    case "write-open":ui.tab="schreiben";ui.wtab="write";if(ui.write.prompt!==+d.p){ui.write={prompt:+d.p,text:"",busy:false,result:null,err:""};}render();window.scrollTo({top:0});break;
    case "write-back":ui.write.prompt=null;render();break;
    case "write-go":correctWriting();break;
    case "write-new":ui.write.text="";ui.write.result=null;render();break;
    case "hist":{const h=S.writing.items[+d.k];ui.write={prompt:h.p,text:h.text,busy:false,result:h.r,err:""};render();break;}
    case "scene":ui.chat={scene:+d.k,turns:[],busy:false,feedback:null,err:""};render();requestAnimationFrame(()=>{const i=$("#chatin");if(i)i.focus();});break;
    case "scene-back":ui.chat.scene=null;render();break;
    case "chat-send":sendChat();break;
    case "chat-feedback":chatFeedback();break;
    case "chat-reset":ui.chat={scene:ui.chat.scene,turns:[],busy:false,feedback:null,err:""};render();break;
    case "mist-del":S.mistakes.items=S.mistakes.items.filter(m=>m.key!==d.key);touch("mistakes");render();break;
    case "wr-clear":S.mistakes.items.forEach(m=>{if(m.tid==="writing")m.fixed=true;});touch("mistakes");render();break;
  }
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.cd)ui.cOpen[d.dataset.cd]=d.open;},true);
document.addEventListener("input",e=>{
  if(e.target.id==="lnotes"){S.notes.by[e.target.dataset.l]=e.target.value;touch("notes");return;}
  if(e.target.id==="wtext"){ui.write.text=e.target.value;const wc=$("#wc");if(wc)wc.textContent=wordCount(e.target.value)+" words";}
  if(e.target.id==="wsearch"){ui.search=e.target.value;const pos=e.target.selectionStart;render();const el=$("#wsearch");if(el){el.focus();el.setSelectionRange(pos,pos);}}
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.shiftKey)return;
  if(e.target.id==="chatin"){e.preventDefault();sendChat();return;}
  if(ui.tab!=="drill"||!ui.sess)return;
  if(e.target.tagName==="TEXTAREA")return;
  const it=curItem();if(!it)return;
  if(e.target.tagName==="BUTTON"&&!e.target.matches('[data-act="next"],[data-act="check"]'))return;
  e.preventDefault();
  if(it.intro&&!it.res){document.querySelector('[data-act="intro-go"]')?.click();return;}
  if(it.res)next();
  else if(it.k==="card"&&CARDS[it.id].kind==="phrase"){if(!it.revealed){it.revealed=true;render();}}
  else{const ins=[...document.querySelectorAll(".drill input:not([disabled])")];const i=ins.indexOf(e.target);if(i>=0&&i<ins.length-1&&!ins[i+1].value){ins[i+1].focus();return;}check();}
});

render();
connect();
</script>
