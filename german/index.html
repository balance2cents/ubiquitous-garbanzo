/* ---------- my added words ---------- */
function registerCustom(){
  for(const [id,c] of Object.entries(S.custom.cards||{})){
    if(CARDS[id])continue;
    const m=c.de.match(/^(der|die|das) (.+)$/);const isNoun=!!(m&&/^[A-ZÄÖÜ]/.test(m[2]));
    CARDS[id]={id,t:"w",ch:c.ch||1,de:c.de,en:c.en,pl:c.pl||"",art:isNoun?m[1]:"",noun:isNoun?m[2]:"",kind:isNoun?"noun":(/[.?!…]/.test(c.de)?"phrase":"word"),custom:true,added:c.added};

let popEl=null,popHide=null,popPinned=false,popSpan=null;

function placePop(span){
  const r=span.getBoundingClientRect(),el=popEl;el.style.left="0px";el.style.top="0px";
  const pw=el.offsetWidth,ph=el.offsetHeight;
  const x=Math.min(Math.max(8,r.left+r.width/2-pw/2),window.innerWidth-pw-8);
  let y=r.bottom+8;if(y+ph>window.innerHeight-8)y=Math.max(8,r.top-ph-8);

}
function showPop(span,pin){const el=ensurePop();popSpan=span;popPinned=!!pin;el.innerHTML=popHtml(span.dataset.w,lookupWord(span.dataset.w));el.hidden=false;placePop(span);}

document.addEventListener("pointerover",e=>{if(e.pointerType!=="mouse")return;const sp=e.target.closest&&e.target.closest(".tw");if(sp){clearTimeout(popHide);if(!popPinned)showPop(sp,false);}});

  else if(x.t==="o"){const got=norm((it.built||[]).map(k=>x.w[k]).join(" "));if(!(it.built||[]).length)return;kind=[x.w.join(" "),...(x.alt||[])].some(a=>norm(a)===got)?"ok":"no";}

    it.res={parts};kind=parts.every(p=>p==="ok")?"ok":parts.every(p=>p!=="no")?"typo":"no";
  }

function checkCard(it){
  const c=CARDS[it.id];let ok,typo=false,cls,msg="",plCls="";
  if(c.t==="v"){
    const exp=[c.pr,c.pt,c.pf].map((f,k)=>k===2&&CH_ALT_SEIN.has(c.inf)?f+"|"+f.replace(/^hat /,"ist "):f);
    let raw=it.vals.slice();
    // "fährt, fuhr, ist gefahren" typed into one box fills all three
    const k0=raw.findIndex(v=>v.includes(","));
    if(k0>=0&&raw.filter(v=>v.trim()).length===1){let ps=splitList(raw[k0]);if(ps.length===4&&judge(ps[0],c.inf)!=="no")ps=ps.slice(1);if(ps.length>=2){raw=[0,1,2].map(k=>ps[k]||"");it.vals=raw;}}
    const vals=raw.map(v=>v.replace(/^\s*(er|sie|es)\s+/i,""));
    if(vals.every(v=>!v.trim()))return;
    const parts=exp.map((e,k)=>judge(vals[k],e));
    ok=parts.every(p=>p!=="no");typo=ok&&parts.some(p=>p==="typo");
    it.res={parts,ok,typo};
  }else{
    const g=(it.val||"").trim();if(!g)return;
    const gp=splitList(g);
    if(c.kind==="noun"){
      const m=norm(gp[0]).match(/^(der|die|das) (.+)$/);
      if(!m){ok=false;msg="You need the article. That's the whole point of learning the noun.";}
      else if(m[1]!==c.art){ok=false;msg=`Wrong article: it's <b class="g-${c.art}">${c.art}</b> ${esc(c.noun)}.`;}
      else{const j=judge(m[2],c.noun);ok=j!=="no";typo=j==="typo";}
      const askPl=c.pl&&srs(it.id)&&srs(it.id).b>=2;
      const plGiven=((it.pl||"").trim()||gp[1]||"").trim();
      if(c.pl&&(askPl||plGiven)){const pj=judgePlural(c,plGiven);plCls=pj;if(pj==="no"){if(ok)msg=plGiven?`Singular right, but the plural is die ${esc(c.pl)}.`:`Plural is die ${esc(c.pl)}.`;ok=false;}else if(pj==="typo")typo=true;}
    }else{let j=judge(g,c.de);if(j==="no"&&gp.length>1)j=judge(gp[0],c.de);ok=j!=="no";typo=j==="typo";}
    cls=ok?(typo?"typo":"ok"):"no";
    it.res={ok,typo,cls,plCls,msg};
  }
  if(!it.cram||!ok)grade(it.id,ok);
  if(ok)ui.sess.ok++;else{ui.sess.no++;requeue(it);}
  render();focusNext();
}

  const sp=ui.speak,l=LESSON[sp.lesson];if(!sample||sp.busy)return;
  sp.busy=true;sp.err="";render();scrollSpk();
  const turns=[{role:"user",content:speakRules(l)+"\n\nStart now: greet briefly and ask the first question."},...sp.turns.slice(-24)];
  try{
    const {text}=await sample(turns,{cache:false,modelTier:"quick"});
    const j=parseJ(text)||{fix:null,why:null,say:text.trim()};
    sp.turns.push({role:"assistant",content:JSON.stringify(j)});
    if(j.fix&&sp.log.length&&sp.log[sp.log.length-1].who==="me"){sp.log[sp.log.length-1].fix=j.fix;sp.log[sp.log.length-1].why=j.why||"";}
    sp.log.push({who:"tutor",text:String(j.say||"")});
    sayDe((j.fix?"Besser: "+j.fix+" … ":"")+String(j.say||""));
  }catch(e){sp.err=errCopy(e);}
  sp.busy=false;if(ui.tab==="kurs"&&ui.lmode==="speak")render();scrollSpk();focusSpk();
}
function spkSend(){
  clearTimeout(spkTimer);const sp=ui.speak;if(!sp||sp.busy)return;
  const el=$("#spin");const t=((el&&el.value)||sp.draft||"").trim();if(!t)return;
  sp.draft="";sp.turns.push({role:"user",content:t});sp.log.push({who:"me",text:t});spkAsk();
}
async function spkFeedback(){
  const sp=ui.speak,l=LESSON[sp.lesson];if(!sample||sp.busy)return;
  const mine=sp.log.filter(x=>x.who==="me");if(!mine.length)return;
  clearTimeout(spkTimer);sp.busy=true;sp.feedback=null;sp.err="";render();
  const convo=sp.log.map(x=>(x.who==="me"?"Learner: ":"Tutor: ")+x.text).join("\n");
  try{
    const r=await sample.json(`An A2 German learner did a spoken drill for lesson ${l.id} ("${l.title}"). Their answers were dictated by voice, so ignore capitalization, punctuation and obvious speech-recognition slips.\n\n${convo.slice(-9000)}\n\nEvaluate ONLY the learner's answers. Reply with ONLY one JSON object:\n{"grade": Swiss grade 1–6 in half steps (6 best, 4 pass) for an A2 speaker on this lesson's grammar,\n "verdict": "one or two blunt, specific sentences in English",\n "errors": [{"wrong": "fragment", "right": "correction", "type": "article|case|ending|word order|verb form|tense|preposition|vocabulary|other", "why": "one short English sentence"}],\n "good": ["up to 3 specific things done well"],\n "phrases": ["3 useful German sentences for this lesson they could practice saying, with English in parentheses"]}\nAt most 8 errors, most important first.`,{modelTier:"default"});
    sp.feedback=r;logClaudeErrors(r.errors,"voice");setLp(l.id,{speak:Math.max(lp(l.id).speak||0,Number(r.grade)||0)});
  }catch(e){sp.err=errCopy(e);}
  sp.busy=false;render();
}

  const tw=e.target.closest(".tw");
  if(tw){if(popPinned&&popSpan===tw)hidePop();else showPop(tw,true);return;}
  if(popEl&&!popEl.hidden&&!e.target.closest("#wpop"))hidePop();
  const a=e.target.closest("[data-act]");if(!a)return;const d=a.dataset;
  switch(d.act){
    case "start-today":sessToday();break;
    case "lesson-open":ui.sess=null;ui.lesson=d.l;ui.lmode=lp(d.l).theory?(lp(d.l).passed?"theory":"practice"):"theory";ui.tab="kurs";ui.railOpen=false;try{localStorage.setItem("roterfaden.tab","kurs");}catch(_){}render();window.scrollTo({top:0});break;
    case "lmode":ui.lmode=d.m;render();window.scrollTo({top:0});break;
    case "rail-toggle":ui.railOpen=!ui.railOpen;render();break;
    case "theory-done":setLp(d.l,{theory:true});ui.lmode="practice";render();window.scrollTo({top:0});break;
    case "lesson-words":sessLessonWords(d.l);break;
    case "lesson-practice":sessLessonPractice(d.l);break;
    case "lesson-test":ui.sess=null;sessLessonTest(d.l);break;
    case "read-ans":{const ti=+d.i,key=d.l+":"+ti,a=ui.readAns[key]||(ui.readAns[key]={});a[+d.k]=+d.j;const r=lessonTexts(LESSON[d.l])[ti];if(r.qs.every((_,k)=>a[k]!=null)){const right=r.qs.filter((q,k)=>a[k]===q.a).length;setReadDone(d.l,ti,{right,total:r.qs.length});}render();break;}
    case "read-reset":ui.readAns[d.l+":"+d.i]={};render();break;
    case "read-text":ui.readIdx[d.l]=+d.i;render();window.scrollTo({top:0});break;
    case "word-add":{const w=d.w,id=addWord(w);if(id){document.querySelectorAll(".tw").forEach(sp=>{if(isMine(sp.dataset.w))sp.classList.add("mine");});if(popEl&&!popEl.hidden){popEl.innerHTML=popHtml(w,lookupWord(w))+`<div class="hint">Added. It'll show up in Today's session.</div>`;popPinned=true;}}break;}
    case "custom-del":removeCustom(d.id);render();break;
    case "scene-open":ui.tab="schreiben";ui.wtab="talk";ui.chat={scene:+d.k,turns:[],busy:false,feedback:null,err:""};render();window.scrollTo({top:0});break;
    case "check":check();break;
    case "next":next();break;
    case "reveal":curItem().revealed=true;render();break;
    case "self-ok":case "self-no":{const it=curItem();const ok=d.act==="self-ok";it.res={ok};grade(it.id,ok);ok?ui.sess.ok++:(ui.sess.no++,requeue(it));render();focusNext();break;}
    case "intro-go":{const it=curItem();introduce(it.id,false);ui.sess.q.splice(Math.min(ui.sess.q.length,ui.sess.i+3),0,{k:"card",id:it.id});ui.sess.i++;render();focusFirst();break;}
    case "intro-know":{const it=curItem();introduce(it.id,true);ui.sess.i++;if(ui.sess.i>=ui.sess.q.length)finishSession(ui.sess);render();focusFirst();break;}
    case "tiles-reset":curItem().built=[];render();break;
    case "explain":explain();break;
    case "sess-quit":case "sess-close":{const r=ui.sess?.ret||"heute";ui.sess=null;commitTime();ui.tab=r==="drill"?"heute":r;render();window.scrollTo({top:0});break;}
    case "go-mistakes":ui.sess=null;sessMistakes();break;
    case "topic":sessTopic(d.t);break;
    case "rule":ui.rule[d.t]=!ui.rule[d.t];render();break;
    case "ch-words":sessChapterWords(+d.ch);break;
    case "due-words":startSession("Wörter · due",dueCards(c=>c.t==="w").slice(0,40).map(id=>({k:"card",id})));break;
    case "verbs":sessVerbs();break;
    case "wch":ui.chFilter=+d.ch;ui.search="";render();break;
    case "toggle-forms":ui.showForms=!ui.showForms;render();break;
    case "goto-ch":if(+d.ch<9){ui.tab="kapitel";render();requestAnimationFrame(()=>{const el=document.getElementById("ch-"+d.ch);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});});}else{ui.tab="kapitel";render();}break;
    case "goto-tab":ui.tab=d.t;render();break;
    case "set-current":S.progress.current=+d.ch;touch("progress");toast("Kapitel "+d.ch+" is now current");break;
    case "toggle-done":S.progress.done[d.ch]=!S.progress.done[d.ch];touch("progress");render();break;
    case "cando":{const k=d.k,v=+d.v;S.progress.cando[k]=S.progress.cando[k]===v?0:v;touch("progress");render();break;}
    case "wtab":ui.wtab=d.t;render();break;
    case "write-open":ui.tab="schreiben";ui.wtab="write";if(ui.write.prompt!==+d.p){ui.write={prompt:+d.p,text:"",busy:false,result:null,err:""};}render();window.scrollTo({top:0});break;
    case "write-back":ui.write.prompt=null;render();break;
    case "write-go":correctWriting();break;
    case "write-new":ui.write.text="";ui.write.result=null;render();break;
    case "hist":{const h=S.writing.items[+d.k];ui.write={prompt:h.p,text:h.text,busy:false,result:h.r,err:""};render();break;}
    case "scene":ui.chat={scene:+d.k,turns:[],busy:false,feedback:null,err:""};render();requestAnimationFrame(()=>{const i=$("#chatin");if(i)i.focus();});break;
    case "scene-back":ui.chat.scene=null;render();break;
    case "chat-send":sendChat();break;
    case "chat-feedback":chatFeedback();break;
    case "sp-start":{const sp=spk();sp.started=true;sayDe("Okay, los geht's.");spkAsk();break;}
    case "sp-send":spkSend();break;
    case "sp-feedback":spkFeedback();break;
    case "sp-reset":clearTimeout(spkTimer);if(ttsOk)try{speechSynthesis.cancel();}catch(_){}ui.speak=spkNew(ui.lesson);render();break;
    case "sp-replay":sayDe(d.t);break;
    case "sp-delay":spkCfg.delay=+d.d;saveSpkCfg();render();break;
    case "sp-rate":spkCfg.rate=+d.r;saveSpkCfg();render();break;
    case "sp-import":spkImport();break;
    case "sp-copy":{const ta=$("#spbrief"),msg=$("#sp-copied");const ok=()=>{if(msg)msg.textContent="Copied. Paste it into Claude's voice mode.";};
      try{navigator.clipboard.writeText(ta.value).then(ok,()=>{ta.focus();ta.select();if(msg)msg.textContent="Selected. Copy it with your device's copy command.";});}catch(_){ta.focus();ta.select();}break;}
    case "chat-reset":ui.chat={scene:ui.chat.scene,turns:[],busy:false,feedback:null,err:""};render();break;
    case "mist-del":S.mistakes.items=S.mistakes.items.filter(m=>m.key!==d.key);touch("mistakes");render();break;
    case "wr-clear":S.mistakes.items.forEach(m=>{if(m.tid==="writing")m.fixed=true;});touch("mistakes");render();break;
  }
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.cd)ui.cOpen[d.dataset.cd]=d.open;},true);
document.addEventListener("change",e=>{
  if(e.target.id==="sp-tts"){spkCfg.tts=e.target.checked;saveSpkCfg();if(!spkCfg.tts&&ttsOk)try{speechSynthesis.cancel();}catch(_){}}
  if(e.target.id==="sp-auto"){spkCfg.auto=e.target.checked;saveSpkCfg();clearTimeout(spkTimer);render();}
});
document.addEventListener("input",e=>{
  if(e.target.id==="lnotes"){S.notes.by[e.target.dataset.l]=e.target.value;touch("notes");return;}
  if(e.target.id==="spimp"&&ui.speak){ui.speak.imp=e.target.value;return;}
  if(e.target.id==="spin"&&ui.speak){ui.speak.draft=e.target.value;clearTimeout(spkTimer);
    if(spkCfg.auto&&e.target.value.trim()){spkTimer=setTimeout(spkSend,spkCfg.delay);const st=$("#sp-status");if(st)st.textContent="Listening… sends when you pause";}
    return;}
  if(e.target.id==="wtext"){ui.write.text=e.target.value;const wc=$("#wc");if(wc)wc.textContent=wordCount(e.target.value)+" words";}
  if(e.target.id==="wsearch"){ui.search=e.target.value;const pos=e.target.selectionStart;render();const el=$("#wsearch");if(el){el.focus();el.setSelectionRange(pos,pos);}}
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.shiftKey)return;
  if(e.target.id==="chatin"){e.preventDefault();sendChat();return;}
  if(e.target.id==="spin"){e.preventDefault();spkSend();return;}
  if(ui.tab!=="drill"||!ui.sess)return;
  if(e.target.tagName==="TEXTAREA")return;
  const it=curItem();if(!it)return;
  if(e.target.tagName==="BUTTON"&&!e.target.matches('[data-act="next"],[data-act="check"]'))return;
  e.preventDefault();
  if(it.intro&&!it.res){document.querySelector('[data-act="intro-go"]')?.click();return;}
  if(it.res)next();
  else if(it.k==="card"&&CARDS[it.id].kind==="phrase"){if(!it.revealed){it.revealed=true;render();}}
  else{const ins=[...document.querySelectorAll(".drill input:not([disabled])")];const i=ins.indexOf(e.target);if(i>=0&&i<ins.length-1&&!ins[i+1].value){ins[i+1].focus();return;}check();}
});

render();
connect();
</script>
