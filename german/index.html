<title>Der rote Faden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface-2:#E3EBE8; --line:#CFDBD7;
  --text:#11201C; --muted:#4F635D; --faint:#86968F;
  --accent:#0B9483; --accent-ink:#FFFFFF; --accent-soft:#D3EEEA;
  --thread:#D1343F;
  --der:#2F6FE4; --die:#C8407A; --das:#2E9A4E;
  --ok:#0B8A5C; --ok-soft:#DBF2E6; --warn:#B7790A; --warn-soft:#FBEFD5; --bad:#C62D2D; --bad-soft:#FBE3E3;
  --focus:#0B9483;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1211; --surface:#121B19; --surface-2:#19241F; --line:#263430;
    --text:#E3EEEA; --muted:#98ABA5; --faint:#65766F;
    --accent:#2FC6B1; --accent-ink:#06201B; --accent-soft:#12302B;
    --thread:#F0616B;
    --der:#6E9DFF; --die:#EE78A8; --das:#5BCB7B;
    --ok:#3CC98A; --ok-soft:#10301F; --warn:#E3AA2E; --warn-soft:#33270C; --bad:#F06262; --bad-soft:#3A1616;
    --focus:#2FC6B1;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1211; --surface:#121B19; --surface-2:#19241F; --line:#263430;
  --text:#E3EEEA; --muted:#98ABA5; --faint:#65766F;
  --accent:#2FC6B1; --accent-ink:#06201B; --accent-soft:#12302B;
  --thread:#F0616B;
  --der:#6E9DFF; --die:#EE78A8; --das:#5BCB7B;
  --ok:#3CC98A; --ok-soft:#10301F; --warn:#E3AA2E; --warn-soft:#33270C; --bad:#F06262; --bad-soft:#3A1616;
  --focus:#2FC6B1;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--text); font:15px/1.55 var(--body); padding-inline:16px; padding-block:0 64px; margin:0}
.app{max-width:980px; margin:0 auto}
h1,h2,h3{font-family:var(--display); margin:0; letter-spacing:-.01em; text-wrap:balance}
h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.mono,.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.eyebrow{font-size:.7rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:700}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

/* header */
.top{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding-block:22px 12px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:12px}
.knot{width:38px; height:38px; flex:none}
.brand h1{font-size:1.55rem; line-height:1.05}
.brand .sub{color:var(--muted); font-size:.82rem; margin-top:2px}
.save{font-size:.75rem; color:var(--muted); display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:3px 10px}
.save::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--faint)}
.save[data-s="db"]::before{background:var(--ok)}
.save[data-s="saving"]::before{background:var(--warn)}
.save[data-s="err"]::before{background:var(--bad)}
nav.tabs{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); display:flex; gap:4px; overflow-x:auto; padding-block:8px; margin-bottom:14px; border-bottom:1px solid var(--line); scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none; border:0; background:none; padding:7px 12px; border-radius:99px; color:var(--muted); font-weight:600; font-size:.9rem; display:flex; flex-direction:column; align-items:flex-start; line-height:1.15}
.tab small{font-size:.66rem; font-weight:500; color:var(--faint)}
.tab[aria-selected="true"]{background:var(--text); color:var(--bg)}
.tab[aria-selected="true"] small{color:var(--bg); opacity:.7}
.tab .dot{display:inline-block; min-width:18px; padding:0 5px; border-radius:99px; background:var(--thread); color:#fff; font-size:.66rem; font-family:var(--mono); margin-left:4px; text-align:center}

/* cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px}
.card-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.hint{font-size:.84rem; color:var(--muted)}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 14px; font-weight:600; display:inline-flex; align-items:center; gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{padding:12px 20px; font-size:1.02rem; border-radius:12px}
.btn.ghost{background:none; border-color:transparent; color:var(--muted)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.mini{border:1px solid var(--line); background:none; border-radius:8px; padding:3px 9px; font-size:.8rem; color:var(--muted); font-weight:600}
.mini:hover{color:var(--text); border-color:var(--muted)}
.pill{display:inline-flex; align-items:center; gap:4px; font-size:.72rem; font-weight:700; padding:2px 8px; border-radius:99px; background:var(--surface-2); color:var(--muted); white-space:nowrap}
.pill.ok{background:var(--ok-soft); color:var(--ok)} .pill.warn{background:var(--warn-soft); color:var(--warn)} .pill.bad{background:var(--bad-soft); color:var(--bad)} .pill.acc{background:var(--accent-soft); color:var(--accent)}
.bar{height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); border-radius:99px}
.field{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:9px 12px; width:100%}
textarea.field{min-height:170px; resize:vertical; line-height:1.6}
.seg{display:inline-flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:2px; flex-wrap:wrap}
.seg button{border:0; background:none; padding:5px 12px; border-radius:8px; font-weight:600; font-size:.85rem; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* the red thread timeline */
.thread{position:relative; padding:8px 0 4px}
.thread-line{position:absolute; left:0; right:0; top:22px; height:3px; background:var(--line); border-radius:3px}
.thread-line i{display:block; height:100%; background:var(--thread); border-radius:3px}
.knots{position:relative; display:grid; grid-template-columns:repeat(9,1fr); gap:2px}
.kn{display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:0; padding:0; color:var(--muted); font-size:.7rem; font-weight:600}
.kn b{width:28px; height:28px; border-radius:50%; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; font-family:var(--mono); font-size:.78rem; color:var(--muted)}
.kn[data-s="done"] b{background:var(--thread); border-color:var(--thread); color:#fff}
.kn[data-s="now"] b{border-color:var(--thread); color:var(--thread); box-shadow:0 0 0 4px color-mix(in srgb,var(--thread) 18%,transparent)}
.kn[data-s="now"]{color:var(--text)}

/* hero */
.hero{display:grid; grid-template-columns:1.4fr 1fr; gap:14px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.today-card{background:var(--text); color:var(--bg); border-radius:16px; padding:22px; display:flex; flex-direction:column; gap:14px; position:relative; overflow:hidden}
.today-card .eyebrow{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.today-card h2{font-size:1.7rem; line-height:1.1}
.today-card .mix{display:flex; gap:18px; flex-wrap:wrap}
.today-card .mix div{display:flex; flex-direction:column}
.today-card .mix b{font-family:var(--mono); font-size:1.5rem; line-height:1.1}
.today-card .mix span{font-size:.75rem; opacity:.75}
.today-card .btn.primary{align-self:flex-start}
.stat{display:flex; flex-direction:column; gap:2px}
.stat b{font-family:var(--mono); font-size:1.35rem; line-height:1.15}
.stat span{font-size:.76rem; color:var(--muted)}

/* chapter */
.chap{display:grid; grid-template-columns:56px 1fr; gap:14px}
.chap-n{font-family:var(--display); font-size:2.4rem; font-weight:800; line-height:1; color:var(--faint)}
.chap[data-s="now"] .chap-n{color:var(--thread)}
.chap[data-s="done"] .chap-n{color:var(--accent)}
.parts{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.part{font-size:.78rem; background:var(--surface-2); border-radius:8px; padding:3px 8px}
.part .mono{color:var(--muted); font-size:.72rem; margin-left:4px}
.cando{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:6px}
.cando li{display:flex; gap:10px; align-items:flex-start; font-size:.88rem}
.cando .seg button{padding:2px 9px; font-size:.74rem}
.topiclist{display:flex; flex-direction:column; gap:6px; margin-top:10px}
.topic-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
.topic-row .t{font-weight:600; font-size:.9rem}
.topic-row .ref{font-size:.74rem; color:var(--muted)}
.acc{font-family:var(--mono); font-size:.8rem}

/* drill */
.drill{max-width:680px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
.drill-top{display:flex; align-items:center; gap:12px}
.drill-top .bar{flex:1}
.q{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:24px 22px; display:flex; flex-direction:column; gap:16px}
.q .kind{display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap}
.prompt{font-family:var(--display); font-size:1.6rem; line-height:1.2; font-weight:700}
.prompt.sm{font-size:1.25rem}
.sentence{font-size:1.25rem; line-height:1.9}
.blank{display:inline-block; min-width:90px; border:0; border-bottom:2px solid var(--accent); background:var(--accent-soft); border-radius:6px 6px 0 0; padding:0 8px; font-size:1.1rem; font-weight:600; text-align:center}
.blank.ok{border-color:var(--ok); background:var(--ok-soft); color:var(--ok)}
.blank.no{border-color:var(--bad); background:var(--bad-soft); color:var(--bad)}
.blank.typo{border-color:var(--warn); background:var(--warn-soft); color:var(--warn)}
.ans{font-size:1.15rem; padding:12px 14px}
.ans.ok{border-color:var(--ok); background:var(--ok-soft)} .ans.no{border-color:var(--bad); background:var(--bad-soft)} .ans.typo{border-color:var(--warn); background:var(--warn-soft)}
.uml{display:flex; gap:6px; flex-wrap:wrap}
.uml button{border:1px solid var(--line); background:var(--surface-2); border-radius:8px; width:40px; height:34px; font-weight:700}
.fb{border-radius:12px; padding:12px 14px; font-size:.92rem; display:flex; flex-direction:column; gap:6px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)} .fb.typo{background:var(--warn-soft)}
.fb b.h{font-family:var(--display); font-size:1.05rem}
.fb .right{font-weight:700}
.opts{display:flex; flex-wrap:wrap; gap:8px}
.opt{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:10px 16px; font-weight:600; font-size:1rem}
.opt.ok{border-color:var(--ok); background:var(--ok-soft); color:var(--ok)} .opt.no{border-color:var(--bad); background:var(--bad-soft); color:var(--bad)}
.tiles{display:flex; flex-wrap:wrap; gap:8px; min-height:48px; padding:8px; border-radius:12px}
.tiles.built{border:2px dashed var(--line)}
.tilebtn{border:1px solid var(--line); background:var(--surface-2); border-radius:9px; padding:7px 12px; font-weight:600}
.tiles.built .tilebtn{background:var(--accent-soft); border-color:var(--accent)}
.g-der{color:var(--der)} .g-die{color:var(--die)} .g-das{color:var(--das)}
.gbar{width:6px; align-self:stretch; border-radius:6px; background:var(--line)}
.gbar.der{background:var(--der)} .gbar.die{background:var(--die)} .gbar.das{background:var(--das)}
.plural{font-size:.95rem; color:var(--muted)}
.keys{font-size:.74rem; color:var(--faint)}
.kbd{font-family:var(--mono); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; font-size:.7rem}
.self{display:grid; grid-template-columns:1fr 1fr; gap:10px}

/* rule box */
.rule{font-size:.9rem; line-height:1.6; display:flex; flex-direction:column; gap:8px}
.rule table{border-collapse:collapse; font-size:.84rem}
.rule th,.rule td{border:1px solid var(--line); padding:4px 8px; text-align:left}
.rule th{background:var(--surface-2); font-weight:700}
.rule code,.rule em{font-style:normal; font-weight:700; color:var(--accent)}
.tablewrap{overflow-x:auto}

/* lists */
.words{display:flex; flex-direction:column}
.word{display:grid; grid-template-columns:6px 1fr auto; gap:12px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line)}
.word:last-child{border-bottom:0}
.word .de{font-weight:600}
.word .en{font-size:.84rem; color:var(--muted)}
.boxes{display:inline-flex; gap:3px}
.boxes i{width:7px; height:7px; border-radius:2px; background:var(--surface-2)}
.boxes i.on{background:var(--accent)}
.vtable{width:100%; border-collapse:collapse; font-size:.86rem}
.vtable th{text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--line)}
.vtable td{padding:6px 8px; border-bottom:1px solid var(--line)}
.vtable td:first-child{font-weight:600}

/* writing + chat */
.corr{display:flex; flex-direction:column; gap:10px}
.corrected{background:var(--surface-2); border-radius:10px; padding:12px 14px; line-height:1.7}
.err{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:.9rem}
.err:last-child{border-bottom:0}
.err s{color:var(--bad)} .err ins{text-decoration:none; color:var(--ok); font-weight:700}
.grade{font-family:var(--display); font-size:2.6rem; font-weight:800; line-height:1}
.chat{display:flex; flex-direction:column; gap:10px; max-height:460px; overflow-y:auto; padding:4px}
.msg{max-width:85%; padding:10px 14px; border-radius:14px; font-size:.95rem; white-space:pre-wrap}
.msg.them{background:var(--surface-2); align-self:flex-start; border-bottom-left-radius:4px}
.msg.me{background:var(--accent); color:var(--accent-ink); align-self:flex-end; border-bottom-right-radius:4px}
.msg .fix{display:block; margin-top:6px; font-size:.82rem; color:var(--warn); font-weight:600}
.scen{display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 14px}
.scen[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.scen b{font-size:.92rem} .scen span{font-size:.8rem; color:var(--muted)}
.mist{display:grid; grid-template-columns:1fr auto; gap:6px 12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:.9rem}
.mist:last-child{border-bottom:0}
.empty{color:var(--muted); font-size:.9rem; padding:12px 0}
.note{border-left:3px solid var(--thread); padding:4px 0 4px 12px; font-size:.88rem; color:var(--muted)}
.spark{display:flex; align-items:flex-end; gap:3px; height:44px}
.spark i{flex:1; background:var(--accent); border-radius:2px 2px 0 0; min-height:2px; opacity:.85}
.spark i.z{background:var(--surface-2); opacity:1}
.spark i.t{background:var(--thread)}
details.rulebox summary{cursor:pointer; font-weight:600; font-size:.88rem; color:var(--accent)}
details.rulebox[open] summary{margin-bottom:8px}
/* course */
.course{display:grid; grid-template-columns:250px minmax(0,1fr); gap:20px; align-items:start}
.rail{position:sticky; top:calc(env(safe-area-inset-top,0px) + 70px); max-height:calc(100vh - 90px); overflow-y:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px}
.rail-toggle{display:none; width:100%; border:0; background:none; font-weight:700; text-align:left; justify-content:space-between; padding:4px 2px}
.rail-g{display:flex; flex-direction:column; gap:2px; margin-bottom:12px}
.rail-g .eyebrow{margin:0 0 4px 4px}
.rail-i{display:grid; grid-template-columns:10px 28px 1fr; gap:6px; align-items:center; text-align:left; border:0; background:none; border-radius:8px; padding:5px 6px; font-size:.82rem; color:var(--text)}
.rail-i:hover{background:var(--surface-2)}
.rail-i[aria-current="true"]{background:var(--text); color:var(--bg)}
.rail-i .mono{font-size:.72rem; opacity:.75}
.rail-i .rt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ld{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--line); flex:none}
.ld[data-s="partial"]{background:var(--warn)}
.ld[data-s="done"]{background:var(--thread)}
.lx-head{display:flex; flex-direction:column; gap:8px; padding-bottom:14px; border-bottom:2px solid var(--text)}
.lx-title{font-size:1.9rem; line-height:1.1}
.goals{margin:2px 0 4px; padding-left:18px; font-size:.9rem; color:var(--muted)}
.lmodes{align-self:flex-start}
.lesson{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:26px 28px; line-height:1.7; max-width:760px}
.lesson h3{font-size:1.15rem; margin:22px 0 8px}
.lesson h3:first-child{margin-top:0}
.lesson p{margin:0 0 10px}
.lesson table,.rule table{border-collapse:collapse; font-size:.86rem; margin:8px 0 12px}
.lesson th,.lesson td{border:1px solid var(--line); padding:6px 9px; text-align:left; vertical-align:top}
.lesson th{background:var(--surface-2)}
.lesson em{font-style:normal; font-weight:700; color:var(--accent)}
.formula{font-family:var(--mono); font-size:.92rem; background:var(--surface-2); border:1px dashed var(--line); border-radius:10px; padding:12px 14px; margin:10px 0 14px; text-align:center}
.formula span{color:var(--thread); font-weight:700}
.ex{border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:10px 0 14px}
.ex-h{background:var(--text); color:var(--bg); font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.09em; padding:5px 12px}
.ex p{margin:0; padding:6px 14px}
.ex p:first-of-type{padding-top:10px} .ex p:last-child{padding-bottom:10px}
.trap{background:var(--bad-soft); border-left:3px solid var(--bad); border-radius:0 10px 10px 0; padding:10px 14px; margin:10px 0 14px; font-size:.92rem}
.trap b{color:var(--bad)}
.book{background:var(--accent-soft); border-left:3px solid var(--accent); border-radius:0 10px 10px 0; padding:10px 14px; margin-top:16px; font-size:.9rem}
.lx-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; max-width:760px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:.8rem; background:var(--surface-2); border-radius:8px; padding:3px 9px}
.reading{font-size:1.02rem; line-height:1.8; margin-top:8px}
.reading p{margin:0 0 8px}
.rq{display:flex; flex-direction:column; gap:8px}
.btn.inv{background:transparent; color:var(--bg); border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
@media (max-width:860px){
  .course{grid-template-columns:1fr}
  .rail{position:static; max-height:none}
  .rail-toggle{display:flex}
  .rail:not(.open) .rail-body{display:none}
  .rail.open .rail-body{margin-top:10px}
  .lesson{padding:18px 16px}
  .lx-title{font-size:1.5rem}
}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:99px; font-size:.86rem; font-weight:600; z-index:20}
@media (prefers-reduced-motion:no-preference){
  .q{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(4px); opacity:.6}to{transform:none; opacity:1}}
}

perfekt:{ch:1,title:"Perfekt: haben or sein?",ga:[[24,127],[25,131]],
 rule:`<p>Perfekt = <em>haben/sein</em> (position 2) + <em>Partizip II</em> (end).</p>
 <p>Use <em>sein</em> with movement from A to B (<i>gehen, fahren, fliegen, umziehen</i>), change of state (<i>aufstehen, werden, sterben</i>), and <i>sein, bleiben, passieren</i>. Everything else, including all reflexive verbs, takes <em>haben</em>.</p>
 <p class="hint">Swiss and southern German also say <i>ich bin gesessen/gestanden/gelegen</i>. Both are accepted here.</p>`,
 items:[
 {q:"Ich ___ in Winterthur zur Schule gegangen.",a:["bin"],why:"gehen = movement → sein"},
 {q:"Nach der Schule ___ sie eine Ausbildung gemacht.",a:["hat"],why:"machen → haben"},
 {q:"2022 ___ wir nach Zürich umgezogen.",a:["sind"],why:"umziehen = change of place → sein"},
 {q:"Wann ___ du dein Studium abgeschlossen?",a:["hast"],why:"abschließen has an object → haben"},
 {q:"Er ___ drei Jahre in Berlin geblieben.",a:["ist"],why:"bleiben always takes sein"},
 {q:"___ ihr schon einmal in Wien gewesen?",a:["Seid"],why:"sein → ist gewesen"},
 {q:"Heute Morgen ___ ich um sechs aufgestanden.",a:["bin"],why:"aufstehen = change of state → sein"},
 {q:"Wir ___ uns im Kurs kennengelernt.",a:["haben"],why:"Reflexive verbs always take haben"},
 {q:"Was ___ gestern passiert?",a:["ist"],why:"passieren → sein"},
 {q:"Sie ___ bei einer Bank ein Praktikum gemacht.",a:["hat"],why:"machen → haben"},
 {t:"o",w:["Ich","habe","gestern","viele","E-Mails","geschrieben"],alt:["Gestern habe ich viele E-Mails geschrieben"],en:"I wrote a lot of emails yesterday.",why:"Auxiliary in position 2, participle at the end"},
 {t:"o",w:["Wann","bist","du","nach Bern","gefahren","?"],en:"When did you go to Bern?",why:"W-question: question word, auxiliary, subject … participle"}
 ]},
partizip:{ch:1,title:"Partizip II forms",ga:[[26,135]],
 rule:`<p>Regular: <em>ge-…-t</em> (gemacht). Irregular: <em>ge-…-en</em>, often with a vowel change (geschrieben).</p>
 <p>Separable verbs put <em>ge</em> after the prefix: <i>ein<b>ge</b>kauft</i>. Verbs with <em>be-, ver-, er-, ent-, emp-, ge-, zer-</em> and verbs ending in <em>-ieren</em> get no ge-: <i>bezahlt, vergessen, studiert</i>.</p>`,
 items:[
 {q:"Ich habe den Film schon ___. (sehen)",a:["gesehen"]},
 {q:"Hast du die E-Mail ___? (lesen)",a:["gelesen"]},
 {q:"Er hat im Lotto viel Geld ___. (gewinnen)",a:["gewonnen"]},
 {q:"Wir haben die Rechnung schon ___. (bezahlen)",a:["bezahlt"],why:"be- prefix: no ge-"},
 {q:"Ich habe gestern ___. (einkaufen)",a:["eingekauft"],why:"separable: ein + ge + kauft"},
 {q:"Hast du den Termin ___? (vereinbaren)",a:["vereinbart"],why:"ver- prefix: no ge-"},
 {q:"Er hat Biologie ___. (studieren)",a:["studiert"],why:"-ieren verbs: no ge-"},
 {q:"Ich habe meinen Schlüssel ___. (vergessen)",a:["vergessen"]},
 {q:"Wann hat der Kurs ___? (anfangen)",a:["angefangen"]},
 {q:"Sie hat mich am Bahnhof ___. (abholen)",a:["abgeholt"]},
 {q:"Wir haben lange ___. (diskutieren)",a:["diskutiert"]},
 {q:"Der Chef hat mir eine Stelle ___. (anbieten)",a:["angeboten"]},
 {q:"Hast du gut ___? (schlafen)",a:["geschlafen"]},
 {q:"Ich habe dich nicht ___. (verstehen)",a:["verstanden"]}
 ]},
trennbar:{ch:1,title:"Separable and inseparable verbs",ga:[[7,45],[52,261]],
 rule:`<p>Separable prefix (<i>an, auf, aus, ein, mit, um, zurück…</i>) goes to the <em>end</em> of the main clause: <i>Ich <b>rufe</b> dich morgen <b>an</b>.</i></p>
 <p>In a subordinate clause or with a modal verb it stays attached: <i>…, weil ich dich morgen <b>anrufe</b></i>. Inseparable prefixes (<i>be-, ver-, er-, ent-</i>) never split.</p>`,
 items:[
 {q:"Der Zug ___ um 8 Uhr ___. (abfahren)",a:["fährt","ab"]},
 {q:"Wann ___ du heute Abend ___? (zurückkommen)",a:["kommst","zurück"]},
 {q:"Ich ___ dich morgen ___. (anrufen)",a:["rufe","an"]},
 {q:"Sie ___ ihre Freunde zum Essen ___. (einladen)",a:["lädt","ein"]},
 {q:"Er ___ die Rechnung sofort. (bezahlen)",a:["bezahlt"],why:"be- never separates"},
 {q:"Wir ___ am Samstag ___. (umziehen)",a:["ziehen","um"]},
 {q:"___ Sie bitte das Formular ___! (ausfüllen)",a:["Füllen","aus"],why:"Imperative: verb first, prefix at the end"},
 {q:"Ich kann dich morgen ___. (anrufen)",a:["anrufen"],why:"With a modal verb the infinitive stays whole"},
 {t:"o",w:["Ich","stehe","jeden Tag","um sechs","auf"],alt:["Jeden Tag stehe ich um sechs auf","Um sechs stehe ich jeden Tag auf"],en:"I get up at six every day.",why:"Prefix auf goes to the end"},
 {t:"o",w:["Ich","weiß",",","dass","der Kurs","um acht","anfängt"],en:"I know that the course starts at eight.",why:"In a dass-clause the verb goes last, prefix attached"}
 ]},
reflexiv:{ch:1,title:"Reflexive verbs",ga:[[29,148]],
 rule:`<div class="tablewrap"><table><tr><th>ich</th><th>du</th><th>er/sie/es</th><th>wir</th><th>ihr</th><th>sie/Sie</th></tr><tr><td>mich</td><td>dich</td><td>sich</td><td>uns</td><td>euch</td><td>sich</td></tr></table></div>
 <p>Common ones: <i>sich beeilen, sich duschen, sich freuen auf/über, sich interessieren für, sich erinnern an, sich treffen, sich verlieben in</i>. Perfekt always with <em>haben</em>.</p>`,
 items:[
 {q:"Ich dusche ___ jeden Morgen.",a:["mich"]},
 {q:"Beeil ___! Der Bus kommt.",a:["dich"]},
 {q:"Er interessiert ___ für Geschichte.",a:["sich"]},
 {q:"Wir treffen ___ um acht vor dem Kino.",a:["uns"]},
 {q:"Freut ihr ___ auf den Urlaub?",a:["euch"]},
 {q:"Sie hat ___ in ihren Kollegen verliebt.",a:["sich"]},
 {q:"Ich kann ___ nicht an seinen Namen erinnern.",a:["mich"]},
 {q:"Haben Sie ___ schon vorgestellt?",a:["sich"]},
 {q:"Du musst ___ beeilen.",a:["dich"]}
 ]},
genus:{ch:1,title:"der, die or das? Gender rules",ga:[[48,243]],
 rule:`<p>Endings that decide gender for you:</p>
 <div class="tablewrap"><table><tr><th class="g-die">die</th><td>-ung, -heit, -keit, -schaft, -ion, -tät, -ur, -ik, most -e</td></tr>
 <tr><th class="g-das">das</th><td>-chen, -lein, -ment, -um, verbs used as nouns (das Essen)</td></tr>
 <tr><th class="g-der">der</th><td>-ling, -ismus, -or, -ist, days, months, seasons</td></tr></table></div>
 <p>Compounds take the gender of the <em>last</em> word: <i>die Tür + der Schlüssel = der Türschlüssel</i>.</p>`,
 items:[
 {t:"c",q:"___ Zeitung",o:["der","die","das"],a:1,why:"-ung → die"},
 {t:"c",q:"___ Mädchen",o:["der","die","das"],a:2,why:"-chen → das"},
 {t:"c",q:"___ Freiheit",o:["der","die","das"],a:1,why:"-heit → die"},
 {t:"c",q:"___ Frühling",o:["der","die","das"],a:0,why:"-ling and seasons → der"},
 {t:"c",q:"___ Information",o:["der","die","das"],a:1,why:"-ion → die"},
 {t:"c",q:"___ Zentrum",o:["der","die","das"],a:2,why:"-um → das"},
 {t:"c",q:"___ Mannschaft",o:["der","die","das"],a:1,why:"-schaft → die"},
 {t:"c",q:"___ Dokument",o:["der","die","das"],a:2,why:"-ment → das"},
 {t:"c",q:"___ Optimismus",o:["der","die","das"],a:0,why:"-ismus → der"},
 {t:"c",q:"___ Kultur",o:["der","die","das"],a:1,why:"-ur → die"},
 {t:"c",q:"___ Universität",o:["der","die","das"],a:1,why:"-tät → die"},
 {t:"c",q:"___ Kinderarzt",o:["der","die","das"],a:0,why:"Compound: der Arzt decides"},
 {t:"c",q:"___ Schwimmen",o:["der","die","das"],a:2,why:"Verb as noun → das"},
 {t:"c",q:"___ Montag",o:["der","die","das"],a:0,why:"Days → der"},
 {t:"c",q:"___ Möglichkeit",o:["der","die","das"],a:1,why:"-keit → die"}
 ]},
genitiv:{ch:1,title:"Genitive (possession)",ga:[[63,314]],
 rule:`<div class="tablewrap"><table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr><tr><th>Genitiv</th><td>des Vaters</td><td>der Mutter</td><td>des Kindes</td><td>der Eltern</td></tr><tr><th></th><td>eines/meines</td><td>einer/meiner</td><td>eines/meines</td><td>meiner</td></tr></table></div>
 <p>Masculine and neuter nouns add <em>-s</em> or <em>-es</em>. Names just take -s: <i>Annas Buch</i>. In speech people often use <i>von + Dativ</i> instead.</p>`,
 items:[
 {q:"Das ist das Auto ___ Vaters.",a:["des"]},
 {q:"Die Wohnung ___ Freundin ist sehr klein. (meine)",a:["meiner"]},
 {q:"Der Name ___ Firma ist KAKO.",a:["der"]},
 {q:"Das Ende ___ Films war traurig.",a:["des"]},
 {q:"Die Farbe ___ Hauses gefällt mir.",a:["des"]},
 {q:"Das ist die Meinung ___ Kollegen. (Pl.)",a:["der"]},
 {q:"Die Adresse ___ Hotels steht im Prospekt. (ein)",a:["eines"]}
 ]},
modal:{ch:2,title:"Modal verbs: present and past",ga:[[5,36],[6,41],[27,140]],
 rule:`<div class="tablewrap"><table><tr><th></th><th>können</th><th>müssen</th><th>wollen</th><th>dürfen</th><th>sollen</th><th>mögen</th></tr>
 <tr><th>ich/er</th><td>kann</td><td>muss</td><td>will</td><td>darf</td><td>soll</td><td>mag</td></tr>
 <tr><th>Prät. ich/er</th><td>konnte</td><td>musste</td><td>wollte</td><td>durfte</td><td>sollte</td><td>mochte</td></tr></table></div>
 <p>In the past, speak and write modal verbs in the <em>Präteritum</em>, not Perfekt: <i>Ich musste arbeiten.</i> No umlaut in the past. The second verb goes to the end as an infinitive.</p>`,
 items:[
 {q:"Als Kind ___ ich jeden Tag Klavier üben. (müssen, Prät.)",a:["musste"]},
 {q:"Früher ___ er sehr gut singen. (können, Prät.)",a:["konnte"]},
 {q:"___ du mit ins Kino kommen? (wollen)",a:["Willst"]},
 {q:"Hier ___ man nicht fotografieren. (dürfen)",a:["darf"]},
 {q:"Wir ___ gestern nicht kommen. (können, Prät.)",a:["konnten"]},
 {q:"Sie ___ eigentlich Ärztin werden. (wollen, Prät.)",a:["wollte"]},
 {q:"Was ___ ich mitbringen? (sollen)",a:["soll"]},
 {q:"Ihr ___ nicht so spät nach Hause kommen. (dürfen, Prät.)",a:["durftet"]},
 {q:"Er ___ keinen Fisch. (mögen)",a:["mag"]},
 {q:"Du ___ das nicht machen. (müssen)",a:["musst"]},
 {t:"o",w:["Ich","musste","gestern","lange","arbeiten"],alt:["Gestern musste ich lange arbeiten"],en:"I had to work late yesterday.",why:"Modal in position 2, infinitive at the end"}
 ]},
praet:{ch:2,title:"Präteritum (simple past)",ga:[[23,123],[49,246]],
 rule:`<p>Regular: stem + <em>-te</em>: <i>ich/er lebte, wir lebten</i>. Irregular verbs change the vowel and have no ending in ich/er: <i>ich/er gab, schrieb, kam</i>.</p>
 <p>Use it for <em>sein, haben</em>, modal verbs, and in written stories and biographies. In conversation, use Perfekt for everything else.</p>`,
 items:[
 {q:"Mozart ___ schon als Kind Konzerte. (geben)",a:["gab"]},
 {q:"Er ___ über 600 Musikstücke. (schreiben)",a:["schrieb"]},
 {q:"Die Familie ___ oft nach Italien. (reisen)",a:["reiste"]},
 {q:"1791 ___ Mozart in Wien. (sterben)",a:["starb"]},
 {q:"Sie ___ zehn Jahre in Paris. (leben)",a:["lebte"]},
 {q:"Wir ___ keine Zeit. (haben)",a:["hatten"]},
 {q:"Das Konzert ___ ein großer Erfolg. (sein)",a:["war"]},
 {q:"Er ___ mit Musik viel Geld. (verdienen)",a:["verdiente"]},
 {q:"Der Film ___ um acht Uhr. (beginnen)",a:["begann"]},
 {q:"Ich ___ den Bus. (verpassen)",a:["verpasste"]},
 {q:"Plötzlich ___ das Telefon. (klingeln)",a:["klingelte"]},
 {q:"Sie ___ in den Zug und ___ nach Basel. (steigen, fahren)",a:["stieg","fuhr"]}
 ]},
negation:{ch:2,title:"nicht or kein?",ga:[[15,85]],
 rule:`<p><em>kein</em> negates a noun that would otherwise have <i>ein</i> or no article: <i>Ich habe <b>keine</b> Zeit.</i> It takes the same endings as <i>ein</i>.</p>
 <p><em>nicht</em> negates everything else: verbs, adjectives, nouns with <i>der/die/das</i> or a possessive. It usually goes before what it negates, or at the end of the clause.</p>`,
 items:[
 {q:"Ich habe heute ___ Zeit.",a:["keine"]},
 {q:"Das Museum ist montags ___ geöffnet.",a:["nicht"]},
 {q:"Er spielt ___ Instrument.",a:["kein"]},
 {q:"Wir gehen heute ___ ins Kino.",a:["nicht"]},
 {q:"Das ist ___ mein Handy.",a:["nicht"],why:"Possessive → nicht"},
 {q:"Sie hat ___ Geschwister.",a:["keine"]},
 {q:"Ich trinke ___ Kaffee.",a:["keinen"],why:"der Kaffee, Akkusativ → keinen"},
 {q:"Er kommt heute ___.",a:["nicht"]},
 {q:"Nein, ich habe ___ Hund, sondern eine Katze.",a:["keinen"]},
 {q:"Der Film war ___ spannend.",a:["nicht"]}
 ]},
weilwenn:{ch:3,title:"Subordinate clauses: weil and wenn",ga:[[42,218]],
 rule:`<p>After <em>weil</em> (because), <em>wenn</em> (if/when), <em>dass</em>, <em>obwohl</em> the conjugated verb goes to the <em>end</em>.</p>
 <p>If the subordinate clause comes first, the main clause starts with the verb: <i>Wenn ich Zeit habe, <b>gehe</b> ich einkaufen.</i> (verb, comma, verb)</p>`,
 items:[
 {t:"o",w:["Ich","kaufe","online",",","weil","es","billiger","ist"],en:"I buy online because it's cheaper.",why:"weil sends the verb to the end"},
 {t:"o",w:["Wenn","ich","Zeit","habe",",","gehe","ich","einkaufen"],alt:["Ich gehe einkaufen , wenn ich Zeit habe"],en:"When I have time, I go shopping.",why:"Clause first → main clause starts with the verb"},
 {t:"o",w:["Er","spart","Geld",",","weil","er","ein","Auto","kaufen","will"],en:"He's saving money because he wants to buy a car.",why:"Modal verb goes to the very end"},
 {t:"o",w:["Ich","bleibe","zu Hause",",","wenn","es","regnet"],alt:["Wenn es regnet , bleibe ich zu Hause"],en:"I stay home if it rains."},
 {q:"Ich gehe nicht mit, ___ ich kein Geld habe.",a:["weil"]},
 {q:"___ du Lust hast, können wir essen gehen.",a:["Wenn"]},
 {q:"Sie bezahlt bar, ___ sie keine Kreditkarte hat.",a:["weil"]},
 {q:"Ich bin müde. → Ich gehe schlafen, weil ich müde ___.",a:["bin"]},
 {q:"Wenn das Wetter schön ist, ___ wir wandern. (gehen)",a:["gehen"]}
 ]},
datakk:{ch:3,title:"Verbs with dative and accusative",ga:[[20,105],[21,110],[22,114]],
 rule:`<p>Give <em>someone (Dativ)</em> <em>something (Akkusativ)</em>: <i>Ich schenke <b>meiner Mutter</b> <b>Blumen</b>.</i> Typical: <i>geben, schenken, zeigen, erklären, empfehlen, schicken, bringen</i>.</p>
 <p>Dative-only verbs: <i>helfen, danken, gefallen, gehören, passen, antworten</i>.</p>
 <div class="tablewrap"><table><tr><th>Nom</th><td>ich</td><td>du</td><td>er</td><td>sie</td><td>wir</td><td>ihr</td><td>sie/Sie</td></tr><tr><th>Akk</th><td>mich</td><td>dich</td><td>ihn</td><td>sie</td><td>uns</td><td>euch</td><td>sie/Sie</td></tr><tr><th>Dat</th><td>mir</td><td>dir</td><td>ihm</td><td>ihr</td><td>uns</td><td>euch</td><td>ihnen/Ihnen</td></tr></table></div>
 <p>Two pronouns: accusative first. <i>Gib <b>es mir</b>!</i></p>`,
 items:[
 {q:"Ich schenke ___ Mutter Blumen. (meine)",a:["meiner"]},
 {q:"Kannst du ___ das Buch geben? (ich)",a:["mir"]},
 {q:"Er hilft ___ Kollegen. (sein, Sg.)",a:["seinem"]},
 {q:"Die Jacke gefällt ___ sehr. (ich)",a:["mir"]},
 {q:"Ich gebe ___ das Geld morgen. (er)",a:["ihm"]},
 {q:"Gehört das Handy ___? (du)",a:["dir"]},
 {q:"Wir danken ___ für Ihre Hilfe. (Sie)",a:["Ihnen"]},
 {q:"Ich zeige ___ die Fotos. (sie, Pl.)",a:["ihnen"]},
 {q:"Der Verkäufer empfiehlt ___ einen Laptop. (wir)",a:["uns"]},
 {q:"Das Kleid passt ___ nicht. (sie, Sg.)",a:["ihr"]},
 {q:"Gib ___ ___! (es, ich)",a:["es","mir"],why:"Two pronouns: accusative before dative"}
 ]},
k2wish:{ch:3,title:"Konjunktiv II: wishes and what-ifs",ga:[[55,275],[56,280]],

 {q:"Es ___ schön, wenn du kommst. (sein)",a:["wäre"]},
 {q:"Wenn wir ein Auto ___, ___ wir ans Meer fahren. (haben, werden)",a:["hätten","würden"]},
 {q:"Ich ___ jetzt lieber am Strand. (sein)",a:["wäre"]},
 {t:"o",w:["Wenn","ich","im Lotto","gewinnen","würde",",","würde","ich","eine Weltreise","machen"],en:"If I won the lottery, I'd travel around the world."}

verbprep:{ch:4,title:"Verbs with prepositions",ga:[[53,265],[54,270]],
 rule:`<p>Learn the verb together with its preposition and case:</p>
 <div class="tablewrap"><table><tr><td>warten auf + A</td><td>sich freuen auf + A (future)</td><td>sich freuen über + A (now/past)</td></tr><tr><td>sprechen über + A</td><td>sich interessieren für + A</td><td>sich beschweren über + A</td></tr><tr><td>teilnehmen an + D</td><td>denken an + A</td><td>Angst haben vor + D</td></tr><tr><td>sich bewerben um + A</td><td>sich kümmern um + A</td><td>träumen von + D</td></tr></table></div>
 <p>Questions about things: <em>wo(r) + preposition</em>: <i>Worauf wartest du?</i> Answers: <em>da(r) + preposition</em>: <i>Ich warte darauf.</i></p>`,
 items:[
 {q:"Ich warte ___ den Bus.",a:["auf"]},
 {q:"Sie freut sich ___ den Urlaub nächste Woche.",a:["auf"]},
 {q:"Er freut sich ___ das Geschenk, das er bekommen hat.",a:["über"]},
 {q:"Wir sprechen morgen ___ das Problem.",a:["über"]},
 {q:"Ich interessiere mich ___ Politik.",a:["für"]},
 {q:"Sie hat sich ___ den Service beschwert.",a:["über"]},
 {q:"Ich nehme ___ der Sitzung teil.",a:["an"]},
 {q:"Er denkt oft ___ seine Familie.",a:["an"]},
 {q:"Ich habe Angst ___ Spinnen.",a:["vor"]},
 {q:"Wir bewerben uns ___ die Stelle.",a:["um"]},
 {q:"___ freust du dich? – Auf das Wochenende.",a:["Worauf"]},
 {q:"Interessierst du dich für Kunst? – Ja, ich interessiere mich sehr ___.",a:["dafür"]}
 ]},
indirekt:{ch:4,title:"Indirect questions and dass",ga:[[67,335],[42,218]],
 rule:`<p>Polite questions wrap the real question in a lead-in: <i>Können Sie mir sagen, … / Wissen Sie, … / Ich möchte wissen, …</i> The verb goes to the <em>end</em>.</p>
 <p>W-question → keep the W-word: <i>…, wann der Zug <b>abfährt</b>?</i> Yes/no question → <em>ob</em>: <i>…, ob Frau Meier im Büro <b>ist</b>?</i></p>`,
 items:[
 {t:"o",w:["Können","Sie","mir","sagen",",","wann","der Zug","abfährt","?"],en:"Can you tell me when the train leaves?"},
 {t:"o",w:["Wissen","Sie",",","ob","Frau Meier","im Büro","ist","?"],en:"Do you know whether Ms. Meier is in the office?"},
 {t:"o",w:["Ich","glaube",",","dass","die Sitzung","um zehn","beginnt"],en:"I think the meeting starts at ten."},
 {q:"Weißt du, ___ er heute kommt? (yes/no question)",a:["ob"]},
 {q:"Ich weiß nicht, ___ viel das kostet.",a:["wie"]},
 {q:"Er sagt, ___ er krank ist.",a:["dass"]},
 {q:"Können Sie mir sagen, ___ das Büro ist?",a:["wo"]},
 {q:"Ich frage mich, ___ sie nicht anruft.",a:["warum|wieso"]},
 {q:"Wissen Sie, wann der Chef zurück___? (kommen)",a:["kommt"]}
 ]},
lokal:{ch:5,title:"Where to? nach, in, zu, an",ga:[[35,178]],
 rule:`<div class="tablewrap"><table><tr><th>nach</th><td>cities, countries without article, <i>nach Hause</i></td><td>nach Italien, nach Bern</td></tr><tr><th>in + Akk</th><td>countries with article, closed spaces, mountains</td><td>in die Schweiz, ins Kino, in die Berge</td></tr><tr><th>zu + Dat</th><td>people, shops, institutions</td><td>zum Arzt, zur Bank, zu Anna</td></tr><tr><th>an + Akk</th><td>water, edges</td><td>ans Meer, an den See</td></tr></table></div>
 <p>Where? <i>zu Hause, in der Schweiz, beim Arzt, am Meer</i>. Where from? <i>aus Spanien, vom Arzt</i>.</p>`,
 items:[
 {q:"Wir fahren ___ Italien.",a:["nach"]},
 {q:"Sie fliegt ___ die Schweiz.",a:["in"]},
 {q:"Ich gehe heute ___ Arzt.",a:["zum"]},
 {q:"Wir fahren im Sommer ___ Meer.",a:["ans"]},
 {q:"Er fährt jetzt ___ Hause.",a:["nach"]},
 {q:"Ich bin heute ___ Hause.",a:["zu"]},
 {q:"Wir fahren ___ die Berge.",a:["in"]},
 {q:"Sie fliegt ___ die USA.",a:["in"]},
 {q:"Wir gehen ___ Strand.",a:["an den|zum"]},
 {q:"Ich komme ___ Spanien.",a:["aus"]},
 {q:"Er kommt gerade ___ Bäcker.",a:["vom"]},

 ]},
obwohl:{ch:5,title:"obwohl vs. weil",ga:[[42,218]],
 rule:`<p><em>weil</em> gives a reason. <em>obwohl</em> (although) gives a surprising contrast. Both send the verb to the end.</p>
 <p><i>Wir fahren ans Meer, <b>obwohl</b> das Wetter schlecht <b>ist</b>.</i> Main-clause version with the same meaning: <i>Das Wetter ist schlecht. <b>Trotzdem</b> fahren wir ans Meer.</i></p>`,
 items:[
 {q:"Er geht schwimmen, ___ es kalt ist.",a:["obwohl"]},
 {q:"Sie bleibt zu Hause, ___ sie krank ist.",a:["weil"]},
 {q:"___ das Hotel teuer war, war der Service schlecht.",a:["Obwohl"]},
 {q:"Ich bin müde, ___ ich lange geschlafen habe.",a:["obwohl"]},
 {q:"Er hat den Zug verpasst, ___ er zu spät aufgestanden ist.",a:["weil"]},
 {t:"o",w:["Wir","fahren","ans Meer",",","obwohl","das Wetter","schlecht","ist"],en:"We're going to the sea although the weather is bad."}
 ]},
komparativ:{ch:6,title:"Comparing: Komparativ and Superlativ",ga:[[38,196],[39,200]],
 rule:`<p><em>-er als</em> for comparing, <em>am -sten</em> or <em>der/die/das -ste</em> for the top. Many short adjectives add an umlaut: <i>alt → älter → am ältesten</i>.</p>
 <div class="tablewrap"><table><tr><th>gut</th><td>besser</td><td>am besten</td></tr><tr><th>viel</th><td>mehr</td><td>am meisten</td></tr><tr><th>gern</th><td>lieber</td><td>am liebsten</td></tr><tr><th>hoch</th><td>höher</td><td>am höchsten</td></tr><tr><th>nah</th><td>näher</td><td>am nächsten</td></tr></table></div>
 <p>Equal: <i>so groß <b>wie</b></i>. Different: <i>größer <b>als</b></i>.</p>`,
 items:[
 {q:"Ein Gepard läuft ___ als ein Pferd. (schnell)",a:["schneller"]},
 {q:"Mein Bruder ist ___ als ich. (alt)",a:["älter"]},
 {q:"Ich trinke ___ Tee als Kaffee. (gern)",a:["lieber"]},
 {q:"Der Hund ist so groß ___ die Katze.",a:["wie"]},
 {q:"Zürich ist teurer ___ Bern.",a:["als"]},
 {q:"Welches Tier ist am ___? (gefährlich)",a:["gefährlichsten"]},
 {q:"Das ist der ___ Berg der Schweiz. (hoch)",a:["höchste"]},
 {q:"Im Sommer ist es ___ als im Winter. (warm)",a:["wärmer"]},
 {q:"Wer singt am ___? (gut)",a:["besten"]},
 {q:"Heute habe ich ___ Zeit als gestern. (viel)",a:["mehr"]}
 ]},
sollten:{ch:6,title:"Recommendations with sollte",ga:[[6,41],[56,280]],
 rule:`<p>Advice = Konjunktiv II of sollen + infinitive at the end: <i>Du <b>solltest</b> mehr Wasser <b>trinken</b>.</i></p>
 <div class="tablewrap"><table><tr><td>ich sollte</td><td>du solltest</td><td>er sollte</td><td>wir sollten</td><td>ihr solltet</td><td>sie/Sie sollten</td></tr></table></div>`,
 items:[
 {q:"Du ___ mehr Wasser trinken.",a:["solltest"]},
 {q:"Sie ___ zum Arzt gehen. (formal)",a:["sollten"]},
 {q:"Ihr ___ früher ins Bett gehen.",a:["solltet"]},
 {q:"Er ___ weniger arbeiten.",a:["sollte"]},
 {q:"Wir ___ einen Hund adoptieren.",a:["sollten"]},
 {t:"o",w:["Bei","Kopfschmerzen","solltest","du","mehr","schlafen"],alt:["Du solltest bei Kopfschmerzen mehr schlafen"],en:"With headaches you should sleep more."}
 ]},
relativ:{ch:6,title:"Relative clauses",ga:[[70,350],[71,354]],
 rule:`<p>The relative pronoun takes <em>gender and number</em> from the noun it refers to, and <em>case</em> from its role in the relative clause. Verb at the end.</p>
 <div class="tablewrap"><table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr><tr><th>Nom</th><td>der</td><td>die</td><td>das</td><td>die</td></tr><tr><th>Akk</th><td>den</td><td>die</td><td>das</td><td>die</td></tr><tr><th>Dat</th><td>dem</td><td>der</td><td>dem</td><td>denen</td></tr></table></div>`,
 items:[
 {q:"Das ist der Mann, ___ neben mir wohnt.",a:["der"]},
 {q:"Das ist die Frau, ___ ich im Kurs kennengelernt habe.",a:["die"]},
 {q:"Das ist das Buch, ___ ich dir empfohlen habe.",a:["das"]},
 {q:"Das sind die Kollegen, ___ mir immer helfen.",a:["die"]},
 {q:"Der Hund, ___ wir gestern gesehen haben, war riesig.",a:["den"],why:"wir haben den Hund gesehen → Akk"},
 {q:"Die Freundin, ___ ich das Geschenk gegeben habe, hat sich gefreut.",a:["der"],why:"ich habe der Freundin … gegeben → Dat"},
 {q:"Das ist der Kollege, mit ___ ich arbeite.",a:["dem"]},
 {q:"Die Stadt, in ___ ich wohne, ist klein.",a:["der"]},
 {q:"Wie heißt das Ding, mit ___ man Fotos macht?",a:["dem"]},
 {q:"Die Leute, ___ ich geholfen habe, waren nett.",a:["denen"]}
 ]},
akkprep:{ch:6,title:"Accusative prepositions: für, durch, gegen, ohne, um",ga:[[32,165]],
 rule:`<p>Always accusative: <em>durch, für, gegen, ohne, um</em> (mnemonic: <i>DOGFU</i>). Only masculine changes visibly: <i>der → den, ein → einen</i>.</p>`,
 items:[
 {q:"Das Geschenk ist für ___ Bruder. (mein)",a:["meinen"]},
 {q:"Wir gehen durch ___ Park.",a:["den"]},
 {q:"Er fährt ohne ___ Frau in den Urlaub. (sein)",a:["seine"]},
 {q:"Das Auto fuhr gegen ___ Baum. (ein)",a:["einen"]},
 {q:"Wir sitzen um ___ Tisch.",a:["den"]},
 {q:"Haustiere sind gut gegen ___ Stress.",a:["den"]},
 {q:"Ich habe ein Geschenk für ___. (du)",a:["dich"]}
 ]},
stellen:{ch:7,title:"stellen/stehen, legen/liegen, hängen",ga:[[62,306]],
 rule:`<div class="tablewrap"><table><tr><th>Wohin? action + Akk</th><th>Wo? result + Dat</th></tr><tr><td>stellen (upright), regular</td><td>stehen, stand, gestanden</td></tr><tr><td>legen (flat), regular</td><td>liegen, lag, gelegen</td></tr><tr><td>hängen, hängte, gehängt</td><td>hängen, hing, gehangen</td></tr><tr><td>setzen</td><td>sitzen, saß, gesessen</td></tr></table></div>`,
 items:[
 {q:"Ich ___ die Flasche in den Kühlschrank. (stellen)",a:["stelle"]},
 {q:"Die Flasche ___ im Kühlschrank.",a:["steht"]},
 {q:"Er ___ das Buch auf den Tisch.",a:["legt"]},
 {q:"Das Buch ___ auf dem Tisch.",a:["liegt"]},
 {q:"Wir ___ das Bild an die Wand.",a:["hängen"]},
 {q:"Das Bild ___ an der Wand.",a:["hängt"]},
 {q:"Wohin hast du den Schlüssel ___?",a:["gelegt"]},

 ]},
alswenn:{ch:7,title:"als or wenn?",ga:[[72,358]],
 rule:`<p><em>als</em>: a <b>single</b> event or period in the past. <em>wenn</em>: repeated events (<i>immer wenn, jedes Mal wenn</i>), or present/future.</p>
 <p><i><b>Als</b> ich ein Kind war, … · <b>Wenn</b> ich Zeit habe, …</i></p>`,
 items:[
 {q:"___ ich ein Kind war, wohnten wir auf dem Land.",a:["Als"]},
 {q:"Immer ___ ich Zeit habe, koche ich selbst.",a:["wenn"]},
 {q:"___ wir nach Zürich umgezogen sind, war ich zwölf.",a:["Als"]},
 {q:"___ es regnet, bleiben wir zu Hause.",a:["Wenn"]},
 {q:"Jedes Mal, ___ er kam, brachte er Blumen mit.",a:["wenn"]},
 {q:"___ ich gestern nach Hause kam, war niemand da.",a:["Als"]}
 ]},
zu:{ch:7,title:"Infinitive with zu",ga:[[68,340],[69,345]],
 rule:`<p>After <i>Lust haben, Zeit haben, vergessen, versuchen, anfangen, vorhaben, Es ist schwer/wichtig…</i>: <em>zu + infinitive</em> at the end.</p>
 <p>Separable verbs put <em>zu</em> in the middle: <i>auf<b>zu</b>räumen</i>. No zu after modal verbs, <i>werden, lassen</i>.</p>`,
 items:[
 {q:"Ich habe keine Lust, heute ___ kochen.",a:["zu"]},
 {q:"Es ist schwer, in Zürich eine Wohnung ___ finden.",a:["zu"]},
 {q:"Ich habe vor, am Wochenende ___. (aufräumen)",a:["aufzuräumen"]},
 {q:"Vergiss nicht, den Müll ___. (rausbringen)",a:["rauszubringen"]},
 {q:"Er hat angefangen, Deutsch ___ lernen.",a:["zu"]},
 {t:"c",q:"Ich muss heute ___ arbeiten.",o:["zu","— (no zu)"],a:1,why:"No zu after modal verbs"},
 {t:"c",q:"Ich versuche, gesünder ___ essen.",o:["zu","— (no zu)"],a:0}
 ]},
deshalb:{ch:7,title:"deshalb and trotzdem",ga:[[41,214]],
 rule:`<p>These are adverbs, not subordinating words: they take position 1 and the <em>verb comes right after</em>.</p>
 <p><i>Ich habe Hunger, <b>deshalb koche</b> ich jetzt.</i> (consequence) · <i>Es regnet, <b>trotzdem gehen</b> wir spazieren.</i> (contrast)</p>`,
 items:[
 {t:"o",w:["Ich","habe","Hunger",",","deshalb","koche","ich","jetzt"],en:"I'm hungry, so I'm cooking now."},
 {t:"o",w:["Es","regnet",",","trotzdem","gehen","wir","spazieren"],en:"It's raining, but we're going for a walk anyway."},
 {q:"Die Wohnung ist teuer. ___ gefällt sie mir.",a:["Trotzdem"]},
 {q:"Ich esse gern Gemüse. ___ kaufe ich jede Woche auf dem Markt ein.",a:["Deshalb"]},
 {t:"c",q:"Er hat wenig Geld, ___ fährt er in den Urlaub.",o:["deshalb","trotzdem"],a:1},
 {t:"c",q:"Der Zug hatte Verspätung, ___ bin ich zu spät gekommen.",o:["deshalb","trotzdem"],a:0}
 ]},
passiv:{ch:8,title:"Passive: present and past",ga:[[57,284],[58,288]],
 rule:`<p>Focus on the action, not who does it: <em>werden</em> (position 2) + <em>Partizip II</em> (end).</p>
 <div class="tablewrap"><table><tr><th>Präsens</th><td>Das Haus <b>wird</b> gebaut.</td></tr><tr><th>Präteritum</th><td>Das Haus <b>wurde</b> 1950 gebaut.</td></tr></table></div>
 <p>Who did it: <i>von + Dativ</i>. <i>Das Telefon wurde von Bell erfunden.</i></p>`,
 items:[
 {q:"Das Rathaus ___ gerade renoviert.",a:["wird"]},
 {q:"Die Häuser ___ 1950 gebaut. (Prät.)",a:["wurden"]},
 {q:"Das Telefon ___ 1876 erfunden. (Prät.)",a:["wurde"]},
 {q:"In der Schweiz ___ vier Sprachen gesprochen.",a:["werden"]},
 {q:"Der Müll ___ jeden Montag abgeholt.",a:["wird"]},
 {q:"Die Ausstellung ___ gestern eröffnet. (Prät.)",a:["wurde"]},
 {q:"Viele Menschen ___ bei dem Unfall verletzt. (Prät.)",a:["wurden"]},
 {q:"Das Paket ___ morgen ___. (liefern)",a:["wird","geliefert"]},
 {q:"Die Fenster ___ jede Woche ___. (putzen)",a:["werden","geputzt"]},
 {t:"o",w:["Der Brief","wurde","gestern","geschrieben"],alt:["Gestern wurde der Brief geschrieben"],en:"The letter was written yesterday."}
 ]},
umzu:{ch:8,title:"Purpose: um … zu and damit",ga:[[74,366]],
 rule:`<p><em>um … zu + infinitive</em> when both parts have the <b>same subject</b>: <i>Ich lerne Deutsch, <b>um</b> in Zürich <b>zu arbeiten</b>.</i></p>
 <p><em>damit</em> + verb at the end when the subjects differ: <i>Ich spreche langsam, <b>damit</b> du mich <b>verstehst</b>.</i></p>`,
 items:[
 {q:"Ich lerne Deutsch, ___ in der Schweiz zu arbeiten.",a:["um"]},
 {t:"o",w:["Ich","spare","Energie",",","um","die Umwelt","zu","schützen"],en:"I save energy to protect the environment."},
 {q:"Er schaltet das Licht aus, ___ Strom zu sparen.",a:["um"]},
 {q:"Ich lade das Handy auf, ___ ich dich später anrufen kann.",a:["damit"],why:"Same subject would allow um…zu, but kann is a conjugated verb → damit"},
 {q:"Sie spricht langsam, ___ alle sie verstehen.",a:["damit"]},
 {q:"Wir fahren mit dem Zug, um die Umwelt ___ schonen.",a:["zu"]}
 ]},
datprep:{ch:8,title:"Dative prepositions: aus, bei, mit, nach, seit, von, zu",ga:[[31,161]],
 rule:`<p>Always dative: <em>aus, bei, mit, nach, seit, von, zu</em> (plus <i>gegenüber</i>). Contractions: <i>zu dem = zum, zu der = zur, von dem = vom, bei dem = beim</i>.</p>
 <div class="tablewrap"><table><tr><th>m</th><th>f</th><th>n</th><th>pl</th></tr><tr><td>dem / einem</td><td>der / einer</td><td>dem / einem</td><td>den …n</td></tr></table></div>`,
 items:[
 {q:"Ich fahre ___ dem Zug zur Arbeit.",a:["mit"]},
 {q:"Er wohnt noch ___ seinen Eltern.",a:["bei"]},
 {q:"Nach ___ Arbeit gehe ich einkaufen.",a:["der"]},

 ]}
};

 rule:`<p>The ending depends on what the article already shows.</p>
 <div class="tablewrap"><table><tr><th>after der/die/das</th><th>m</th><th>f</th><th>n</th><th>pl</th></tr><tr><th>Nom</th><td>-e</td><td>-e</td><td>-e</td><td>-en</td></tr><tr><th>Akk</th><td>-en</td><td>-e</td><td>-e</td><td>-en</td></tr><tr><th>Dat</th><td>-en</td><td>-en</td><td>-en</td><td>-en</td></tr></table></div>
 <div class="tablewrap"><table><tr><th>after ein/kein/mein</th><th>m</th><th>f</th><th>n</th><th>pl (kein)</th></tr><tr><th>Nom</th><td>-er</td><td>-e</td><td>-es</td><td>-en</td></tr><tr><th>Akk</th><td>-en</td><td>-e</td><td>-es</td><td>-en</td></tr><tr><th>Dat</th><td>-en</td><td>-en</td><td>-en</td><td>-en</td></tr></table></div>
 <div class="tablewrap"><table><tr><th>no article</th><th>m</th><th>f</th><th>n</th><th>pl</th></tr><tr><th>Nom</th><td>-er</td><td>-e</td><td>-es</td><td>-e</td></tr><tr><th>Akk</th><td>-en</td><td>-e</td><td>-es</td><td>-e</td></tr><tr><th>Dat</th><td>-em</td><td>-er</td><td>-em</td><td>-en</td></tr></table></div>
 <p>Shortcut: after an article the adjective ends in <em>-e</em> or <em>-en</em>, unless <i>ein</i> hides the gender (m Nom, n Nom/Akk), then the adjective shows it: <i>ein alt<b>er</b> Mann, ein neu<b>es</b> Auto</i>.</p>`},
kompgen:{ch:6,title:"Komparativ and Superlativ forms (infinite)",ga:[[38,196],[39,200]],gen:true,
 rule:`<p>Type the comparative and the <i>am …sten</i> form. Watch the umlauts on short adjectives (<i>alt, jung, warm, kalt, lang, kurz, groß, stark, klug, arm</i>) and <em>-esten</em> after -t, -d, -s, -ß, -z: <i>am ältesten, am kürzesten</i>.</p>`},
wechselgen:{ch:7,title:"Wo or wohin? Two-way prepositions (infinite)",ga:[[33,169],[34,174]],gen:true,
 rule:`<p><em>in, an, auf, über, unter, vor, hinter, neben, zwischen</em>:</p>
 <p><b>Wohin?</b> movement to a place → <em>Akkusativ</em>: <i>Ich lege das Buch auf <b>den</b> Tisch.</i><br><b>Wo?</b> location → <em>Dativ</em>: <i>Das Buch liegt auf <b>dem</b> Tisch.</i></p>
 <p>Contractions: <i>in dem = im, in das = ins, an dem = am, an das = ans</i>.</p>`}

{id:"1.1",ch:1,title:"Über mich und meinen Weg: das Perfekt",pages:[8,19],ga:[[24,127],[25,131]],topics:["perfekt"],
 goals:["Introduce yourself with your education and work history","Build Perfekt sentences with the right auxiliary"],
 theory:`
<h3>1 · Why Perfekt first</h3>
<p>Chapter 1 opens with people telling their life story: where they went to school, what they studied, when they moved. In spoken German almost all of that is told in the <em>Perfekt</em>. If you get the Perfekt automatic, half of A2 speaking is already solved.</p>
<h3>2 · How it's built</h3>
<div class="formula"><span>haben / sein</span> in position 2 &nbsp;+&nbsp; … &nbsp;+&nbsp; <span>Partizip II</span> at the end</div>
<div class="ex"><div class="ex-h">Examples</div>
<p>Ich <b>habe</b> in Zürich Wirtschaft <b>studiert</b>.</p>
<p>Nach dem Studium <b>bin</b> ich nach Winterthur <b>umgezogen</b>.</p>
<p>Wann <b>hast</b> du die Schule <b>abgeschlossen</b>?</p></div>
<p>The auxiliary is the conjugated verb, so it follows the normal word-order rules: position 2 in a statement, position 1 in a yes/no question, position 2 after a question word. The participle always closes the clause, like the second half of a bracket (<i>Satzklammer</i>).</p>
<h3>3 · haben or sein?</h3>
<p>Most verbs take <em>haben</em>. Take <em>sein</em> only when one of these is true:</p>
<div class="tablewrap"><table>
<tr><th>Rule</th><th>Verbs</th><th>Example</th></tr>
<tr><td>Movement from A to B</td><td>gehen, fahren, fliegen, kommen, laufen, umziehen, reisen</td><td>Ich <b>bin</b> nach Bern gefahren.</td></tr>
<tr><td>Change of state</td><td>aufstehen, einschlafen, werden, sterben, aufwachen</td><td>Er <b>ist</b> früh aufgestanden.</td></tr>
<tr><td>The three exceptions</td><td>sein, bleiben, passieren</td><td>Wir <b>sind</b> zu Hause geblieben.</td></tr>
</table></div>
<div class="trap"><b>Common mistake:</b> reflexive verbs always take haben, even when they feel like movement: <i>Ich <b>habe</b> mich beeilt.</i> Also, <i>fahren</i> with a direct object takes haben: <i>Ich <b>habe</b> das Auto in die Garage gefahren.</i></div>
<p class="hint">Swiss and southern German: <i>ich bin gesessen / gestanden / gelegen</i>. Standard German in Germany uses haben. Both are correct in Switzerland; exams accept both.</p>
<h3>4 · Telling your story</h3>
<div class="ex"><div class="ex-h">Useful phrases</div>
<p>Ich bin <b>am</b> 6. Mai 2005 <b>in</b> Moskau geboren.</p>
<p><b>Von</b> 2011 <b>bis</b> 2023 habe ich das Gymnasium besucht.</p>
<p>Nach der Schule habe ich eine Ausbildung <b>zur</b> Kauffrau gemacht. / … habe ich angefangen zu studieren.</p>
<p><b>Seit</b> 2024 wohne ich in der Schweiz.</p>
<p>Ich arbeite <b>als</b> Assistentin <b>bei</b> einer Treuhandfirma.</p></div>
<p><i>geboren</i> is special: <i>Ich <b>bin</b> … geboren</i> (you are still born), but for dead people <i>Er <b>wurde</b> 1819 geboren.</i> And <i>als</i> + job has no article: <i>Ich arbeite als Lehrerin</i>, never <i>als eine Lehrerin</i>.</p>
<div class="book">In the book: read the two portraits on p. 8 (PDF 10) and the CV section from p. 16. Mark every Perfekt form you find and sort them into haben / sein.</div>`,

{id:"1.2",ch:1,title:"Partizip II und trennbare Verben",pages:[11,29],ga:[[26,135],[7,45],[52,261]],topics:["partizip","trennbar"],
 goals:["Form the Partizip II of regular, irregular, separable and inseparable verbs","Place separable prefixes correctly"],
 theory:`
<h3>1 · Four patterns for the Partizip II</h3>
<div class="tablewrap"><table>
<tr><th>Type</th><th>Pattern</th><th>Examples</th></tr>
<tr><td>Regular (weak)</td><td><b>ge</b>-stem-<b>t</b></td><td>machen → gemacht, arbeiten → gearbeitet</td></tr>
<tr><td>Irregular (strong)</td><td><b>ge</b>-stem-<b>en</b>, often with a vowel change</td><td>schreiben → geschrieben, finden → gefunden</td></tr>
<tr><td>Separable</td><td>prefix + <b>ge</b> + rest</td><td>einkaufen → ein<b>ge</b>kauft, anfangen → an<b>ge</b>fangen</td></tr>
<tr><td>No ge-</td><td>be-, ver-, er-, ent-, emp-, ge-, zer-, and all -ieren verbs</td><td>bezahlen → bezahlt, verstehen → verstanden, studieren → studiert</td></tr>
</table></div>
<p>Stems ending in -t or -d add an extra e: <i>gearbeitet, geredet</i>. Mixed verbs change the vowel but keep -t: <i>bringen → gebracht, denken → gedacht, kennen → gekannt</i>.</p>
<div class="trap"><b>Common mistake:</b> "geverstanden", "gestudiert". If the verb starts with an inseparable prefix or ends in -ieren, there is no ge-. Test it out loud: the stress is never on be-, ver- or er-.</div>
<h3>2 · Separable verbs in the present</h3>
<p>The prefix carries the stress (<i><b>an</b>rufen, <b>auf</b>stehen, <b>ein</b>kaufen</i>) and splits off to the end of a main clause:</p>
<div class="ex"><div class="ex-h">Where the prefix goes</div>
<p>Main clause: Ich <b>rufe</b> dich morgen <b>an</b>.</p>
<p>Question: <b>Rufst</b> du mich morgen <b>an</b>?</p>
<p>Imperative: <b>Ruf</b> mich bitte <b>an</b>!</p>
<p>With a modal verb: Ich <b>kann</b> dich morgen <b>anrufen</b>. (together, at the end)</p>
<p>Subordinate clause: …, weil ich dich morgen <b>anrufe</b>. (together, at the end)</p></div>
<p>Separable prefixes are usually real words: <i>an, auf, aus, ein, mit, nach, vor, weg, zu, zurück, fern, kennen</i>. Inseparable prefixes are not: <i>be-, ver-, er-, ent-, emp-, ge-, miss-, zer-</i>.</p>
<h3>3 · Why this matters in chapter 1</h3>
<p>Daily-routine language is full of separable verbs: <i>aufstehen, sich anziehen, einkaufen, fernsehen, anfangen, aufhören</i>. When you tell someone what you did yesterday, you need their participles: <i>Ich bin um sieben <b>aufgestanden</b>, habe <b>eingekauft</b> und am Abend <b>ferngesehen</b>.</i></p>
<div class="book">In the book: the verb list in Rückblick 1 (p. 32, PDF 34) gives Präsens, Präteritum and Perfekt for every irregular verb in the chapter. Drill it in the Verbs tab.</div>`,

{id:"1.3",ch:1,title:"Mein Tag: reflexive Verben, Genus, Genitiv",pages:[20,31],ga:[[29,148],[48,243],[63,314]],topics:["reflexiv","genus","genitiv"],
 goals:["Describe your daily routine with reflexive verbs","Guess noun gender from the ending","Show possession with the genitive"],
 theory:`
<h3>1 · Reflexive verbs</h3>
<p>A reflexive verb has the action pointing back at the subject: <i>Ich wasche <b>mich</b></i> (I wash myself). German uses far more of these than English: <i>sich beeilen</i> (to hurry), <i>sich freuen</i> (to be glad), <i>sich erinnern</i> (to remember).</p>
<div class="tablewrap"><table><tr><th>ich</th><th>du</th><th>er / sie / es</th><th>wir</th><th>ihr</th><th>sie / Sie</th></tr><tr><td>mich</td><td>dich</td><td><b>sich</b></td><td>uns</td><td>euch</td><td><b>sich</b></td></tr></table></div>
<p>Word order: the reflexive pronoun sits right after the conjugated verb, or right after the subject if the subject comes later: <i>Morgens dusche ich <b>mich</b>. / Heute hat <b>sich</b> mein Chef beschwert.</i></p>
<div class="ex"><div class="ex-h">A reflexive morning</div><p>Ich wache um sechs auf, dusche <b>mich</b>, ziehe <b>mich</b> an und schminke <b>mich</b>. Dann muss ich <b>mich</b> beeilen, weil der Zug um 7.12 Uhr fährt.</p></div>
<p>Many reflexive verbs come with a fixed preposition. Learn them as one block: <i>sich interessieren <b>für</b>, sich freuen <b>auf</b> / <b>über</b>, sich erinnern <b>an</b>, sich ärgern <b>über</b></i>.</p>
<h3>2 · der, die, das from the ending</h3>
<p>You can't guess every gender, but the ending often gives it away. This covers a big share of the nouns you'll meet at A2:</p>
<div class="tablewrap"><table>
<tr><th class="g-die">die</th><td>-ung, -heit, -keit, -schaft, -ion, -tät, -ur, -ik, and most nouns ending in -e</td><td>die Zeitung, die Freiheit, die Universität</td></tr>
<tr><th class="g-das">das</th><td>-chen, -lein, -ment, -um, infinitives used as nouns</td><td>das Mädchen, das Zentrum, das Essen</td></tr>
<tr><th class="g-der">der</th><td>-ling, -ismus, -or, -ist, -er for people who do something, days, months, seasons</td><td>der Frühling, der Motor, der Lehrer</td></tr>
</table></div>
<p>Compound nouns take the gender of the <b>last</b> part: <i>das Kind + <b>der</b> Garten = <b>der</b> Kindergarten</i>.</p>
<h3>3 · The genitive</h3>
<p>The genitive answers <i>wessen?</i> (whose?). At A2 you mostly need to <em>recognize</em> it and use it in fixed expressions and writing.</p>
<div class="tablewrap"><table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr><tr><td>definite</td><td>de<b>s</b> Vater<b>s</b></td><td>de<b>r</b> Mutter</td><td>de<b>s</b> Kind<b>es</b></td><td>de<b>r</b> Eltern</td></tr><tr><td>ein / mein</td><td>(m)ein<b>es</b> Vater<b>s</b></td><td>(m)ein<b>er</b> Mutter</td><td>(m)ein<b>es</b> Kind<b>es</b></td><td>mein<b>er</b> Eltern</td></tr></table></div>
<p>Names: <i>Annas Wohnung, Peters Auto</i> (no apostrophe). In everyday speech, <i>von + Dativ</i> replaces the genitive: <i>das Auto <b>von meinem</b> Vater</i>.</p>
<div class="book">In the book: Tagesablauf p. 20 (PDF 22) and Teil C "Die Nomengruppe" p. 30 (PDF 32).</div>`,

{id:"2.1",ch:2,title:"Freizeit: nicht oder kein?",pages:[36,38],ga:[[15,85]],topics:["negation"],

 theory:`
<h3>1 · kein: the negative of ein</h3>
<p>If a noun would have <i>ein</i> or <b>no article</b>, you negate it with <em>kein</em>. It takes exactly the same endings as <i>ein</i> (and <i>keine</i> in the plural).</p>
<div class="tablewrap"><table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr><tr><td>Nom</td><td>kein</td><td>keine</td><td>kein</td><td>keine</td></tr><tr><td>Akk</td><td>kein<b>en</b></td><td>keine</td><td>kein</td><td>keine</td></tr><tr><td>Dat</td><td>kein<b>em</b></td><td>kein<b>er</b></td><td>kein<b>em</b></td><td>kein<b>en</b></td></tr></table></div>
<div class="ex"><div class="ex-h">Examples</div><p>Ich habe ein Hobby. → Ich habe <b>kein</b> Hobby.</p><p>Ich trinke Kaffee. → Ich trinke <b>keinen</b> Kaffee.</p><p>Wir haben Zeit. → Wir haben <b>keine</b> Zeit.</p></div>
<h3>2 · nicht: everything else</h3>
<p><em>nicht</em> negates verbs, adjectives, adverbs, and nouns with a definite article or possessive.</p>
<div class="tablewrap"><table>
<tr><th>What</th><th>Where nicht goes</th><th>Example</th></tr>
<tr><td>the whole sentence</td><td>at the end, but before the second verb part</td><td>Ich komme heute <b>nicht</b>. / Ich bin <b>nicht</b> gekommen.</td></tr>
<tr><td>adjective / adverb</td><td>right before it</td><td>Der Film war <b>nicht</b> spannend.</td></tr>
<tr><td>preposition phrase</td><td>right before it</td><td>Wir gehen <b>nicht</b> ins Kino.</td></tr>
<tr><td>der/die/das, mein…</td><td>before the thing negated</td><td>Das ist <b>nicht</b> mein Handy.</td></tr>
</table></div>
<p>Contrast with <em>sondern</em> (but rather): <i>Ich spiele nicht Klavier, <b>sondern</b> Geige. / Ich habe keinen Hund, <b>sondern</b> eine Katze.</i></p>
<div class="trap"><b>Common mistake:</b> "Ich habe nicht Zeit." Zeit has no article here, so it takes kein: <i>Ich habe <b>keine</b> Zeit.</i> Same with <i>keine Lust, keinen Hunger, keine Ahnung</i>.</div>
<h3>3 · Useful free-time phrases</h3>
<div class="ex"><div class="ex-h">Redemittel</div><p>In meiner Freizeit <b>treibe</b> ich Sport / <b>gehe</b> ich wandern / <b>spiele</b> ich Gitarre.</p><p>Ich bin Mitglied <b>in einem</b> Verein.</p><p>Ich habe <b>keine Lust auf</b> Fitnessstudio.</p><p>Am Wochenende <b>unternehme</b> ich gern etwas mit Freunden.</p></div>
<div class="book">In the book: Freizeitaktivitäten p. 36 (PDF 38), Teil C Negation p. 61 (PDF 63).</div>`,

{id:"2.2",ch:2,title:"Modalverben: Präsens und Präteritum",pages:[53,60],ga:[[5,36],[6,41],[27,140]],topics:["modal"],
 goals:["Use können, müssen, wollen, dürfen, sollen, mögen in present and past","Ask about opening times and rules politely"],
 theory:`
<h3>1 · The sentence bracket again</h3>
<div class="formula"><span>modal verb</span> in position 2 &nbsp;+&nbsp; … &nbsp;+&nbsp; <span>infinitive</span> at the end</div>
<p><i>Ich <b>kann</b> heute leider nicht ins Konzert <b>gehen</b>.</i> The infinitive has no zu.</p>
<h3>2 · What each one means</h3>
<div class="tablewrap"><table>
<tr><th>Verb</th><th>Meaning</th><th>ich / er (present)</th><th>ich / er (past)</th></tr>
<tr><td>können</td><td>ability, possibility</td><td>kann</td><td>konnte</td></tr>
<tr><td>müssen</td><td>necessity</td><td>muss</td><td>musste</td></tr>
<tr><td>wollen</td><td>your own intention</td><td>will</td><td>wollte</td></tr>
<tr><td>dürfen</td><td>permission</td><td>darf</td><td>durfte</td></tr>
<tr><td>sollen</td><td>someone else's instruction</td><td>soll</td><td>sollte</td></tr>
<tr><td>mögen</td><td>liking (mostly with a noun)</td><td>mag</td><td>mochte</td></tr>
</table></div>
<p>Two traps English speakers fall into: <i>nicht müssen</i> means "don't have to" (<i>Du musst nicht kommen</i> = you don't need to come), and "must not" is <i>nicht dürfen</i> (<i>Hier darf man nicht rauchen</i>).</p>
<h3>3 · The past: Präteritum, not Perfekt</h3>
<p>For modal verbs Germans use the <em>Präteritum</em> even in conversation. It's easy: drop the umlaut, add <b>-te</b>.</p>
<div class="tablewrap"><table><tr><th>ich</th><th>du</th><th>er/sie</th><th>wir</th><th>ihr</th><th>sie/Sie</th></tr><tr><td>musste</td><td>musstest</td><td>musste</td><td>mussten</td><td>musstet</td><td>mussten</td></tr></table></div>
<div class="ex"><div class="ex-h">Examples</div><p>Als Kind <b>musste</b> ich jeden Tag Klavier üben.</p><p>Wir <b>konnten</b> das Konzert nicht sehen, weil wir keine Karten hatten.</p><p>Sie <b>wollte</b> eigentlich Schauspielerin werden.</p></div>
<div class="trap"><b>Common mistake:</b> "Ich habe müssen arbeiten" or "Ich habe gemusst arbeiten." Just say <i>Ich <b>musste</b> arbeiten.</i></div>
<h3>4 · Phone call to a museum</h3>
<div class="ex"><div class="ex-h">Redemittel</div><p>Wann hat das Museum geöffnet? / Bis wann ist die Ausstellung zu sehen?</p><p>Darf man im Museum fotografieren?</p><p>Kann man die Karten online kaufen?</p><p>Muss man vorher reservieren?</p></div>
<div class="book">In the book: Teil C Verben from p. 53 (PDF 55) and the museum dialogues in the Musik section from p. 39.</div>`,

{id:"2.3",ch:2,title:"Biografien: das Präteritum",pages:[39,49],ga:[[23,123],[49,246]],topics:["praet"],
 goals:["Read and write a short biography","Recognize and form the Präteritum of regular and irregular verbs"],
 theory:`
<h3>1 · When Germans use the Präteritum</h3>
<p>Speech uses the Perfekt. <b>Written</b> narratives (biographies, news, stories, novels) use the <em>Präteritum</em>. Plus, in speech, the Präteritum is standard for <i>sein, haben</i> and the modal verbs. That's why chapter 2's biographies are all Präteritum.</p>
<h3>2 · Regular verbs: -te</h3>
<div class="tablewrap"><table><tr><th>ich</th><th>du</th><th>er/sie</th><th>wir</th><th>ihr</th><th>sie/Sie</th></tr><tr><td>leb<b>te</b></td><td>leb<b>test</b></td><td>leb<b>te</b></td><td>leb<b>ten</b></td><td>leb<b>tet</b></td><td>leb<b>ten</b></td></tr></table></div>
<p>After -t or -d: <i>arbeit<b>ete</b>, red<b>ete</b></i>.</p>
<h3>3 · Irregular verbs: new stem, no ending in ich/er</h3>
<div class="tablewrap"><table><tr><th>Infinitive</th><th>ich / er</th><th>wir / sie</th></tr>
<tr><td>sein</td><td>war</td><td>waren</td></tr><tr><td>haben</td><td>hatte</td><td>hatten</td></tr><tr><td>werden</td><td>wurde</td><td>wurden</td></tr>
<tr><td>geben</td><td>gab</td><td>gaben</td></tr><tr><td>kommen</td><td>kam</td><td>kamen</td></tr><tr><td>schreiben</td><td>schrieb</td><td>schrieben</td></tr><tr><td>gehen</td><td>ging</td><td>gingen</td></tr><tr><td>sterben</td><td>starb</td><td>starben</td></tr></table></div>
<p>There's no shortcut: learn the three forms together (<i>schreiben, schrieb, geschrieben</i>). The Verbs tab drills exactly that.</p>
<h3>4 · Biography toolkit</h3>
<div class="ex"><div class="ex-h">Redemittel</div><p>Sie <b>wurde</b> 1819 in Leipzig <b>geboren</b>.</p><p>Schon als Kind <b>gab</b> sie Konzerte.</p><p><b>Mit</b> 21 Jahren <b>heiratete</b> sie …</p><p>Sie <b>hatte</b> acht Kinder.</p><p>1896 <b>starb</b> sie in Frankfurt.</p></div>
<div class="trap"><b>Common mistake:</b> <i>geboren</i> for someone who has died uses <i>wurde</i>: <i>Mozart <b>wurde</b> 1756 geboren.</i> For yourself: <i>Ich <b>bin</b> 2005 geboren.</i></div>
<div class="book">In the book: the Musik section from p. 39 (PDF 41) and Kino from p. 47. Teil B p. 50 has a crime-fiction text. Good Präteritum reading.</div>`,
 extra:[
 {q:"Sie ___ in Leipzig geboren. (werden, Prät.)",a:["wurde"]},
 {q:"Er ___ viele Jahre in Wien. (leben)",a:["lebte"]},
 {q:"Wir ___ keine Karten mehr. (bekommen)",a:["bekamen"]},
 {q:"Das Publikum ___ begeistert. (sein)",a:["war"]},
 {q:"Sie ___ bis spät in die Nacht. (arbeiten)",a:["arbeitete"]}
 ],
 read:{title:"Clara Schumann",text:`Clara Wieck wurde 1819 in Leipzig geboren. Ihr Vater war Klavierlehrer, und sie bekam schon mit fünf Jahren Unterricht. Mit neun Jahren gab sie ihr erstes Konzert. Bald reiste sie durch ganz Europa und wurde sehr berühmt. Mit 20 Jahren heiratete sie den Komponisten Robert Schumann. Ihr Vater war gegen die Ehe, aber Clara und Robert kämpften vor Gericht und gewannen. Das Paar hatte acht Kinder. Clara spielte trotzdem weiter Konzerte und komponierte auch selbst. Nach Roberts Tod 1856 musste sie allein für die Familie Geld verdienen. Sie starb 1896 in Frankfurt. Viele Jahre war ihr Bild auf dem deutschen 100-Mark-Schein.`,

{id:"3.1",ch:3,title:"Einkaufen: Gründe und Bedingungen mit weil und wenn",pages:[68,76],ga:[[42,218]],topics:["weilwenn"],
 goals:["Say why you buy (or don't buy) something","Build subordinate clauses with the verb at the end"],
 theory:`
<h3>1 · The verb goes to the end</h3>
<p><em>weil</em> (because) and <em>wenn</em> (if / whenever) start a <b>subordinate clause</b> (Nebensatz). Inside it, the conjugated verb moves to the very end.</p>
<div class="ex"><div class="ex-h">Main clause → subordinate clause</div><p>Online ist es billiger. → Ich kaufe online, <b>weil</b> es billiger <b>ist</b>.</p><p>Ich habe Zeit. → <b>Wenn</b> ich Zeit <b>habe</b>, gehe ich auf den Markt.</p></div>
<p>With two verbs, the conjugated one comes last of all: <i>…, weil ich ein Auto kaufen <b>will</b>. / …, weil ich zu viel Geld ausgegeben <b>habe</b>.</i> Separable verbs join back together: <i>…, wenn ich <b>einkaufe</b>.</i></p>
<h3>2 · Subordinate clause first: verb, comma, verb</h3>
<p>If the Nebensatz comes first, it counts as position 1. The main clause starts straight away with its verb:</p>
<div class="formula"><span>Wenn</span> ich Zeit habe<span>,</span> <b>gehe</b> ich einkaufen.</div>
<p>This "verb, comma, verb" pattern is one of the clearest signals of good A2 German.</p>
<h3>3 · weil or denn?</h3>
<p><em>denn</em> also means "because" but keeps normal word order: <i>Ich kaufe online, <b>denn</b> es <b>ist</b> billiger.</i> Both are correct; <i>weil</i> is more common in speech. Don't mix them: "weil es ist billiger" is a very typical learner error (you'll even hear it from native speakers, but not in exams).</p>
<h3>4 · wenn vs. ob vs. als</h3>
<p><i>wenn</i> = if / whenever. <i>ob</i> = whether (indirect yes/no questions, chapter 4). <i>als</i> = when, for a single time in the past (chapter 7).</p>
<div class="ex"><div class="ex-h">Shopping Redemittel</div><p>Ich kaufe lieber im Geschäft ein, weil die Beratung besser ist.</p><p>Wenn die Hose nicht passt, kann ich sie umtauschen?</p><p>Ich vergleiche die Preise, bevor ich etwas kaufe.</p></div>
<div class="book">In the book: Einkaufen p. 70 (PDF 72), Teil C Haupt- und Nebensätze p. 87 (PDF 89).</div>`,

 {t:"o",w:["Wenn","die Jacke","nicht","passt",",","tausche","ich","sie","um"],en:"If the jacket doesn't fit, I'll exchange it."},

 read:{title:"Online oder im Laden?",text:`Nina (28) kauft fast alles online: „Ich arbeite viel und habe abends keine Zeit. Wenn ich etwas brauche, bestelle ich es im Zug. Das geht schnell und ist oft billiger.“ Ihr Freund Marco sieht das anders. Er kauft Kleidung nur im Geschäft, weil er sie zuerst anprobieren will. „Wenn ich online bestelle, passt mir die Hälfte nicht. Dann muss ich alles zurückschicken. Das nervt!“ Außerdem findet er die Beratung im Laden wichtig. Nur bei Büchern sind sich die beiden einig: Die kaufen sie in der kleinen Buchhandlung im Zentrum, weil sie die Verkäuferin so nett finden.`,

{id:"3.2",ch:3,title:"Wem? Was? Verben mit Dativ und Akkusativ",pages:[89,91],ga:[[20,105],[21,110],[22,114],[14,82]],topics:["datakk","einer"],
 goals:["Say who gets what: geben, schenken, zeigen, empfehlen","Use dative verbs like gefallen, passen, helfen","Replace nouns with pronouns in the right order"],
 theory:`
<h3>1 · Two objects: person in the dative, thing in the accusative</h3>
<div class="formula">Ich schenke <span>meiner Mutter</span> (wem? Dativ) <span>einen Schal</span> (was? Akkusativ).</div>
<p>Verbs of giving and showing work like this: <i>geben, schenken, schicken, bringen, zeigen, erklären, empfehlen, kaufen, leihen</i>.</p>
<div class="tablewrap"><table><tr><th></th><th>m</th><th>f</th><th>n</th><th>pl</th></tr><tr><td>Akk</td><td>den / einen</td><td>die / eine</td><td>das / ein</td><td>die / –</td></tr><tr><td>Dat</td><td>de<b>m</b> / eine<b>m</b></td><td>de<b>r</b> / eine<b>r</b></td><td>de<b>m</b> / eine<b>m</b></td><td>de<b>n</b> …<b>n</b></td></tr></table></div>
<h3>2 · Dative-only verbs</h3>
<p>Some verbs take only a dative: <i>helfen, danken, gefallen, gehören, passen, schmecken, antworten, gratulieren</i>. In English these look like normal objects, which is why they trip people up:</p>
<div class="ex"><div class="ex-h">Examples</div><p>Die Jacke gefällt <b>mir</b>. (literally: the jacket pleases me)</p><p>Die Hose passt <b>ihm</b> nicht.</p><p>Kann ich <b>Ihnen</b> helfen?</p><p>Das Handy gehört <b>meinem</b> Bruder.</p></div>
<h3>3 · Personal pronouns</h3>
<div class="tablewrap"><table><tr><th>Nom</th><td>ich</td><td>du</td><td>er</td><td>sie</td><td>es</td><td>wir</td><td>ihr</td><td>sie / Sie</td></tr><tr><th>Akk</th><td>mich</td><td>dich</td><td>ihn</td><td>sie</td><td>es</td><td>uns</td><td>euch</td><td>sie / Sie</td></tr><tr><th>Dat</th><td>mir</td><td>dir</td><td>ihm</td><td>ihr</td><td>ihm</td><td>uns</td><td>euch</td><td>ihnen / Ihnen</td></tr></table></div>
<h3>4 · Word order with two objects</h3>
<p>Two nouns: dative before accusative. <i>Ich gebe <b>dem Kind</b> <b>den Ball</b>.</i><br>A pronoun comes before a noun. <i>Ich gebe <b>ihm</b> den Ball. / Ich gebe <b>ihn</b> dem Kind.</i><br>Two pronouns: accusative before dative. <i>Ich gebe <b>ihn ihm</b>. / Gib <b>es mir</b>!</i></p>
<h3>5 · einer, eine, eins: pronouns without a noun</h3>
<p>When you drop the noun, the pronoun has to show the gender: <i>Brauchst du einen Stift? – Ja, ich brauche <b>einen</b>. / Hast du ein Auto? – Nein, ich habe <b>keins</b>. / Gibt es hier einen Automaten? – Ja, dort ist <b>einer</b>.</i> For plurals: <i>welche / keine</i>.</p>
<div class="book">In the book: Teil C p. 89 (PDF 91), shopping dialogues from p. 70.</div>`,
 extra:[
 {q:"Ich kaufe ___ Freund ein Buch. (mein)",a:["meinem"]},
 {q:"Der Rock gefällt ___ nicht. (ich)",a:["mir"]},

 {q:"Ich zeige ___ ___. (es, du)",a:["es","dir"],why:"two pronouns: Akk before Dat"},

{id:"3.3",ch:3,title:"Wenn ich reich wäre: Konjunktiv II",pages:[80,93],ga:[[55,275],[56,280]],topics:["k2wish"],
 goals:["Talk about wishes and imaginary situations","Form wäre, hätte, könnte and würde + infinitive"],
 theory:`
<h3>1 · Real vs. unreal</h3>
<p><i>Wenn ich Zeit <b>habe</b>, komme ich.</i> → realistic, it may happen.<br><i>Wenn ich Zeit <b>hätte</b>, <b>würde</b> ich kommen.</i> → I don't have time, it's imaginary.</p>
<p>The <em>Konjunktiv II</em> marks things as hypothetical: wishes, dreams, "what if" and (in chapter 4) politeness.</p>
<h3>2 · The forms you actually need</h3>
<div class="tablewrap"><table><tr><th></th><th>sein</th><th>haben</th><th>werden</th><th>können</th><th>müssen</th></tr>
<tr><td>ich / er</td><td>wäre</td><td>hätte</td><td>würde</td><td>könnte</td><td>müsste</td></tr>
<tr><td>du</td><td>wärst</td><td>hättest</td><td>würdest</td><td>könntest</td><td>müsstest</td></tr>
<tr><td>wir / sie</td><td>wären</td><td>hätten</td><td>würden</td><td>könnten</td><td>müssten</td></tr></table></div>
<p>For almost every other verb, use <em>würde + infinitive</em>: <i>Ich <b>würde</b> eine Weltreise <b>machen</b>.</i></p>
<h3>3 · The wenn-sentence</h3>
<div class="formula"><span>Wenn</span> ich im Lotto gewinnen <span>würde</span>, <span>würde</span> ich ein Haus <span>kaufen</span>.</div>
<div class="ex"><div class="ex-h">More examples</div><p>Wenn ich reich <b>wäre</b>, <b>würde</b> ich weniger arbeiten.</p><p>Wenn wir ein Auto <b>hätten</b>, <b>könnten</b> wir ans Meer fahren.</p><p>Ich <b>hätte</b> gern mehr Freizeit. (wish)</p><p>Es <b>wäre</b> schön, wenn du kommst.</p></div>
<div class="trap"><b>Common mistake:</b> "Wenn ich würde reich sein…" For <i>sein</i> and <i>haben</i> always use <i>wäre</i> and <i>hätte</i>. They sound much more natural than <i>würde sein / würde haben</i>.</div>
<h3>4 · Swiss money talk</h3>
<p>In Switzerland it's <i>Franken</i> and <i>Rappen</i>. <i>Eine Million Franken</i>, <i>im Lotto gewinnen</i>, <i>einen Teil spenden</i>, <i>den Rest sparen</i>.</p>
<div class="book">In the book: Lotto from p. 80 (PDF 82), Teil C Konjunktiv II p. 92 (PDF 94).</div>`,
 extra:[
 {q:"Wenn ich mehr Geld ___, würde ich ein Auto kaufen. (haben)",a:["hätte"]},
 {q:"Ich ___ jetzt gern am Meer. (sein)",a:["wäre"]},
 {q:"Wenn du Zeit hättest, ___ du mitkommen? (werden)",a:["würdest"]},
 {q:"Wir ___ mehr reisen, wenn wir mehr Urlaub hätten. (können)",a:["könnten"]},
 {t:"o",w:["Wenn","ich","reich","wäre",",","würde","ich","nicht","arbeiten"],en:"If I were rich, I wouldn't work."}
 ],
 read:{title:"Der Lottogewinner",text:`Vor einem Jahr hat Herr Baumann aus Bern 2,3 Millionen Franken im Lotto gewonnen. Viele Leute denken: „Wenn ich so viel Geld hätte, würde ich nie mehr arbeiten.“ Herr Baumann arbeitet aber immer noch als Busfahrer. „Ich mag meinen Job“, sagt er. „Was würde ich den ganzen Tag machen?“ Mit dem Geld hat er seinen Kindern geholfen: Beide konnten eine Wohnung kaufen. Einen Teil hat er einem Kinderspital gespendet. Und einen Traum hat er sich erfüllt: Er ist mit seiner Frau nach Kanada geflogen. „Wenn ich noch einmal gewinnen würde“, lacht er, „würde ich vielleicht doch weniger arbeiten.“`,
